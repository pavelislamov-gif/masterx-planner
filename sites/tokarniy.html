<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterX - Токарный участок</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* ... (те же стили) ... */
        
        .quantity-input {
            width: 60px;
            padding: 4px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            text-align: center;
        }
        
        .extra-task-badge {
            background: #17a2b8;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 10px;
        }
        
        .task-description {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
            padding: 5px;
            background: #f5f5f5;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="site-header">
            <h1>🔧 Токарный участок</h1>
        </div>
        
        <div class="date-navigation">
            <h2 id="currentDateDisplay"></h2>
            <div class="nav-buttons">
                <button class="btn btn-primary" onclick="changeDate('prev')">← Вчера</button>
                <button class="btn btn-success" onclick="changeDate('today')">Сегодня</button>
                <button class="btn btn-primary" onclick="changeDate('next')">Завтра →</button>
            </div>
        </div>
        
        <div id="tasksList" class="tasks-list"></div>
    </div>
    
    <script src="../js/storage.js"></script>
    <script src="../js/task-manager.js"></script>
    <script>
        const taskManager = new TaskManager('tokarniy');
        let currentDate = new Date();
        
        document.addEventListener('DOMContentLoaded', function() {
            updateDateDisplay();
            loadTasks();
            
            window.addEventListener('taskStatusChanged', () => loadTasks());
            window.addEventListener('storage', (e) => {
                if (e.key === 'masterx_orders') loadTasks();
            });
        });
        
        function changeDate(action) {
            switch(action) {
                case 'prev': taskManager.prevDay(); break;
                case 'next': taskManager.nextDay(); break;
                case 'today': taskManager.today(); break;
            }
            currentDate = taskManager.currentDate;
            updateDateDisplay();
            loadTasks();
        }
        
        function updateDateDisplay() {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = currentDate.toLocaleDateString('ru-RU', options);
            const isToday = taskManager.formatDate(currentDate) === taskManager.formatDate(new Date());
            
            document.getElementById('currentDateDisplay').innerHTML = `
                ${dateStr} ${!isToday ? '<span class="history-indicator">(история)</span>' : ''}
            `;
        }
        
        function loadTasks() {
            taskManager.loadData();
            const tasks = taskManager.tasks;
            const tasksList = document.getElementById('tasksList');
            
            tasksList.innerHTML = '';
            
            if (tasks.length === 0) {
                tasksList.innerHTML = '<div class="no-tasks">📭 Нет задач на этот день</div>';
                return;
            }
            
            // Группировка по заказам
            const tasksByOrder = {};
            tasks.forEach(task => {
                const key = `${task.orderId}_${task.product}`;
                if (!tasksByOrder[key]) {
                    tasksByOrder[key] = {
                        orderNumber: task.orderNumber,
                        product: task.product,
                        size: task.size,
                        totalQuantity: task.totalQuantity,
                        tasks: []
                    };
                }
                tasksByOrder[key].tasks.push(task);
            });
            
            Object.values(tasksByOrder).forEach(group => {
                tasksList.appendChild(createTaskGroup(group));
            });
        }
        
        function createTaskGroup(group) {
            const groupDiv = document.createElement('div');
            groupDiv.style.marginBottom = '25px';
            
            const headerDiv = document.createElement('div');
            headerDiv.className = 'product-info';
            headerDiv.innerHTML = `
                <strong>Заказ №${group.orderNumber}</strong> | 
                ${group.product} | 
                Размер: ${group.size || '—'} | 
                Всего: ${group.totalQuantity} шт
            `;
            groupDiv.appendChild(headerDiv);
            
            group.tasks.sort((a, b) => {
                if (a.isExtra && !b.isExtra) return 1;
                if (!a.isExtra && b.isExtra) return -1;
                return (a.operationIndex || 0) - (b.operationIndex || 0);
            });
            
            group.tasks.forEach(task => {
                groupDiv.appendChild(createTaskCard(task));
            });
            
            return groupDiv;
        }
        
        function createTaskCard(task) {
            const card = document.createElement('div');
            card.className = `task-card status-${task.status}`;
            card.dataset.taskId = task.id;
            
            const statusText = {
                'pending': 'Ожидает',
                'in_progress': 'В работе',
                'completed': 'Завершено'
            }[task.status] || task.status;
            
            const header = document.createElement('div');
            header.className = 'task-header';
            header.innerHTML = `
                <span class="task-title">
                    ${task.operation}
                    ${task.isExtra ? '<span class="extra-task-badge">Доп.</span>' : ''}
                </span>
                <div>
                    <span class="status-badge status-${task.status}">${statusText}</span>
                </div>
            `;
            
            // Описание для доп. задач
            if (task.isExtra && task.description) {
                const descDiv = document.createElement('div');
                descDiv.className = 'task-description';
                descDiv.textContent = task.description;
                card.appendChild(descDiv);
            }
            
            const executorList = document.createElement('div');
            executorList.className = 'executor-list';
            executorList.id = `executors-${task.id}`;
            
            if (task.executors && task.executors.length > 0) {
                task.executors.forEach(executor => {
                    executorList.appendChild(createExecutorItem(task.id, executor, task.status, task.totalQuantity));
                });
            } else {
                executorList.innerHTML = '<p style="color: #999; padding: 10px;">Нет исполнителей</p>';
            }
            
            // Прогресс выполнения
            const progressDiv = document.createElement('div');
            progressDiv.style.margin = '10px 0';
            progressDiv.style.fontSize = '14px';
            progressDiv.style.fontWeight = 'bold';
            progressDiv.style.color = '#28a745';
            progressDiv.textContent = `Выполнено: ${task.completedQuantity || 0}/${task.totalQuantity} шт`;
            
            const addExecutorBtn = document.createElement('button');
            addExecutorBtn.className = 'btn-add-executor';
            addExecutorBtn.textContent = '+ Добавить исполнителя';
            addExecutorBtn.onclick = () => showAddExecutorForm(task);
            
            const readyBtn = document.createElement('button');
            readyBtn.className = `btn-ready ${task.status === 'completed' ? 'completed' : ''}`;
            readyBtn.textContent = 'ГОТОВО';
            readyBtn.disabled = task.status === 'completed';
            readyBtn.onclick = () => completeTask(task.id);
            
            card.appendChild(header);
            card.appendChild(progressDiv);
            card.appendChild(executorList);
            
            if (task.status !== 'completed') {
                card.appendChild(addExecutorBtn);
                card.appendChild(readyBtn);
            }
            
            return card;
        }
        
        function createExecutorItem(taskId, executor, taskStatus, totalQuantity) {
            const div = document.createElement('div');
            div.className = 'executor-item';
            
            const nameSpan = document.createElement('span');
            nameSpan.className = 'executor-name';
            nameSpan.textContent = executor.name;
            
            const quantityInput = document.createElement('input');
            quantityInput.type = 'number';
            quantityInput.className = 'quantity-input';
            quantityInput.value = executor.quantity || 0;
            quantityInput.min = 0;
            quantityInput.max = totalQuantity;
            quantityInput.disabled = taskStatus === 'completed';
            quantityInput.onchange = (e) => {
                const val = parseInt(e.target.value) || 0;
                taskManager.updateExecutorQuantity(taskId, executor.name, val);
                loadTasks(); // перезагрузить для обновления прогресса
            };
            
            const workBtn = document.createElement('button');
            workBtn.className = `btn-work ${executor.status === 'in_progress' ? 'active' : ''} ${taskStatus === 'completed' ? 'completed' : ''}`;
            workBtn.textContent = executor.status === 'in_progress' ? 'В РАБОТЕ' : 'НАЧАТЬ';
            workBtn.disabled = taskStatus === 'completed';
            workBtn.onclick = () => toggleWorkStatus(taskId, executor.name, workBtn);
            
            div.appendChild(nameSpan);
            div.appendChild(quantityInput);
            div.appendChild(workBtn);
            
            return div;
        }
        
        function showAddExecutorForm(task) {
            const executorList = document.getElementById(`executors-${task.id}`);
            if (!executorList) return;
            
            const oldForm = executorList.parentNode.querySelector('.new-executor-form');
            if (oldForm) oldForm.remove();
            
            const formDiv = document.createElement('div');
            formDiv.className = 'new-executor-form';
            
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'ФИО исполнителя';
            
            const addBtn = document.createElement('button');
            addBtn.className = 'btn btn-success';
            addBtn.textContent = 'Добавить';
            addBtn.onclick = () => {
                if (input.value.trim()) {
                    taskManager.addExecutor(task.id, input.value);
                    loadTasks();
                }
            };
            
            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn btn-danger';
            cancelBtn.textContent = 'Отмена';
            cancelBtn.onclick = () => formDiv.remove();
            
            formDiv.appendChild(input);
            formDiv.appendChild(addBtn);
            formDiv.appendChild(cancelBtn);
            
            executorList.parentNode.insertBefore(formDiv, executorList.nextSibling);
        }
        
        function toggleWorkStatus(taskId, executorName, btn) {
            const newStatus = btn.classList.contains('active') ? 'pending' : 'in_progress';
            
            // Здесь нужно добавить метод в taskManager для обновления статуса исполнителя
            // Пока просто меняем класс
            btn.classList.toggle('active');
            btn.textContent = newStatus === 'in_progress' ? 'В РАБОТЕ' : 'НАЧАТЬ';
        }
        
        function completeTask(taskId) {
            taskManager.completeTask(taskId);
            loadTasks();
        }
    </script>
</body>
</html>
