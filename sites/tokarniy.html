<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterX - Токарный участок</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Стили для страницы участка */
        .date-navigation {
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #2a2f38;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        
        .order-card {
            background: #1a1e24;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #2a2f38;
            overflow: hidden;
        }
        
        .order-header {
            padding: 15px 20px;
            background: #232830;
            border-bottom: 1px solid #2a2f38;
        }
        
        .order-header h3 {
            color: #fff;
            font-size: 18px;
        }
        
        .product-info {
            padding: 12px 20px;
            background: #15191f;
            border-bottom: 1px solid #2a2f38;
            color: #a0a0a0;
        }
        
        .product-info strong {
            color: #ff3b3b;
        }
        
        .task-card {
            padding: 15px 20px;
            border-bottom: 1px solid #2a2f38;
            transition: all 0.3s;
        }
        
        .task-card:last-child {
            border-bottom: none;
        }
        
        .task-card.completed {
            opacity: 0.8;
            background: #1a2a1a;
            border-left: 3px solid #2ecc71;
        }
        
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .task-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }
        
        .task-progress {
            font-size: 13px;
            color: #4cd964;
            margin-bottom: 15px;
            padding: 5px 10px;
            background: #1e232b;
            border-radius: 20px;
            display: inline-block;
        }
        
        .executor-header {
            display: flex;
            gap: 12px;
            padding: 0 15px;
            margin-bottom: 8px;
            font-size: 12px;
            color: #a0a0a0;
        }
        
        .executor-header span:nth-child(1) { flex: 2; }
        .executor-header span:nth-child(2) { width: 80px; text-align: center; }
        .executor-header span:nth-child(3) { width: 90px; text-align: center; }
        .executor-header span:nth-child(4) { width: 40px; }
        
        .executor-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            background: #15191f;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #2a2f38;
        }
        
        .executor-name {
            flex: 2;
            padding: 6px 10px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
        }
        
        .executor-quantity {
            width: 80px;
            padding: 6px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            text-align: center;
        }
        
        .btn-work {
            background: #ffc107;
            color: #000;
            padding: 6px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            min-width: 90px;
        }
        
        .btn-work.active {
            background: #fd7e14;
            color: white;
        }
        
        .btn-work.completed {
            background: #28a745;
            color: white;
            cursor: not-allowed;
        }
        
        .btn-add-executor {
            background: #6c757d;
            color: white;
            padding: 6px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            margin: 10px 0;
            transition: all 0.3s;
        }
        
        .btn-add-executor:hover {
            background: #5a6268;
        }
        
        .btn-ready {
            background: #28a745;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
            width: 100%;
            transition: all 0.3s;
        }
        
        .btn-ready:hover:not(:disabled) {
            background: #218838;
        }
        
        .btn-ready:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .new-executor-form {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            padding: 10px;
            background: #15191f;
            border: 1px solid #2a2f38;
            border-radius: 8px;
        }
        
        .new-executor-form input {
            flex: 1;
            padding: 8px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
        }
        
        .extra-task-badge {
            background: #ff3b3b;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            margin-left: 10px;
        }
        
        .task-description {
            color: #a0a0a0;
            font-size: 12px;
            margin: 5px 0 10px 0;
            padding: 8px;
            background: #15191f;
            border-radius: 4px;
            border-left: 3px solid #ff3b3b;
        }
        
        .no-tasks {
            text-align: center;
            padding: 50px;
            background: #1a1e24;
            border-radius: 12px;
            color: #a0a0a0;
            border: 1px solid #2a2f38;
        }
        
        .history-indicator {
            font-size: 13px;
            color: #a0a0a0;
            margin-left: 10px;
        }
        
        .warning-message {
            background: #ff3b3b20;
            border: 1px solid #ff3b3b;
            color: #ff3b3b;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 13px;
        }
        
        .filter-section {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .search-box {
            padding: 12px 20px;
            background: #1a1e24;
            border: 1px solid #2a2f38;
            border-radius: 8px;
            font-size: 14px;
            color: #e0e0e0;
        }
        
        .order-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            border-radius: 12px;
            border: 1px solid #2a2f38;
        }
        
        .stat-item {
            flex: 1;
            text-align: center;
            padding: 15px;
            background: #15191f;
            border-radius: 8px;
            border: 1px solid #2a2f38;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #a0a0a0;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #a0a0a0;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 15px;
            border: 3px solid #2a2f38;
            border-top: 3px solid #ff3b3b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ШАПКА -->
        <header>
            <div class="logo-container">
                <img src="../images/logo.png" alt="MasterX Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="logo-text">
                    Master<span class="x-red">X</span>
                </div>
            </div>
            <h1 style="margin:0; color: white; font-size:20px;">🔧 Токарный участок</h1>
            <a href="../index.html" class="btn btn-primary">🏠 На главную</a>
        </header>

        <!-- НАВИГАЦИЯ ПО ДАТАМ -->
        <div class="date-navigation">
            <h2 id="currentDateDisplay" style="font-size: 16px; color: #fff; margin: 0;"></h2>
            <div class="nav-buttons">
                <button class="btn btn-primary" onclick="changeDate('prev')">← Вчера</button>
                <button class="btn btn-success" onclick="changeDate('today')">Сегодня</button>
                <button class="btn btn-primary" onclick="changeDate('next')">Завтра →</button>
                <button class="btn btn-info" onclick="exportToExcel()">📊 Excel</button>
            </div>
        </div>

        <!-- ФИЛЬТРЫ -->
        <div class="filter-section">
            <select id="statusFilter" class="search-box" style="width: auto;">
                <option value="all">Все задачи</option>
                <option value="pending">Ожидают</option>
                <option value="in_progress">В работе</option>
                <option value="completed">Завершённые</option>
            </select>
            <button class="btn btn-primary" onclick="applyFilters()">🔍 Применить</button>
            <button class="btn btn-warning" onclick="clearHistory()">🗑️ Очистить историю</button>
        </div>

        <!-- СТАТИСТИКА -->
        <div class="order-stats">
            <div class="stat-item">
                <div class="stat-value" id="totalTasks">0</div>
                <div class="stat-label">Всего задач</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="tasksInProgress">0</div>
                <div class="stat-label">В работе</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="tasksCompleted">0</div>
                <div class="stat-label">Выполнено</div>
            </div>
        </div>

        <!-- СПИСОК ЗАДАЧ -->
        <div id="tasksList" class="tasks-list">
            <div class="loading">
                <div class="spinner"></div>
                <p>Загрузка задач...</p>
            </div>
        </div>
    </div>

    <!-- ПОДКЛЮЧЕНИЕ СКРИПТОВ (ВАЖНО: В ПРАВИЛЬНОМ ПОРЯДКЕ) -->
    <script src="../js/storage.js"></script>
    <script src="../js/data-loader.js"></script>
    <script src="../js/task-manager.js"></script>  <!-- ЭТОТ ФАЙЛ БЫЛ ПРОПУЩЕН -->
    
    <script>
        // ============== ОПЕРАЦИИ ДЛЯ ТОКАРНОГО УЧАСТКА ==============
        const tokarniyOperations = {
            'XRAY 6-T2 BT 220 Шторка х2': [
                'Заготовка',
                'Точение Корпуса',
                'Заготовка деталей Крышка',
                'Точение деталей Кольцо',
                'Фрезеровка Корпуса'
            ],
            'XRAY 6-T2 BT 180': [
                'Заготовка',
                'Точение Корпуса',
                'Точение Крышки',
                'Точение Кольца',
                'Фрезеровка'
            ],
            'XRAY 6-T2 BT 200': [
                'Заготовка',
                'Точение Корпуса',
                'Точение Крышки',
                'Точение Кольца',
                'Фрезеровка'
            ],
            'XRAY 6-T2 BT 220': [
                'Заготовка',
                'Точение Корпуса',
                'Точение Крышки',
                'Точение Кольца',
                'Фрезеровка'
            ],
            'XGRAY v.1': [
                'Заготовка профиля',
                'Точение профиля',
                'Точение планки'
            ],
            'XGRAY v.2': [
                'Заготовка профиля',
                'Точение профиля',
                'Точение планки'
            ]
        };
        
        // ============== ИНИЦИАЛИЗАЦИЯ ==============
        // Проверяем, загружен ли TaskManager
        if (typeof TaskManager === 'undefined') {
            console.error('❌ TaskManager не загружен! Проверьте подключение task-manager.js');
            document.getElementById('tasksList').innerHTML = `
                <div class="no-tasks">
                    <p style="font-size: 18px;">❌ Ошибка загрузки</p>
                    <p style="color: #666;">Не удалось загрузить менеджер задач</p>
                </div>
            `;
        } else {
            // Создаем экземпляр TaskManager с операциями для токарного участка
            const taskManager = new TaskManager('tokarniy', tokarniyOperations);
            let currentFilter = 'all';
            
            // Глобальные функции для доступа из HTML
            window.taskManager = taskManager;
            
            document.addEventListener('DOMContentLoaded', function() {
                console.log('✅ Страница токарного участка загружена');
                updateDateDisplay();
                loadTasks();
                
                // Слушаем изменения из других вкладок
                window.addEventListener('taskStatusChanged', function() {
                    console.log('🔄 Получено событие taskStatusChanged');
                    loadTasks();
                });
                
                window.addEventListener('taskHistoryChanged', function(e) {
                    if (e.detail.siteType === 'tokarniy') {
                        console.log('🔄 Изменение истории для токарного участка');
                        loadTasks();
                    }
                });
                
                window.addEventListener('storage', function(e) {
                    if (e.key === 'masterx_orders' || e.key.startsWith('tasks_tokarniy_')) {
                        console.log('🔄 Изменение в localStorage');
                        taskManager.loadData();
                        loadTasks();
                    }
                });
            });
            
            // ============== НАВИГАЦИЯ ПО ДАТАМ ==============
            window.changeDate = function(action) {
                switch(action) {
                    case 'prev': 
                        taskManager.prevDay(); 
                        break;
                    case 'next': 
                        taskManager.nextDay(); 
                        break;
                    case 'today': 
                        taskManager.today(); 
                        break;
                }
                updateDateDisplay();
                loadTasks();
            };
            
            function updateDateDisplay() {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const dateStr = taskManager.currentDate.toLocaleDateString('ru-RU', options);
                const isToday = taskManager.formatDate(taskManager.currentDate) === taskManager.formatDate(new Date());
                
                document.getElementById('currentDateDisplay').innerHTML = `
                    ${dateStr} ${!isToday ? '<span class="history-indicator">(история)</span>' : ''}
                `;
            }
            
            // ============== ФИЛЬТРАЦИЯ ==============
            window.applyFilters = function() {
                currentFilter = document.getElementById('statusFilter').value;
                loadTasks();
            };
            
            // ============== ЗАГРУЗКА ЗАДАЧ ==============
            function loadTasks() {
                const tasksList = document.getElementById('tasksList');
                
                taskManager.loadData();
                let tasks = taskManager.getTasksByStatus(currentFilter);
                
                // Обновляем статистику
                const stats = taskManager.getStats();
                document.getElementById('totalTasks').textContent = stats.total;
                document.getElementById('tasksInProgress').textContent = stats.inProgress;
                document.getElementById('tasksCompleted').textContent = stats.completed;
                
                tasksList.innerHTML = '';
                
                if (tasks.length === 0) {
                    tasksList.innerHTML = `
                        <div class="no-tasks">
                            <p style="font-size: 18px;">📭 Нет задач на этот день</p>
                            <p style="color: #666;">Выберите другую дату или создайте заказ</p>
                        </div>
                    `;
                    return;
                }
                
                // Группируем по заказам
                const byOrder = {};
                tasks.forEach(task => {
                    if (!byOrder[task.orderId]) {
                        byOrder[task.orderId] = {
                            number: task.orderNumber,
                            tasks: []
                        };
                    }
                    byOrder[task.orderId].tasks.push(task);
                });
                
                Object.values(byOrder).forEach(order => {
                    const orderDiv = document.createElement('div');
                    orderDiv.className = 'order-card';
                    
                    const header = document.createElement('div');
                    header.className = 'order-header';
                    header.innerHTML = `<h3>📦 Заказ №${order.number}</h3>`;
                    orderDiv.appendChild(header);
                    
                    // Группируем по изделиям
                    const byProduct = {};
                    order.tasks.forEach(task => {
                        const key = task.product;
                        if (!byProduct[key]) {
                            byProduct[key] = {
                                product: task.product,
                                size: task.size,
                                totalQuantity: task.totalQuantity,
                                tasks: []
                            };
                        }
                        byProduct[key].tasks.push(task);
                    });
                    
                    Object.values(byProduct).forEach(product => {
                        const productInfo = document.createElement('div');
                        productInfo.className = 'product-info';
                        productInfo.innerHTML = `
                            <strong>${product.product}</strong> | 
                            Размер: ${product.size || 'Стандартный'} | 
                            Всего: ${product.totalQuantity} шт
                        `;
                        orderDiv.appendChild(productInfo);
                        
                        product.tasks.sort((a, b) => a.index - b.index);
                        
                        product.tasks.forEach(task => {
                            orderDiv.appendChild(createTaskCard(task));
                        });
                    });
                    
                    tasksList.appendChild(orderDiv);
                });
            }
            
            // ============== СОЗДАНИЕ КАРТОЧКИ ЗАДАЧИ ==============
            function createTaskCard(task) {
                const card = document.createElement('div');
                card.className = `task-card ${task.status === 'completed' ? 'completed' : ''}`;
                card.dataset.taskId = task.id;
                
                const header = document.createElement('div');
                header.className = 'task-header';
                header.innerHTML = `
                    <span class="task-title">
                        ${task.operation}
                        ${task.isExtra ? '<span class="extra-task-badge">Доп.</span>' : ''}
                    </span>
                `;
                card.appendChild(header);
                
                if (task.isExtra && task.description) {
                    const desc = document.createElement('div');
                    desc.className = 'task-description';
                    desc.textContent = task.description;
                    card.appendChild(desc);
                }
                
                const progress = document.createElement('div');
                progress.className = 'task-progress';
                progress.textContent = `Выполнено: ${task.completedQuantity}/${task.totalQuantity} шт`;
                card.appendChild(progress);
                
                // Предупреждение если есть расхождения
                const totalAssigned = task.executors.reduce((sum, e) => sum + (e.quantity || 0), 0);
                if (totalAssigned > task.totalQuantity) {
                    const warning = document.createElement('div');
                    warning.className = 'warning-message';
                    warning.textContent = `⚠️ Внимание: назначено ${totalAssigned} из ${task.totalQuantity}`;
                    card.appendChild(warning);
                }
                
                const headers = document.createElement('div');
                headers.className = 'executor-header';
                headers.innerHTML = `
                    <span>ФИО</span>
                    <span>Кол-во</span>
                    <span>Статус</span>
                    <span></span>
                `;
                card.appendChild(headers);
                
                const executorList = document.createElement('div');
                executorList.className = 'executor-list';
                executorList.id = `executors-${task.id}`;
                
                if (task.executors && task.executors.length > 0) {
                    task.executors.forEach(executor => {
                        executorList.appendChild(createExecutorItem(task, executor));
                    });
                } else {
                    const noExecutors = document.createElement('p');
                    noExecutors.style.cssText = 'color: #a0a0a0; padding: 15px; text-align: center;';
                    noExecutors.textContent = 'Нет исполнителей';
                    executorList.appendChild(noExecutors);
                }
                card.appendChild(executorList);
                
                if (task.status !== 'completed') {
                    const addBtn = document.createElement('button');
                    addBtn.className = 'btn-add-executor';
                    addBtn.textContent = '+ Добавить исполнителя';
                    addBtn.onclick = () => showAddExecutorForm(task);
                    card.appendChild(addBtn);
                }
                
                const readyBtn = document.createElement('button');
                readyBtn.className = 'btn-ready';
                readyBtn.textContent = 'ГОТОВО';
                readyBtn.disabled = task.status === 'completed';
                readyBtn.onclick = () => completeTask(task.id);
                card.appendChild(readyBtn);
                
                return card;
            }
            
            // ============== СОЗДАНИЕ ЭЛЕМЕНТА ИСПОЛНИТЕЛЯ ==============
            function createExecutorItem(task, executor) {
                const div = document.createElement('div');
                div.className = `executor-item ${executor.status === 'completed' ? 'completed' : ''}`;
                
                const nameSpan = document.createElement('span');
                nameSpan.className = 'executor-name';
                nameSpan.textContent = executor.name;
                nameSpan.style.padding = '6px 10px';
                nameSpan.style.background = '#1e232b';
                nameSpan.style.borderRadius = '4px';
                nameSpan.style.flex = '2';
                div.appendChild(nameSpan);
                
                const quantityInput = document.createElement('input');
                quantityInput.type = 'number';
                quantityInput.className = 'executor-quantity';
                quantityInput.value = executor.quantity || 0;
                quantityInput.min = 0;
                quantityInput.max = task.totalQuantity;
                quantityInput.disabled = task.status === 'completed';
                quantityInput.onchange = (e) => {
                    const val = parseInt(e.target.value) || 0;
                    taskManager.updateExecutorQuantity(task.id, executor.id, val);
                    loadTasks();
                };
                div.appendChild(quantityInput);
                
                const workBtn = document.createElement('button');
                workBtn.className = `btn-work ${executor.status === 'in_progress' ? 'active' : ''}`;
                workBtn.textContent = executor.status === 'in_progress' ? 'В РАБОТЕ' : 'НАЧАТЬ';
                workBtn.disabled = task.status === 'completed';
                workBtn.onclick = () => toggleWorkStatus(task.id, executor.id, workBtn);
                div.appendChild(workBtn);
                
                const removeBtn = document.createElement('button');
                removeBtn.className = 'btn btn-danger btn-sm';
                removeBtn.innerHTML = '✕';
                removeBtn.style.padding = '4px 8px';
                removeBtn.style.marginLeft = '5px';
                removeBtn.onclick = () => removeExecutor(task.id, executor.id);
                div.appendChild(removeBtn);
                
                return div;
            }
            
            // ============== ФОРМА ДОБАВЛЕНИЯ ИСПОЛНИТЕЛЯ ==============
            function showAddExecutorForm(task) {
                const executorList = document.getElementById(`executors-${task.id}`);
                if (!executorList) return;
                
                const oldForm = executorList.parentNode.querySelector('.new-executor-form');
                if (oldForm) oldForm.remove();
                
                const formDiv = document.createElement('div');
                formDiv.className = 'new-executor-form';
                
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = 'ФИО исполнителя';
                
                const addBtn = document.createElement('button');
                addBtn.className = 'btn btn-success';
                addBtn.textContent = 'Добавить';
                addBtn.onclick = () => {
                    if (input.value.trim()) {
                        taskManager.addExecutor(task.id, input.value);
                        loadTasks();
                    }
                };
                
                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'btn btn-danger';
                cancelBtn.textContent = 'Отмена';
                cancelBtn.onclick = () => formDiv.remove();
                
                formDiv.appendChild(input);
                formDiv.appendChild(addBtn);
                formDiv.appendChild(cancelBtn);
                
                executorList.parentNode.insertBefore(formDiv, executorList.nextSibling);
            }
            
            // ============== ДЕЙСТВИЯ С ЗАДАЧАМИ ==============
            window.toggleWorkStatus = function(taskId, executorId, btn) {
                const newStatus = btn.classList.contains('active') ? 'pending' : 'in_progress';
                taskManager.updateExecutorStatus(taskId, executorId, newStatus);
                btn.classList.toggle('active');
                btn.textContent = newStatus === 'in_progress' ? 'В РАБОТЕ' : 'НАЧАТЬ';
            };
            
            window.removeExecutor = function(taskId, executorId) {
                if (confirm('Удалить этого исполнителя?')) {
                    taskManager.removeExecutor(taskId, executorId);
                    loadTasks();
                }
            };
            
            window.completeTask = function(taskId) {
                const task = taskManager.tasks.find(t => t.id === taskId);
                if (!task) return;
                
                const totalAssigned = task.executors.reduce((sum, e) => sum + (e.quantity || 0), 0);
                
                let message = 'Завершить эту задачу?';
                if (totalAssigned < task.totalQuantity) {
                    message = `Назначено только ${totalAssigned} из ${task.totalQuantity} шт.\nОстаток будет добавлен первому исполнителю.\nВсё равно завершить?`;
                } else if (totalAssigned > task.totalQuantity) {
                    message = `Внимание! Назначено ${totalAssigned} из ${task.totalQuantity} шт.\nКоличество будет скорректировано.\nПродолжить?`;
                }
                
                if (confirm(message)) {
                    taskManager.completeTask(taskId);
                    loadTasks();
                }
            };
            
            // ============== ОЧИСТКА ИСТОРИИ ==============
            window.clearHistory = function() {
                if (!confirm('Очистить историю задач для текущей даты?')) return;
                
                const dateStr = taskManager.formatDate(taskManager.currentDate);
                localStorage.removeItem(`tasks_tokarniy_${dateStr}`);
                
                // Перезагружаем задачи
                taskManager.loadData();
                loadTasks();
            };
            
            // ============== ЭКСПОРТ В EXCEL ==============
            window.exportToExcel = function() {
                const tasks = taskManager.tasks;
                const dateStr = taskManager.formatDate(taskManager.currentDate);
                
                let csv = "Заказ,Изделие,Операция,Исполнитель,Количество,Статус\n";
                
                tasks.forEach(task => {
                    if (task.executors.length > 0) {
                        task.executors.forEach(executor => {
                            csv += `${task.orderNumber},${task.product},${task.operation},${executor.name},${executor.quantity},${executor.status}\n`;
                        });
                    } else {
                        csv += `${task.orderNumber},${task.product},${task.operation},Нет,0,${task.status}\n`;
                    }
                });
                
                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `tokarniy_${dateStr}.csv`;
                link.click();
            };
        }
    </script>
</body>
</html>
