<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterX - Токарный участок</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .task-card {
            background: #1a1e24;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #2a2f38;
        }
        .task-title {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
        .executor-item {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #15191f;
            border-radius: 6px;
            margin: 10px 0;
        }
        .btn-work {
            background: #ffc107;
            padding: 5px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-work.active {
            background: #fd7e14;
            color: white;
        }
        .btn-add-executor {
            background: #6c757d;
            color: white;
            padding: 5px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px 0;
        }
        .btn-ready {
            background: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .no-tasks {
            text-align: center;
            padding: 50px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Токарный участок</h1>
        
        <div id="tasksList"></div>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/task-manager.js"></script>
    <script>
        const taskManager = new TaskManager('tokarniy');
        
        document.addEventListener('DOMContentLoaded', function() {
            loadTasks();
            
            // Слушаем изменения
            window.addEventListener('taskStatusChanged', function() {
                loadTasks();
            });
            
            window.addEventListener('storage', function(e) {
                if (e.key === 'masterx_orders') {
                    loadTasks();
                }
            });
        });
        
        function loadTasks() {
            taskManager.loadData();
            const tasks = taskManager.tasks;
            const tasksList = document.getElementById('tasksList');
            
            tasksList.innerHTML = '';
            
            if (tasks.length === 0) {
                tasksList.innerHTML = '<div class="no-tasks">📭 Нет задач</div>';
                return;
            }
            
            // Группируем по заказам
            const byOrder = {};
            tasks.forEach(task => {
                if (!byOrder[task.orderId]) {
                    byOrder[task.orderId] = {
                        orderNumber: task.orderNumber,
                        tasks: []
                    };
                }
                byOrder[task.orderId].tasks.push(task);
            });
            
            Object.values(byOrder).forEach(order => {
                const orderDiv = document.createElement('div');
                orderDiv.className = 'order-card';
                orderDiv.innerHTML = `<h3>📦 Заказ №${order.orderNumber}</h3>`;
                
                order.tasks.forEach(task => {
                    orderDiv.appendChild(createTaskCard(task));
                });
                
                tasksList.appendChild(orderDiv);
            });
        }
        
        function createTaskCard(task) {
            const card = document.createElement('div');
            card.className = 'task-card';
            
            card.innerHTML = `
                <div class="task-title">${task.operation}</div>
                <div>Выполнено: 0/${task.totalQuantity}</div>
                <div id="executors-${task.id}"></div>
                <button class="btn-add-executor" onclick="addExecutor('${task.id}')">+ Добавить исполнителя</button>
                <button class="btn-ready" onclick="completeTask('${task.id}')">ГОТОВО</button>
            `;
            
            return card;
        }
        
        function addExecutor(taskId) {
            const name = prompt('ФИО исполнителя:');
            if (!name) return;
            
            // Здесь нужно добавить логику сохранения исполнителя
            alert(`Исполнитель ${name} добавлен`);
        }
        
        function completeTask(taskId) {
            if (confirm('Завершить задачу?')) {
                taskManager.updateTaskStatus(taskId, 'completed');
                loadTasks();
            }
        }
    </script>
</body>
</html>
