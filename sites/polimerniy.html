<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterX - Полимерный участок</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .date-navigation {
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #2a2f38;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .nav-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .order-card { background: #1a1e24; border-radius: 12px; margin-bottom: 15px; border: 1px solid #2a2f38; overflow: hidden; }
        .order-header { padding: 12px 20px; background: #232830; border-bottom: 1px solid #2a2f38; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .order-header h3 { color: #fff; font-size: 16px; font-weight: 500; margin: 0; }
        .order-header .collapse-icon { color: #a0a0a0; font-size: 14px; transition: transform 0.2s; }
        .order-header.collapsed .collapse-icon { transform: rotate(-90deg); }
        .order-content { padding: 15px 20px; transition: all 0.2s; }
        .order-content.collapsed { display: none; }
        .product-info { background: #15191f; border-bottom: 1px solid #2a2f38; color: #a0a0a0; font-size: 13px; }
        .task-card { padding: 12px 15px; border-bottom: 1px solid #2a2f38; transition: all 0.3s; }
        .task-card:last-child { border-bottom: none; }
        .task-card.completed { opacity: 0.8; background: #1a2a1a; border-left: 3px solid #2ecc71; }
        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .task-title { font-size: 14px; font-weight: 600; color: #fff; }
        .task-plan { color: #ff9800; font-size: 12px; margin-bottom: 10px; padding: 4px 8px; background: #1e232b; border-radius: 4px; display: inline-block; }
        .profile-info { margin-bottom: 10px; padding: 6px 10px; background: #232830; border-radius: 6px; font-size: 12px; border-left: 3px solid #ff9800; }
        .profile-info span { margin-right: 15px; }
        .profile-info .profile-name { color: #ff9800; }
        .profile-info .profile-length { color: #00d4ff; }
        .profile-info .profile-qty { color: #4cd964; }
        .executor-header { display: flex; gap: 10px; padding: 0 10px; margin-bottom: 6px; font-size: 11px; color: #a0a0a0; }
        .executor-header span:nth-child(1) { width: 140px; }
        .executor-header span:nth-child(2) { width: 70px; text-align: center; }
        .executor-header span:nth-child(3) { width: 80px; text-align: center; }
        .executor-header span:nth-child(4) { width: 30px; }
        .executor-item { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: #15191f; border-radius: 6px; margin-bottom: 4px; border: 1px solid #2a2f38; }
        .executor-name { width: 140px; padding: 4px 8px; background: #1e232b; border: 1px solid #2a2f38; border-radius: 4px; color: #fff; font-size: 12px; }
        .executor-quantity { width: 70px; padding: 4px; background: #1e232b; border: 1px solid #2a2f38; border-radius: 4px; color: #fff; text-align: center; font-size: 12px; }
        .btn-work { background: #ffc107; color: #000; padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; width: 70px; font-weight: 600; }
        .btn-work.active { background: #fd7e14; color: white; }
        .btn-work:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-add-executor { background: #6c757d; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; margin: 8px 0; width: 140px; }
        .action-container { margin: 8px 0; }
        .new-executor-form { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 8px; background: #15191f; border: 1px solid #2a2f38; border-radius: 6px; flex-wrap: wrap; }
        .new-executor-form input { width: 160px; padding: 5px 8px; background: #1e232b; border: 1px solid #2a2f38; border-radius: 4px; color: #fff; font-size: 12px; }
        .btn-ready { background: #28a745; color: white; padding: 5px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; margin: 10px 0 0 0; min-width: 100px; }
        .btn-ready:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-report { background: #ff9800; color: white; border: none; border-radius: 4px; padding: 5px 12px; cursor: pointer; font-size: 11px; font-weight: 600; margin-left: 8px; transition: all 0.2s; }
        .btn-report:hover { background: #e68900; transform: scale(1.02); }
        .extra-task-badge { background: #ff3b3b; color: white; padding: 2px 6px; border-radius: 20px; font-size: 10px; margin-left: 8px; }
        .task-description { color: #a0a0a0; font-size: 11px; margin: 5px 0 8px 0; padding: 6px; background: #15191f; border-radius: 4px; border-left: 3px solid #ff3b3b; }
        .no-tasks { text-align: center; padding: 40px; background: #1a1e24; border-radius: 12px; color: #a0a0a0; border: 1px solid #2a2f38; }
        .filter-section { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
        .search-box { padding: 6px 12px; background: #1a1e24; border: 1px solid #2a2f38; border-radius: 6px; font-size: 12px; color: #e0e0e0; }
        .order-stats { display: flex; gap: 15px; margin-bottom: 20px; padding: 12px 15px; background: linear-gradient(135deg, #1a1e24, #0f1217); border-radius: 10px; border: 1px solid #2a2f38; }
        .stat-item { flex: 1; text-align: center; padding: 8px; background: #15191f; border-radius: 6px; border: 1px solid #2a2f38; }
        .stat-value { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #00d4ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 2px; }
        .stat-label { font-size: 11px; color: #a0a0a0; }
        .loading { text-align: center; padding: 30px; color: #a0a0a0; }
        .spinner { width: 30px; height: 30px; margin: 0 auto 10px; border: 2px solid #2a2f38; border-top: 2px solid #ff3b3b; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-sm { padding: 3px 6px; font-size: 10px; }
        .btn-danger { background: #dc3545; color: white; border: none; padding: 3px 6px; font-size: 10px; }
        .btn-end-shift { background: #ff9800; color: white; padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; width: 95px; font-weight: 600; margin-left: 5px; }
        .btn-end-shift:disabled { background: #4caf50; cursor: not-allowed; opacity: 0.7; }

        /* ПРАВАЯ МОДАЛЬНАЯ ПАНЕЛЬ */
        .right-modal {
            position: fixed;
            right: -450px;
            top: 0;
            width: 450px;
            height: 100vh;
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            border-left: 2px solid #ff3b3b;
            box-shadow: -5px 0 30px rgba(0,0,0,0.5);
            transition: right 0.3s ease;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .right-modal.open { right: 0; }
        .right-modal-header {
            background: linear-gradient(135deg, #232830, #1a1e24);
            padding: 15px 20px;
            border-bottom: 1px solid #2a2f38;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .right-modal-header h3 { margin: 0; color: #ff3b3b; font-size: 18px; }
        .right-modal-close {
            background: none; border: none; color: #a0a0a0; font-size: 28px; cursor: pointer; transition: all 0.2s;
        }
        .right-modal-close:hover { color: #ff3b3b; transform: scale(1.1); }
        .right-modal-content {
            flex: 1; overflow-y: auto; padding: 20px;
        }
        .right-modal-content::-webkit-scrollbar { width: 6px; }
        .right-modal-content::-webkit-scrollbar-track { background: #1a1e24; }
        .right-modal-content::-webkit-scrollbar-thumb { background: #ff3b3b; border-radius: 3px; }
        .right-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1999; display: none;
        }
        .right-modal-overlay.show { display: block; }
        .report-input {
            width: 100%; padding: 8px 12px; background: #1e232b; border: 1px solid #2a2f38; border-radius: 6px; color: #fff; font-size: 14px;
        }
        .report-input:focus { outline: none; border-color: #ff9800; }
        .report-textarea {
            width: 100%; padding: 8px 12px; background: #1e232b; border: 1px solid #2a2f38; border-radius: 6px; color: #fff; font-size: 14px; resize: vertical;
        }
        .report-textarea:focus { outline: none; border-color: #ff9800; }

        /* СВЕТЛАЯ ТЕМА */
        body.light-theme .right-modal {
            background: linear-gradient(135deg, #ffffff, #f8fafc);
            border-left: 2px solid #ff9800;
        }
        body.light-theme .right-modal-header {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border-bottom: 1px solid #e2e8f0;
        }
        body.light-theme .report-input,
        body.light-theme .report-textarea {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="../images/logo.png" alt="MasterX Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="logo-text">Master<span class="x-red">X</span></div>
            </div>
            <h1 style="margin:0; color: white; font-size:18px;">🎨 Полимерный участок</h1>
        </header>

        <div class="date-navigation">
            <h2 id="currentDateDisplay" style="font-size: 15px; color: #fff; margin: 0;"></h2>
            <div class="nav-buttons">
                <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="changeDate('prev')">← Вчера</button>
                <button class="btn btn-success" style="padding: 6px 12px; font-size: 12px;" onclick="changeDate('today')">Сегодня</button>
                <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="changeDate('next')">Завтра →</button>
                <button class="btn btn-info" style="padding: 6px 12px; font-size: 12px;" onclick="exportToExcel()">📊 Excel</button>
            </div>
        </div>

        <div class="filter-section">
            <select id="statusFilter" class="search-box" style="width: auto; padding: 6px 10px;" onchange="applyFilters()">
                <option value="all">Все задачи</option>
                <option value="pending">Ожидают</option>
                <option value="in_progress">В работе</option>
                <option value="completed">Завершённые</option>
            </select>
        </div>

        <div class="order-stats">
            <div class="stat-item"><div class="stat-value" id="totalTasks">0</div><div class="stat-label">Всего задач</div></div>
            <div class="stat-item"><div class="stat-value" id="tasksInProgress">0</div><div class="stat-label">В работе</div></div>
            <div class="stat-item"><div class="stat-value" id="tasksCompleted">0</div><div class="stat-label">Выполнено</div></div>
        </div>

        <div id="tasksList" class="tasks-list"><div class="loading"><div class="spinner"></div><p>Загрузка задач...</p></div></div>
    </div>

    <!-- ПРАВАЯ МОДАЛЬНАЯ ПАНЕЛЬ -->
    <div id="rightModalOverlay" class="right-modal-overlay" onclick="closeRightModal()"></div>
    <div id="rightModal" class="right-modal">
        <div class="right-modal-header">
            <h3>📝 Отчёт по операции</h3>
            <button class="right-modal-close" onclick="closeRightModal()">&times;</button>
        </div>
        <div id="rightModalContent" class="right-modal-content">
            <!-- Содержимое формы будет здесь -->
        </div>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/data-loader.js"></script>
    <script src="../js/task-operations.js"></script>
    <script src="../js/task-manager.js"></script>

    <script>
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ============== ЗАГРУЗКА ОПЕРАЦИЙ ИЗ taskOperations.json ==============
        let taskOperationsData = {};
        
        async function loadTaskOperationsData() {
            try {
                const response = await fetch('../data/taskOperations.json');
                if (response.ok) {
                    const data = await response.json();
                    taskOperationsData = data.operations || {};
                    console.log('✅ Загружены операции из taskOperations.json');
                } else {
                    console.warn('taskOperations.json не найден');
                }
            } catch(e) {
                console.error('Ошибка загрузки taskOperations.json:', e);
            }
        }
        
        // ============== ПОЛУЧЕНИЕ ОПЕРАЦИЙ ==============
        function getOperationNames(productName, siteKey) {
            const productOps = taskOperationsData[productName];
            if (!productOps) return [];
            const siteMap = {
                'tokarniy': 'токарно-фрезерный', 'frezerniy': 'фрезерный',
                'slesarniy': 'слесарный', 'lazerno': 'лазерно-гибочный', 'polimerniy': 'полимерный'
            };
            const siteColumn = siteMap[siteKey];
            if (!siteColumn) return [];
            const ops = productOps[siteColumn] || [];
            if (ops.length > 0 && typeof ops[0] === 'object' && ops[0].operation) {
                return ops.map(op => op.operation);
            }
            return ops;
        }
        
        // ============== ПОЛУЧЕНИЕ ПРОФИЛЯ ПО ОПЕРАЦИИ ==============
        function getProfileForOperation(operationName, details) {
            if (!details || details.length === 0) return null;
            let searchName = operationName;
            if (searchName.startsWith('Покраска профиля ')) {
                searchName = searchName.replace('Покраска профиля ', '');
            }
            for (let i = 0; i < details.length; i++) {
                const detail = details[i];
                if (detail.type === 'profile') {
                    if (detail.name.includes(searchName) || searchName.includes(detail.name)) return detail;
                }
            }
            return null;
        }
        
        function getTaskPlanFromDetails(task, fullOrder) {
            if (!fullOrder || !fullOrder.items || !fullOrder.items[0]) return 1;
            const item = fullOrder.items[0];
            const details = item.details || [];
            const productName = item.product;
            const productOps = taskOperationsData[productName];
            if (!productOps) return item.size?.quantity || 1;
            let foundDetail = null;
            for (const siteOps of Object.values(productOps)) {
                for (const op of siteOps) {
                    if (op.operation === task.operation) {
                        foundDetail = op.detail;
                        break;
                    }
                }
                if (foundDetail) break;
            }
            if (!foundDetail) return item.size?.quantity || 1;
            for (const detail of details) {
                if (detail.name === foundDetail) return detail.quantity;
            }
            if (item.brackets) {
                for (const b of item.brackets) {
                    if (`Кронштейн ${b.type}` === foundDetail) return b.quantity;
                }
            }
            if (item.lyres) {
                for (const l of item.lyres) {
                    if (`Лира ${l.type}` === foundDetail) return l.quantity;
                }
            }
            return item.size?.quantity || 1;
        }

        // ============== СОХРАНЕНИЕ СОСТОЯНИЯ ОТКРЫТЫХ КАРТОЧЕК ==============
        const POLIMERNIY_STORAGE_KEY = 'polimerniy_open_cards';
        function saveOpenCardsState() {
            const openCards = [];
            document.querySelectorAll('.order-card').forEach(card => {
                const content = card.querySelector('.order-content');
                if (content && !content.classList.contains('collapsed')) {
                    openCards.push(card.dataset.orderId);
                }
            });
            localStorage.setItem(POLIMERNIY_STORAGE_KEY, JSON.stringify(openCards));
        }
        function restoreOpenCardsState() {
            const savedOpenCards = localStorage.getItem(POLIMERNIY_STORAGE_KEY);
            if (!savedOpenCards) return;
            const openCardsIds = JSON.parse(savedOpenCards);
            openCardsIds.forEach(orderId => {
                const card = document.querySelector(`.order-card[data-order-id="${orderId}"]`);
                if (card) {
                    const header = card.querySelector('.order-header');
                    const content = card.querySelector('.order-content');
                    if (header && content) {
                        header.classList.remove('collapsed');
                        content.classList.remove('collapsed');
                    }
                }
            });
        }

        // ============== ИНИЦИАЛИЗАЦИЯ ==============
        if (typeof TaskManager === 'undefined') {
            console.error('❌ TaskManager не загружен!');
            document.getElementById('tasksList').innerHTML = '<div class="no-tasks"><p>❌ Ошибка загрузки</p></div>';
        } else {
            const taskManager = new TaskManager('polimerniy', window.TASK_OPERATIONS.polimerniy || {});
            let currentFilter = 'all';
            let isLoadingTasks = false;
            
            window.taskManager = taskManager;
            
            document.addEventListener('DOMContentLoaded', async function() {
                await loadTaskOperationsData();
                updateDateDisplay();
                loadTasks();
                window.addEventListener('beforeunload', function() { saveOpenCardsState(); });
            });
            
            window.changeDate = function(action) {
                switch(action) {
                    case 'prev': taskManager.prevDay(); break;
                    case 'next': taskManager.nextDay(); break;
                    case 'today': taskManager.today(); break;
                }
                updateDateDisplay();
                loadTasks();
            };
            
            function updateDateDisplay() {
                var options = { year: 'numeric', month: 'long', day: 'numeric' };
                var dateStr = taskManager.currentDate.toLocaleDateString('ru-RU', options);
                var isToday = taskManager.formatDate(taskManager.currentDate) === taskManager.formatDate(new Date());
                document.getElementById('currentDateDisplay').innerHTML = dateStr + (isToday ? '' : '<span class="history-indicator">(история)</span>');
            }
            
            window.applyFilters = function() {
                currentFilter = document.getElementById('statusFilter').value;
                loadTasks();
            };
            
            function loadTasks() {
                if (isLoadingTasks) return;
                isLoadingTasks = true;
                
                var tasksList = document.getElementById('tasksList');
                taskManager.loadData();
                var tasks = taskManager.getTasksByStatus(currentFilter);
                
                var stats = taskManager.getStats();
                document.getElementById('totalTasks').textContent = stats.total;
                document.getElementById('tasksInProgress').textContent = stats.inProgress;
                document.getElementById('tasksCompleted').textContent = stats.completed;
                
                tasksList.innerHTML = '';
                
                if (tasks.length === 0) {
                    tasksList.innerHTML = '<div class="no-tasks"><p>📭 Нет задач на этот день</p></div>';
                    isLoadingTasks = false;
                    return;
                }
                
                var byOrder = {};
                tasks.forEach(function(task) {
                    if (!byOrder[task.orderId]) {
                        byOrder[task.orderId] = { number: task.orderNumber, orderId: task.orderId, tasks: [] };
                    }
                    byOrder[task.orderId].tasks.push(task);
                });
                
                Object.values(byOrder).forEach(function(order) {
                    var orderDiv = document.createElement('div');
                    orderDiv.className = 'order-card';
                    orderDiv.dataset.orderId = order.orderId;
                    
                    var header = document.createElement('div');
                    header.className = 'order-header collapsed';
                    header.innerHTML = '<h3>📦 Заказ №' + escapeHtml(order.number) + '</h3><span class="collapse-icon">▼</span>';
                    
                    var content = document.createElement('div');
                    content.className = 'order-content collapsed';
                    
                    var fullOrder = null;
                    try {
                        var allOrders = JSON.parse(localStorage.getItem('masterx_orders')) || [];
                        fullOrder = allOrders.find(function(o) { return o.id == order.orderId; });
                    } catch (e) {}

                    var productQty = (fullOrder && fullOrder.items && fullOrder.items[0]) ? (fullOrder.items[0].size?.quantity || 1) : 1;
                    var productName = (fullOrder && fullOrder.items && fullOrder.items[0]) ? (fullOrder.items[0].product || '') : '';
                    var productSize = (fullOrder && fullOrder.items && fullOrder.items[0]) ? (fullOrder.items[0].size?.name || '-') : '-';
                    var bracket = (fullOrder && fullOrder.items && fullOrder.items[0]) ? (fullOrder.items[0].brackets || []) : [];
                    var lyre = (fullOrder && fullOrder.items && fullOrder.items[0]) ? (fullOrder.items[0].lyres || []) : [];
                    var ral = (fullOrder && fullOrder.items && fullOrder.items[0]) ? (fullOrder.items[0].ral || '') : '';
                    var texture = (fullOrder && fullOrder.items && fullOrder.items[0]) ? (fullOrder.items[0].texture || '') : '';
                    var components = (fullOrder && fullOrder.components) ? fullOrder.components : [];
                    var details = (fullOrder && fullOrder.items && fullOrder.items[0]) ? (fullOrder.items[0].details || []) : [];
                    
                    var allDetails = [];
                    if (bracket && bracket.length > 0) {
                        bracket.forEach(function(b) {
                            if (b.type && b.type !== 'отсутствует' && b.quantity > 0) {
                                allDetails.push({ name: 'Кронштейн ' + b.type, quantity: b.quantity });
                            }
                        });
                    }
                    if (lyre && lyre.length > 0) {
                        lyre.forEach(function(l) {
                            if (l.type && l.type !== 'отсутствует' && l.quantity > 0) {
                                allDetails.push({ name: 'Лира ' + l.type, quantity: l.quantity });
                            }
                        });
                    }
                    if (details && details.length > 0) {
                        details.forEach(function(d) {
                            if (d.type !== 'profile' && d.quantity > 0) {
                                allDetails.push({ name: d.name, quantity: d.quantity });
                            }
                        });
                    }
                    
                    var profiles = [];
                    if (details && details.length > 0) {
                        details.forEach(function(d) {
                            if (d.type === 'profile' && d.quantity > 0) {
                                profiles.push({ name: d.name, lengthMm: d.lengthMm, quantity: d.quantity });
                            }
                        });
                    }
                    
                    var productInfoDiv = document.createElement('div');
                    productInfoDiv.className = 'product-info';
                    productInfoDiv.style.padding = '8px 12px';
                    productInfoDiv.style.borderBottom = '1px solid #2a2f38';
                    
                    var infoHtml = `
                        <div style="font-size: 20px; font-weight: 600; color: #ff3b3b; margin: 0 0 8px 0;">📦 ${escapeHtml(productName)}</div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;">
                            <div>
                                <div style="color: #a0a0a0; font-size: 11px;">РАЗМЕР</div>
                                <div style="font-size: 20px;"><strong>${escapeHtml(productSize)}</strong> <span style="color: #4cd964;">× ${productQty} шт</span></div>
                                <div style="margin-top: 8px;">
                                    <div style="color: #a0a0a0; font-size: 11px;">ПОКРЫТИЕ</div>
                                    <div style="font-size: 18px;"><strong>${escapeHtml(ral || '-')}</strong> / ${escapeHtml(texture || '-')}</div>
                                </div>
                            </div>
                            <div>
                                <div style="color: #a0a0a0; font-size: 11px; margin-bottom: 8px;">ПРОФИЛИ</div>
                                ${profiles.map(p => `
                                    <div style="margin-bottom: 8px;">
                                        <div style="font-size: 16px;">• ${escapeHtml(p.name)}</div>
                                        <div style="margin-left: 18px; color: #a0a0a0; font-size: 13px;">
                                            <span style="color: #ff9800;">${p.lengthMm} мм</span> <span style="color: #4cd964;">× ${p.quantity} шт</span>
                                        </div>
                                    </div>
                                `).join('') || '<div style="color: #6c757d;">— нет —</div>'}
                            </div>
                            <div>
                                <div style="color: #a0a0a0; font-size: 11px; margin-bottom: 8px;">ДЕТАЛИ</div>
                                ${allDetails.map(d => `
                                    <div style="margin-bottom: 6px; font-size: 16px;">• ${escapeHtml(d.name)} <span style="color: #4cd964;">${d.quantity} шт</span></div>
                                `).join('') || '<div style="color: #6c757d;">— нет —</div>'}
                            </div>
                        </div>
                    `;
                    
                    if (components && components.length > 0) {
                        var compsHtml = '';
                        for (var i = 0; i < components.length; i++) {
                            compsHtml += '<span style="background: #1e232b; padding: 4px 10px; border-radius: 14px; font-size: 12px; border: 1px solid #2a2f38; margin-right: 6px; display: inline-block;">' + escapeHtml(components[i].name) + ': <strong style="color: #4cd964;">' + components[i].quantityPerProduct + '</strong> шт/изд</span>';
                        }
                        infoHtml += '<div style="margin-top: 12px; padding-top: 10px; border-top: 1px solid #2a2f38;"><strong style="color: #ff3b3b;">🔧 КОМПЛЕКТУЮЩИЕ:</strong><div style="margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px;">' + compsHtml + '</div></div>';
                    }
                    
                    productInfoDiv.innerHTML = infoHtml;
                    content.appendChild(productInfoDiv);
                    
                    order.tasks.forEach(function(task) {
                        content.appendChild(createTaskCard(task, fullOrder));
                    });
                    
                    header.addEventListener('click', function(e) {
                        if (e.target.tagName === 'BUTTON') return;
                        content.classList.toggle('collapsed');
                        header.classList.toggle('collapsed');
                        saveOpenCardsState();
                    });
                    
                    orderDiv.appendChild(header);
                    orderDiv.appendChild(content);
                    tasksList.appendChild(orderDiv);
                });
                
                setTimeout(function() {
                    restoreOpenCardsState();
                    isLoadingTasks = false;
                }, 100);
            }
            
            function createTaskCard(task, fullOrder) {
                var card = document.createElement('div');
                card.className = 'task-card ' + (task.status === 'completed' ? 'completed' : '');
                card.dataset.taskId = task.id;
                
                var planQuantity = task.totalQuantity || getTaskPlanFromDetails(task, fullOrder);
                
                var operationName = task.operation;
                if (typeof operationName === 'object' && operationName !== null) {
                    operationName = operationName.operation || JSON.stringify(operationName);
                }
                if (typeof operationName !== 'string') {
                    operationName = String(operationName);
                }
                
                var header = document.createElement('div');
                header.className = 'task-header';
                header.innerHTML = '<span class="task-title">' + escapeHtml(operationName) + (task.isExtra ? '<span class="extra-task-badge">Доп.</span>' : '') + '</span>';
                card.appendChild(header);
                
                var planDiv = document.createElement('div');
                planDiv.className = 'task-plan';
                planDiv.innerHTML = '📋 План: ' + planQuantity + ' шт';
                card.appendChild(planDiv);
                
                // ИНФОРМАЦИЯ О ПРОФИЛЕ (только для Покраска профиля)
                if (fullOrder && fullOrder.items && fullOrder.items[0]) {
                    var details = fullOrder.items[0].details || [];
                    if (operationName && operationName.trim().startsWith('Покраска профиля')) {
                        var profileInfo = getProfileForOperation(operationName, details);
                        if (profileInfo) {
                            var profileDiv = document.createElement('div');
                            profileDiv.className = 'profile-info';
                            profileDiv.innerHTML = `
                                <span class="profile-name">📐 ${escapeHtml(profileInfo.name)}</span>
                                <span class="profile-length">📏 Длина: ${profileInfo.lengthMm || 0} мм</span>
                                <span class="profile-qty">× ${profileInfo.quantity} шт</span>
                            `;
                            card.appendChild(profileDiv);
                        }
                    }
                }
                
                if (task.isExtra && task.description) {
                    var desc = document.createElement('div');
                    desc.className = 'task-description';
                    desc.textContent = escapeHtml(task.description);
                    card.appendChild(desc);
                }
                
                var headersDiv = document.createElement('div');
                headersDiv.className = 'executor-header';
                headersDiv.innerHTML = '<span>ФИО</span><span>Кол-во</span><span>Статус</span><span></span>';
                card.appendChild(headersDiv);
                
                var executorList = document.createElement('div');
                executorList.className = 'executor-list';
                executorList.id = 'executors-' + task.id;
                
                if (task.executors && task.executors.length > 0) {
                    task.executors.forEach(function(executor) { 
                        executorList.appendChild(createExecutorItem(task, executor)); 
                    });
                } else {
                    var noExecutors = document.createElement('p');
                    noExecutors.style.cssText = 'color: #a0a0a0; padding: 8px; text-align: center; font-style: italic; font-size: 12px;';
                    noExecutors.textContent = 'Нет исполнителей';
                    executorList.appendChild(noExecutors);
                }
                card.appendChild(executorList);
                
                var actionContainer = document.createElement('div');
                actionContainer.className = 'action-container';
                if (task.status !== 'completed') {
                    var addBtn = document.createElement('button');
                    addBtn.className = 'btn-add-executor';
                    addBtn.textContent = '+ Добавить исполнителя';
                    addBtn.onclick = function() { showAddExecutorForm(task, actionContainer); };
                    actionContainer.appendChild(addBtn);
                }
                card.appendChild(actionContainer);
                
                var readyBtn = document.createElement('button');
                readyBtn.className = 'btn-ready';
                readyBtn.textContent = '✅ ГОТОВО';
                readyBtn.disabled = task.status === 'completed';
                readyBtn.onclick = function() { completeTask(task.id); };
                card.appendChild(readyBtn);
                
                // КНОПКА ОТЧЁТ
                var reportBtn = document.createElement('button');
                reportBtn.className = 'btn-report';
                reportBtn.textContent = '📝 Отчёт';
                reportBtn.onclick = function() { openRightModal(task, fullOrder); };
                card.appendChild(reportBtn);
                
                return card;
            }
            
            function createExecutorItem(task, executor) {
                var div = document.createElement('div');
                div.className = 'executor-item';
                div.dataset.executorId = executor.id;
                var isShiftEnded = executor.status === 'shift_ended';
                
                var nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.className = 'executor-name';
                nameInput.value = escapeHtml(executor.name);
                nameInput.placeholder = 'ФИО';
                nameInput.disabled = task.status === 'completed' || isShiftEnded;
                div.appendChild(nameInput);
                
                var quantityInput = document.createElement('input');
                quantityInput.type = 'number';
                quantityInput.className = 'executor-quantity';
                quantityInput.value = executor.quantity || 0;
                quantityInput.min = 0;
                quantityInput.disabled = task.status === 'completed' || isShiftEnded;
                quantityInput.onchange = function(e) {
                    taskManager.updateExecutorQuantity(task.id, executor.id, parseInt(e.target.value) || 0);
                };
                div.appendChild(quantityInput);
                
                var workBtn = document.createElement('button');
                workBtn.className = 'btn-work ' + (executor.status === 'in_progress' ? 'active' : '');
                workBtn.textContent = executor.status === 'in_progress' ? 'В РАБОТЕ' : (isShiftEnded ? 'СМЕНА ЗАКРЫТА' : 'НАЧАТЬ');
                workBtn.disabled = task.status === 'completed' || isShiftEnded;
                workBtn.onclick = function() {
                    if (isShiftEnded) return;
                    var newStatus = workBtn.classList.contains('active') ? 'pending' : 'in_progress';
                    taskManager.updateExecutorStatus(task.id, executor.id, newStatus);
                    workBtn.classList.toggle('active');
                    workBtn.textContent = newStatus === 'in_progress' ? 'В РАБОТЕ' : 'НАЧАТЬ';
                };
                div.appendChild(workBtn);
                
                var endShiftBtn = document.createElement('button');
                endShiftBtn.className = 'btn-end-shift';
                endShiftBtn.innerHTML = isShiftEnded ? '✅ СМЕНА ЗАКРЫТА' : '🕒 ЗАКРЫТЬ';
                endShiftBtn.disabled = task.status === 'completed' || isShiftEnded;
                endShiftBtn.onclick = function() {
                    if (confirm('Закрыть смену для ' + executor.name + '?')) {
                        taskManager.updateExecutorStatus(task.id, executor.id, 'shift_ended');
                        var executorList = document.getElementById('executors-' + task.id);
                        if (executorList) {
                            executorList.innerHTML = '';
                            var updatedTask = taskManager.tasks.find(t => t.id === task.id);
                            if (updatedTask && updatedTask.executors) {
                                updatedTask.executors.forEach(exec => { executorList.appendChild(createExecutorItem(updatedTask, exec)); });
                            }
                        }
                    }
                };
                div.appendChild(endShiftBtn);
                
                var removeBtn = document.createElement('button');
                removeBtn.className = 'btn btn-danger btn-sm';
                removeBtn.innerHTML = '✕';
                removeBtn.disabled = task.status === 'completed' || isShiftEnded;
                removeBtn.onclick = function() {
                    if (confirm('Удалить этого исполнителя?')) taskManager.removeExecutor(task.id, executor.id);
                };
                div.appendChild(removeBtn);
                
                return div;
            }
            
            function showAddExecutorForm(task, actionContainer) {
                var oldForm = actionContainer.querySelector('.new-executor-form');
                if (oldForm) oldForm.remove();
                
                var formDiv = document.createElement('div');
                formDiv.className = 'new-executor-form';
                var input = document.createElement('input');
                input.type = 'text';
                input.placeholder = 'ФИО исполнителя';
                var addBtn = document.createElement('button');
                addBtn.className = 'btn btn-success';
                addBtn.textContent = 'Добавить';
                addBtn.onclick = function() {
                    var name = input.value.trim();
                    if (!name) { alert('Введите ФИО'); return; }
                    if (taskManager.addExecutor(task.id, name)) {
                        formDiv.remove();
                        var executorList = document.getElementById('executors-' + task.id);
                        if (executorList) {
                            executorList.innerHTML = '';
                            var updatedTask = taskManager.tasks.find(t => t.id === task.id);
                            if (updatedTask && updatedTask.executors) {
                                updatedTask.executors.forEach(exec => { executorList.appendChild(createExecutorItem(updatedTask, exec)); });
                            }
                        }
                    } else { alert('Исполнитель уже существует'); }
                };
                var cancelBtn = document.createElement('button');
                cancelBtn.className = 'btn btn-danger';
                cancelBtn.textContent = 'Отмена';
                cancelBtn.onclick = function() { formDiv.remove(); };
                formDiv.appendChild(input);
                formDiv.appendChild(addBtn);
                formDiv.appendChild(cancelBtn);
                actionContainer.appendChild(formDiv);
            }
            
            window.completeTask = function(taskId) {
                var task = taskManager.tasks.find(t => t.id === taskId);
                if (!task) return;
                var totalAssigned = task.executors.reduce((sum, e) => sum + (e.quantity || 0), 0);
                var operationName = task.operation;
                if (typeof operationName === 'object' && operationName !== null) {
                    operationName = operationName.operation || JSON.stringify(operationName);
                }
                if (confirm('Завершить задачу?\nОперация: ' + operationName + '\nВыполнено: ' + totalAssigned + ' шт')) {
                    taskManager.completeTask(taskId);
                    loadTasks();
                }
            };
            
            window.exportToExcel = function() {
                const tasks = taskManager.tasks;
                const dateStr = taskManager.formatDate(taskManager.currentDate);
                let csv = "Заказ,Изделие,Операция,Исполнитель,Количество,Статус,План\n";
                tasks.forEach(task => {
                    let fullOrder = null;
                    try {
                        const allOrders = JSON.parse(localStorage.getItem('masterx_orders')) || [];
                        fullOrder = allOrders.find(o => o.id == task.orderId);
                    } catch(e) {}
                    const planQuantity = task.totalQuantity || getTaskPlanFromDetails(task, fullOrder);
                    var operationName = task.operation;
                    if (typeof operationName === 'object' && operationName !== null) {
                        operationName = operationName.operation || JSON.stringify(operationName);
                    }
                    if (task.executors && task.executors.length > 0) {
                        task.executors.forEach(exec => {
                            csv += `"${task.orderNumber}","${task.product}","${operationName}","${exec.name}",${exec.quantity || 0},"${exec.status}",${planQuantity}\n`;
                        });
                    } else {
                        csv += `"${task.orderNumber}","${task.product}","${operationName}","Нет",0,"${task.status}",${planQuantity}\n`;
                    }
                });
                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `polimerniy_${dateStr}.csv`;
                link.click();
            };
        }
        
        // ============== ПРАВАЯ МОДАЛЬНАЯ ПАНЕЛЬ ДЛЯ ОТЧЁТА ==============
        let currentReportTask = null;
let currentReportFullOrder = null;
let reportRows = []; // массив для хранения строк отчёта

function openRightModal(task, fullOrder) {
    currentReportTask = task;
    currentReportFullOrder = fullOrder;
    
    const modal = document.getElementById('rightModal');
    const overlay = document.getElementById('rightModalOverlay');
    const contentDiv = document.getElementById('rightModalContent');
    
    // Загружаем сохранённые данные
    const savedData = getSavedReportData(task.id);
    if (savedData && savedData.rows) {
        reportRows = [...savedData.rows];
    } else {
        // Создаём одну пустую строку по умолчанию
        reportRows = [{ paintUsed: 0, quantity: 0, comment: '' }];
    }
    
    let operationName = task.operation;
    if (typeof operationName === 'object' && operationName !== null) {
        operationName = operationName.operation || JSON.stringify(operationName);
    }
    
    // Получаем количество изделий из заказа
    let productQuantity = 1;
    if (fullOrder && fullOrder.items && fullOrder.items[0]) {
        productQuantity = fullOrder.items[0].size?.quantity || 1;
    }
    
    renderReportForm(contentDiv, operationName, productQuantity);
    
    modal.classList.add('open');
    overlay.classList.add('show');
}

function renderReportForm(container, operationName, productQuantity) {
    let rowsHtml = '';
    
    reportRows.forEach((row, index) => {
        rowsHtml += `
            <div class="report-row" data-row-index="${index}" style="background: #15191f; border-radius: 8px; padding: 12px; margin-bottom: 12px; border: 1px solid #2a2f38;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span style="font-size: 12px; color: #ff9800;">📝 Запись ${index + 1}</span>
                    <button type="button" class="btn-remove-row" onclick="removeReportRow(${index})" style="background: #dc3545; color: white; border: none; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 11px;">✖️ Удалить</button>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                    <div>
                        <label style="font-size: 11px; color: #a0a0a0;">🎨 Расход краски (граммы):</label>
                        <input type="number" class="report-paint" data-row="${index}" value="${row.paintUsed || 0}" step="1" placeholder="0" style="width: 100%; padding: 6px; background: #1e232b; border: 1px solid #2a2f38; border-radius: 4px; color: #fff;">
                    </div>
                    <div>
                        <label style="font-size: 11px; color: #a0a0a0;">📦 Количество изделий:</label>
                        <input type="number" class="report-qty" data-row="${index}" value="${row.quantity || 0}" step="1" placeholder="0" style="width: 100%; padding: 6px; background: #1e232b; border: 1px solid #2a2f38; border-radius: 4px; color: #fff;">
                    </div>
                </div>
                <div>
                    <label style="font-size: 11px; color: #a0a0a0;">💬 Комментарий:</label>
                    <textarea class="report-comment" data-row="${index}" rows="2" placeholder="Дополнительная информация..." style="width: 100%; padding: 6px; background: #1e232b; border: 1px solid #2a2f38; border-radius: 4px; color: #fff;">${escapeHtml(row.comment || '')}</textarea>
                </div>
            </div>
        `;
    });
    
    // Подсчитываем итоги
    let totalPaint = reportRows.reduce((sum, row) => sum + (row.paintUsed || 0), 0);
    let totalQuantity = reportRows.reduce((sum, row) => sum + (row.quantity || 0), 0);
    
    container.innerHTML = `
        <div style="margin-bottom: 20px; padding: 12px; background: #15191f; border-radius: 8px; border-left: 3px solid #ff9800;">
            <div style="font-size: 12px; color: #a0a0a0;">Заказ: ${escapeHtml(currentReportTask.orderNumber)}</div>
            <div style="font-size: 16px; font-weight: bold; color: #ff9800; margin: 5px 0;">${escapeHtml(currentReportTask.product)}</div>
            <div style="font-size: 12px;">🔧 Операция: ${escapeHtml(operationName)}</div>
            <div style="font-size: 12px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #2a2f38;">
                <span style="color: #ff9800;">📊 Итого:</span>
                <span style="margin-left: 10px;">🎨 ${totalPaint} г</span>
                <span style="margin-left: 10px;">📦 ${totalQuantity} шт</span>
                <span style="margin-left: 10px;">📋 План: ${productQuantity} шт</span>
            </div>
        </div>
        
        <div id="reportRowsContainer" style="max-height: 400px; overflow-y: auto; margin-bottom: 15px;">
            ${rowsHtml}
        </div>
        
        <div style="margin-bottom: 15px;">
            <button type="button" class="btn btn-primary" onclick="addReportRow()" style="width: 100%; padding: 8px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer;">
                ➕ Добавить строку
            </button>
        </div>
        
        <div class="form-group">
            <label>👤 Исполнитель:</label>
            <input type="text" id="reportOperator" value="${getSavedReportData(currentReportTask.id)?.operator || localStorage.getItem('currentUser') || ''}" placeholder="ФИО исполнителя" class="report-input" style="width: 100%; padding: 8px; background: #1e232b; border: 1px solid #2a2f38; border-radius: 6px; color: #fff;">
        </div>
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button type="button" class="btn btn-success" onclick="saveReportData()" style="flex: 1;">💾 Сохранить отчёт</button>
            <button type="button" class="btn btn-danger" onclick="closeRightModal()" style="flex: 1;">✖️ Закрыть</button>
        </div>
        
        ${getSavedReportData(currentReportTask.id)?.savedAt ? `
        <div style="margin-top: 15px; padding: 8px; background: #15191f; border-radius: 6px; font-size: 11px; color: #4cd964;">
            ✅ Последнее сохранение: ${new Date(getSavedReportData(currentReportTask.id).savedAt).toLocaleString()}
        </div>
        ` : ''}
    `;
    
    // Добавляем обработчики для полей
    document.querySelectorAll('.report-paint').forEach(input => {
        input.addEventListener('change', function() {
            const rowIndex = parseInt(this.dataset.row);
            if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                reportRows[rowIndex].paintUsed = parseFloat(this.value) || 0;
                updateReportTotals();
            }
        });
    });
    
    document.querySelectorAll('.report-qty').forEach(input => {
        input.addEventListener('change', function() {
            const rowIndex = parseInt(this.dataset.row);
            if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                reportRows[rowIndex].quantity = parseFloat(this.value) || 0;
                updateReportTotals();
            }
        });
    });
    
    document.querySelectorAll('.report-comment').forEach(textarea => {
        textarea.addEventListener('change', function() {
            const rowIndex = parseInt(this.dataset.row);
            if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                reportRows[rowIndex].comment = this.value;
            }
        });
    });
}

function updateReportTotals() {
    const totalPaint = reportRows.reduce((sum, row) => sum + (row.paintUsed || 0), 0);
    const totalQuantity = reportRows.reduce((sum, row) => sum + (row.quantity || 0), 0);
    
    const totalsDiv = document.querySelector('#rightModalContent .report-totals');
    if (totalsDiv) {
        totalsDiv.innerHTML = `
            <span style="color: #ff9800;">📊 Итого:</span>
            <span style="margin-left: 10px;">🎨 ${totalPaint} г</span>
            <span style="margin-left: 10px;">📦 ${totalQuantity} шт</span>
        `;
    }
}

function addReportRow() {
    reportRows.push({ paintUsed: 0, quantity: 0, comment: '' });
    
    let operationName = currentReportTask.operation;
    if (typeof operationName === 'object' && operationName !== null) {
        operationName = operationName.operation || JSON.stringify(operationName);
    }
    
    let productQuantity = 1;
    if (currentReportFullOrder && currentReportFullOrder.items && currentReportFullOrder.items[0]) {
        productQuantity = currentReportFullOrder.items[0].size?.quantity || 1;
    }
    
    const container = document.getElementById('rightModalContent');
    renderReportForm(container, operationName, productQuantity);
}

function removeReportRow(rowIndex) {
    if (reportRows.length <= 1) {
        if (!confirm('Удалить последнюю строку? Будет создана пустая строка.')) return;
        reportRows = [{ paintUsed: 0, quantity: 0, comment: '' }];
    } else {
        reportRows.splice(rowIndex, 1);
    }
    
    let operationName = currentReportTask.operation;
    if (typeof operationName === 'object' && operationName !== null) {
        operationName = operationName.operation || JSON.stringify(operationName);
    }
    
    let productQuantity = 1;
    if (currentReportFullOrder && currentReportFullOrder.items && currentReportFullOrder.items[0]) {
        productQuantity = currentReportFullOrder.items[0].size?.quantity || 1;
    }
    
    const container = document.getElementById('rightModalContent');
    renderReportForm(container, operationName, productQuantity);
}

function saveReportData() {
    if (!currentReportTask) return;
    
    const operator = document.getElementById('reportOperator').value.trim();
    if (!operator) {
        alert('Введите ФИО исполнителя');
        return;
    }
    
    // Обновляем данные из полей перед сохранением
    document.querySelectorAll('.report-paint').forEach(input => {
        const rowIndex = parseInt(input.dataset.row);
        if (!isNaN(rowIndex) && reportRows[rowIndex]) {
            reportRows[rowIndex].paintUsed = parseFloat(input.value) || 0;
        }
    });
    
    document.querySelectorAll('.report-qty').forEach(input => {
        const rowIndex = parseInt(input.dataset.row);
        if (!isNaN(rowIndex) && reportRows[rowIndex]) {
            reportRows[rowIndex].quantity = parseFloat(input.value) || 0;
        }
    });
    
    document.querySelectorAll('.report-comment').forEach(textarea => {
        const rowIndex = parseInt(textarea.dataset.row);
        if (!isNaN(rowIndex) && reportRows[rowIndex]) {
            reportRows[rowIndex].comment = textarea.value;
        }
    });
    
    let operationName = currentReportTask.operation;
    if (typeof operationName === 'object' && operationName !== null) {
        operationName = operationName.operation || JSON.stringify(operationName);
    }
    
    const reportData = {
        taskId: currentReportTask.id,
        orderId: currentReportTask.orderId,
        orderNumber: currentReportTask.orderNumber,
        product: currentReportTask.product,
        operation: operationName,
        size: currentReportTask.size,
        siteKey: 'polimerniy',
        rows: reportRows.map(row => ({
            paintUsed: row.paintUsed || 0,
            quantity: row.quantity || 0,
            comment: row.comment || ''
        })),
        operator: operator,
        savedAt: new Date().toISOString()
    };
    
    // Сохраняем в localStorage
    const allReports = JSON.parse(localStorage.getItem('material_reports') || '[]');
    const existingIndex = allReports.findIndex(r => r.taskId === currentReportTask.id);
    
    if (existingIndex >= 0) {
        allReports[existingIndex] = reportData;
    } else {
        allReports.push(reportData);
    }
    
    localStorage.setItem('material_reports', JSON.stringify(allReports));
    localStorage.setItem('currentUser', operator);
    
    alert('✅ Отчёт сохранён!');
    closeRightModal();
}

function getSavedReportData(taskId) {
    const allReports = JSON.parse(localStorage.getItem('material_reports') || '[]');
    return allReports.find(r => r.taskId === taskId);
}

function closeRightModal() {
    const modal = document.getElementById('rightModal');
    const overlay = document.getElementById('rightModalOverlay');
    modal.classList.remove('open');
    overlay.classList.remove('show');
    currentReportTask = null;
    currentReportFullOrder = null;
    reportRows = [];
}

// Глобальные функции
window.openRightModal = openRightModal;
window.closeRightModal = closeRightModal;
window.saveReportData = saveReportData;
window.addReportRow = addReportRow;
window.removeReportRow = removeReportRow;
    </script>
