<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterX - Полимерный участок</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Карточка операции */
        .task-card {
            background: #1a1e24;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #2a2f38;
            overflow: hidden;
            transition: all 0.2s;
        }

        .task-card.priority {
            border: 2px solid #ff3b3b;
            box-shadow: 0 0 15px rgba(255,59,59,0.3);
        }

        .task-card:hover {
            border-color: #ff3b3b;
        }

        .task-header {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .task-header.status-pending {
            background: linear-gradient(135deg, #232830, #1a1e24);
            border-left: 4px solid #6c757d;
        }

        .task-header.status-in-progress {
            background: linear-gradient(135deg, #3a2a1a, #2a1f0f);
            border-left: 4px solid #ff9800;
        }

        .task-header.status-completed {
            background: linear-gradient(135deg, #1a3a1a, #0f2a0f);
            border-left: 4px solid #2ecc71;
        }

        .task-header.priority {
            background: linear-gradient(135deg, #4a1a1a, #3a0f0f) !important;
            border-left: 4px solid #ff3b3b !important;
        }

        .task-header.priority .task-customer-name {
            color: #ff6b6b !important;
        }

        .task-header-left {
            flex: 1;
        }

        .task-customer-name {
            font-weight: 600;
            color: #ff3b3b;
            font-size: 14px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .priority-badge {
            background: #ff3b3b;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            display: inline-block;
        }

        .task-product-info {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-top: 4px;
        }

        .task-product-name {
            font-size: 13px;
            color: #ff9800;
            font-weight: 500;
        }

        .task-size {
            font-size: 11px;
            color: #4cd964;
        }

        .task-quantity {
            font-size: 11px;
            color: #a0a0a0;
        }

        .task-ral {
            font-size: 11px;
            color: #ff9800;
            background: #1e232b;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .task-texture {
            font-size: 11px;
            color: #a0a0a0;
        }

        .task-status-badge {
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            min-width: 90px;
            text-align: center;
        }

        .task-status-badge.pending {
            background: #2a2f38;
            color: #a0a0a0;
        }

        .task-status-badge.in-progress {
            background: #ff9800;
            color: #1a1e24;
        }

        .task-status-badge.completed {
            background: #4caf50;
            color: white;
        }

        .collapse-icon {
            color: #a0a0a0;
            font-size: 14px;
            transition: transform 0.2s;
            margin-left: 15px;
        }

        .task-header.collapsed .collapse-icon {
            transform: rotate(-90deg);
        }

        .task-content {
            padding: 15px 20px;
            border-top: 1px solid #2a2f38;
            transition: all 0.2s;
        }

        .task-content.collapsed {
            display: none;
        }

        .operation-info {
            background: #15191f;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #2a2f38;
        }

        .operation-name {
            font-size: 14px;
            font-weight: 600;
            color: #ff9800;
            margin-bottom: 6px;
        }

        .operation-detail {
            font-size: 12px;
            color: #a0a0a0;
        }

        .operation-detail span {
            color: #4cd964;
        }

        .operation-plan {
            font-size: 11px;
            color: #ff9800;
            margin-top: 6px;
            padding: 2px 6px;
            background: #1e232b;
            border-radius: 4px;
            display: inline-block;
        }

        .executor-header {
            display: flex;
            gap: 8px;
            padding: 0 8px;
            margin-bottom: 4px;
            font-size: 10px;
            color: #a0a0a0;
        }

        .executor-header span:nth-child(1) { width: 120px; }
        .executor-header span:nth-child(2) { width: 60px; text-align: center; }
        .executor-header span:nth-child(3) { width: 70px; text-align: center; }
        .executor-header span:nth-child(4) { width: 30px; }

        .executor-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            background: #15191f;
            border-radius: 4px;
            margin-bottom: 4px;
            border: 1px solid #2a2f38;
        }

        .executor-name {
            width: 120px;
            padding: 3px 6px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            font-size: 11px;
        }

        .executor-quantity {
            width: 60px;
            padding: 3px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            text-align: center;
            font-size: 11px;
        }

        .btn-work {
            background: #ffc107;
            color: #000;
            padding: 3px 6px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            width: 65px;
            font-weight: 600;
        }

        .btn-work.active {
            background: #fd7e14;
            color: white;
        }

        .btn-work:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-add-executor {
            background: #6c757d;
            color: white;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            margin: 6px 0;
            width: 120px;
        }

        .action-container {
            margin: 6px 0;
        }

        .new-executor-form {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            padding: 6px;
            background: #15191f;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            flex-wrap: wrap;
        }

        .new-executor-form input {
            width: 130px;
            padding: 4px 6px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            font-size: 11px;
        }

        .btn-ready {
            background: #28a745;
            color: white;
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            margin: 8px 0 0 0;
            min-width: 80px;
        }

        .btn-ready:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-end-shift {
            background: #ff9800;
            color: white;
            padding: 3px 6px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            width: 85px;
            font-weight: 600;
            margin-left: 4px;
        }

        .btn-end-shift:disabled {
            background: #4caf50;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-report-item {
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-report-item:hover {
            background: #e68900;
            transform: scale(1.02);
        }

        /* Фильтры */
        .filter-section {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #15191f;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #2a2f38;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-group label {
            font-size: 10px;
            color: #a0a0a0;
            letter-spacing: 0.5px;
        }

        .filter-group select {
            padding: 6px 10px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            min-width: 150px;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #ff3b3b;
        }

        .btn-reset {
            background: #6c757d;
            padding: 6px 12px;
            font-size: 12px;
            height: 32px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            color: white;
        }

        .btn-reset:hover {
            background: #5a6268;
        }

        .order-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding: 12px 15px;
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            border-radius: 10px;
            border: 1px solid #2a2f38;
        }

        .stat-item {
            flex: 1;
            text-align: center;
            padding: 8px;
            background: #15191f;
            border-radius: 6px;
            border: 1px solid #2a2f38;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }

        .stat-label {
            font-size: 11px;
            color: #a0a0a0;
        }

        .no-tasks {
            text-align: center;
            padding: 40px;
            background: #1a1e24;
            border-radius: 12px;
            color: #a0a0a0;
            border: 1px solid #2a2f38;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #a0a0a0;
        }

        .spinner {
            width: 30px;
            height: 30px;
            margin: 0 auto 10px;
            border: 2px solid #2a2f38;
            border-top: 2px solid #ff3b3b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Правая модальная панель */
        .right-modal {
            position: fixed;
            right: -450px;
            top: 0;
            width: 450px;
            height: 100vh;
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            border-left: 2px solid #ff3b3b;
            box-shadow: -5px 0 30px rgba(0,0,0,0.5);
            transition: right 0.3s ease;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .right-modal.open {
            right: 0;
        }

        .right-modal-header {
            background: linear-gradient(135deg, #232830, #1a1e24);
            padding: 15px 20px;
            border-bottom: 1px solid #2a2f38;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .right-modal-header h3 {
            margin: 0;
            color: #ff3b3b;
            font-size: 18px;
        }

        .right-modal-close {
            background: none;
            border: none;
            color: #a0a0a0;
            font-size: 28px;
            cursor: pointer;
        }

        .right-modal-close:hover {
            color: #ff3b3b;
        }

        .right-modal-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .right-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1999;
            display: none;
        }

        .right-modal-overlay.show {
            display: block;
        }

        .report-row {
            background: #15191f;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #2a2f38;
        }

        .report-input {
            width: 100%;
            padding: 6px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
        }

        .report-textarea {
            width: 100%;
            padding: 6px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            resize: vertical;
        }

        .btn-add-row {
            width: 100%;
            padding: 8px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-remove-row {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 11px;
        }

        body.light-theme .filter-section {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
        }

        body.light-theme .filter-group select {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            color: #1e293b !important;
        }

        body.light-theme .task-card {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
        }

        body.light-theme .task-header.status-pending {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9) !important;
        }

        body.light-theme .task-header.status-in-progress {
            background: linear-gradient(135deg, #fff3e0, #ffe6cc) !important;
        }

        body.light-theme .task-header.status-completed {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9) !important;
        }

        body.light-theme .task-header.priority {
            background: linear-gradient(135deg, #fee2e2, #fecaca) !important;
        }

        body.light-theme .task-customer-name {
            color: #dc2626 !important;
        }

        body.light-theme .task-product-name {
            color: #f97316 !important;
        }

        body.light-theme .operation-info {
            background: #f8fafc !important;
            border: 1px solid #e2e8f0 !important;
        }

        body.light-theme .executor-item {
            background: #f8fafc !important;
            border: 1px solid #e2e8f0 !important;
        }

        body.light-theme .executor-name,
        body.light-theme .executor-quantity {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            color: #1e293b !important;
        }

        body.light-theme .btn-report-item {
            background: #ff9800 !important;
            color: white !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="../images/logo.png" alt="MasterX Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="logo-text">Master<span class="x-red">X</span></div>
            </div>
            <h1 style="margin:0; color: white; font-size:18px;">🎨 Полимерный участок</h1>
        </header>

        <!-- ФИЛЬТРЫ -->
        <div class="filter-section">
            <div class="filter-group">
                <label>🏢 ЗАКАЗЧИК</label>
                <select id="filterCustomer">
                    <option value="">Все заказчики</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📦 ИЗДЕЛИЕ</label>
                <select id="filterProduct">
                    <option value="">Все изделия</option>
                </select>
            </div>
            <div class="filter-group">
                <label>🔧 ОПЕРАЦИЯ</label>
                <select id="filterOperation">
                    <option value="">Все операции</option>
                </select>
            </div>
            <div class="filter-group">
                <label>🎨 RAL</label>
                <select id="filterRal">
                    <option value="">Все RAL</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📊 СТАТУС</label>
                <select id="statusFilter">
                    <option value="all">Все задачи</option>
                    <option value="pending">⏳ Ожидают</option>
                    <option value="in_progress">⚡ В работе</option>
                    <option value="completed">✅ Завершённые</option>
                </select>
            </div>
            <button class="btn-reset" onclick="resetFilters()">🔄 Сбросить</button>
        </div>

        <div class="order-stats">
            <div class="stat-item"><div class="stat-value" id="totalTasks">0</div><div class="stat-label">Всего задач</div></div>
            <div class="stat-item"><div class="stat-value" id="tasksInProgress">0</div><div class="stat-label">В работе</div></div>
            <div class="stat-item"><div class="stat-value" id="tasksCompleted">0</div><div class="stat-label">Выполнено</div></div>
        </div>

        <div id="tasksList" class="tasks-list"><div class="loading"><div class="spinner"></div><p>Загрузка задач...</p></div></div>
    </div>

    <div id="rightModalOverlay" class="right-modal-overlay" onclick="closeRightModal()"></div>
    <div id="rightModal" class="right-modal">
        <div class="right-modal-header">
            <h3>📝 Отчёт по задаче</h3>
            <button class="right-modal-close" onclick="closeRightModal()">&times;</button>
        </div>
        <div id="rightModalContent" class="right-modal-content"></div>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/data-loader.js"></script>
    <script src="../js/task-operations.js"></script>
    <script src="../js/task-manager.js"></script>

    <script>
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        let taskOperationsData = {};
        let taskManager = null;
        let isLoadingTasks = false;
        let currentReportTask = null;
        let reportRows = [];
        
        const OPEN_CARDS_KEY = 'polimerniy_open_tasks';
        
        function saveOpenCardsState() {
            const openCards = [];
            document.querySelectorAll('.task-card').forEach(card => {
                const content = card.querySelector('.task-content');
                if (content && !content.classList.contains('collapsed')) {
                    openCards.push(card.dataset.taskId);
                }
            });
            localStorage.setItem(OPEN_CARDS_KEY, JSON.stringify(openCards));
        }
        
        function restoreOpenCardsState() {
            const savedOpenCards = localStorage.getItem(OPEN_CARDS_KEY);
            if (!savedOpenCards) return;
            const openCardsIds = JSON.parse(savedOpenCards);
            openCardsIds.forEach(taskId => {
                const card = document.querySelector(`.task-card[data-task-id="${taskId}"]`);
                if (card) {
                    const header = card.querySelector('.task-header');
                    const content = card.querySelector('.task-content');
                    if (header && content) {
                        header.classList.remove('collapsed');
                        content.classList.remove('collapsed');
                        const arrow = header.querySelector('.collapse-icon');
                        if (arrow) arrow.textContent = '▲';
                    }
                }
            });
        }
        
        async function loadTaskOperationsData() {
            try {
                const response = await fetch('../data/taskOperations.json');
                if (response.ok) {
                    const data = await response.json();
                    taskOperationsData = data.operations || {};
                    console.log('✅ Загружены операции из taskOperations.json');
                }
            } catch(e) {
                console.error('Ошибка загрузки taskOperations.json:', e);
            }
        }
        
        function populateFilters() {
            const allOrders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
            const customers = new Set();
            const products = new Set();
            const operations = new Set();
            const rals = new Set();
            
            allOrders.forEach(order => {
                if (order.groupName) customers.add(order.groupName);
                if (order.items) {
                    order.items.forEach(item => {
                        if (item.product) products.add(item.product);
                        if (item.ral && item.ral.trim()) {
                            rals.add(item.ral.trim());
                        }
                    });
                }
            });
            
            if (taskManager && taskManager.tasks) {
                taskManager.tasks.forEach(task => {
                    if (task.operation) operations.add(task.operation);
                });
            }
            
            const customerSelect = document.getElementById('filterCustomer');
            if (customerSelect) {
                customerSelect.innerHTML = '<option value="">🏢 Все заказчики</option>';
                Array.from(customers).sort().forEach(c => {
                    customerSelect.innerHTML += `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`;
                });
            }
            
            const productSelect = document.getElementById('filterProduct');
            if (productSelect) {
                productSelect.innerHTML = '<option value="">📦 Все изделия</option>';
                Array.from(products).sort().forEach(p => {
                    productSelect.innerHTML += `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`;
                });
            }
            
            const operationSelect = document.getElementById('filterOperation');
            if (operationSelect) {
                operationSelect.innerHTML = '<option value="">🔧 Все операции</option>';
                Array.from(operations).sort().forEach(op => {
                    operationSelect.innerHTML += `<option value="${escapeHtml(op)}">${escapeHtml(op)}</option>`;
                });
            }
            
            const ralSelect = document.getElementById('filterRal');
            if (ralSelect) {
                ralSelect.innerHTML = '<option value="">🎨 Все RAL</option>';
                Array.from(rals).sort().forEach(r => {
                    ralSelect.innerHTML += `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`;
                });
            }
        }
        
        function resetFilters() {
            document.getElementById('filterCustomer').value = '';
            document.getElementById('filterProduct').value = '';
            document.getElementById('filterOperation').value = '';
            document.getElementById('filterRal').value = '';
            document.getElementById('statusFilter').value = 'all';
            loadTasks();
        }
        
        class SimpleTaskManager {
            constructor(siteKey) {
                this.siteKey = siteKey;
                this.tasks = [];
                this.storageKey = `tasks_${siteKey}`;
            }
            
            loadData() {
                const saved = localStorage.getItem(this.storageKey);
                if (saved) {
                    this.tasks = JSON.parse(saved);
                } else {
                    this.tasks = [];
                }
                return this.tasks;
            }
            
            saveData() {
                localStorage.setItem(this.storageKey, JSON.stringify(this.tasks));
            }
            
            getTasksByStatus(status) {
                if (status === 'all') return this.tasks;
                return this.tasks.filter(t => t.status === status);
            }
            
            getStats() {
                const total = this.tasks.length;
                const inProgress = this.tasks.filter(t => t.status === 'in_progress').length;
                const completed = this.tasks.filter(t => t.status === 'completed').length;
                return { total, inProgress, completed };
            }
            
            updateExecutorQuantity(taskId, executorId, quantity) {
                const task = this.tasks.find(t => t.id === taskId);
                if (task && task.executors) {
                    const executor = task.executors.find(e => e.id === executorId);
                    if (executor) {
                        executor.quantity = quantity;
                        this.saveData();
                    }
                }
            }
            
            updateExecutorStatus(taskId, executorId, status) {
                const task = this.tasks.find(t => t.id === taskId);
                if (!task || !task.executors) return;
                const executor = task.executors.find(e => e.id === executorId);
                if (executor) {
                    executor.status = status;
                    this.saveData();
                    let taskStatus = 'pending';
                    if (task.executors.some(e => e.status === 'in_progress')) {
                        taskStatus = 'in_progress';
                    } else if (task.executors.every(e => e.status === 'shift_ended' || e.status === 'completed')) {
                        taskStatus = 'completed';
                    }
                    task.status = taskStatus;
                    this.saveData();
                    const orders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
                    const order = orders.find(o => o.id == task.orderId);
                    if (order) {
                        if (!order.tasks) order.tasks = {};
                        order.tasks[task.id] = taskStatus;
                        localStorage.setItem('masterx_orders', JSON.stringify(orders));
                    }
                    setTimeout(() => { loadTasks(); }, 100);
                }
            }
            
            addExecutor(taskId, name) {
                const task = this.tasks.find(t => t.id === taskId);
                if (task) {
                    if (!task.executors) task.executors = [];
                    if (task.executors.some(e => e.name === name)) return false;
                    task.executors.push({
                        id: Date.now(),
                        name: name,
                        quantity: 0,
                        status: 'pending'
                    });
                    this.saveData();
                    return true;
                }
                return false;
            }
            
            removeExecutor(taskId, executorId) {
                const task = this.tasks.find(t => t.id === taskId);
                if (task && task.executors) {
                    task.executors = task.executors.filter(e => e.id !== executorId);
                    this.saveData();
                }
            }
            
            completeTask(taskId) {
                const task = this.tasks.find(t => t.id === taskId);
                if (task && task.status !== 'completed') {
                    task.status = 'completed';
                    task.completedAt = new Date().toISOString();
                    this.saveData();
                    const orders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
                    const order = orders.find(o => o.id == task.orderId);
                    if (order) {
                        if (!order.tasks) order.tasks = {};
                        order.tasks[task.id] = 'completed';
                        const orderIndex = orders.findIndex(o => o.id == task.orderId);
                        orders[orderIndex] = order;
                        localStorage.setItem('masterx_orders', JSON.stringify(orders));
                    }
                    setTimeout(() => { loadTasks(); }, 100);
                }
            }
        }
        
        function loadTasks() {
            if (isLoadingTasks) return;
            isLoadingTasks = true;
            
            taskManager.loadData();
            
            // ОБНОВЛЯЕМ ФИЛЬТРЫ
            populateFilters();
            
            let tasks = taskManager.getTasksByStatus(document.getElementById('statusFilter').value);
            
            const filterCustomer = document.getElementById('filterCustomer').value;
            const filterProduct = document.getElementById('filterProduct').value;
            const filterOperation = document.getElementById('filterOperation').value;
            const filterRal = document.getElementById('filterRal').value;
            const filterStatus = document.getElementById('statusFilter').value;
            
            const allOrders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
            
            // ФИЛЬТРАЦИЯ
            let filteredTasks = tasks.filter(task => {
                const order = allOrders.find(o => o.id == task.orderId);
                if (!order) return false;
                
                if (task.isPriority === true) {
                    if (filterStatus === 'completed' && task.status !== 'completed') return false;
                    return true;
                }
                
                if (filterCustomer && order.groupName !== filterCustomer) return false;
                
                const item = order.items?.[task.itemIndex || 0];
                if (!item) return false;
                
                if (filterProduct && item.product !== filterProduct) return false;
                
                if (filterRal) {
                    const itemRal = (item.ral || '').trim();
                    if (itemRal !== filterRal) return false;
                }
                
                if (filterOperation && task.operation !== filterOperation) return false;
                
                return true;
            });
            
            // СОРТИРОВКА: приоритетные наверх
            const priorityTasks = filteredTasks.filter(t => t.isPriority === true);
            const normalTasks = filteredTasks.filter(t => t.isPriority !== true);
            priorityTasks.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            const sortedTasks = [...priorityTasks, ...normalTasks];
            
            // СТАТИСТИКА
            document.getElementById('totalTasks').textContent = filteredTasks.length;
            document.getElementById('tasksInProgress').textContent = filteredTasks.filter(t => t.status === 'in_progress').length;
            document.getElementById('tasksCompleted').textContent = filteredTasks.filter(t => t.status === 'completed').length;

            const tasksList = document.getElementById('tasksList');
            tasksList.innerHTML = '';

            if (sortedTasks.length === 0) {
                tasksList.innerHTML = '<div class="no-tasks"><p>📭 Нет задач по выбранным фильтрам</p></div>';
                isLoadingTasks = false;
                return;
            }

            // РЕНДЕРИНГ
            sortedTasks.forEach(task => {
                const order = allOrders.find(o => o.id == task.orderId);
                const item = order?.items?.[task.itemIndex || 0];
                if (!order || !item) return;
                
                let statusClass = 'pending';
                let statusText = '⏳ ОЖИДАЕТ';
                if (task.status === 'in_progress') {
                    statusClass = 'in-progress';
                    statusText = '⚡ В РАБОТЕ';
                } else if (task.status === 'completed') {
                    statusClass = 'completed';
                    statusText = '✅ ГОТОВО';
                }
                
                const isPriority = task.isPriority === true;
                const priorityClass = isPriority ? 'priority' : '';
                const priorityBadge = isPriority ? '<span class="priority-badge">🔴 ПРИОРИТЕТ</span>' : '';
                
                const taskCard = document.createElement('div');
                taskCard.className = `task-card ${priorityClass}`;
                taskCard.dataset.taskId = task.id;
                
                const header = document.createElement('div');
                header.className = `task-header ${statusClass} ${priorityClass} collapsed`;
                header.innerHTML = `
                    <div class="task-header-left">
                        <div class="task-customer-name">
                            🏢 ${escapeHtml(order.groupName)} | Заказ №${escapeHtml(order.number)}
                            ${priorityBadge}
                        </div>
                        <div class="task-product-info">
                            <span class="task-product-name">📦 ${escapeHtml(item.product)}</span>
                            <span class="task-size">📏 ${escapeHtml(item.size?.name || '-')}</span>
                            <span class="task-quantity">× ${item.size?.quantity || 1} шт</span>
                            ${item.ral ? `<span class="task-ral">🎨 ${escapeHtml(item.ral)}</span>` : ''}
                            ${item.texture ? `<span class="task-texture">🧵 ${escapeHtml(item.texture)}</span>` : ''}
                        </div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span class="task-status-badge ${statusClass}">${statusText}</span>
                        <button class="btn-report-item" onclick="event.stopPropagation(); openRightModalForTask('${task.id}')">📝 Отчёт</button>
                        <span class="collapse-icon">▼</span>
                    </div>
                `;
                
                const content = document.createElement('div');
                content.className = 'task-content collapsed';
                
                const productOps = taskOperationsData[item.product];
                const siteOps = productOps?.['полимерный'];
                const operationData = siteOps?.find(op => op.operation === task.operation);
                const detailName = operationData?.detail || '';
                const thickness = operationData?.thickness || '';
                
                let detailHtml = '';
                if (detailName) {
                    let detailDisplay = detailName;
                    if (thickness) {
                        detailDisplay = detailDisplay.replace(thickness, '').trim();
                    }
                    detailHtml = `
                        <div class="operation-detail">
                            📦 ${escapeHtml(detailDisplay)} ${thickness ? `<span>${escapeHtml(thickness)}</span>` : ''}
                        </div>
                    `;
                }
                
                content.innerHTML = `
                    <div class="operation-info">
                        <div class="operation-name">${escapeHtml(task.operation)}</div>
                        ${detailHtml}
                        <div class="operation-plan">📋 План: ${task.totalQuantity || 1} шт</div>
                    </div>
                    
                    <div class="executor-header">
                        <span>ФИО</span><span>Кол-во</span><span>Статус</span><span></span>
                    </div>
                    <div class="executor-list" id="executors-${task.id}"></div>
                    
                    <div class="action-container" id="action-${task.id}"></div>
                    
                    <button class="btn-ready" id="ready-${task.id}" ${task.status === 'completed' ? 'disabled' : ''}>✅ ГОТОВО</button>
                `;
                
                header.addEventListener('click', function(e) {
                    if (e.target.tagName === 'BUTTON') return;
                    header.classList.toggle('collapsed');
                    content.classList.toggle('collapsed');
                    const arrow = header.querySelector('.collapse-icon');
                    if (arrow) arrow.textContent = header.classList.contains('collapsed') ? '▼' : '▲';
                    saveOpenCardsState();
                });
                
                taskCard.appendChild(header);
                taskCard.appendChild(content);
                tasksList.appendChild(taskCard);
                
                renderExecutors(task.id, task);
                renderActionButtons(task.id, task);
                
                const readyBtn = document.getElementById(`ready-${task.id}`);
                if (readyBtn) {
                    readyBtn.onclick = () => completeTask(task.id);
                }
            });
            
            setTimeout(() => {
                restoreOpenCardsState();
                isLoadingTasks = false;
            }, 50);
        }
        
        function renderExecutors(taskId, task) {
            const container = document.getElementById(`executors-${taskId}`);
            if (!container) return;
            container.innerHTML = '';
            
            if (task.executors && task.executors.length > 0) {
                task.executors.forEach(executor => {
                    const isShiftEnded = executor.status === 'shift_ended';
                    const isCompleted = task.status === 'completed';
                    const div = document.createElement('div');
                    div.className = 'executor-item';
                    div.dataset.executorId = executor.id;
                    
                    const nameInput = document.createElement('input');
                    nameInput.type = 'text';
                    nameInput.className = 'executor-name';
                    nameInput.value = executor.name;
                    nameInput.disabled = isCompleted || isShiftEnded;
                    div.appendChild(nameInput);
                    
                    const quantityInput = document.createElement('input');
                    quantityInput.type = 'number';
                    quantityInput.className = 'executor-quantity';
                    quantityInput.value = executor.quantity || 0;
                    quantityInput.min = 0;
                    quantityInput.disabled = isCompleted || isShiftEnded;
                    quantityInput.onchange = function() {
                        taskManager.updateExecutorQuantity(task.id, executor.id, parseInt(this.value) || 0);
                        loadTasks();
                    };
                    div.appendChild(quantityInput);
                    
                    const workBtn = document.createElement('button');
                    workBtn.className = `btn-work ${executor.status === 'in_progress' ? 'active' : ''}`;
                    workBtn.textContent = executor.status === 'in_progress' ? 'В РАБОТЕ' : (isShiftEnded ? 'СМЕНА ЗАКРЫТА' : 'НАЧАТЬ');
                    workBtn.disabled = isCompleted || isShiftEnded;
                    workBtn.onclick = function() {
                        if (isShiftEnded) return;
                        const newStatus = workBtn.classList.contains('active') ? 'pending' : 'in_progress';
                        taskManager.updateExecutorStatus(task.id, executor.id, newStatus);
                        workBtn.classList.toggle('active');
                        workBtn.textContent = newStatus === 'in_progress' ? 'В РАБОТЕ' : 'НАЧАТЬ';
                    };
                    div.appendChild(workBtn);
                    
                    const endShiftBtn = document.createElement('button');
                    endShiftBtn.className = 'btn-end-shift';
                    endShiftBtn.innerHTML = isShiftEnded ? '✅ СМЕНА ЗАКРЫТА' : '🕒 ЗАКРЫТЬ';
                    endShiftBtn.disabled = isCompleted || isShiftEnded;
                    endShiftBtn.onclick = function() {
                        if (confirm('Закрыть смену для ' + executor.name + '?')) {
                            taskManager.updateExecutorStatus(task.id, executor.id, 'shift_ended');
                            loadTasks();
                        }
                    };
                    div.appendChild(endShiftBtn);
                    
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'btn btn-danger btn-sm';
                    removeBtn.innerHTML = '✕';
                    removeBtn.disabled = isCompleted || isShiftEnded;
                    removeBtn.onclick = function() {
                        if (confirm('Удалить этого исполнителя?')) taskManager.removeExecutor(task.id, executor.id);
                        loadTasks();
                    };
                    div.appendChild(removeBtn);
                    container.appendChild(div);
                });
            } else {
                const noExecutors = document.createElement('p');
                noExecutors.style.cssText = 'color: #a0a0a0; padding: 8px; text-align: center; font-style: italic; font-size: 11px;';
                noExecutors.textContent = 'Нет исполнителей';
                container.appendChild(noExecutors);
            }
        }
        
        function renderActionButtons(taskId, task) {
            const container = document.getElementById(`action-${taskId}`);
            if (!container) return;
            container.innerHTML = '';
            if (task.status !== 'completed') {
                const addBtn = document.createElement('button');
                addBtn.className = 'btn-add-executor';
                addBtn.textContent = '+ Добавить исполнителя';
                addBtn.onclick = function() { showAddExecutorForm(task, container); };
                container.appendChild(addBtn);
            }
        }
        
        function showAddExecutorForm(task, container) {
            const oldForm = container.querySelector('.new-executor-form');
            if (oldForm) oldForm.remove();
            const formDiv = document.createElement('div');
            formDiv.className = 'new-executor-form';
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'ФИО исполнителя';
            const addBtn = document.createElement('button');
            addBtn.className = 'btn btn-success';
            addBtn.textContent = 'Добавить';
            addBtn.onclick = function() {
                const name = input.value.trim();
                if (!name) { alert('Введите ФИО'); return; }
                if (taskManager.addExecutor(task.id, name)) {
                    formDiv.remove();
                    loadTasks();
                } else { alert('Исполнитель уже существует'); }
            };
            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn btn-danger';
            cancelBtn.textContent = 'Отмена';
            cancelBtn.onclick = function() { formDiv.remove(); };
            formDiv.appendChild(input);
            formDiv.appendChild(addBtn);
            formDiv.appendChild(cancelBtn);
            container.appendChild(formDiv);
        }
        
        function completeTask(taskId) {
            const task = taskManager.tasks.find(t => t.id === taskId);
            if (!task) return;
            const totalAssigned = task.executors.reduce((sum, e) => sum + (e.quantity || 0), 0);
            let operationName = task.operation;
            if (confirm('Завершить задачу?\nОперация: ' + operationName + '\nВыполнено: ' + totalAssigned + ' шт')) {
                taskManager.completeTask(taskId);
                loadTasks();
            }
        }
        
        function openRightModalForTask(taskId) {
            const task = taskManager.tasks.find(t => t.id === taskId);
            if (!task) {
                alert('Задача не найдена');
                return;
            }
            const allOrders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
            const order = allOrders.find(o => o.id == task.orderId);
            const item = order?.items?.[task.itemIndex || 0];
            if (!order || !item) {
                alert('Данные заказа не найдены');
                return;
            }
            currentReportTask = {
                taskId: task.id,
                orderId: order.id,
                orderNumber: order.number,
                customerName: order.groupName,
                product: item.product,
                size: item.size?.name,
                quantity: item.size?.quantity,
                ral: item.ral,
                texture: item.texture,
                operation: task.operation,
                isPriority: task.isPriority || false
            };
            const modal = document.getElementById('rightModal');
            const overlay = document.getElementById('rightModalOverlay');
            const contentDiv = document.getElementById('rightModalContent');
            const savedData = getSavedReportDataForTask(task.id);
            if (savedData && savedData.rows) {
                reportRows = [...savedData.rows];
            } else {
                reportRows = [{ расход: 0, количество: 0, комментарий: '' }];
            }
            renderReportForm(contentDiv);
            modal.classList.add('open');
            overlay.classList.add('show');
        }
        
        function getSavedReportDataForTask(taskId) {
            const allReports = JSON.parse(localStorage.getItem('material_reports') || '[]');
            const taskReports = allReports.filter(r => r.taskId === taskId);
            if (taskReports.length === 0) return null;
            const allRows = [];
            taskReports.forEach(report => {
                if (report.rows) {
                    allRows.push(...report.rows);
                }
            });
            return { rows: allRows, savedAt: taskReports[taskReports.length - 1]?.savedAt };
        }

            container.innerHTML = `
                <div style="padding: 20px 0;">
                    <div style="margin-bottom: 20px; padding: 12px; background: #15191f; border-radius: 8px; border-left: 3px solid #ff9800;">
                        <div style="font-size: 12px; color: #a0a0a0;">Заказ: ${escapeHtml(currentReportTask.orderNumber)}</div>
                        <div style="font-size: 14px; font-weight: bold; color: #ff9800; margin: 5px 0;">${escapeHtml(currentReportTask.product)}${priorityBadge}</div>
                        <div style="font-size: 12px;">🏢 ${escapeHtml(currentReportTask.customerName)}</div>
                        <div style="font-size: 12px;">📏 Размер: ${escapeHtml(currentReportTask.size || '-')} × ${currentReportTask.quantity || 0} шт</div>
                        <div style="font-size: 12px;">🎨 Покрытие: ${escapeHtml(currentReportTask.ral || '-')} / ${escapeHtml(currentReportTask.texture || '-')}</div>
                        <div style="font-size: 12px; margin-top: 8px;">🔧 Операция: ${escapeHtml(currentReportTask.operation)}</div>
                    </div>
                    <div id="reportRowsContainer" style="max-height: 400px; overflow-y: auto; margin-bottom: 15px;">${rowsHtml}</div>
                    <div style="margin-bottom: 15px;"><button type="button" class="btn-add-row" onclick="addReportRowItem()">➕ Добавить строку</button></div>
                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button type="button" class="btn btn-success" onclick="saveReportDataForTask()" style="flex: 1;">💾 Сохранить</button>
                        <button type="button" class="btn btn-danger" onclick="closeRightModal()" style="flex: 1;">✖️ Закрыть</button>
                    </div>
                </div>
            `;
            document.querySelectorAll('.report-expense').forEach(input => {

                        reportRows[rowIndex].расход = parseFloat(this.value) || 0;
                    }
                });
            });
            document.querySelectorAll('.report-quantity').forEach(input => {
                input.addEventListener('change', function() {
                    const rowIndex = parseInt(this.dataset.row);
                    if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                        reportRows[rowIndex].количество = parseFloat(this.value) || 0;
                    }
                });
            });
            document.querySelectorAll('.report-comment').forEach(textarea => {
                textarea.addEventListener('change', function() {
                    const rowIndex = parseInt(this.dataset.row);
                    if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                        reportRows[rowIndex].комментарий = this.value;
                    }
                });
            });

        function addReportRowItem() {
            reportRows.push({ расход: 0, количество: 0, комментарий: '' });
            const container = document.getElementById('rightModalContent');
            renderReportForm(container);
        }
        
        function removeReportRowItem(rowIndex) {
            if (reportRows.length <= 1) {
                if (!confirm('Удалить последнюю строку? Будет создана пустая строка.')) return;
                reportRows = [{ расход: 0, количество: 0, комментарий: '' }];
            } else {
                reportRows.splice(rowIndex, 1);
            }
            const container = document.getElementById('rightModalContent');
            renderReportForm(container);
        }
        
        function saveReportDataForTask() {
            if (!currentReportTask) return;
            document.querySelectorAll('.report-expense').forEach(input => {
                const rowIndex = parseInt(input.dataset.row);
                if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                    reportRows[rowIndex].расход = parseFloat(input.value) || 0;
                }
            });
            document.querySelectorAll('.report-quantity').forEach(input => {
                const rowIndex = parseInt(input.dataset.row);
                if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                    reportRows[rowIndex].количество = parseFloat(input.value) || 0;
                }
            });
            document.querySelectorAll('.report-comment').forEach(textarea => {
                const rowIndex = parseInt(textarea.dataset.row);
                if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                    reportRows[rowIndex].комментарий = textarea.value;
                }
            });
            const reportData = {
                taskId: currentReportTask.taskId,
                orderId: currentReportTask.orderId,
                orderNumber: currentReportTask.orderNumber,
                customerName: currentReportTask.customerName,
                product: currentReportTask.product,
                size: currentReportTask.size,
                quantity: currentReportTask.quantity,
                ral: currentReportTask.ral,
                texture: currentReportTask.texture,
                operation: currentReportTask.operation,
                isPriority: currentReportTask.isPriority,
                siteKey: 'polimerniy',
                rows: reportRows.map(row => ({
                    расход: row.расход || 0,
                    количество: row.количество || 0,
                    комментарий: row.комментарий || ''
                })),
                savedAt: new Date().toISOString(),
                isTaskReport: true
            };
            let allReports = JSON.parse(localStorage.getItem('material_reports') || '[]');
            allReports = allReports.filter(r => r.taskId !== currentReportTask.taskId);
            allReports.push(reportData);
            localStorage.setItem('material_reports', JSON.stringify(allReports));
            alert('✅ Отчёт сохранён!');
            closeRightModal();
        }
        
        function closeRightModal() {
            const modal = document.getElementById('rightModal');
            const overlay = document.getElementById('rightModalOverlay');
            modal.classList.remove('open');
            overlay.classList.remove('show');
            currentReportTask = null;
            reportRows = [];
        }
        
        function setupFilterListeners() {
            const inputs = ['filterCustomer', 'filterProduct', 'filterOperation', 'filterRal', 'statusFilter'];
            inputs.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('change', () => loadTasks());
                }
            });
        }
        
        window.exportToExcel = function() {
            const tasks = taskManager.tasks;
            const allOrders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
            let csv = "Заказ,Заказчик,Изделие,Размер,Количество,RAL,Текстура,Операция,Деталь,Приоритет,Исполнитель,Количество,Статус,План\n";
            tasks.forEach(task => {
                const order = allOrders.find(o => o.id == task.orderId);
                const item = order?.items?.[task.itemIndex || 0];
                const productOps = taskOperationsData[item?.product];
                const siteOps = productOps?.['полимерный'];
                const operationData = siteOps?.find(op => op.operation === task.operation);
                const detailName = operationData?.detail || '';
                const isPriority = task.isPriority ? 'ДА' : 'НЕТ';
                if (task.executors && task.executors.length > 0) {
                    task.executors.forEach(exec => {
                        csv += `"${task.orderNumber}","${order?.groupName || ''}","${item?.product || ''}","${item?.size?.name || ''}",${item?.size?.quantity || 0},"${item?.ral || ''}","${item?.texture || ''}","${task.operation}","${detailName}","${isPriority}","${exec.name}",${exec.quantity || 0},"${exec.status}",${task.totalQuantity || 1}\n`;
                    });
                } else {
                    csv += `"${task.orderNumber}","${order?.groupName || ''}","${item?.product || ''}","${item?.size?.name || ''}",${item?.size?.quantity || 0},"${item?.ral || ''}","${item?.texture || ''}","${task.operation}","${detailName}","${isPriority}","Нет",0,"${task.status}",${task.totalQuantity || 1}\n`;
                }
            });
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `polimerniy_tasks.csv`;
            link.click();
        };
        
        async function init() {
            await loadTaskOperationsData();
            taskManager = new SimpleTaskManager('polimerniy');
            window.taskManager = taskManager;
            setupFilterListeners();
            loadTasks();
            window.addEventListener('beforeunload', () => { saveOpenCardsState(); });
        }
        
        window.resetFilters = resetFilters;
        window.openRightModalForTask = openRightModalForTask;
        window.closeRightModal = closeRightModal;
        window.addReportRowItem = addReportRowItem;
        window.removeReportRowItem = removeReportRowItem;
        window.saveReportDataForTask = saveReportDataForTask;
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
