<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterX - Полимерный участок</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Стили остаются без изменений - такие же как были */
        .task-card {
            background: #1a1e24;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #2a2f38;
            overflow: hidden;
            transition: all 0.2s;
        }
        .task-card.priority {
            border: 2px solid #ff3b3b;
            box-shadow: 0 0 15px rgba(255,59,59,0.3);
        }
        .task-card:hover {
            border-color: #ff3b3b;
        }
        .task-header {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .task-header.status-pending {
            background: linear-gradient(135deg, #232830, #1a1e24);
            border-left: 4px solid #6c757d;
        }
        .task-header.status-in-progress {
            background: linear-gradient(135deg, #3a2a1a, #2a1f0f);
            border-left: 4px solid #ff9800;
        }
        .task-header.status-completed {
            background: linear-gradient(135deg, #1a3a1a, #0f2a0f);
            border-left: 4px solid #2ecc71;
        }
        .task-header.priority {
            background: linear-gradient(135deg, #4a1a1a, #3a0f0f) !important;
            border-left: 4px solid #ff3b3b !important;
        }
        .task-header-left {
            flex: 1;
        }
        .task-customer-name {
            font-weight: 600;
            color: #ff3b3b;
            font-size: 14px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .priority-badge {
            background: #ff3b3b;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            display: inline-block;
        }
        .task-product-info {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-top: 4px;
        }
        .task-product-name {
            font-size: 13px;
            color: #ff9800;
            font-weight: 500;
        }
        .task-size {
            font-size: 11px;
            color: #4cd964;
        }
        .task-quantity {
            font-size: 11px;
            color: #a0a0a0;
        }
        .task-ral {
            font-size: 11px;
            color: #ff9800;
            background: #1e232b;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .task-texture {
            font-size: 11px;
            color: #a0a0a0;
        }
        .file-indicator {
            background: #1e232b;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            color: #4cd964;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .task-status-badge {
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            min-width: 90px;
            text-align: center;
        }
        .task-status-badge.pending {
            background: #2a2f38;
            color: #a0a0a0;
        }
        .task-status-badge.in-progress {
            background: #ff9800;
            color: #1a1e24;
        }
        .task-status-badge.completed {
            background: #4caf50;
            color: white;
        }
        .collapse-icon {
            color: #a0a0a0;
            font-size: 14px;
            transition: transform 0.2s;
            margin-left: 15px;
        }
        .task-header.collapsed .collapse-icon {
            transform: rotate(-90deg);
        }
        .task-content {
            padding: 15px 20px;
            border-top: 1px solid #2a2f38;
            transition: all 0.2s;
        }
        .task-content.collapsed {
            display: none;
        }
        .operation-info {
            background: #15191f;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #2a2f38;
        }
        .operation-name {
            font-size: 14px;
            font-weight: 600;
            color: #ff9800;
            margin-bottom: 6px;
        }
        .operation-detail {
            font-size: 12px;
            color: #a0a0a0;
            margin-bottom: 4px;
        }
        .operation-detail span {
            color: #4cd964;
        }
        .operation-plan {
            font-size: 11px;
            color: #ff9800;
            margin-top: 6px;
            padding: 2px 6px;
            background: #1e232b;
            border-radius: 4px;
            display: inline-block;
        }
        .executor-header {
            display: flex;
            gap: 8px;
            padding: 0 8px;
            margin-bottom: 4px;
            font-size: 10px;
            color: #a0a0a0;
        }
        .executor-header span:nth-child(1) { width: 120px; }
        .executor-header span:nth-child(2) { width: 60px; text-align: center; }
        .executor-header span:nth-child(3) { width: 70px; text-align: center; }
        .executor-header span:nth-child(4) { width: 30px; }
        .executor-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            background: #15191f;
            border-radius: 4px;
            margin-bottom: 4px;
            border: 1px solid #2a2f38;
        }
        .executor-name {
            width: 120px;
            padding: 3px 6px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            font-size: 11px;
        }
        .executor-quantity {
            width: 60px;
            padding: 3px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            text-align: center;
            font-size: 11px;
        }
        .btn-work {
            background: #ffc107;
            color: #000;
            padding: 3px 6px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            width: 65px;
            font-weight: 600;
        }
        .btn-work.active {
            background: #fd7e14;
            color: white;
        }
        .btn-work:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-add-executor {
            background: #6c757d;
            color: white;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            margin: 6px 0;
            width: 120px;
        }
        .action-container {
            margin: 6px 0;
        }
        .new-executor-form {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            padding: 6px;
            background: #15191f;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            flex-wrap: wrap;
        }
        .new-executor-form input {
            width: 130px;
            padding: 4px 6px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            font-size: 11px;
        }
        .btn-ready {
            background: #28a745;
            color: white;
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            margin: 8px 0 0 0;
            min-width: 80px;
        }
        .btn-ready:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-end-shift {
            background: #ff9800;
            color: white;
            padding: 3px 6px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            width: 85px;
            font-weight: 600;
            margin-left: 4px;
        }
        .btn-end-shift:disabled {
            background: #4caf50;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .btn-report-item {
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-report-item:hover {
            background: #e68900;
            transform: scale(1.02);
        }
        .btn-copy-path {
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
            margin-left: 8px;
        }
        .btn-copy-path:hover {
            background: #218838;
            transform: scale(1.02);
        }
        .btn-sm {
            padding: 2px 6px;
            font-size: 9px;
            border-radius: 4px;
            cursor: pointer;
            border: none;
        }
        .filter-section {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #15191f;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #2a2f38;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 130px;
        }
        .filter-group label {
            font-size: 10px;
            color: #a0a0a0;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .filter-group select, .filter-group input {
            padding: 6px 10px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            min-width: 140px;
        }
        .btn-reset {
            background: #6c757d;
            padding: 6px 12px;
            font-size: 12px;
            height: 32px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            color: white;
            margin-top: 20px;
        }
        .btn-reset:hover {
            background: #5a6268;
        }
        .order-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding: 12px 15px;
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            border-radius: 10px;
            border: 1px solid #2a2f38;
        }
        .stat-item {
            flex: 1;
            text-align: center;
            padding: 8px;
            background: #15191f;
            border-radius: 6px;
            border: 1px solid #2a2f38;
        }
        .stat-value {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }
        .stat-label {
            font-size: 11px;
            color: #a0a0a0;
        }
        .no-tasks {
            text-align: center;
            padding: 40px;
            background: #1a1e24;
            border-radius: 12px;
            color: #a0a0a0;
            border: 1px solid #2a2f38;
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: #a0a0a0;
        }
        .spinner {
            width: 30px;
            height: 30px;
            margin: 0 auto 10px;
            border: 2px solid #2a2f38;
            border-top: 2px solid #ff3b3b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .right-modal {
            position: fixed;
            right: -450px;
            top: 0;
            width: 450px;
            height: 100vh;
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            border-left: 2px solid #ff3b3b;
            box-shadow: -5px 0 30px rgba(0,0,0,0.5);
            transition: right 0.3s ease;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .right-modal.open {
            right: 0;
        }
        .right-modal-header {
            background: linear-gradient(135deg, #232830, #1a1e24);
            padding: 15px 20px;
            border-bottom: 1px solid #2a2f38;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .right-modal-header h3 {
            margin: 0;
            color: #ff3b3b;
            font-size: 18px;
        }
        .right-modal-close {
            background: none;
            border: none;
            color: #a0a0a0;
            font-size: 28px;
            cursor: pointer;
        }
        .right-modal-close:hover {
            color: #ff3b3b;
        }
        .right-modal-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .right-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1999;
            display: none;
        }
        .right-modal-overlay.show {
            display: block;
        }
        .report-row {
            background: #15191f;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #2a2f38;
        }
        .report-input {
            width: 100%;
            padding: 6px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
        }
        .report-textarea {
            width: 100%;
            padding: 6px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            resize: vertical;
        }
        .btn-add-row {
            width: 100%;
            padding: 8px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-remove-row {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 11px;
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
        .notification {
            animation: slideInRight 0.3s ease;
        }
        body.light-theme .filter-section {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
        }
        body.light-theme .filter-group select,
        body.light-theme .filter-group input {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            color: #1e293b !important;
        }
        body.light-theme .task-card {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
        }
        body.light-theme .task-card.priority {
            border: 2px solid #ff3b3b !important;
        }
        body.light-theme .task-header.status-pending {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9) !important;
        }
        body.light-theme .task-header.status-in-progress {
            background: linear-gradient(135deg, #fff3e0, #ffe6cc) !important;
        }
        body.light-theme .task-header.status-completed {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9) !important;
        }
        body.light-theme .task-header.priority {
            background: linear-gradient(135deg, #fee2e2, #fecaca) !important;
        }
        body.light-theme .task-customer-name {
            color: #dc2626 !important;
        }
        body.light-theme .task-product-name {
            color: #f97316 !important;
        }
        body.light-theme .operation-info {
            background: #f8fafc !important;
            border: 1px solid #e2e8f0 !important;
        }
        body.light-theme .executor-item {
            background: #f8fafc !important;
            border: 1px solid #e2e8f0 !important;
        }
        body.light-theme .executor-name,
        body.light-theme .executor-quantity {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            color: #1e293b !important;
        }
        body.light-theme .btn-report-item {
            background: #ff9800 !important;
            color: white !important;
        }
        body.light-theme .btn-copy-path {
            background: #28a745 !important;
            color: white !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="../images/logo.png" alt="MasterX Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="logo-text">Master<span class="x-red">X</span></div>
            </div>
            <h1 style="margin:0; color: white; font-size:18px;">🎨 Полимерный участок</h1>
        </header>

        <div class="filter-section">
            <div class="filter-group">
                <label>🏢 ЗАКАЗЧИК</label>
                <select id="filterCustomer">
                    <option value="">Все заказчики</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📦 ИЗДЕЛИЕ</label>
                <select id="filterProduct">
                    <option value="">Все изделия</option>
                </select>
            </div>
            <div class="filter-group">
                <label>🔧 ОПЕРАЦИЯ</label>
                <select id="filterOperation">
                    <option value="">Все операции</option>
                </select>
            </div>
            <div class="filter-group">
                <label>🎨 RAL</label>
                <select id="filterRal">
                    <option value="">Все RAL</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📏 ТОЛЩИНА (мм)</label>
                <select id="filterThickness">
                    <option value="">Все толщины</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📐 РАЗМЕР</label>
                <select id="filterSize">
                    <option value="">Все размеры</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📊 СТАТУС</label>
                <select id="statusFilter">
                    <option value="all">Все задачи</option>
                    <option value="pending">⏳ Ожидают</option>
                    <option value="in_progress">⚡ В работе</option>
                    <option value="completed">✅ Завершённые</option>
                    <option value="priority">🔴 Приоритетные</option>
                </select>
            </div>
            <button class="btn-reset" onclick="resetFilters()">🔄 Сбросить</button>
        </div>

        <div class="order-stats">
            <div class="stat-item"><div class="stat-value" id="totalTasks">0</div><div class="stat-label">Всего задач</div></div>
            <div class="stat-item"><div class="stat-value" id="tasksInProgress">0</div><div class="stat-label">В работе</div></div>
            <div class="stat-item"><div class="stat-value" id="tasksCompleted">0</div><div class="stat-label">Выполнено</div></div>
        </div>

        <div id="tasksList" class="tasks-list"><div class="loading"><div class="spinner"></div><p>Загрузка задач...</p></div></div>
    </div>

    <div id="rightModalOverlay" class="right-modal-overlay" onclick="closeRightModal()"></div>
    <div id="rightModal" class="right-modal">
        <div class="right-modal-header">
            <h3>📝 Отчёт по задаче</h3>
            <button class="right-modal-close" onclick="closeRightModal()">&times;</button>
        </div>
        <div id="rightModalContent" class="right-modal-content"></div>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/data-loader.js"></script>
    <!-- Удалено подключение task-operations.js -->
    <script src="../js/materials-report.js"></script>
    <script src="../js/task-manager.js"></script>

    <script>
        // ... весь остальной код polimerniy.html без изменений ...
        // (оставьте весь JavaScript код таким же, как был)
    </script>
</body>
</html>
