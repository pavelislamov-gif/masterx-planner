<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterX - Полимерный участок</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* ... существующие стили ... */
        .filter-highlight {
            background: #ff9800 !important;
            color: #1a1e24 !important;
            font-weight: bold !important;
            border-color: #e68900 !important;
        }
        .filter-highlight option {
            background: #1a1e24;
            color: #e0e0e0;
        }
        body.light-theme .filter-highlight {
            background: #ff9800 !important;
            color: #1a1e24 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="../images/logo.png" alt="MasterX Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="logo-text">Master<span class="x-red">X</span></div>
            </div>
            <h1 style="margin:0; color: white; font-size:18px;">🎨 Полимерный участок</h1>
        </header>

        <!-- РАСШИРЕННЫЙ ФИЛЬТР -->
        <div class="filter-section" style="flex-direction: column; align-items: stretch; gap: 15px;">
            <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between;">
                <select id="statusFilter" class="search-box" style="width: auto; padding: 6px 10px;" onchange="applyFilters()">
                    <option value="all">📊 Все задачи</option>
                    <option value="pending">⏳ Ожидают</option>
                    <option value="in_progress">⚡ В работе</option>
                    <option value="completed">✅ Завершённые</option>
                </select>
                
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-sm" onclick="resetFilters()" style="background: #6c757d;">🔄 Сбросить фильтры</button>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; background: #15191f; padding: 15px; border-radius: 8px; border: 1px solid #2a2f38;">
                <div>
                    <label style="color: #a0a0a0; font-size: 11px; display: block; margin-bottom: 4px;">📅 ДАТА</label>
                    <select id="filterDate" class="search-box" style="width: 100%;" onchange="applyFilters()">
                        <option value="">Все даты</option>
                    </select>
                </div>
                
                <div>
                    <label style="color: #a0a0a0; font-size: 11px; display: block; margin-bottom: 4px;">📦 ИЗДЕЛИЕ</label>
                    <select id="filterProduct" class="search-box" style="width: 100%;" onchange="applyFilters()">
                        <option value="">Все изделия</option>
                    </select>
                </div>
                
                <div>
                    <label style="color: #a0a0a0; font-size: 11px; display: block; margin-bottom: 4px;">📏 РАЗМЕР</label>
                    <select id="filterSize" class="search-box" style="width: 100%;" onchange="applyFilters()">
                        <option value="">Все размеры</option>
                    </select>
                </div>
                
                <div>
                    <label style="color: #ff9800; font-size: 11px; display: block; margin-bottom: 4px;">🎨 RAL (ОСНОВНОЙ ФИЛЬТР)</label>
                    <select id="filterRal" class="search-box filter-highlight" style="width: 100%;" onchange="applyFilters()">
                        <option value="">Все RAL</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="order-stats">
            <div class="stat-item"><div class="stat-value" id="totalTasks">0</div><div class="stat-label">Всего задач</div></div>
            <div class="stat-item"><div class="stat-value" id="tasksInProgress">0</div><div class="stat-label">В работе</div></div>
            <div class="stat-item"><div class="stat-value" id="tasksCompleted">0</div><div class="stat-label">Выполнено</div></div>
        </div>

        <div id="tasksList" class="tasks-list"><div class="loading"><div class="spinner"></div><p>Загрузка задач...</p></div></div>
    </div>

    <div id="rightModalOverlay" class="right-modal-overlay" onclick="closeRightModal()"></div>
    <div id="rightModal" class="right-modal">
        <div class="right-modal-header">
            <h3>📝 Отчёт по изделию</h3>
            <button class="right-modal-close" onclick="closeRightModal()">&times;</button>
        </div>
        <div id="rightModalContent" class="right-modal-content"></div>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/data-loader.js"></script>
    <script src="../js/task-operations.js"></script>
    <script src="../js/task-manager.js"></script>

    <script>
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        let taskOperationsData = {};
        let taskManager = null;
        let currentFilter = 'all';
        let isLoadingTasks = false;
        let currentReportItem = null;
        let currentReportFullOrder = null;
        let reportRows = [];
        
        let currentFilters = {
            date: '',
            product: '',
            size: '',
            ral: '',
            thickness: ''
        };
        
        // ============== ЗАГРУЗКА ДАННЫХ ==============
        async function loadTaskOperationsData() {
            try {
                const response = await fetch('../data/taskOperations.json');
                if (response.ok) {
                    const data = await response.json();
                    taskOperationsData = data.operations || {};
                    console.log('✅ Загружены операции из taskOperations.json');
                }
            } catch(e) {
                console.error('Ошибка загрузки taskOperations.json:', e);
            }
        }
        
        // ============== ФИЛЬТР ПО RAL (ОСНОВНОЙ) ==============
        function getUniqueRals() {
            const rals = new Set();
            const allOrders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
            
            allOrders.forEach(order => {
                if (order.items) {
                    order.items.forEach(item => {
                        if (item.ral && item.ral.trim()) {
                            rals.add(item.ral.trim());
                        }
                    });
                }
            });
            
            return Array.from(rals).sort();
        }
        
        function populateRalFilter() {
            const rals = getUniqueRals();
            const select = document.getElementById('filterRal');
            if (!select) return;
            
            select.innerHTML = '<option value="">🎨 Все RAL</option>';
            rals.forEach(ral => {
                select.innerHTML += `<option value="${ral}">${ral}</option>`;
            });
        }
        
        function filterTasksByRal(tasks, ral) {
            if (!ral) return tasks;
            
            return tasks.filter(task => {
                const allOrders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
                const order = allOrders.find(o => o.id == task.orderId);
                if (order && order.items && order.items[task.itemIndex || 0]) {
                    const itemRal = order.items[task.itemIndex || 0].ral || '';
                    return itemRal === ral;
                }
                return false;
            });
        }
        
        // ============== ОСТАЛЬНЫЕ ФИЛЬТРЫ ==============
        function getUniqueDates() {
            const dates = new Set();
            const allOrders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
            allOrders.forEach(order => {
                if (order.date) dates.add(order.date);
            });
            return Array.from(dates).sort().reverse();
        }
        
        function getUniqueProducts() {
            const products = new Set();
            const allOrders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
            allOrders.forEach(order => {
                if (order.items) {
                    order.items.forEach(item => {
                        if (item.product) products.add(item.product);
                    });
                }
            });
            return Array.from(products).sort();
        }
        
        function getUniqueSizes() {
            const sizes = new Set();
            const allOrders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
            allOrders.forEach(order => {
                if (order.items) {
                    order.items.forEach(item => {
                        if (item.size?.name) sizes.add(item.size.name);
                    });
                }
            });
            return Array.from(sizes).sort();
        }
        
        function populateFilterSelects() {
            // Дата
            const dateSelect = document.getElementById('filterDate');
            if (dateSelect) {
                const dates = getUniqueDates();
                dateSelect.innerHTML = '<option value="">Все даты</option>';
                dates.forEach(date => {
                    dateSelect.innerHTML += `<option value="${date}">${formatDateForDisplay(date)}</option>`;
                });
            }
            
            // Изделие
            const productSelect = document.getElementById('filterProduct');
            if (productSelect) {
                const products = getUniqueProducts();
                productSelect.innerHTML = '<option value="">Все изделия</option>';
                products.forEach(product => {
                    productSelect.innerHTML += `<option value="${product}">${product}</option>`;
                });
            }
            
            // Размер
            const sizeSelect = document.getElementById('filterSize');
            if (sizeSelect) {
                const sizes = getUniqueSizes();
                sizeSelect.innerHTML = '<option value="">Все размеры</option>';
                sizes.forEach(size => {
                    sizeSelect.innerHTML += `<option value="${size}">${size}</option>`;
                });
            }
        }
        
        function formatDateForDisplay(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString;
            const today = new Date();
            const dateStr = date.toDateString();
            if (dateStr === today.toDateString()) return 'Сегодня';
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
        }
        
        function updateFilters() {
            currentFilters = {
                date: document.getElementById('filterDate')?.value || '',
                product: (document.getElementById('filterProduct')?.value || '').toLowerCase(),
                size: (document.getElementById('filterSize')?.value || '').toLowerCase(),
                ral: (document.getElementById('filterRal')?.value || '').toLowerCase()
            };
        }
        
        function resetFilters() {
            document.getElementById('filterDate').value = '';
            document.getElementById('filterProduct').value = '';
            document.getElementById('filterSize').value = '';
            document.getElementById('filterRal').value = '';
            currentFilters = { date: '', product: '', size: '', ral: '' };
            applyFilters();
        }
        
        function applyFilters() {
            updateFilters();
            loadTasks();
        }
        
        // ============== КЛАСС ДЛЯ УПРАВЛЕНИЯ ЗАДАЧАМИ ==============
        class SimpleTaskManager {
            constructor(siteKey) {
                this.siteKey = siteKey;
                this.tasks = [];
                this.storageKey = `tasks_${siteKey}`;
            }
            
            loadData() {
                const saved = localStorage.getItem(this.storageKey);
                if (saved) {
                    this.tasks = JSON.parse(saved);
                } else {
                    this.tasks = [];
                }
                return this.tasks;
            }
            
            saveData() {
                localStorage.setItem(this.storageKey, JSON.stringify(this.tasks));
            }
            
            getTasksByStatus(status) {
                if (status === 'all') return this.tasks;
                return this.tasks.filter(t => t.status === status);
            }
            
            getStats() {
                const total = this.tasks.length;
                const inProgress = this.tasks.filter(t => t.status === 'in_progress').length;
                const completed = this.tasks.filter(t => t.status === 'completed').length;
                return { total, inProgress, completed };
            }
            
            updateExecutorQuantity(taskId, executorId, quantity) {
                const task = this.tasks.find(t => t.id === taskId);
                if (task && task.executors) {
                    const executor = task.executors.find(e => e.id === executorId);
                    if (executor) {
                        executor.quantity = quantity;
                        this.saveData();
                    }
                }
            }
            
            updateExecutorStatus(taskId, executorId, status) {
                const task = this.tasks.find(t => t.id === taskId);
                if (!task || !task.executors) return;

                const executor = task.executors.find(e => e.id === executorId);
                if (executor) {
                    executor.status = status;
                    this.saveData();

                    let taskStatus = 'pending';
                    if (task.executors.some(e => e.status === 'in_progress')) {
                        taskStatus = 'in_progress';
                    } else if (task.executors.every(e => e.status === 'shift_ended' || e.status === 'completed')) {
                        taskStatus = 'completed';
                    }

                    task.status = taskStatus;
                    this.saveData();

                    updateItemStatusTexts();

                    const orders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
                    const order = orders.find(o => o.id == task.orderId);
                    if (order) {
                        if (!order.tasks) order.tasks = {};
                        order.tasks[task.id] = taskStatus;
                        localStorage.setItem('masterx_orders', JSON.stringify(orders));
                    }
                }
            }
            
            addExecutor(taskId, name) {
                const task = this.tasks.find(t => t.id === taskId);
                if (task) {
                    if (!task.executors) task.executors = [];
                    if (task.executors.some(e => e.name === name)) return false;
                    task.executors.push({
                        id: Date.now(),
                        name: name,
                        quantity: 0,
                        status: 'pending'
                    });
                    this.saveData();
                    return true;
                }
                return false;
            }
            
            removeExecutor(taskId, executorId) {
                const task = this.tasks.find(t => t.id === taskId);
                if (task && task.executors) {
                    task.executors = task.executors.filter(e => e.id !== executorId);
                    this.saveData();
                }
            }
            
            completeTask(taskId) {
                const task = this.tasks.find(t => t.id === taskId);
                if (task && task.status !== 'completed') {
                    task.status = 'completed';
                    task.completedAt = new Date().toISOString();
                    this.saveData();
                    updateItemStatusTexts();
                    
                    const orders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
                    const order = orders.find(o => o.id == task.orderId);
                    if (order) {
                        if (!order.tasks) order.tasks = {};
                        order.tasks[task.id] = 'completed';
                        const orderIndex = orders.findIndex(o => o.id == task.orderId);
                        orders[orderIndex] = order;
                        localStorage.setItem('masterx_orders', JSON.stringify(orders));
                    }
                }
            }
        }
        
        // ============== ОСНОВНАЯ ФУНКЦИЯ ЗАГРУЗКИ ==============
        function loadTasks() {
            if (isLoadingTasks) return;
            isLoadingTasks = true;
            
            taskManager.loadData();
            let tasks = taskManager.getTasksByStatus(document.getElementById('statusFilter').value);
            
            // ПРИМЕНЯЕМ ФИЛЬТРЫ
            updateFilters();
            
            // Фильтр по дате
            if (currentFilters.date) {
                tasks = tasks.filter(task => task.date === currentFilters.date);
            }
            
            // Фильтр по изделию
            if (currentFilters.product) {
                tasks = tasks.filter(task => (task.product || '').toLowerCase().includes(currentFilters.product));
            }
            
            // Фильтр по размеру
            if (currentFilters.size) {
                tasks = tasks.filter(task => {
                    const allOrders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
                    const order = allOrders.find(o => o.id == task.orderId);
                    if (order && order.items && order.items[task.itemIndex || 0]) {
                        const sizeName = (order.items[task.itemIndex || 0].size?.name || '').toLowerCase();
                        return sizeName.includes(currentFilters.size);
                    }
                    return false;
                });
            }
            
            // ФИЛЬТР ПО RAL (ОСНОВНОЙ)
            if (currentFilters.ral) {
                tasks = filterTasksByRal(tasks, currentFilters.ral);
            }
            
            const stats = {
                total: tasks.length,
                inProgress: tasks.filter(t => t.status === 'in_progress').length,
                completed: tasks.filter(t => t.status === 'completed').length
            };
            document.getElementById('totalTasks').textContent = stats.total;
            document.getElementById('tasksInProgress').textContent = stats.inProgress;
            document.getElementById('tasksCompleted').textContent = stats.completed;

            const tasksList = document.getElementById('tasksList');
            tasksList.innerHTML = '';

            if (tasks.length === 0) {
                tasksList.innerHTML = '<div class="no-tasks"><p>📭 Нет задач по выбранным фильтрам</p></div>';
                isLoadingTasks = false;
                return;
            }

            const byItem = {};
            tasks.forEach(task => {
                const size = task.size || '';
                const ral = task.ral || '';
                const itemIndex = task.itemIndex !== undefined ? task.itemIndex : 0;
                const itemKey = `${task.orderId}_item${itemIndex}_${task.product}_${size}_${ral}`;

                if (!byItem[itemKey]) {
                    byItem[itemKey] = {
                        orderId: task.orderId,
                        orderNumber: task.orderNumber,
                        groupName: '',
                        product: task.product,
                        size: size,
                        ral: ral,
                        texture: task.texture || '',
                        totalQuantity: task.totalQuantity || 1,
                        tasks: [],
                        itemKey: itemKey,
                        itemIndex: itemIndex
                    };
                }
                byItem[itemKey].tasks.push(task);
            });

            const allOrders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
            Object.values(byItem).forEach(item => {
                const order = allOrders.find(o => o.id == item.orderId);
                if (order && order.items && order.items[item.itemIndex]) {
                    const foundItem = order.items[item.itemIndex];
                    item.groupName = order.groupName || '';
                    item.product = foundItem.product;
                    item.size = foundItem.size?.name || '';
                    item.ral = foundItem.ral || '';
                    item.texture = foundItem.texture || '';
                    item.totalQuantity = foundItem.size?.quantity || 1;
                }
            });

            Object.values(byItem).forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'order-card';
                itemDiv.dataset.itemKey = item.itemKey;

                const header = document.createElement('div');
                header.className = 'order-header collapsed';

                const hasInProgress = item.tasks.some(t => t.status === 'in_progress');
                const allCompleted = item.tasks.length > 0 && item.tasks.every(t => t.status === 'completed');
                if (allCompleted) header.classList.add('green');
                else if (hasInProgress) header.classList.add('orange');

                header.innerHTML = `
                    <div style="flex: 1;">
                        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                            <span style="font-weight: bold; color: #ff9800;">📦 ${escapeHtml(item.product)}</span>
                            <span style="font-size: 12px; color: #4cd964;">${escapeHtml(item.size || '-')} × ${item.totalQuantity} шт</span>
                            ${item.ral ? `<span style="font-size: 11px; color: #ff9800;">🎨 ${escapeHtml(item.ral)} / ${escapeHtml(item.texture || '-')}</span>` : ''}
                        </div>
                        <div style="font-size: 11px; color: #a0a0a0; margin-top: 4px;">
                            📁 ${escapeHtml(item.groupName)} | Заказ №${escapeHtml(item.orderNumber)}
                        </div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button class="btn-report-item" onclick="event.stopPropagation(); openRightModalForItem('${item.orderId}', '${item.itemKey}')">📝 Отчёт</button>
                        <span id="status-text-${item.itemKey}" class="status-text"></span>
                        <span class="collapse-icon" style="cursor: pointer;">▼</span>
                    </div>
                `;

                const content = document.createElement('div');
                content.className = 'order-content collapsed';

                item.tasks.forEach(task => content.appendChild(createTaskCard(task)));

                header.addEventListener('click', function(e) {
                    if (e.target.tagName === 'BUTTON') return;
                    header.classList.toggle('collapsed');
                    content.classList.toggle('collapsed');
                    const arrow = header.querySelector('.collapse-icon');
                    if (arrow) arrow.textContent = header.classList.contains('collapsed') ? '▼' : '▲';
                });

                itemDiv.appendChild(header);
                itemDiv.appendChild(content);
                tasksList.appendChild(itemDiv);
            });

            updateItemStatusTexts();
            isLoadingTasks = false;
        }
        
        function updateItemStatusTexts() {
            document.querySelectorAll('.order-card').forEach(card => {
                const itemKey = card.dataset.itemKey;
                const span = document.getElementById(`status-text-${itemKey}`);
                if (!span) return;
                
                const tasks = [];
                card.querySelectorAll('.task-card').forEach(taskCard => {
                    const taskId = taskCard.dataset.taskId;
                    if (taskId && taskManager.tasks) {
                        const task = taskManager.tasks.find(t => t.id === taskId);
                        if (task) tasks.push(task);
                    }
                });
                
                const hasInProgress = tasks.some(t => t.status === 'in_progress');
                const allCompleted = tasks.length > 0 && tasks.every(t => t.status === 'completed');
                
                if (allCompleted) {
                    span.textContent = 'ГОТОВО';
                    span.style.background = '#1a3a1a';
                    span.style.color = '#2ecc71';
                } else if (hasInProgress) {
                    span.textContent = 'В РАБОТЕ';
                    span.style.background = '#3a2a1a';
                    span.style.color = '#ff9800';
                } else {
                    span.textContent = '';
                }
            });
        }
        
        function createTaskCard(task) {
            const card = document.createElement('div');
            card.className = 'task-card ' + (task.status === 'completed' ? 'completed' : '');
            card.dataset.taskId = task.id;
            
            const planQuantity = task.totalQuantity || 1;
            let operationName = task.operation;
            if (typeof operationName === 'object' && operationName !== null) {
                operationName = operationName.operation || JSON.stringify(operationName);
            }
            if (typeof operationName !== 'string') {
                operationName = String(operationName);
            }
            
            const header = document.createElement('div');
            header.className = 'task-header';
            header.innerHTML = '<span class="task-title">' + escapeHtml(operationName) + (task.isExtra ? '<span class="extra-task-badge">Доп.</span>' : '') + '</span>';
            card.appendChild(header);
            
            const planDiv = document.createElement('div');
            planDiv.className = 'task-plan';
            planDiv.innerHTML = '📋 План: ' + planQuantity + ' шт';
            card.appendChild(planDiv);
            
            if (task.isExtra && task.description) {
                const desc = document.createElement('div');
                desc.className = 'task-description';
                desc.textContent = escapeHtml(task.description);
                card.appendChild(desc);
            }
            
            const headersDiv = document.createElement('div');
            headersDiv.className = 'executor-header';
            headersDiv.innerHTML = '<span>ФИО</span><span>Кол-во</span><span>Статус</span><span></span>';
            card.appendChild(headersDiv);
            
            const executorList = document.createElement('div');
            executorList.className = 'executor-list';
            executorList.id = 'executors-' + task.id;
            
            if (task.executors && task.executors.length > 0) {
                task.executors.forEach(executor => {
                    executorList.appendChild(createExecutorItem(task, executor));
                });
            } else {
                const noExecutors = document.createElement('p');
                noExecutors.style.cssText = 'color: #a0a0a0; padding: 6px; text-align: center; font-style: italic; font-size: 11px;';
                noExecutors.textContent = 'Нет исполнителей';
                executorList.appendChild(noExecutors);
            }
            card.appendChild(executorList);
            
            const actionContainer = document.createElement('div');
            actionContainer.className = 'action-container';
            if (task.status !== 'completed') {
                const addBtn = document.createElement('button');
                addBtn.className = 'btn-add-executor';
                addBtn.textContent = '+ Добавить исполнителя';
                addBtn.onclick = function() { showAddExecutorForm(task, actionContainer); };
                actionContainer.appendChild(addBtn);
            }
            card.appendChild(actionContainer);
            
            const readyBtn = document.createElement('button');
            readyBtn.className = 'btn-ready';
            readyBtn.textContent = '✅ ГОТОВО';
            readyBtn.disabled = task.status === 'completed';
            readyBtn.onclick = function() { completeTask(task.id); };
            card.appendChild(readyBtn);
            
            return card;
        }
        
        function createExecutorItem(task, executor) {
            const div = document.createElement('div');
            div.className = 'executor-item';
            div.dataset.executorId = executor.id;
            const isShiftEnded = executor.status === 'shift_ended';
            
            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.className = 'executor-name';
            nameInput.value = escapeHtml(executor.name);
            nameInput.placeholder = 'ФИО';
            nameInput.disabled = task.status === 'completed' || isShiftEnded;
            div.appendChild(nameInput);
            
            const quantityInput = document.createElement('input');
            quantityInput.type = 'number';
            quantityInput.className = 'executor-quantity';
            quantityInput.value = executor.quantity || 0;
            quantityInput.min = 0;
            quantityInput.disabled = task.status === 'completed' || isShiftEnded;
            quantityInput.onchange = function(e) {
                taskManager.updateExecutorQuantity(task.id, executor.id, parseInt(e.target.value) || 0);
            };
            div.appendChild(quantityInput);
            
            const workBtn = document.createElement('button');
            workBtn.className = 'btn-work ' + (executor.status === 'in_progress' ? 'active' : '');
            workBtn.textContent = executor.status === 'in_progress' ? 'В РАБОТЕ' : (isShiftEnded ? 'СМЕНА ЗАКРЫТА' : 'НАЧАТЬ');
            workBtn.disabled = task.status === 'completed' || isShiftEnded;
            workBtn.onclick = function() {
                if (isShiftEnded) return;
                const newStatus = workBtn.classList.contains('active') ? 'pending' : 'in_progress';
                taskManager.updateExecutorStatus(task.id, executor.id, newStatus);
                workBtn.classList.toggle('active');
                workBtn.textContent = newStatus === 'in_progress' ? 'В РАБОТЕ' : 'НАЧАТЬ';
            };
            div.appendChild(workBtn);
            
            const endShiftBtn = document.createElement('button');
            endShiftBtn.className = 'btn-end-shift';
            endShiftBtn.innerHTML = isShiftEnded ? '✅ СМЕНА ЗАКРЫТА' : '🕒 ЗАКРЫТЬ';
            endShiftBtn.disabled = task.status === 'completed' || isShiftEnded;
            endShiftBtn.onclick = function() {
                if (confirm('Закрыть смену для ' + executor.name + '?')) {
                    taskManager.updateExecutorStatus(task.id, executor.id, 'shift_ended');
                    const executorList = document.getElementById('executors-' + task.id);
                    if (executorList) {
                        executorList.innerHTML = '';
                        const updatedTask = taskManager.tasks.find(t => t.id === task.id);
                        if (updatedTask && updatedTask.executors) {
                            updatedTask.executors.forEach(exec => { executorList.appendChild(createExecutorItem(updatedTask, exec)); });
                        }
                    }
                }
            };
            div.appendChild(endShiftBtn);
            
            const removeBtn = document.createElement('button');
            removeBtn.className = 'btn btn-danger btn-sm';
            removeBtn.innerHTML = '✕';
            removeBtn.disabled = task.status === 'completed' || isShiftEnded;
            removeBtn.onclick = function() {
                if (confirm('Удалить этого исполнителя?')) taskManager.removeExecutor(task.id, executor.id);
            };
            div.appendChild(removeBtn);
            
            return div;
        }
        
        function showAddExecutorForm(task, actionContainer) {
            const oldForm = actionContainer.querySelector('.new-executor-form');
            if (oldForm) oldForm.remove();
            
            const formDiv = document.createElement('div');
            formDiv.className = 'new-executor-form';
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'ФИО исполнителя';
            const addBtn = document.createElement('button');
            addBtn.className = 'btn btn-success';
            addBtn.textContent = 'Добавить';
            addBtn.onclick = function() {
                const name = input.value.trim();
                if (!name) { alert('Введите ФИО'); return; }
                if (taskManager.addExecutor(task.id, name)) {
                    formDiv.remove();
                    const executorList = document.getElementById('executors-' + task.id);
                    if (executorList) {
                        executorList.innerHTML = '';
                        const updatedTask = taskManager.tasks.find(t => t.id === task.id);
                        if (updatedTask && updatedTask.executors) {
                            updatedTask.executors.forEach(exec => { executorList.appendChild(createExecutorItem(updatedTask, exec)); });
                        }
                    }
                } else { alert('Исполнитель уже существует'); }
            };
            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn btn-danger';
            cancelBtn.textContent = 'Отмена';
            cancelBtn.onclick = function() { formDiv.remove(); };
            formDiv.appendChild(input);
            formDiv.appendChild(addBtn);
            formDiv.appendChild(cancelBtn);
            actionContainer.appendChild(formDiv);
        }
        
        window.completeTask = function(taskId) {
            const task = taskManager.tasks.find(t => t.id === taskId);
            if (!task) return;
            const totalAssigned = task.executors.reduce((sum, e) => sum + (e.quantity || 0), 0);
            let operationName = task.operation;
            if (typeof operationName === 'object' && operationName !== null) {
                operationName = operationName.operation || JSON.stringify(operationName);
            }
            if (confirm('Завершить задачу?\nОперация: ' + operationName + '\nВыполнено: ' + totalAssigned + ' шт')) {
                taskManager.completeTask(taskId);
                loadTasks();
            }
        };
        
        window.exportToExcel = function() {
            const tasks = taskManager.tasks;
            let csv = "Заказ,Изделие,Операция,Исполнитель,Количество,Статус,План,RAL\n";
            tasks.forEach(task => {
                let fullOrder = null;
                try {
                    const allOrders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
                    fullOrder = allOrders.find(o => o.id == task.orderId);
                } catch(e) {}
                const planQuantity = task.totalQuantity || 1;
                let operationName = task.operation;
                if (typeof operationName === 'object' && operationName !== null) {
                    operationName = operationName.operation || JSON.stringify(operationName);
                }
                
                let ral = '';
                if (fullOrder && fullOrder.items && fullOrder.items[task.itemIndex || 0]) {
                    ral = fullOrder.items[task.itemIndex || 0].ral || '';
                }
                
                if (task.executors && task.executors.length > 0) {
                    task.executors.forEach(exec => {
                        csv += `"${task.orderNumber}","${task.product}","${operationName}","${exec.name}",${exec.quantity || 0},"${exec.status}",${planQuantity},"${ral}"\n`;
                    });
                } else {
                    csv += `"${task.orderNumber}","${task.product}","${operationName}","Нет",0,"${task.status}",${planQuantity},"${ral}"\n`;
                }
            });
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `polimerniy_tasks.csv`;
            link.click();
        };
        
        // ============== ПРАВАЯ МОДАЛЬНАЯ ПАНЕЛЬ ==============
        function openRightModalForItem(orderId, itemKey) {
            const allOrders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
            const fullOrder = allOrders.find(o => o.id == orderId);
            if (!fullOrder) {
                alert('Заказ не найден');
                return;
            }
            
            const parts = itemKey.split('_');
            let productName, sizeName;
            if (parts.length === 3) {
                productName = parts[1];
                sizeName = parts[2];
            } else if (parts.length === 4) {
                productName = parts[1];
                sizeName = parts[2];
            } else {
                sizeName = parts[parts.length - 1];
                productName = parts.slice(1, -1).join('_');
            }
            
            productName = productName.trim();
            sizeName = sizeName.trim();
            
            let foundItem = null;
            for (const item of fullOrder.items) {
                const itemSize = item.size?.name || '';
                if (item.product === productName) {
                    const sizeMatch = (itemSize === sizeName) || (sizeName === '' && itemSize === '');
                    if (sizeMatch) {
                        foundItem = item;
                        break;
                    }
                }
            }
            
            if (!foundItem) {
                for (const item of fullOrder.items) {
                    if (item.product.includes(productName) || productName.includes(item.product)) {
                        foundItem = item;
                        break;
                    }
                }
            }
            
            if (!foundItem) {
                alert('Изделие не найдено');
                return;
            }
            
            currentReportItem = {
                orderId: orderId,
                orderNumber: fullOrder.number,
                groupName: fullOrder.groupName,
                product: foundItem.product,
                size: foundItem.size?.name,
                quantity: foundItem.size?.quantity,
                ral: foundItem.ral,
                texture: foundItem.texture,
                itemKey: itemKey
            };
            currentReportFullOrder = fullOrder;
            
            const modal = document.getElementById('rightModal');
            const overlay = document.getElementById('rightModalOverlay');
            const contentDiv = document.getElementById('rightModalContent');
            
            const savedData = getSavedReportDataForItem(orderId, itemKey);
            if (savedData && savedData.rows) {
                reportRows = [...savedData.rows];
            } else {
                reportRows = [{ расход: 0, количество: 0, комментарий: '' }];
            }
            
            renderReportFormForItem(contentDiv, fullOrder, foundItem);
            modal.classList.add('open');
            overlay.classList.add('show');
        }
        
        function getSavedReportDataForItem(orderId, itemKey) {
            const allReports = JSON.parse(localStorage.getItem('material_reports') || '[]');
            const itemReports = allReports.filter(r => r.orderId == orderId && r.itemKey === itemKey && r.isItemReport === true);
            if (itemReports.length === 0) return null;
            const allRows = [];
            itemReports.forEach(report => {
                if (report.rows) {
                    allRows.push(...report.rows);
                }
            });
            return { rows: allRows, savedAt: itemReports[itemReports.length - 1]?.savedAt };
        }
        
        function renderReportFormForItem(container, fullOrder, item) {
            let rowsHtml = '';
            reportRows.forEach((row, index) => {
                rowsHtml += `
                    <div class="report-row" data-row-index="${index}">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <span style="font-size: 12px; color: #ff9800;">📝 Запись ${index + 1}</span>
                            <button type="button" class="btn-remove-row" onclick="removeReportRowItem(${index})">✖️</button>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                            <div>
                                <label style="font-size: 11px; color: #a0a0a0;">📊 Расход:</label>
                                <input type="number" class="report-input report-expense" data-row="${index}" value="${row.расход || 0}" step="0.1" placeholder="0">
                            </div>
                            <div>
                                <label style="font-size: 11px; color: #a0a0a0;">📦 Количество:</label>
                                <input type="number" class="report-input report-quantity" data-row="${index}" value="${row.количество || 0}" step="1" placeholder="0">
                            </div>
                        </div>
                        <div>
                            <label style="font-size: 11px; color: #a0a0a0;">💬 Комментарий:</label>
                            <textarea class="report-textarea report-comment" data-row="${index}" rows="2" placeholder="Дополнительная информация...">${escapeHtml(row.комментарий || '')}</textarea>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = `
                <div style="padding: 20px 0;">
                    <div style="margin-bottom: 20px; padding: 12px; background: #15191f; border-radius: 8px; border-left: 3px solid #ff9800;">
                        <div style="font-size: 12px; color: #a0a0a0;">Заказ: ${escapeHtml(fullOrder.number)}</div>
                        <div style="font-size: 16px; font-weight: bold; color: #ff9800; margin: 5px 0;">${escapeHtml(item.product)}</div>
                        <div style="font-size: 12px;">📁 ${escapeHtml(fullOrder.groupName)}</div>
                        <div style="font-size: 12px;">📏 Размер: ${escapeHtml(item.size?.name || '-')} × ${item.size?.quantity || 0} шт</div>
                        <div style="font-size: 12px;">🎨 Покрытие: ${escapeHtml(item.ral || '-')} / ${escapeHtml(item.texture || '-')}</div>
                    </div>
                    
                    <div id="reportRowsContainer" style="max-height: 400px; overflow-y: auto; margin-bottom: 15px;">
                        ${rowsHtml}
                    </div>
                    
                    <div style="margin-bottom: 15px;">
                        <button type="button" class="btn-add-row" onclick="addReportRowItem()">➕ Добавить строку</button>
                    </div>
                    
                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button type="button" class="btn btn-success" onclick="saveReportDataForItem()" style="flex: 1;">💾 Сохранить</button>
                        <button type="button" class="btn btn-danger" onclick="closeRightModal()" style="flex: 1;">✖️ Закрыть</button>
                    </div>
                </div>
            `;
            
            document.querySelectorAll('.report-expense').forEach(input => {
                input.addEventListener('change', function() {
                    const rowIndex = parseInt(this.dataset.row);
                    if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                        reportRows[rowIndex].расход = parseFloat(this.value) || 0;
                    }
                });
            });
            document.querySelectorAll('.report-quantity').forEach(input => {
                input.addEventListener('change', function() {
                    const rowIndex = parseInt(this.dataset.row);
                    if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                        reportRows[rowIndex].количество = parseFloat(this.value) || 0;
                    }
                });
            });
            document.querySelectorAll('.report-comment').forEach(textarea => {
                textarea.addEventListener('change', function() {
                    const rowIndex = parseInt(this.dataset.row);
                    if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                        reportRows[rowIndex].комментарий = this.value;
                    }
                });
            });
        }
        
        function addReportRowItem() {
            reportRows.push({ расход: 0, количество: 0, комментарий: '' });
            const container = document.getElementById('rightModalContent');
            renderReportFormForItem(container, currentReportFullOrder, currentReportItem);
        }
        
        function removeReportRowItem(rowIndex) {
            if (reportRows.length <= 1) {
                if (!confirm('Удалить последнюю строку? Будет создана пустая строка.')) return;
                reportRows = [{ расход: 0, количество: 0, комментарий: '' }];
            } else {
                reportRows.splice(rowIndex, 1);
            }
            const container = document.getElementById('rightModalContent');
            renderReportFormForItem(container, currentReportFullOrder, currentReportItem);
        }
        
        function saveReportDataForItem() {
            if (!currentReportItem) return;
            
            document.querySelectorAll('.report-expense').forEach(input => {
                const rowIndex = parseInt(input.dataset.row);
                if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                    reportRows[rowIndex].расход = parseFloat(input.value) || 0;
                }
            });
            document.querySelectorAll('.report-quantity').forEach(input => {
                const rowIndex = parseInt(input.dataset.row);
                if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                    reportRows[rowIndex].количество = parseFloat(input.value) || 0;
                }
            });
            document.querySelectorAll('.report-comment').forEach(textarea => {
                const rowIndex = parseInt(textarea.dataset.row);
                if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                    reportRows[rowIndex].комментарий = textarea.value;
                }
            });
            
            const reportData = {
                orderId: currentReportItem.orderId,
                orderNumber: currentReportItem.orderNumber,
                groupName: currentReportItem.groupName,
                product: currentReportItem.product,
                size: currentReportItem.size,
                quantity: currentReportItem.quantity,
                ral: currentReportItem.ral,
                texture: currentReportItem.texture,
                itemKey: currentReportItem.itemKey,
                siteKey: 'polimerniy',
                rows: reportRows.map(row => ({
                    расход: row.расход || 0,
                    количество: row.количество || 0,
                    комментарий: row.комментарий || ''
                })),
                savedAt: new Date().toISOString(),
                isItemReport: true
            };
            
            let allReports = JSON.parse(localStorage.getItem('material_reports') || '[]');
            allReports = allReports.filter(r => !(r.orderId == currentReportItem.orderId && r.itemKey === currentReportItem.itemKey && r.isItemReport === true));
            allReports.push(reportData);
            localStorage.setItem('material_reports', JSON.stringify(allReports));
            
            alert('✅ Отчёт сохранён!');
            closeRightModal();
        }
        
        function closeRightModal() {
            const modal = document.getElementById('rightModal');
            const overlay = document.getElementById('rightModalOverlay');
            modal.classList.remove('open');
            overlay.classList.remove('show');
            currentReportItem = null;
            currentReportFullOrder = null;
            reportRows = [];
        }
        
        // ============== ИНИЦИАЛИЗАЦИЯ ==============
        async function init() {
            await loadTaskOperationsData();
            taskManager = new SimpleTaskManager('polimerniy');
            window.taskManager = taskManager;
            populateFilterSelects();
            populateRalFilter();
            loadTasks();
        }
        
        window.applyFilters = applyFilters;
        window.resetFilters = resetFilters;
        window.openRightModalForItem = openRightModalForItem;
        window.closeRightModal = closeRightModal;
        window.addReportRowItem = addReportRowItem;
        window.removeReportRowItem = removeReportRowItem;
        window.saveReportDataForItem = saveReportDataForItem;
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
