<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterX - Полимерный участок</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Стили полностью идентичны предыдущим (скопированы из лазерно-гибочного) */
        /* ... (для краткости здесь не дублируются, но в реальном файле они должны быть) */
        /* Рекомендуется скопировать блок <style> из файла lazerno-gibochniy.html */
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="../images/logo.png" alt="MasterX Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="logo-text">
                    Master<span class="x-red">X</span>
                </div>
            </div>
            <h1 style="margin:0; color: white; font-size:18px;">Полимерный участок</h1>
        </header>

        <!-- Навигация, фильтры, статистика (как в лазерно-гибочном) -->
        <div class="date-navigation">...</div>
        <div class="filter-section">...</div>
        <div class="order-stats">...</div>
        <div id="tasksList">...</div>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/data-loader.js"></script>
    <script src="../js/task-manager.js"></script>

    <script>
        // ============== ОПЕРАЦИИ ДЛЯ ПОЛИМЕРНОГО УЧАСТКА ==============
        const polimerniyOperations = {
            'XRAY 6-T2 BT 220 Шторка х2': [
                'Корпус',
                'Фоновая заглушка',
                'Покраска'
            ]
            // Можно добавить другие продукты
        };

        // ============== ИНИЦИАЛИЗАЦИЯ ==============
        if (typeof TaskManager === 'undefined') {
            console.error('❌ TaskManager не загружен!');
            document.getElementById('tasksList').innerHTML = `<div class="no-tasks">Ошибка загрузки</div>`;
        } else {
            const taskManager = new TaskManager('polimerniy', polimerniyOperations);
            let currentFilter = 'all';
            let _historyTimer = null, _loadTimer = null;
            window.taskManager = taskManager;

            document.addEventListener('DOMContentLoaded', function() {
                console.log('✅ Полимерный участок загружен');
                updateDateDisplay();
                loadTasks();

                window.addEventListener('taskStatusChanged', () => {
                    clearTimeout(_loadTimer);
                    _loadTimer = setTimeout(() => loadTasks(), 100);
                });
                window.addEventListener('taskHistoryChanged', (e) => {
                    if (e.detail.siteType === 'polimerniy') {
                        clearTimeout(_historyTimer);
                        _historyTimer = setTimeout(() => loadTasks(), 200);
                    }
                });
                window.addEventListener('storage', (e) => {
                    if (e.key === 'masterx_orders' || e.key?.startsWith('tasks_polimerniy_')) {
                        clearTimeout(_loadTimer);
                        _loadTimer = setTimeout(() => { taskManager.loadData(); loadTasks(); }, 100);
                    }
                });
            });

            window.changeDate = function(action) {
                if (action === 'prev') taskManager.prevDay();
                else if (action === 'next') taskManager.nextDay();
                else taskManager.today();
                updateDateDisplay();
                loadTasks();
            };

            function updateDateDisplay() {
                const dateStr = taskManager.currentDate.toLocaleDateString('ru-RU', { year:'numeric', month:'long', day:'numeric' });
                const isToday = taskManager.formatDate(taskManager.currentDate) === taskManager.formatDate(new Date());
                document.getElementById('currentDateDisplay').innerHTML = `${dateStr} ${!isToday ? '<span class="history-indicator">(история)</span>' : ''}`;
            }

            window.applyFilters = function() {
                currentFilter = document.getElementById('statusFilter').value;
                loadTasks();
            };

            function loadTasks() {
                const tasksList = document.getElementById('tasksList');
                taskManager.loadData();
                let tasks = taskManager.getTasksByStatus(currentFilter);
                const stats = taskManager.getStats();
                document.getElementById('totalTasks').textContent = stats.total;
                document.getElementById('tasksInProgress').textContent = stats.inProgress;
                document.getElementById('tasksCompleted').textContent = stats.completed;
                tasksList.innerHTML = '';

                if (tasks.length === 0) {
                    tasksList.innerHTML = '<div class="no-tasks"><p>📭 Нет задач на этот день</p></div>';
                    return;
                }

                const byOrder = {};
                tasks.forEach(t => { if (!byOrder[t.orderId]) byOrder[t.orderId] = { number: t.orderNumber, tasks: [] }; byOrder[t.orderId].tasks.push(t); });

                Object.values(byOrder).forEach(order => {
                    const orderDiv = document.createElement('div');
                    orderDiv.className = 'order-card';
                    const header = document.createElement('div');
                    header.className = 'order-header';
                    header.innerHTML = `<h3>📦 Заказ №${order.number}</h3><span class="collapse-icon">▼</span>`;
                    const content = document.createElement('div');
                    content.className = 'order-content';

                    const byProduct = {};
                    order.tasks.forEach(t => {
                        const key = t.product;
                        if (!byProduct[key]) byProduct[key] = { product: t.product, size: t.size, totalQuantity: t.totalQuantity, tasks: [] };
                        byProduct[key].tasks.push(t);
                    });

                    Object.values(byProduct).forEach(p => {
                        const productInfo = document.createElement('div');
                        productInfo.className = 'product-info';
                        productInfo.innerHTML = `<strong>${p.product}</strong> | Размер: ${p.size || 'Стандартный'} | Всего: ${p.totalQuantity} шт`;
                        content.appendChild(productInfo);
                        p.tasks.sort((a,b) => a.index - b.index).forEach(task => content.appendChild(createTaskCard(task)));
                    });

                    header.addEventListener('click', (e) => {
                        if (e.target.tagName === 'BUTTON') return;
                        content.classList.toggle('collapsed');
                        header.classList.toggle('collapsed');
                    });

                    orderDiv.appendChild(header);
                    orderDiv.appendChild(content);
                    tasksList.appendChild(orderDiv);
                });
            }

            // ========== ФУНКЦИИ createTaskCard, createExecutorItem, showAddExecutorForm, и т.д. (полностью идентичны предыдущим) ==========
            // (Скопировать из лазерно-гибочного участка)
            // Для экономии места здесь они не повторяются, но в реальном файле они должны быть.
            // Вставьте сюда все функции, начиная с createTaskCard и заканчивая exportToExcel,
            // заменив в них все упоминания 'lazerno' на 'polimerniy' (например, в localStorage и event‑ах).
            
            // Пример: в функции clearHistory должно быть:
            // localStorage.removeItem(`tasks_polimerniy_${dateStr}`);
            // и в exportToExcel: download = `polimerniy_${dateStr}.csv`
        }
    </script>
</body>
</html>
