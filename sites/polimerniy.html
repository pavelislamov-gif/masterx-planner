<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterX - Полимерный участок</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Стили остаются без изменений - такие же как были */
        .task-card {
            background: #1a1e24;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #2a2f38;
            overflow: hidden;
            transition: all 0.2s;
        }
        .task-card.priority {
            border: 2px solid #ff3b3b;
            box-shadow: 0 0 15px rgba(255,59,59,0.3);
        }
        .task-card:hover {
            border-color: #ff3b3b;
        }
        .task-header {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .task-header.status-pending {
            background: linear-gradient(135deg, #232830, #1a1e24);
            border-left: 4px solid #6c757d;
        }
        .task-header.status-in-progress {
            background: linear-gradient(135deg, #3a2a1a, #2a1f0f);
            border-left: 4px solid #ff9800;
        }
        .task-header.status-completed {
            background: linear-gradient(135deg, #1a3a1a, #0f2a0f);
            border-left: 4px solid #2ecc71;
        }
        .task-header.priority {
            background: linear-gradient(135deg, #4a1a1a, #3a0f0f) !important;
            border-left: 4px solid #ff3b3b !important;
        }
        .task-header-left {
            flex: 1;
        }
        .task-customer-name {
            font-weight: 600;
            color: #ff3b3b;
            font-size: 14px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .priority-badge {
            background: #ff3b3b;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            display: inline-block;
        }
        .task-product-info {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-top: 4px;
        }
        .task-product-name {
            font-size: 13px;
            color: #ff9800;
            font-weight: 500;
        }
        .task-size {
            font-size: 11px;
            color: #4cd964;
        }
        .task-quantity {
            font-size: 11px;
            color: #a0a0a0;
        }
        .task-ral {
            font-size: 11px;
            color: #ff9800;
            background: #1e232b;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .task-texture {
            font-size: 11px;
            color: #a0a0a0;
        }
        .file-indicator {
            background: #1e232b;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            color: #4cd964;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .task-status-badge {
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            min-width: 90px;
            text-align: center;
        }
        .task-status-badge.pending {
            background: #2a2f38;
            color: #a0a0a0;
        }
        .task-status-badge.in-progress {
            background: #ff9800;
            color: #1a1e24;
        }
        .task-status-badge.completed {
            background: #4caf50;
            color: white;
        }
        .collapse-icon {
            color: #a0a0a0;
            font-size: 14px;
            transition: transform 0.2s;
            margin-left: 15px;
        }
        .task-header.collapsed .collapse-icon {
            transform: rotate(-90deg);
        }
        .task-content {
            padding: 15px 20px;
            border-top: 1px solid #2a2f38;
            transition: all 0.2s;
        }
        .task-content.collapsed {
            display: none;
        }
        .operation-info {
            background: #15191f;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #2a2f38;
        }
        .operation-name {
            font-size: 14px;
            font-weight: 600;
            color: #ff9800;
            margin-bottom: 6px;
        }
        .operation-detail {
            font-size: 12px;
            color: #a0a0a0;
            margin-bottom: 4px;
        }
        .operation-detail span {
            color: #4cd964;
        }
        .operation-plan {
            font-size: 11px;
            color: #ff9800;
            margin-top: 6px;
            padding: 2px 6px;
            background: #1e232b;
            border-radius: 4px;
            display: inline-block;
        }
        .executor-header {
            display: flex;
            gap: 8px;
            padding: 0 8px;
            margin-bottom: 4px;
            font-size: 10px;
            color: #a0a0a0;
        }
        .executor-header span:nth-child(1) { width: 120px; }
        .executor-header span:nth-child(2) { width: 60px; text-align: center; }
        .executor-header span:nth-child(3) { width: 70px; text-align: center; }
        .executor-header span:nth-child(4) { width: 30px; }
        .executor-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            background: #15191f;
            border-radius: 4px;
            margin-bottom: 4px;
            border: 1px solid #2a2f38;
        }
        .executor-name {
            width: 120px;
            padding: 3px 6px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            font-size: 11px;
        }
        .executor-quantity {
            width: 60px;
            padding: 3px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            text-align: center;
            font-size: 11px;
        }
        .btn-work {
            background: #ffc107;
            color: #000;
            padding: 3px 6px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            width: 65px;
            font-weight: 600;
        }
        .btn-work.active {
            background: #fd7e14;
            color: white;
        }
        .btn-work:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-add-executor {
            background: #6c757d;
            color: white;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            margin: 6px 0;
            width: 120px;
        }
        .action-container {
            margin: 6px 0;
        }
        .new-executor-form {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            padding: 6px;
            background: #15191f;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            flex-wrap: wrap;
        }
        .new-executor-form input {
            width: 130px;
            padding: 4px 6px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            font-size: 11px;
        }
        .btn-ready {
            background: #28a745;
            color: white;
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            margin: 8px 0 0 0;
            min-width: 80px;
        }
        .btn-ready:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-end-shift {
            background: #ff9800;
            color: white;
            padding: 3px 6px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            width: 85px;
            font-weight: 600;
            margin-left: 4px;
        }
        .btn-end-shift:disabled {
            background: #4caf50;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .btn-report-item {
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-report-item:hover {
            background: #e68900;
            transform: scale(1.02);
        }
        .btn-copy-path {
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
            margin-left: 8px;
        }
        .btn-copy-path:hover {
            background: #218838;
            transform: scale(1.02);
        }
        .btn-sm {
            padding: 2px 6px;
            font-size: 9px;
            border-radius: 4px;
            cursor: pointer;
            border: none;
        }
        .filter-section {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #15191f;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #2a2f38;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 130px;
        }
        .filter-group label {
            font-size: 10px;
            color: #a0a0a0;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .filter-group select, .filter-group input {
            padding: 6px 10px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            min-width: 140px;
        }
        .btn-reset {
            background: #6c757d;
            padding: 6px 12px;
            font-size: 12px;
            height: 32px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            color: white;
            margin-top: 20px;
        }
        .btn-reset:hover {
            background: #5a6268;
        }
        .order-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding: 12px 15px;
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            border-radius: 10px;
            border: 1px solid #2a2f38;
        }
        .stat-item {
            flex: 1;
            text-align: center;
            padding: 8px;
            background: #15191f;
            border-radius: 6px;
            border: 1px solid #2a2f38;
        }
        .stat-value {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }
        .stat-label {
            font-size: 11px;
            color: #a0a0a0;
        }
        .no-tasks {
            text-align: center;
            padding: 40px;
            background: #1a1e24;
            border-radius: 12px;
            color: #a0a0a0;
            border: 1px solid #2a2f38;
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: #a0a0a0;
        }
        .spinner {
            width: 30px;
            height: 30px;
            margin: 0 auto 10px;
            border: 2px solid #2a2f38;
            border-top: 2px solid #ff3b3b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .right-modal {
            position: fixed;
            right: -450px;
            top: 0;
            width: 450px;
            height: 100vh;
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            border-left: 2px solid #ff3b3b;
            box-shadow: -5px 0 30px rgba(0,0,0,0.5);
            transition: right 0.3s ease;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .right-modal.open {
            right: 0;
        }
        .right-modal-header {
            background: linear-gradient(135deg, #232830, #1a1e24);
            padding: 15px 20px;
            border-bottom: 1px solid #2a2f38;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .right-modal-header h3 {
            margin: 0;
            color: #ff3b3b;
            font-size: 18px;
        }
        .right-modal-close {
            background: none;
            border: none;
            color: #a0a0a0;
            font-size: 28px;
            cursor: pointer;
        }
        .right-modal-close:hover {
            color: #ff3b3b;
        }
        .right-modal-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .right-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1999;
            display: none;
        }
        .right-modal-overlay.show {
            display: block;
        }
        .report-row {
            background: #15191f;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #2a2f38;
        }
        .report-input {
            width: 100%;
            padding: 6px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
        }
        .report-textarea {
            width: 100%;
            padding: 6px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            resize: vertical;
        }
        .btn-add-row {
            width: 100%;
            padding: 8px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-remove-row {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 11px;
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
        .notification {
            animation: slideInRight 0.3s ease;
        }
        body.light-theme .filter-section {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
        }
        body.light-theme .filter-group select,
        body.light-theme .filter-group input {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            color: #1e293b !important;
        }
        body.light-theme .task-card {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
        }
        body.light-theme .task-card.priority {
            border: 2px solid #ff3b3b !important;
        }
        body.light-theme .task-header.status-pending {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9) !important;
        }
        body.light-theme .task-header.status-in-progress {
            background: linear-gradient(135deg, #fff3e0, #ffe6cc) !important;
        }
        body.light-theme .task-header.status-completed {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9) !important;
        }
        body.light-theme .task-header.priority {
            background: linear-gradient(135deg, #fee2e2, #fecaca) !important;
        }
        body.light-theme .task-customer-name {
            color: #dc2626 !important;
        }
        body.light-theme .task-product-name {
            color: #f97316 !important;
        }
        body.light-theme .operation-info {
            background: #f8fafc !important;
            border: 1px solid #e2e8f0 !important;
        }
        body.light-theme .executor-item {
            background: #f8fafc !important;
            border: 1px solid #e2e8f0 !important;
        }
        body.light-theme .executor-name,
        body.light-theme .executor-quantity {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            color: #1e293b !important;
        }
        body.light-theme .btn-report-item {
            background: #ff9800 !important;
            color: white !important;
        }
        body.light-theme .btn-copy-path {
            background: #28a745 !important;
            color: white !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="../images/logo.png" alt="MasterX Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="logo-text">Master<span class="x-red">X</span></div>
            </div>
            <h1 style="margin:0; color: white; font-size:18px;">🎨 Полимерный участок</h1>
        </header>

        <div class="filter-section">
            <div class="filter-group">
                <label>🏢 ЗАКАЗЧИК</label>
                <select id="filterCustomer">
                    <option value="">Все заказчики</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📦 ИЗДЕЛИЕ</label>
                <select id="filterProduct">
                    <option value="">Все изделия</option>
                </select>
            </div>
            <div class="filter-group">
                <label>🔧 ОПЕРАЦИЯ</label>
                <select id="filterOperation">
                    <option value="">Все операции</option>
                </select>
            </div>
            <div class="filter-group">
                <label>🎨 RAL</label>
                <select id="filterRal">
                    <option value="">Все RAL</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📏 ТОЛЩИНА (мм)</label>
                <select id="filterThickness">
                    <option value="">Все толщины</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📐 РАЗМЕР</label>
                <select id="filterSize">
                    <option value="">Все размеры</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📊 СТАТУС</label>
                <select id="statusFilter">
                    <option value="all">Все задачи</option>
                    <option value="pending">⏳ Ожидают</option>
                    <option value="in_progress">⚡ В работе</option>
                    <option value="completed">✅ Завершённые</option>
                    <option value="priority">🔴 Приоритетные</option>

        <div class="order-stats">
            <div class="stat-item"><div class="stat-value" id="totalTasks">0</div><div class="stat-label">Всего задач</div></div>
            <div class="stat-item"><div class="stat-value" id="tasksInProgress">0</div><div class="stat-label">В работе</div></div>
            <div class="stat-item"><div class="stat-value" id="tasksCompleted">0</div><div class="stat-label">Выполнено</div></div>
        </div>

        <div id="tasksList" class="tasks-list"><div class="loading"><div class="spinner"></div><p>Загрузка задач...</p></div></div>
    </div>

    <div id="rightModalOverlay" class="right-modal-overlay" onclick="closeRightModal()"></div>
    <div id="rightModal" class="right-modal">
        <div class="right-modal-header">
            <h3>📝 Отчёт по задаче</h3>
            <button class="right-modal-close" onclick="closeRightModal()">&times;</button>
        </div>
        <div id="rightModalContent" class="right-modal-content"></div>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/data-loader.js"></script>
    <script src="../js/materials-report.js"></script>
    <script src="../js/task-manager.js"></script>

    <script>
        // ============== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==============
        let taskOperationsData = {};
        let taskManager = null;
        let isLoadingTasks = false;
        let currentReportTask = null;
        let reportRows = [];
        
        const OPEN_CARDS_KEY = 'polimerniy_open_tasks';
        
        // ============== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==============
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        
        function saveAllCardsState() {
            const openCards = [];
            document.querySelectorAll('.task-card').forEach(card => {
                const content = card.querySelector('.task-content');
                if (content && content.classList.contains('collapsed')) {
                    openCards.push(card.dataset.taskId);
                }
            });
            localStorage.setItem(OPEN_CARDS_KEY, JSON.stringify(openCards));
        }
        
        function restoreAllCardsState() {
            const savedOpenCards = localStorage.getItem(OPEN_CARDS_KEY);
            if (!savedOpenCards) return;
            const collapsedCardsIds = JSON.parse(savedOpenCards);
            collapsedCardsIds.forEach(taskId => {
                const card = document.querySelector(`.task-card[data-task-id="${taskId}"]`);
                if (card) {
                    const header = card.querySelector('.task-header');
                    const content = card.querySelector('.task-content');
                    if (header && content) {
                        header.classList.add('collapsed');
                        content.classList.add('collapsed');
                        const arrow = header.querySelector('.collapse-icon');
                        if (arrow) arrow.textContent = '▼';
                    }
                }
            });
        }
        
        function toggleCardState(header, content, taskId) {
            const isCollapsing = !header.classList.contains('collapsed');
            if (isCollapsing) {
                header.classList.add('collapsed');
                content.classList.add('collapsed');
            } else {
                header.classList.remove('collapsed');
                content.classList.remove('collapsed');
            }
            const arrow = header.querySelector('.collapse-icon');
            if (arrow) arrow.textContent = isCollapsing ? '▼' : '▲';
            saveAllCardsState();
        }
        
        // ============== ЗАГРУЗКА ОПЕРАЦИЙ ИЗ JSON ==============
        async function loadTaskOperationsData() {
            try {
                const response = await fetch('../data/taskOperations.json?_=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    taskOperationsData = data.operations || {};
                    window.taskOperationsData = taskOperationsData;
                    console.log('✅ Загружены операции из taskOperations.json');
                    console.log('Загружено изделий:', Object.keys(taskOperationsData).length);
                } else {
                    console.warn('taskOperations.json не найден, статус:', response.status);
                    taskOperationsData = {};
                }
            } catch(e) {
                console.error('Ошибка загрузки taskOperations.json:', e);
                taskOperationsData = {};
            }
        }
        
        // ============== КЛАСС УПРАВЛЕНИЯ ЗАДАЧАМИ ==============
        class SimpleTaskManager {
            constructor(siteKey) {
                this.siteKey = siteKey;
                this.tasks = [];
                this.storageKey = `tasks_${siteKey}`;
            }
            
            loadData() {
                const saved = localStorage.getItem(this.storageKey);
                if (saved) {
                    this.tasks = JSON.parse(saved);
                } else {
                    this.tasks = [];
                }
                return this.tasks;
            }
            
            saveData() {
                localStorage.setItem(this.storageKey, JSON.stringify(this.tasks));
            }
            
            getTasksByStatus(status) {
                if (status === 'all') return this.tasks;
                return this.tasks.filter(t => t.status === status);
            }
            
            getStats() {
                const total = this.tasks.length;
                const inProgress = this.tasks.filter(t => t.status === 'in_progress').length;
                const completed = this.tasks.filter(t => t.status === 'completed').length;
                return { total, inProgress, completed };
            }
            
            updateExecutorQuantity(taskId, executorId, quantity) {
                const task = this.tasks.find(t => t.id === taskId);
                if (task && task.executors) {
                    const executor = task.executors.find(e => e.id === executorId);
                    if (executor) {
                        executor.quantity = quantity;
                        this.saveData();
                        updateSingleTaskCard(taskId);
                    }
                }
            }
            
            updateExecutorStatus(taskId, executorId, status) {
                const task = this.tasks.find(t => t.id === taskId);
                if (!task || !task.executors) return;
                
                const executor = task.executors.find(e => e.id === executorId);
                if (executor) {
                    executor.status = status;
                    
                    let taskStatus = 'pending';
                    const hasInProgress = task.executors.some(e => e.status === 'in_progress');
                    const allShiftEnded = task.executors.length > 0 && task.executors.every(e => e.status === 'shift_ended');
                    const allCompleted = task.executors.length > 0 && task.executors.every(e => e.status === 'completed');
                    
                    if (allCompleted) {
                        taskStatus = 'completed';
                    } else if (hasInProgress) {
                        taskStatus = 'in_progress';
                    } else if (allShiftEnded) {
                        taskStatus = 'in_progress';
                    } else {
                        taskStatus = 'pending';
                    }
                    
                    task.status = taskStatus;
                    this.saveData();
                    
                    const orders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
                    const order = orders.find(o => o.id == task.orderId);
                    if (order) {
                        if (!order.tasks) order.tasks = {};
                        const squareColor = taskStatus === 'completed' ? 'green' : (taskStatus === 'in_progress' ? 'orange' : '');
                        order.tasks[task.id] = squareColor;
                        localStorage.setItem('masterx_orders', JSON.stringify(orders));
                    }
                    
                    updateSingleTaskCard(taskId);
                }
            }
            
            addExecutor(taskId, name) {
                const task = this.tasks.find(t => t.id === taskId);
                if (task) {
                    if (!task.executors) task.executors = [];
                    if (task.executors.some(e => e.name === name)) return false;
                    task.executors.push({
                        id: Date.now(),
                        name: name,
                        quantity: 0,
                        status: 'pending'
                    });
                    this.saveData();
                    updateExecutorList(taskId);
                    return true;
                }
                return false;
            }
            
            removeExecutor(taskId, executorId) {
                const task = this.tasks.find(t => t.id === taskId);
                if (task && task.executors) {
                    task.executors = task.executors.filter(e => e.id !== executorId);
                    this.saveData();
                    updateExecutorList(taskId);
                }
            }
            
            completeTask(taskId) {
                const task = this.tasks.find(t => t.id === taskId);
                if (task && task.status !== 'completed') {
                    if (task.executors) {
                        task.executors.forEach(executor => {
                            executor.status = 'completed';
                        });
                    }
                    task.status = 'completed';
                    task.completedAt = new Date().toISOString();
                    
                    if (task.isPriority === true) {
                        task.isPriority = false;
                    }
                    
                    this.saveData();
                    
                    const orders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
                    const order = orders.find(o => o.id == task.orderId);
                    if (order) {
                        if (!order.tasks) order.tasks = {};
                        order.tasks[task.id] = 'green';
                        localStorage.setItem('masterx_orders', JSON.stringify(orders));
                    }
                    
                    updateSingleTaskCard(taskId);
                }
            }
        }
        
        function updateSingleTaskCard(taskId) {
            const task = taskManager.tasks.find(t => t.id === taskId);
            if (!task) return;
            
            const taskCard = document.querySelector(`.task-card[data-task-id="${taskId}"]`);
            if (!taskCard) return;
            
            const statusBadge = taskCard.querySelector('.task-status-badge');
            const taskHeader = taskCard.querySelector('.task-header');
            
            if (statusBadge) {
                let statusClass = 'pending';
                let statusText = '⏳ ОЖИДАЕТ';
                if (task.status === 'in_progress') {
                    statusClass = 'in-progress';
                    statusText = '⚡ В РАБОТЕ';
                } else if (task.status === 'completed') {
                    statusClass = 'completed';
                    statusText = '✅ ГОТОВО';
                }
                
                statusBadge.className = `task-status-badge ${statusClass}`;
                statusBadge.textContent = statusText;
                
                if (taskHeader) {
                    taskHeader.classList.remove('status-pending', 'status-in-progress', 'status-completed');
                    taskHeader.classList.add(`status-${statusClass}`);
                }
            }
            
            const executorList = taskCard.querySelector('.executor-list');
            if (executorList) {
                const wasCollapsed = taskCard.querySelector('.task-content')?.classList.contains('collapsed');

                if (task.executors && task.executors.length > 0) {

                    });
                } else {

                    noExecutors.textContent = 'Нет исполнителей';

        function updateExecutorList(taskId) {
            const task = taskManager.tasks.find(t => t.id === taskId);

        function createExecutorItemElement(task, executor) {
            const isShiftEnded = executor.status === 'shift_ended';
            const isTaskCompleted = task.status === 'completed';
            const canEdit = !isTaskCompleted && !isShiftEnded;
            
            const div = document.createElement('div');
            div.className = 'executor-item';
            div.dataset.executorId = executor.id;
            
            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.className = 'executor-name';
            nameInput.value = executor.name;
            nameInput.disabled = isTaskCompleted || isShiftEnded;
            div.appendChild(nameInput);
            
            const quantityInput = document.createElement('input');
            quantityInput.type = 'number';
            quantityInput.className = 'executor-quantity';
            quantityInput.value = executor.quantity || 0;
            quantityInput.min = 0;
            quantityInput.disabled = !canEdit;
            quantityInput.onchange = function(e) {
                e.stopPropagation();
                if (!canEdit) return;
                taskManager.updateExecutorQuantity(task.id, executor.id, parseInt(this.value) || 0);
            };
            div.appendChild(quantityInput);
            
            const workBtn = document.createElement('button');
            workBtn.className = `btn-work ${executor.status === 'in_progress' ? 'active' : ''}`;
            workBtn.textContent = executor.status === 'in_progress' ? 'В РАБОТЕ' : (isShiftEnded ? 'СМЕНА ЗАКРЫТА' : 'НАЧАТЬ');
            workBtn.disabled = !canEdit;
            workBtn.onclick = function(e) {
                e.stopPropagation();
                if (!canEdit) return;
                const newStatus = workBtn.classList.contains('active') ? 'pending' : 'in_progress';
                taskManager.updateExecutorStatus(task.id, executor.id, newStatus);
            };
            div.appendChild(workBtn);
            
            const endShiftBtn = document.createElement('button');
            endShiftBtn.className = 'btn-end-shift';
            endShiftBtn.innerHTML = isShiftEnded ? '✅ СМЕНА ЗАКРЫТА' : '🕒 ЗАКРЫТЬ';
            endShiftBtn.disabled = isTaskCompleted || isShiftEnded;
            endShiftBtn.onclick = function(e) {
                e.stopPropagation();
                if (confirm(`Закрыть смену для ${executor.name}?`)) {
                    taskManager.updateExecutorStatus(task.id, executor.id, 'shift_ended');
                }
            };
            div.appendChild(endShiftBtn);
            
            const removeBtn = document.createElement('button');
            removeBtn.className = 'btn btn-danger btn-sm';
            removeBtn.innerHTML = '✕';
            removeBtn.disabled = !canEdit;
            removeBtn.onclick = function(e) {
                e.stopPropagation();
                if (confirm('Удалить этого исполнителя?')) {
                    taskManager.removeExecutor(task.id, executor.id);
                }
            };
            div.appendChild(removeBtn);
            
            return div;
        }

// Получить текущий ключ участка
function getCurrentSiteKey() {
    const path = window.location.pathname;
    if (path.includes('tokarniy')) return 'tokarniy';
    if (path.includes('slesarniy')) return 'slesarniy';
    if (path.includes('frezerniy')) return 'frezerniy';
    if (path.includes('lazerno')) return 'lazerno';
    if (path.includes('polimerniy')) return 'polimerniy';

}

// Выбрать и скопировать файл
function selectAndCopyFile(taskId, fileId) {
    const task = taskManager.tasks.find(t => t.id === taskId);
    if (!task) return;
    
    const allOrders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
    const order = allOrders.find(o => o.id == task.orderId);
    if (!order) return;
    
    const siteKey = getCurrentSiteKey();
    const files = order.siteFiles?.[siteKey] || [];
    const file = files.find(f => f.id === fileId);
    
    if (!file) {
        showCopyNotification('❌ Файл не найден', 'error');
        return;
    }
    
    navigator.clipboard.writeText(file.path).then(() => {
        showCopyNotification(`✅ Путь к файлу "${file.name}" скопирован!`, 'success');
        closeAllModals();
    }).catch(() => {
        showCopyNotification('❌ Ошибка при копировании', 'error');
    });
}

// Закрыть все модальные окна

    document.querySelectorAll('.modal').forEach(modal => {

    });
}

// Получить иконку по расширению
function getFileIcon(filePath) {
    const ext = (filePath || '').split('.').pop()?.toLowerCase() || '';
    const icons = {
        'pdf': '📄', 'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️',
        'dwg': '📐', 'dxf': '📐', 'cdr': '📐',
        'mp4': '🎬', 'avi': '🎬',
        'doc': '📝', 'docx': '📝', 'xls': '📊', 'xlsx': '📊'
    };
    return icons[ext] || '📎';
}

    if (files.length === 0) {
        showCopyNotification('📭 Нет прикреплённых файлов', 'warning');
        return;
    }
    
    if (files.length === 1) {
        // Если файл один, копируем сразу
        navigator.clipboard.writeText(files[0].path).then(() => {
            showCopyNotification(`✅ Путь к файлу "${files[0].name}" скопирован!`, 'success');
        });
    } else {
        // Если файлов несколько, показываем окно выбора

    }

            const operations = new Set();
            const rals = new Set();
            const thicknesses = new Set();
            const sizes = new Set();
            
            allOrders.forEach(order => {
                if (order.groupName) customers.add(order.groupName);
                if (order.items) {
                    order.items.forEach(item => {
                        if (item.product) products.add(item.product);
                        if (item.ral && item.ral.trim()) rals.add(item.ral.trim());
                        if (item.size?.name) sizes.add(item.size.name);

                    if (task.thickness) thicknesses.add(task.thickness);

                    ralSelect.innerHTML += `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`;
                });
                if (currentRal && rals.has(currentRal)) ralSelect.value = currentRal;
            }
            
            const thicknessSelect = document.getElementById('filterThickness');
            if (thicknessSelect) {
                const currentThickness = thicknessSelect.value;
                thicknessSelect.innerHTML = '<option value="">📏 Все толщины</option>';
                Array.from(thicknesses).sort().forEach(th => {
                    thicknessSelect.innerHTML += `<option value="${th}">${th}</option>`;
                });
                if (currentThickness && thicknesses.has(currentThickness)) thicknessSelect.value = currentThickness;
            }
            
            const sizeSelect = document.getElementById('filterSize');
            if (sizeSelect) {
                const currentSize = sizeSelect.value;
                sizeSelect.innerHTML = '<option value="">📐 Все размеры</option>';
                Array.from(sizes).sort((a, b) => {
                    const aNum = parseInt(a);
                    const bNum = parseInt(b);
                    if (!isNaN(aNum) && !isNaN(bNum)) return aNum - bNum;
                    return String(a).localeCompare(String(b));
                }).forEach(s => {
                    sizeSelect.innerHTML += `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`;
                });
                if (currentSize && sizes.has(currentSize)) sizeSelect.value = currentSize;
            }
        }
        
        function resetFilters() {
            document.getElementById('filterCustomer').value = '';
            document.getElementById('filterProduct').value = '';
            document.getElementById('filterOperation').value = '';
            document.getElementById('filterRal').value = '';
            document.getElementById('filterThickness').value = '';
            document.getElementById('filterSize').value = '';
            document.getElementById('statusFilter').value = 'all';
            renderTasks();
        }
        
        function setupFilterListeners() {
            const inputs = ['filterCustomer', 'filterProduct', 'filterOperation', 'filterRal', 'filterThickness', 'filterSize', 'statusFilter'];
            inputs.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('change', () => renderTasks());
                }
            });
        }
        
        // ============== ОТОБРАЖЕНИЕ ЗАДАЧ ==============
        function renderTasks() {
            if (isLoadingTasks) return;
            isLoadingTasks = true;
            
            saveAllCardsState();
            taskManager.loadData();
            
            populateFilters();
            
            const filterCustomer = document.getElementById('filterCustomer').value;
            const filterProduct = document.getElementById('filterProduct').value;
            const filterOperation = document.getElementById('filterOperation').value;
            const filterRal = document.getElementById('filterRal').value;
            const filterThickness = document.getElementById('filterThickness').value;
            const filterSize = document.getElementById('filterSize').value;
            const filterStatus = document.getElementById('statusFilter').value;
            
            const allOrders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
            
            let tasks = taskManager.tasks;
            
            tasks = tasks.filter(task => {
                const order = allOrders.find(o => o.id == task.orderId);
                if (!order) return false;
                
                if (filterStatus === 'priority') {
                    return task.isPriority === true;
                }
                
                if (filterStatus === 'completed' && task.status !== 'completed') return false;
                if (filterStatus === 'in_progress' && task.status !== 'in_progress') return false;
                if (filterStatus === 'pending' && task.status !== 'pending') return false;
                
                if (task.isPriority === true) return true;
                
                if (filterCustomer && order.groupName !== filterCustomer) return false;
                
                const item = order.items?.[task.itemIndex || 0];
                if (!item) return false;
                
                if (filterProduct && item.product !== filterProduct) return false;
                if (filterOperation && task.operation !== filterOperation) return false;
                if (filterRal) {
                    const itemRal = (item.ral || '').trim();
                    if (itemRal !== filterRal) return false;
                }
                if (filterSize && item.size?.name !== filterSize) return false;
                if (filterThickness && task.thickness !== filterThickness) return false;
                
                return true;
            });
            
            const priorityTasks = tasks.filter(t => t.isPriority === true);
            const normalTasks = tasks.filter(t => t.isPriority !== true);
            priorityTasks.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            normalTasks.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            tasks = [...priorityTasks, ...normalTasks];
            
            document.getElementById('totalTasks').textContent = tasks.length;
            document.getElementById('tasksInProgress').textContent = tasks.filter(t => t.status === 'in_progress').length;
            document.getElementById('tasksCompleted').textContent = tasks.filter(t => t.status === 'completed').length;
            
            const tasksList = document.getElementById('tasksList');
            const scrollPosition = tasksList.scrollTop;
            tasksList.innerHTML = '';
            
            if (tasks.length === 0) {
                tasksList.innerHTML = '<div class="no-tasks"><p>📭 Нет задач по выбранным фильтрам</p></div>';
                isLoadingTasks = false;
                return;
            }
            
            tasks.forEach(task => {
                const order = allOrders.find(o => o.id == task.orderId);
                const item = order?.items?.[task.itemIndex || 0];
                if (!order || !item) return;
                
                let statusClass = 'pending';
                let statusText = '⏳ ОЖИДАЕТ';
                if (task.status === 'in_progress') {
                    statusClass = 'in-progress';
                    statusText = '⚡ В РАБОТЕ';
                } else if (task.status === 'completed') {
                    statusClass = 'completed';
                    statusText = '✅ ГОТОВО';
                }
                
                const isPriority = task.isPriority === true;
                const priorityClass = isPriority ? 'priority' : '';
                const priorityBadge = isPriority ? '<span class="priority-badge">🔴 ПРИОРИТЕТ</span>' : '';
                
                let displayOperationName = task.operation;
                if (task.detail) {
                    let cleanDetailName = task.detail;
                    if (task.thickness) {
                        cleanDetailName = task.detail.replace(task.thickness, '').trim();
                    }
                    displayOperationName = `${task.operation} (${cleanDetailName})`;
                    if (task.thickness) {
                        displayOperationName += ` ${task.thickness}`;
                    }
                }
                
                let detailDisplay = '';
                if (task.detail) {
                    let cleanDetailName = task.detail;
                    if (task.thickness) {
                        cleanDetailName = task.detail.replace(task.thickness, '').trim();
                    }
                    detailDisplay = `<div class="operation-detail">📦 ${escapeHtml(cleanDetailName)} ${task.thickness ? `<span>${escapeHtml(task.thickness)}</span>` : ''}</div>`;
                }
                
                const siteFiles = order.siteFiles?.['polimerniy'] || [];
                const hasFiles = siteFiles.length > 0;
                const filesIndicator = hasFiles ? `<span class="file-indicator">📎 Файлы: ${siteFiles.length}</span>` : '';
                
                const taskCard = document.createElement('div');
                taskCard.className = `task-card ${priorityClass}`;
                taskCard.dataset.taskId = task.id;
                
                const header = document.createElement('div');
                header.className = `task-header ${statusClass} ${priorityClass} collapsed`;
                header.innerHTML = `
                    <div class="task-header-left">
                        <div class="task-customer-name">
                            🏢 ${escapeHtml(order.groupName)} | Заказ №${escapeHtml(order.number)}
                            ${priorityBadge}
                        </div>
                        <div class="task-product-info">
                            <span class="task-product-name">📦 ${escapeHtml(task.product || item.product)}</span>
                            <span class="task-size">📏 ${escapeHtml(task.size || item.size?.name || '-')}</span>
                            <span class="task-quantity">× ${task.sizeQuantity || item.size?.quantity || 1} шт</span>
                            ${task.ral || item.ral ? `<span class="task-ral">🎨 ${escapeHtml(task.ral || item.ral)}</span>` : ''}
                            ${task.texture || item.texture ? `<span class="task-texture">🧵 ${escapeHtml(task.texture || item.texture)}</span>` : ''}
                            ${filesIndicator}
                        </div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span class="task-status-badge ${statusClass}">${statusText}</span>
                        <button class="btn-report-item" onclick="event.stopPropagation(); openRightModalForTask('${task.id}')">📝 Отчёт</button>
                        ${hasFiles ? `<button class="btn-copy-path" onclick="event.stopPropagation(); copyAllFilePaths('${task.id}')">📋 Копировать путь</button>` : ''}
                        <span class="collapse-icon">▼</span>
                    </div>
                `;
                
                const content = document.createElement('div');
                content.className = 'task-content collapsed';
                content.innerHTML = `
                    <div class="operation-info">
                        <div class="operation-name">${escapeHtml(displayOperationName)}</div>
                        ${detailDisplay}
                        <div class="operation-plan">📋 План: ${task.totalQuantity || 1} шт</div>
                    </div>
                    
                    <div class="executor-header">
                        <span>ФИО</span><span>Кол-во</span><span>Статус</span><span></span>
                    </div>
                    <div class="executor-list" id="executors-${task.id}"></div>
                    
                    <div class="action-container" id="action-${task.id}"></div>
                    
                    <button class="btn-ready" id="ready-${task.id}" ${task.status === 'completed' ? 'disabled' : ''} onclick="event.stopPropagation(); completeTask('${task.id}')">✅ ГОТОВО</button>
                `;
                
                header.addEventListener('click', function(e) {
                    if (e.target.tagName === 'BUTTON') return;
                    toggleCardState(header, content, task.id);
                });
                
                taskCard.appendChild(header);
                taskCard.appendChild(content);
                tasksList.appendChild(taskCard);
                
                const executorContainer = document.getElementById(`executors-${task.id}`);
                if (executorContainer && task.executors) {
                    executorContainer.innerHTML = '';
                    task.executors.forEach(executor => {
                        executorContainer.appendChild(createExecutorItemElement(task, executor));
                    });
                }
                
                const actionContainer = document.getElementById(`action-${task.id}`);
                if (actionContainer && task.status !== 'completed') {
                    actionContainer.innerHTML = '';
                    const addBtn = document.createElement('button');
                    addBtn.className = 'btn-add-executor';
                    addBtn.textContent = '+ Добавить исполнителя';
                    addBtn.onclick = function(e) {
                        e.stopPropagation();
                        showAddExecutorForm(task, actionContainer);
                    };
                    actionContainer.appendChild(addBtn);
                }
            });
            
            restoreAllCardsState();
            tasksList.scrollTop = scrollPosition;
            isLoadingTasks = false;
            
            setTimeout(() => {
                restoreTaskHeaderColors();
            }, 50);
        }
        
        function showAddExecutorForm(task, container) {
            const oldForm = container.querySelector('.new-executor-form');
            if (oldForm) oldForm.remove();
            
            const formDiv = document.createElement('div');
            formDiv.className = 'new-executor-form';
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'ФИО исполнителя';
            const addBtn = document.createElement('button');
            addBtn.className = 'btn btn-success';
            addBtn.textContent = 'Добавить';
            addBtn.onclick = function(e) {
                e.stopPropagation();
                const name = input.value.trim();
                if (!name) { alert('Введите ФИО'); return; }
                if (taskManager.addExecutor(task.id, name)) {
                    formDiv.remove();
                } else { 
                    alert('Исполнитель уже существует'); 
                }
            };
            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn btn-danger';
            cancelBtn.textContent = 'Отмена';
            cancelBtn.onclick = function(e) {
                e.stopPropagation();
                formDiv.remove();
            };
            formDiv.appendChild(input);
            formDiv.appendChild(addBtn);
            formDiv.appendChild(cancelBtn);
            container.appendChild(formDiv);
        }
        
        function completeTask(taskId) {
            const task = taskManager.tasks.find(t => t.id === taskId);
            if (!task) return;
            
            const totalAssigned = task.executors.reduce((sum, e) => sum + (e.quantity || 0), 0);
            const planQuantity = task.totalQuantity || 1;
            let operationName = task.operation;
            if (task.detail) {
                operationName += ` (${task.detail})`;
            }
            
            if (totalAssigned < planQuantity) {
                if (!confirm(`⚠️ Выполнено только ${totalAssigned} из ${planQuantity} шт.\n\nВсё равно завершить задачу?`)) {
                    return;
                }
            } else {
                if (!confirm(`✅ Завершить задачу?\nОперация: ${operationName}\nВыполнено: ${totalAssigned} из ${planQuantity} шт`)) {
                    return;
                }
            }
            
            taskManager.completeTask(taskId);
        }
        
        // ============== ОТЧЁТЫ ==============
        function openRightModalForTask(taskId) {
            const task = taskManager.tasks.find(t => t.id === taskId);
            if (!task) {
                alert('Задача не найдена');
                return;
            }
            
            const allOrders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
            const order = allOrders.find(o => o.id == task.orderId);
            const item = order?.items?.[task.itemIndex || 0];
            
            if (!order || !item) {
                alert('Данные заказа не найдены');
                return;
            }
            
            currentReportTask = {
                taskId: task.id,
                orderId: order.id,
                orderNumber: order.number,
                customerName: order.groupName,
                product: task.product || item.product,
                size: task.size || item.size?.name,
                quantity: task.sizeQuantity || item.size?.quantity,
                ral: task.ral || item.ral,
                texture: task.texture || item.texture,
                operation: task.operation,
                detail: task.detail,
                thickness: task.thickness,
                isPriority: task.isPriority || false,
                siteKey: 'polimerniy'
            };
            
            const modal = document.getElementById('rightModal');
            const overlay = document.getElementById('rightModalOverlay');
            const contentDiv = document.getElementById('rightModalContent');
            
            const savedData = getSavedReportDataForTask(task.id);
            if (savedData && savedData.rows) {
                reportRows = [...savedData.rows];
            } else {
                reportRows = [{ расход: 0, единица: 'гр', количество: 0, комментарий: '' }];
            }
            
            renderReportForm(contentDiv);
            modal.classList.add('open');
            overlay.classList.add('show');
        }
        
        function getSavedReportDataForTask(taskId) {
            const allReports = JSON.parse(localStorage.getItem('material_reports') || '[]');
            const taskReports = allReports.filter(r => r.taskId === taskId && r.siteKey === 'polimerniy');
            if (taskReports.length === 0) return null;
            const allRows = [];
            taskReports.forEach(report => {
                if (report.rows) {
                    allRows.push(...report.rows);
                }
            });
            return { 
                rows: allRows.map(row => ({
                    расход: row.расход || 0,
                    единица: row.единица || 'гр',
                    количество: row.количество || 0,
                    комментарий: row.комментарий || ''
                })),
                savedAt: taskReports[taskReports.length - 1]?.savedAt 
            };
        }
        
        function renderReportForm(container) {
            let totalQuantity = 0;
            if (currentReportTask && currentReportTask.taskId) {
                const task = taskManager.tasks.find(t => t.id === currentReportTask.taskId);
                if (task && task.executors) {
                    totalQuantity = task.executors.reduce((sum, exec) => sum + (exec.quantity || 0), 0);
                }
            }
            
            let rowsHtml = '';
            reportRows.forEach((row, index) => {
                rowsHtml += `
                    <div class="report-row" data-row-index="${index}">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <span style="font-size: 12px; color: #ff9800;">📝 Запись ${index + 1}</span>
                            <button type="button" class="btn-remove-row" onclick="removeReportRowItem(${index})">✖️</button>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 0.5fr 1fr; gap: 10px; margin-bottom: 10px;">
                            <div>
                                <label style="font-size: 11px; color: #a0a0a0;">📊 Расход:</label>
                                <input type="number" class="report-input report-expense" data-row="${index}" value="${row.расход || 0}" step="0.01" placeholder="0">
                            </div>
                            <div>
                                <label style="font-size: 11px; color: #a0a0a0;">📏 Ед. изм.:</label>
                                <select class="report-input report-unit" data-row="${index}">
                                    <option value="гр" ${row.единица === 'гр' ? 'selected' : ''}>гр</option>
                                    <option value="кг" ${row.единица === 'кг' ? 'selected' : ''}>кг</option>
                                    <option value="мм" ${row.единица === 'мм' ? 'selected' : ''}>мм</option>
                                    <option value="м2" ${row.единица === 'м2' ? 'selected' : ''}>м²</option>
                                </select>
                            </div>
                            <div>
                                <label style="font-size: 11px; color: #a0a0a0;">📦 Количество (шт):</label>
                                <input type="number" class="report-input report-quantity" data-row="${index}" value="${row.количество || totalQuantity || 0}" step="1" placeholder="0">
                            </div>
                        </div>
                        <div>
                            <label style="font-size: 11px; color: #a0a0a0;">💬 Комментарий:</label>
                            <textarea class="report-textarea report-comment" data-row="${index}" rows="2" placeholder="Дополнительная информация...">${escapeHtml(row.комментарий || '')}</textarea>
                        </div>
                    </div>
                `;
            });
            
            const operationDisplay = currentReportTask.operation + (currentReportTask.detail ? ` (${currentReportTask.detail})` : '');
            const priorityBadge = currentReportTask.isPriority ? '<span style="background: #ff3b3b; color: white; padding: 2px 8px; border-radius: 20px; font-size: 10px; margin-left: 8px;">🔴 ПРИОРИТЕТ</span>' : '';
            
            container.innerHTML = `
                <div style="padding: 20px 0;">
                    <div style="margin-bottom: 20px; padding: 12px; background: #15191f; border-radius: 8px; border-left: 3px solid #ff9800;">
                        <div style="font-size: 12px; color: #a0a0a0;">Заказ: ${escapeHtml(currentReportTask.orderNumber)}</div>
                        <div style="font-size: 14px; font-weight: bold; color: #ff9800; margin: 5px 0;">${escapeHtml(currentReportTask.product)}${priorityBadge}</div>
                        <div style="font-size: 12px;">🏢 ${escapeHtml(currentReportTask.customerName)}</div>
                        <div style="font-size: 12px;">📏 Размер: ${escapeHtml(currentReportTask.size || '-')} × ${currentReportTask.quantity || 0} шт</div>
                        <div style="font-size: 12px;">🎨 Покрытие: ${escapeHtml(currentReportTask.ral || '-')} / ${escapeHtml(currentReportTask.texture || '-')}</div>
                        <div style="font-size: 12px; margin-top: 8px;">🔧 Операция: ${escapeHtml(operationDisplay)}</div>
                        <div style="font-size: 12px; margin-top: 8px; color: #4cd964;">📦 Выполнено: ${totalQuantity} шт</div>
                    </div>
                    <div id="reportRowsContainer" style="max-height: 400px; overflow-y: auto; margin-bottom: 15px;">
                        ${rowsHtml}
                    </div>
                    <div style="margin-bottom: 15px;">
                        <button type="button" class="btn-add-row" onclick="addReportRowItem()">➕ Добавить строку</button>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button type="button" class="btn btn-success" onclick="saveReportDataForTask()" style="flex: 1;">💾 Сохранить</button>
                        <button type="button" class="btn btn-danger" onclick="closeRightModal()" style="flex: 1;">✖️ Закрыть</button>
                    </div>
                </div>
            `;
            
            document.querySelectorAll('.report-expense').forEach(input => {
                input.addEventListener('change', function() {
                    const rowIndex = parseInt(this.dataset.row);
                    if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                        reportRows[rowIndex].расход = parseFloat(this.value) || 0;
                    }
                });
            });
            
            document.querySelectorAll('.report-unit').forEach(select => {
                select.addEventListener('change', function() {
                    const rowIndex = parseInt(this.dataset.row);
                    if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                        reportRows[rowIndex].единица = this.value;
                    }
                });
            });
            
            document.querySelectorAll('.report-quantity').forEach(input => {
                input.addEventListener('change', function() {
                    const rowIndex = parseInt(this.dataset.row);
                    if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                        reportRows[rowIndex].количество = parseFloat(this.value) || 0;
                    }
                });
            });
            
            document.querySelectorAll('.report-comment').forEach(textarea => {
                textarea.addEventListener('change', function() {
                    const rowIndex = parseInt(this.dataset.row);
                    if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                        reportRows[rowIndex].комментарий = this.value;
                    }
                });
            });
        }
        
        function addReportRowItem() {
            reportRows.push({ расход: 0, единица: 'гр', количество: 0, комментарий: '' });
            const container = document.getElementById('rightModalContent');
            renderReportForm(container);
        }
        
        function removeReportRowItem(rowIndex) {
            if (reportRows.length <= 1) {
                if (!confirm('Удалить последнюю строку? Будет создана пустая строка.')) return;
                reportRows = [{ расход: 0, единица: 'гр', количество: 0, комментарий: '' }];
            } else {
                reportRows.splice(rowIndex, 1);
            }
            const container = document.getElementById('rightModalContent');
            renderReportForm(container);
        }
        
        function saveReportDataForTask() {
            if (!currentReportTask) return;
            
            document.querySelectorAll('.report-expense').forEach(input => {
                const rowIndex = parseInt(input.dataset.row);
                if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                    reportRows[rowIndex].расход = parseFloat(input.value) || 0;
                }
            });
            
            document.querySelectorAll('.report-unit').forEach(select => {
                const rowIndex = parseInt(select.dataset.row);
                if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                    reportRows[rowIndex].единица = select.value;
                }
            });
            
            document.querySelectorAll('.report-quantity').forEach(input => {
                const rowIndex = parseInt(input.dataset.row);
                if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                    reportRows[rowIndex].количество = parseFloat(input.value) || 0;
                }
            });
            
            document.querySelectorAll('.report-comment').forEach(textarea => {
                const rowIndex = parseInt(textarea.dataset.row);
                if (!isNaN(rowIndex) && reportRows[rowIndex]) {
                    reportRows[rowIndex].комментарий = textarea.value;
                }
            });
            
            const reportData = {
                id: Date.now(),
                taskId: currentReportTask.taskId,
                orderId: currentReportTask.orderId,
                orderNumber: currentReportTask.orderNumber,
                customerName: currentReportTask.customerName,
                product: currentReportTask.product,
                size: currentReportTask.size,
                quantity: currentReportTask.quantity,
                ral: currentReportTask.ral,
                texture: currentReportTask.texture,
                operation: currentReportTask.operation,
                detail: currentReportTask.detail,
                thickness: currentReportTask.thickness,
                isPriority: currentReportTask.isPriority,
                siteKey: currentReportTask.siteKey,
                rows: reportRows.map(row => ({
                    расход: row.расход || 0,
                    единица: row.единица || 'гр',
                    количество: row.количество || 0,
                    комментарий: row.комментарий || ''
                })),
                savedAt: new Date().toISOString(),
                isTaskReport: true
            };
            
            let allReports = JSON.parse(localStorage.getItem('material_reports') || '[]');
            allReports = allReports.filter(r => !(r.taskId === currentReportTask.taskId && r.siteKey === currentReportTask.siteKey));
            allReports.push(reportData);
            localStorage.setItem('material_reports', JSON.stringify(allReports));
            
            alert('✅ Отчёт сохранён!');
            closeRightModal();
        }
        
        function closeRightModal() {
            const modal = document.getElementById('rightModal');
            const overlay = document.getElementById('rightModalOverlay');
            modal.classList.remove('open');
            overlay.classList.remove('show');
            currentReportTask = null;
            reportRows = [];
        }
        
        window.exportToExcel = function() {
            const tasks = taskManager.tasks;
            const allOrders = JSON.parse(localStorage.getItem('masterx_orders') || '[]');
            let csv = "Заказ,Заказчик,Изделие,Размер,Количество,RAL,Текстура,Операция,Деталь,Толщина,Приоритет,Исполнитель,Количество,Статус,План\n";
            tasks.forEach(task => {
                const order = allOrders.find(o => o.id == task.orderId);
                const item = order?.items?.[task.itemIndex || 0];
                const isPriority = task.isPriority ? 'ДА' : 'НЕТ';
                if (task.executors && task.executors.length > 0) {
                    task.executors.forEach(exec => {
                        csv += `"${task.orderNumber}","${order?.groupName || ''}","${task.product || item?.product || ''}","${task.size || item?.size?.name || ''}",${task.sizeQuantity || item?.size?.quantity || 0},"${task.ral || item?.ral || ''}","${task.texture || item?.texture || ''}","${task.operation}","${task.detail || ''}","${task.thickness || ''}","${isPriority}","${exec.name}",${exec.quantity || 0},"${exec.status}",${task.totalQuantity || 1}\n`;
                    });
                } else {
                    csv += `"${task.orderNumber}","${order?.groupName || ''}","${task.product || item?.product || ''}","${task.size || item?.size?.name || ''}",${task.sizeQuantity || item?.size?.quantity || 0},"${task.ral || item?.ral || ''}","${task.texture || item?.texture || ''}","${task.operation}","${task.detail || ''}","${task.thickness || ''}","${isPriority}","Нет",0,"${task.status}",${task.totalQuantity || 1}\n`;
                }
            });
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `polimerniy_tasks.csv`;
            link.click();
        };
        
        // ============== ИНИЦИАЛИЗАЦИЯ ==============
        async function init() {
            await loadTaskOperationsData();
            taskManager = new SimpleTaskManager('polimerniy');
            window.taskManager = taskManager;
            setupFilterListeners();
            renderTasks();
            window.addEventListener('beforeunload', () => { saveAllCardsState(); });
        }
        
        window.resetFilters = resetFilters;
        window.openRightModalForTask = openRightModalForTask;
        window.closeRightModal = closeRightModal;
        window.addReportRowItem = addReportRowItem;
        window.removeReportRowItem = removeReportRowItem;
        window.saveReportDataForTask = saveReportDataForTask;
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
