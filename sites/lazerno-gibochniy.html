<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterX - Лазерно-гибочный участок</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* ========== СТИЛИ ДЛЯ СТРАНИЦ УЧАСТКОВ ========== */
        .date-navigation {
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #2a2f38;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .order-card {
            background: #1a1e24;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #2a2f38;
            overflow: hidden;
        }
        
        .order-header {
            padding: 12px 20px;
            background: #232830;
            border-bottom: 1px solid #2a2f38;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .order-header h3 {
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            margin: 0;
        }
        
        .order-header .collapse-icon {
            color: #a0a0a0;
            font-size: 14px;
            transition: transform 0.2s;
        }
        
        .order-header.collapsed .collapse-icon {
            transform: rotate(-90deg);
        }
        
        .order-content {
            padding: 15px 20px;
            transition: all 0.2s;
        }
        
        .order-content.collapsed {
            display: none;
        }
        
        /* СТИЛИ ДЛЯ ИЗДЕЛИЯ */
        .item-card {
            margin-bottom: 20px;
            border: 1px solid #2a2f38;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .item-header {
            padding: 10px 15px;
            background: #232830;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #ff3b3b;
        }
        
        .item-header span:first-child {
            font-size: 14px;
        }
        
        .item-header .collapse-icon {
            color: #a0a0a0;
            font-size: 12px;
        }
        
        .item-content {
            padding: 15px;
            display: none;
        }
        
        .item-content.collapsed {
            display: none;
        }
        
        .item-content:not(.collapsed) {
            display: block;
        }
        
        /* СТИЛИ ДЛЯ ЗАДАЧ */
        .task-card {
            padding: 12px 15px;
            border-bottom: 1px solid #2a2f38;
            transition: all 0.3s;
        }
        
        .task-card:last-child {
            border-bottom: none;
        }
        
        .task-card.completed {
            opacity: 0.8;
            background: #1a2a1a;
            border-left: 3px solid #2ecc71;
        }
        
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .task-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }
        
        .task-planned {
            font-size: 12px;
            color: #ff9800;
            background: rgba(255, 152, 0, 0.15);
            padding: 4px 10px;
            border-radius: 20px;
        }
        
        .task-progress {
            font-size: 12px;
            color: #4cd964;
            margin-bottom: 10px;
            padding: 4px 8px;
            background: #1e232b;
            border-radius: 20px;
            display: inline-block;
        }
        
        .executor-header {
            display: flex;
            gap: 10px;
            padding: 0 10px;
            margin-bottom: 6px;
            font-size: 11px;
            color: #a0a0a0;
        }
        
        .executor-header span:nth-child(1) { width: 140px; }
        .executor-header span:nth-child(2) { width: 70px; text-align: center; }
        .executor-header span:nth-child(3) { width: 80px; text-align: center; }
        .executor-header span:nth-child(4) { width: 30px; }
        
        .executor-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            background: #15191f;
            border-radius: 6px;
            margin-bottom: 4px;
            border: 1px solid #2a2f38;
        }
        
        .executor-name {
            width: 140px;
            padding: 4px 8px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
        }
        
        .executor-quantity {
            width: 70px;
            padding: 4px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            text-align: center;
            font-size: 12px;
        }
        
        .btn-work {
            background: #ffc107;
            color: #000;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
            width: 70px;
            font-weight: 600;
        }
        
        .btn-work.active {
            background: #fd7e14;
            color: white;
        }
        
        .btn-work.completed {
            background: #28a745;
            color: white;
            cursor: not-allowed;
        }
        
        .btn-work:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-add-executor {
            background: #6c757d;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin: 8px 0;
            width: 140px;
        }
        
        .btn-add-executor:hover {
            background: #5a6268;
        }
        
        .action-container {
            margin: 8px 0;
        }
        
        .new-executor-form {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding: 8px;
            background: #15191f;
            border: 1px solid #2a2f38;
            border-radius: 6px;
            flex-wrap: wrap;
        }
        
        .new-executor-form input {
            width: 160px;
            flex: none;
            padding: 5px 8px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
        }
        
        .new-executor-form .btn {
            padding: 5px 12px;
            font-size: 12px;
            white-space: nowrap;
        }
        
        .btn-ready {
            background: #28a745;
            color: white;
            padding: 5px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            margin: 10px 0 0 0;
            width: auto;
            min-width: 100px;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .btn-ready:hover:not(:disabled) {
            background: #218838;
        }
        
        .btn-ready:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .extra-task-badge {
            background: #ff3b3b;
            color: white;
            padding: 2px 6px;
            border-radius: 20px;
            font-size: 10px;
            margin-left: 8px;
        }
        
        .task-description {
            color: #a0a0a0;
            font-size: 11px;
            margin: 5px 0 8px 0;
            padding: 6px;
            background: #15191f;
            border-radius: 4px;
            border-left: 3px solid #ff3b3b;
        }
        
        .no-tasks {
            text-align: center;
            padding: 40px;
            background: #1a1e24;
            border-radius: 12px;
            color: #a0a0a0;
            border: 1px solid #2a2f38;
        }
        
        .history-indicator {
            font-size: 12px;
            color: #a0a0a0;
            margin-left: 10px;
        }
        
        .filter-section {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .search-box {
            padding: 6px 12px;
            background: #1a1e24;
            border: 1px solid #2a2f38;
            border-radius: 6px;
            font-size: 12px;
            color: #e0e0e0;
        }
        
        .order-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding: 12px 15px;
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            border-radius: 10px;
            border: 1px solid #2a2f38;
        }
        
        .stat-item {
            flex: 1;
            text-align: center;
            padding: 8px;
            background: #15191f;
            border-radius: 6px;
            border: 1px solid #2a2f38;
        }
        
        .stat-value {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }
        
        .stat-label {
            font-size: 11px;
            color: #a0a0a0;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            color: #a0a0a0;
        }
        
        .spinner {
            width: 30px;
            height: 30px;
            margin: 0 auto 10px;
            border: 2px solid #2a2f38;
            border-top: 2px solid #ff3b3b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .btn-sm {
            padding: 3px 6px;
            font-size: 10px;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
            border: none;
            padding: 3px 6px;
            font-size: 10px;
        }
        
        .btn-danger:hover {
            background: #c82333;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
            border: none;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .btn-warning {
            background: #ffc107;
            color: #000;
            border: none;
        }
        
        .btn-warning:hover {
            background: #e0a800;
        }
        
        .btn-info {
            background: #17a2b8;
            color: white;
            border: none;
        }
        
        .btn-info:hover {
            background: #138496;
        }
        
        /* КНОПКА ЗАКРЫТИЯ СМЕНЫ */
        .btn-end-shift {
            background: #ff9800;
            color: white;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
            width: 95px;
            font-weight: 600;
            margin-left: 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }
        
        .btn-end-shift:hover:not(:disabled) {
            background: #f57c00;
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .btn-end-shift:disabled {
            background: #4caf50;
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .btn-end-shift.completed {
            background: #4caf50;
        }
        
        .executor-item .btn-work:disabled,
        .executor-item .btn-end-shift:disabled,
        .executor-item input:disabled {
            opacity: 0.6;
        }
        
        /* СТАТУСЫ ГРУППЫ */
        .order-header.status-green {
            background: linear-gradient(135deg, #1a3a1a, #0f2a0f);
            border-left: 4px solid #2ecc71;
        }
        
        .order-header.status-orange {
            background: linear-gradient(135deg, #3a2a1a, #2a1f0f);
            border-left: 4px solid #ff9800;
        }
        
        .order-header.status-gray {
            background: linear-gradient(135deg, #2a2a2a, #1f1f1f);
            border-left: 4px solid #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ШАПКА -->
        <header>
            <div class="logo-container">
                <img src="../images/logo.png" alt="MasterX Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="logo-text">
                    Master<span class="x-red">X</span>
                </div>
            </div>
            <h1 style="margin:0; color: white; font-size:18px;">✨ Лазерно-гибочный участок</h1>
        </header>

        <!-- НАВИГАЦИЯ ПО ДАТАМ -->
        <div class="date-navigation">
            <h2 id="currentDateDisplay" style="font-size: 15px; color: #fff; margin: 0;"></h2>
            <div class="nav-buttons">
                <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="changeDate('prev')">← Вчера</button>
                <button class="btn btn-success" style="padding: 6px 12px; font-size: 12px;" onclick="changeDate('today')">Сегодня</button>
                <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="changeDate('next')">Завтра →</button>
                <button class="btn btn-info" style="padding: 6px 12px; font-size: 12px;" onclick="exportToExcel()">📊 Excel</button>
            </div>
        </div>

        <!-- ФИЛЬТРЫ -->
        <div class="filter-section">
            <input type="text" class="search-box" placeholder="🔍 Поиск по группе или изделию..." id="searchInput">
            <select id="statusFilter" class="search-box" style="width: auto;">
                <option value="all">Все задачи</option>
                <option value="pending">Ожидают</option>
                <option value="in_progress">В работе</option>
                <option value="completed">Завершённые</option>
            </select>
        </div>

        <!-- СТАТИСТИКА -->
        <div class="order-stats">
            <div class="stat-item">
                <div class="stat-value" id="totalTasks">0</div>
                <div class="stat-label">Всего задач</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="tasksInProgress">0</div>
                <div class="stat-label">В работе</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="tasksCompleted">0</div>
                <div class="stat-label">Выполнено</div>
            </div>
        </div>

        <!-- СПИСОК ГРУПП С ЗАДАЧАМИ -->
        <div id="ordersList" class="orders-list">
            <div class="loading">
                <div class="spinner"></div>
                <p>Загрузка задач...</p>
            </div>
        </div>
    </div>

    <!-- ПОДКЛЮЧЕНИЕ СКРИПТОВ -->
    <script src="../js/storage.js"></script>
    <script src="../js/data-loader.js"></script>
    <script src="../js/task-operations.js"></script>
    <script src="../js/task-manager.js"></script>

    <script>
        // ============== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==============
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatDateDisplay(date) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('ru-RU', options);
        }

        function getGroupStatus(order) {
            if (!order.tasks || Object.keys(order.tasks).length === 0) return 'gray';
            
            let hasInProgress = false;
            let allCompleted = true;
            
            Object.values(order.tasks).forEach(status => {
                if (status === 'orange') {
                    hasInProgress = true;
                    allCompleted = false;
                }
                if (status !== 'green') {
                    allCompleted = false;
                }
            });
            
            if (allCompleted && Object.keys(order.tasks).length > 0) return 'green';
            if (hasInProgress) return 'orange';
            return 'gray';
        }

        // ============== ИНИЦИАЛИЗАЦИЯ ==============
        if (typeof TaskManager === 'undefined') {
            console.error('❌ TaskManager не загружен!');
            document.getElementById('ordersList').innerHTML = `
                <div class="no-tasks">
                    <p style="font-size: 18px;">❌ Ошибка загрузки</p>
                    <p style="color: #666;">Не удалось загрузить менеджер задач</p>
                </div>
            `;
        } else {
            const taskManager = new TaskManager('lazerno', window.TASK_OPERATIONS?.lazerno || {});
            let currentFilter = 'all';
            let currentlyOpenOrderId = null;
            
            // Сохранение состояния открытых карточек
            function saveOpenOrderState() {
                const allContents = document.querySelectorAll('.order-content');
                let foundOpenId = null;
                allContents.forEach((content) => {
                    const card = content.closest('.order-card');
                    if (card && !content.classList.contains('collapsed')) {
                        foundOpenId = card.dataset.orderId;
                    }
                });
                currentlyOpenOrderId = foundOpenId;
            }
            
            function restoreOpenOrderState() {
                if (!currentlyOpenOrderId) return;
                
                document.querySelectorAll('.order-content').forEach(content => {
                    content.classList.add('collapsed');
                });
                document.querySelectorAll('.order-header').forEach(header => {
                    header.classList.add('collapsed');
                });
                
                const openCard = document.querySelector(`.order-card[data-order-id="${currentlyOpenOrderId}"]`);
                if (openCard) {
                    const header = openCard.querySelector('.order-header');
                    const content = openCard.querySelector('.order-content');
                    if (header && content) {
                        header.classList.remove('collapsed');
                        content.classList.remove('collapsed');
                    }
                }
            }
            
            window.taskManager = taskManager;
            
            // ============== НАВИГАЦИЯ ПО ДАТАМ ==============
            window.changeDate = function(action) {
                switch(action) {
                    case 'prev': taskManager.prevDay(); break;
                    case 'next': taskManager.nextDay(); break;
                    case 'today': taskManager.today(); break;
                }
                currentlyOpenOrderId = null;
                updateDateDisplay();
                loadOrders();
            };
            
            function updateDateDisplay() {
                const dateStr = formatDateDisplay(taskManager.currentDate);
                const isToday = taskManager.formatDate(taskManager.currentDate) === taskManager.formatDate(new Date());
                document.getElementById('currentDateDisplay').innerHTML = `${dateStr} ${!isToday ? '<span class="history-indicator">(история)</span>' : ''}`;
            }
            
            // ============== ФИЛЬТРАЦИЯ ==============
            function applyFilters() {
                currentFilter = document.getElementById('statusFilter').value;
                loadOrders();
            }
            
            document.getElementById('statusFilter')?.addEventListener('change', applyFilters);
            document.getElementById('searchInput')?.addEventListener('input', applyFilters);
            
            // ============== ЗАГРУЗКА ГРУПП С ЗАДАЧАМИ ==============
            function loadOrders() {
                const ordersList = document.getElementById('ordersList');
                if (!ordersList) return;
                
                saveOpenOrderState();
                
                taskManager.loadData();
                let tasks = taskManager.getTasksByStatus(currentFilter);
                
                const stats = taskManager.getStats();
                document.getElementById('totalTasks').textContent = stats.total;
                document.getElementById('tasksInProgress').textContent = stats.inProgress;
                document.getElementById('tasksCompleted').textContent = stats.completed;
                
                ordersList.innerHTML = '';
                
                if (tasks.length === 0) {
                    ordersList.innerHTML = `<div class="no-tasks"><p style="font-size: 16px;">📭 Нет задач на этот день</p><p style="color: #666; font-size: 13px;">Выберите другую дату или создайте заказ</p></div>`;
                    return;
                }
                
                // Группируем задачи по заказам
                const byOrder = {};
                tasks.forEach(task => {
                    if (!byOrder[task.orderId]) {
                        byOrder[task.orderId] = {
                            orderId: task.orderId,
                            orderNumber: task.orderNumber,
                            groupName: '',
                            items: []
                        };
                    }
                    if (!byOrder[task.orderId].items[task.product]) {
                        byOrder[task.orderId].items[task.product] = {
                            product: task.product,
                            size: task.size,
                            tasks: []
                        };
                    }
                    byOrder[task.orderId].items[task.product].tasks.push(task);
                });
                
                // Получаем названия групп из заказов
                const allOrders = loadOrdersFromStorage() || [];
                for (const orderId in byOrder) {
                    const fullOrder = allOrders.find(o => o.id == orderId);
                    if (fullOrder) {
                        byOrder[orderId].groupName = fullOrder.groupName;
                    }
                }
                
                // Отображаем группы
                for (const orderId in byOrder) {
                    const order = byOrder[orderId];
                    const groupStatus = getGroupStatus(allOrders.find(o => o.id == orderId) || {});
                    const statusClass = groupStatus === 'green' ? 'status-green' : (groupStatus === 'orange' ? 'status-orange' : 'status-gray');
                    
                    const card = document.createElement('div');
                    card.className = 'order-card';
                    card.dataset.orderId = orderId;
                    
                    const header = document.createElement('div');
                    header.className = `order-header collapsed ${statusClass}`;
                    header.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                            <div>
                                <h3>📁 ${escapeHtml(order.groupName || 'Группа')}</h3>
                                <div style="font-size: 12px; color: #a0a0a0; margin-top: 5px;">
                                    Заказ №${order.orderNumber}
                                </div>
                            </div>
                            <span class="collapse-icon">▼</span>
                        </div>
                    `;
                    
                    const content = document.createElement('div');
                    content.className = 'order-content collapsed';
                    
                    // Отображаем изделия
                    for (const productName in order.items) {
                        const item = order.items[productName];
                        
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'item-card';
                        
                        const itemHeader = document.createElement('div');
                        itemHeader.className = 'item-header collapsed';
                        itemHeader.innerHTML = `
                            <span>📦 ${escapeHtml(item.product)}</span>
                            <span class="collapse-icon">▼</span>
                        `;
                        
                        const itemContent = document.createElement('div');
                        itemContent.className = 'item-content collapsed';
                        
                        // Отображаем задачи
                        item.tasks.sort((a, b) => (a.index || 0) - (b.index || 0));
                        item.tasks.forEach(task => {
                            itemContent.appendChild(createTaskCard(task));
                        });
                        
                        itemHeader.onclick = () => {
                            const isCollapsed = itemContent.classList.contains('collapsed');
                            if (isCollapsed) {
                                itemContent.classList.remove('collapsed');
                                itemHeader.classList.remove('collapsed');
                            } else {
                                itemContent.classList.add('collapsed');
                                itemHeader.classList.add('collapsed');
                            }
                        };
                        
                        itemDiv.appendChild(itemHeader);
                        itemDiv.appendChild(itemContent);
                        content.appendChild(itemDiv);
                    }
                    
                    header.onclick = () => {
                        const isCollapsed = content.classList.contains('collapsed');
                        if (isCollapsed) {
                            content.classList.remove('collapsed');
                            header.classList.remove('collapsed');
                            currentlyOpenOrderId = orderId;
                        } else {
                            content.classList.add('collapsed');
                            header.classList.add('collapsed');
                            if (currentlyOpenOrderId === orderId) currentlyOpenOrderId = null;
                        }
                    };
                    
                    card.appendChild(header);
                    card.appendChild(content);
                    ordersList.appendChild(card);
                }
                
                setTimeout(() => restoreOpenOrderState(), 50);
            }
            
            // ============== СОЗДАНИЕ КАРТОЧКИ ЗАДАЧИ ==============
            function createTaskCard(task) {
    const card = document.createElement('div');
    card.className = `task-card ${task.status === 'completed' ? 'completed' : ''}`;
    card.dataset.taskId = task.id;
    
    // Запланированное количество
    const plannedQty = task.plannedQuantity || task.totalQuantity || 1;
    
    const header = document.createElement('div');
    header.className = 'task-header';
    header.innerHTML = `
        <div style="display: flex; flex-direction: column; gap: 5px; width: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span class="task-title">
                    ${escapeHtml(task.operation)}
                    ${task.isComponent ? '<span class="component-badge">🔧 Комплектующая</span>' : ''}
                </span>
            </div>
            <div class="task-planned-info">
                📦 Запланировано: <strong>${plannedQty} шт</strong>
            </div>
        </div>
    `;
    card.appendChild(header);
    
    // Описание для доп. задач
    if (task.isExtra && task.description) {
        const desc = document.createElement('div');
        desc.className = 'task-description';
        desc.textContent = escapeHtml(task.description);
        card.appendChild(desc);
    }
    
    const headers = document.createElement('div');
    headers.className = 'executor-header';
    headers.innerHTML = `<span>ФИО</span><span>Кол-во</span><span>Статус</span><span></span>`;
    card.appendChild(headers);
    
    const executorList = document.createElement('div');
    executorList.className = 'executor-list';
    executorList.id = `executors-${task.id}`;
    
    if (task.executors && task.executors.length > 0) {
        task.executors.forEach(executor => {
            executorList.appendChild(createExecutorItem(task, executor));
        });
    } else {
        const noExecutors = document.createElement('p');
        noExecutors.style.cssText = 'color: #a0a0a0; padding: 8px; text-align: center; font-style: italic; font-size: 12px;';
        noExecutors.textContent = 'Нет исполнителей';
        executorList.appendChild(noExecutors);
    }
    card.appendChild(executorList);
    
    const actionContainer = document.createElement('div');
    actionContainer.className = 'action-container';
    
    if (task.status !== 'completed') {
        const addBtn = document.createElement('button');
        addBtn.className = 'btn-add-executor';
        addBtn.textContent = '+ Добавить исполнителя';
        addBtn.onclick = () => showAddExecutorForm(task, actionContainer);
        actionContainer.appendChild(addBtn);
    }
    card.appendChild(actionContainer);
    
    const readyBtn = document.createElement('button');
    readyBtn.className = 'btn-ready';
    readyBtn.textContent = '✅ ГОТОВО';
    readyBtn.disabled = task.status === 'completed';
    readyBtn.onclick = () => completeTask(task.id);
    card.appendChild(readyBtn);
    
    return card;
}
            
            // ============== СОЗДАНИЕ ЭЛЕМЕНТА ИСПОЛНИТЕЛЯ ==============
            function createExecutorItem(task, executor) {
                const div = document.createElement('div');
                div.className = `executor-item ${executor.status === 'completed' ? 'completed' : ''}`;
                div.dataset.executorId = executor.id;
                
                const isShiftEnded = executor.status === 'shift_ended';
                
                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.className = 'executor-name';
                nameInput.value = escapeHtml(executor.name);
                nameInput.placeholder = 'ФИО';
                nameInput.disabled = task.status === 'completed' || isShiftEnded;
                div.appendChild(nameInput);
                
                const quantityInput = document.createElement('input');
                quantityInput.type = 'number';
                quantityInput.className = 'executor-quantity';
                quantityInput.value = executor.quantity || 0;
                quantityInput.min = 0;
                quantityInput.max = task.plannedQuantity || task.totalQuantity || 1;
                quantityInput.disabled = task.status === 'completed' || isShiftEnded;
                quantityInput.onchange = function(e) {
                    const val = parseInt(e.target.value) || 0;
                    taskManager.updateExecutorQuantity(task.id, executor.id, val);
                    updateTaskProgress(task.id);
                };
                div.appendChild(quantityInput);
                
                const workBtn = document.createElement('button');
                workBtn.className = `btn-work ${executor.status === 'in_progress' ? 'active' : ''}`;
                workBtn.textContent = executor.status === 'in_progress' ? 'В РАБОТЕ' : (isShiftEnded ? 'СМЕНА ЗАКРЫТА' : 'НАЧАТЬ');
                workBtn.disabled = task.status === 'completed' || isShiftEnded;
                workBtn.onclick = function() {
                    if (isShiftEnded) return;
                    const newStatus = workBtn.classList.contains('active') ? 'pending' : 'in_progress';
                    taskManager.updateExecutorStatus(task.id, executor.id, newStatus);
                    workBtn.classList.toggle('active');
                    workBtn.textContent = newStatus === 'in_progress' ? 'В РАБОТЕ' : 'НАЧАТЬ';
                };
                div.appendChild(workBtn);
                
                const endShiftBtn = document.createElement('button');
                endShiftBtn.className = 'btn-end-shift';
                endShiftBtn.innerHTML = isShiftEnded ? '✅ СМЕНА ЗАКРЫТА' : '🕒 ЗАКРЫТЬ';
                endShiftBtn.disabled = task.status === 'completed' || isShiftEnded;
                endShiftBtn.onclick = function() {
                    if (confirm(`Закрыть смену для ${executor.name}?`)) {
                        taskManager.updateExecutorStatus(task.id, executor.id, 'shift_ended');
                        refreshTaskCard(task.id);
                    }
                };
                div.appendChild(endShiftBtn);
                
                const removeBtn = document.createElement('button');
                removeBtn.className = 'btn btn-danger btn-sm';
                removeBtn.innerHTML = '✕';
                removeBtn.disabled = task.status === 'completed' || isShiftEnded;
                removeBtn.onclick = function() {
                    if (confirm('Удалить этого исполнителя?')) {
                        taskManager.removeExecutor(task.id, executor.id);
                        refreshTaskCard(task.id);
                    }
                };
                div.appendChild(removeBtn);
                
                return div;
            }
            
            function refreshTaskCard(taskId) {
                const updatedTask = taskManager.tasks.find(t => t.id === taskId);
                if (updatedTask) {
                    const oldCard = document.querySelector(`.task-card[data-task-id="${taskId}"]`);
                    if (oldCard) {
                        const newCard = createTaskCard(updatedTask);
                        oldCard.parentNode.replaceChild(newCard, oldCard);
                    }
                }
            }
            
            function updateTaskProgress(taskId) {
                refreshTaskCard(taskId);
            }
            
            // ============== ФОРМА ДОБАВЛЕНИЯ ИСПОЛНИТЕЛЯ ==============
            function showAddExecutorForm(task, actionContainer) {
                const oldForm = actionContainer.querySelector('.new-executor-form');
                if (oldForm) oldForm.remove();
                
                const formDiv = document.createElement('div');
                formDiv.className = 'new-executor-form';
                
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = 'ФИО исполнителя';
                
                const addBtn = document.createElement('button');
                addBtn.type = 'button';
                addBtn.className = 'btn btn-success';
                addBtn.textContent = 'Добавить';
                addBtn.onclick = () => {
                    const name = input.value.trim();
                    if (!name) {
                        alert('Введите ФИО исполнителя');
                        return;
                    }
                    
                    const result = taskManager.addExecutor(task.id, name);
                    if (result) {
                        formDiv.remove();
                        refreshTaskCard(task.id);
                    } else {
                        alert('Не удалось добавить исполнителя. Возможно, он уже существует.');
                    }
                };
                
                const cancelBtn = document.createElement('button');
                cancelBtn.type = 'button';
                cancelBtn.className = 'btn btn-danger';
                cancelBtn.textContent = 'Отмена';
                cancelBtn.onclick = () => formDiv.remove();
                
                formDiv.appendChild(input);
                formDiv.appendChild(addBtn);
                formDiv.appendChild(cancelBtn);
                
                actionContainer.appendChild(formDiv);
            }
            
            // ============== ДЕЙСТВИЯ С ЗАДАЧАМИ ==============
            window.completeTask = function(taskId) {
                const task = taskManager.tasks.find(t => t.id === taskId);
                if (!task) return;
                
                let message = `Завершить задачу?\n\n📌 Операция: ${task.operation}\n📦 Заказ: ${task.orderNumber}\n`;
                const completedTotal = task.executors.reduce((sum, e) => sum + (e.quantity || 0), 0);
                message += `🔢 Выполнено: ${completedTotal} из ${task.plannedQuantity || task.totalQuantity || 1} шт`;
                
                if (confirm(message)) {
                    taskManager.completeTask(taskId);
                    refreshTaskCard(taskId);
                }
            };
            
            // ============== ЭКСПОРТ В EXCEL ==============
            window.exportToExcel = function() {
                const tasks = taskManager.tasks;
                const dateStr = taskManager.formatDate(taskManager.currentDate);
                
                let csv = "Заказ,Изделие,Операция,Запланировано,Исполнитель,Выполнено,Статус\n";
                
                tasks.forEach(task => {
                    if (task.executors && task.executors.length > 0) {
                        task.executors.forEach(executor => {
                            csv += `"${task.orderNumber}","${task.product}","${task.operation}",${task.plannedQuantity || task.totalQuantity || 1},"${executor.name}",${executor.quantity || 0},"${executor.status}"\n`;
                        });
                    } else {
                        csv += `"${task.orderNumber}","${task.product}","${task.operation}",${task.plannedQuantity || task.totalQuantity || 1},"Нет",0,"${task.status}"\n`;
                    }
                });
                
                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${taskManager.siteType}_${dateStr}.csv`;
                link.click();
            };
            
            // Запуск
            document.addEventListener('DOMContentLoaded', function() {
                updateDateDisplay();
                loadOrders();
                
                window.addEventListener('taskHistoryChanged', function(e) {
                    if (e.detail.siteType === 'lazerno') loadOrders();
                });
                window.addEventListener('storage', function(e) {
                    if (e.key === 'masterx_orders' || (e.key && e.key.startsWith('tasks_lazerno_'))) loadOrders();
                });
            });
        }
    </script>
</body>
</html>
