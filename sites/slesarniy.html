<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterX - Слесарный участок</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* ========== СТИЛИ ДЛЯ СТРАНИЦЫ СЛЕСАРНОГО УЧАСТКА ========== */
        .date-navigation {
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #2a2f38;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .order-card {
            background: #1a1e24;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #2a2f38;
            overflow: hidden;
        }
        
        .order-header {
            padding: 12px 20px;
            background: #232830;
            border-bottom: 1px solid #2a2f38;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .order-header h3 {
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            margin: 0;
        }
        
        .order-header .collapse-icon {
            color: #a0a0a0;
            font-size: 14px;
            transition: transform 0.2s;
        }
        
        .order-header.collapsed .collapse-icon {
            transform: rotate(-90deg);
        }
        
        .order-content {
            padding: 15px 20px;
            transition: all 0.2s;
        }
        
        .order-content.collapsed {
            display: none;
        }
        
        .product-info {
            background: #15191f;
            border-bottom: 1px solid #2a2f38;
            color: #a0a0a0;
            font-size: 13px;
        }
        
        .product-info strong {
            color: #ff3b3b;
        }
        
        .task-card {
            padding: 12px 15px;
            border-bottom: 1px solid #2a2f38;
            transition: all 0.3s;
        }
        
        .task-card:last-child {
            border-bottom: none;
        }
        
        .task-card.completed {
            opacity: 0.8;
            background: #1a2a1a;
            border-left: 3px solid #2ecc71;
        }
        
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .task-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }
        
        .task-progress {
            font-size: 12px;
            color: #4cd964;
            margin-bottom: 10px;
            padding: 4px 8px;
            background: #1e232b;
            border-radius: 20px;
            display: inline-block;
        }
        
        .executor-header {
            display: flex;
            gap: 10px;
            padding: 0 10px;
            margin-bottom: 6px;
            font-size: 11px;
            color: #a0a0a0;
        }
        
        .executor-header span:nth-child(1) { width: 140px; }
        .executor-header span:nth-child(2) { width: 70px; text-align: center; }
        .executor-header span:nth-child(3) { width: 80px; text-align: center; }
        .executor-header span:nth-child(4) { width: 30px; }
        
        .executor-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            background: #15191f;
            border-radius: 6px;
            margin-bottom: 4px;
            border: 1px solid #2a2f38;
        }
        
        .executor-name {
            width: 140px;
            padding: 4px 8px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
        }
        
        .executor-quantity {
            width: 70px;
            padding: 4px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            text-align: center;
            font-size: 12px;
        }
        
        .btn-work {
            background: #ffc107;
            color: #000;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
            width: 70px;
            font-weight: 600;
        }
        
        .btn-work.active {
            background: #fd7e14;
            color: white;
        }
        
        .btn-work.completed {
            background: #28a745;
            color: white;
            cursor: not-allowed;
        }
        
        .btn-work:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-add-executor {
            background: #6c757d;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin: 8px 0;
            width: 140px;
        }
        
        .btn-add-executor:hover {
            background: #5a6268;
        }
        
        .action-container {
            margin: 8px 0;
        }
        
        .new-executor-form {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding: 8px;
            background: #15191f;
            border: 1px solid #2a2f38;
            border-radius: 6px;
            flex-wrap: wrap;
        }
        
        .new-executor-form input {
            width: 160px;
            flex: none;
            padding: 5px 8px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
        }
        
        .new-executor-form .btn {
            padding: 5px 12px;
            font-size: 12px;
            white-space: nowrap;
        }
        
        .btn-ready {
            background: #28a745;
            color: white;
            padding: 5px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            margin: 10px 0 0 0;
            width: auto;
            min-width: 100px;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .btn-ready:hover:not(:disabled) {
            background: #218838;
        }
        
        .btn-ready:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .extra-task-badge {
            background: #ff3b3b;
            color: white;
            padding: 2px 6px;
            border-radius: 20px;
            font-size: 10px;
            margin-left: 8px;
        }
        
        .task-description {
            color: #a0a0a0;
            font-size: 11px;
            margin: 5px 0 8px 0;
            padding: 6px;
            background: #15191f;
            border-radius: 4px;
            border-left: 3px solid #ff3b3b;
        }
        
        .no-tasks {
            text-align: center;
            padding: 40px;
            background: #1a1e24;
            border-radius: 12px;
            color: #a0a0a0;
            border: 1px solid #2a2f38;
        }
        
        .history-indicator {
            font-size: 12px;
            color: #a0a0a0;
            margin-left: 10px;
        }
        
        .warning-message {
            background: #ff3b3b20;
            border: 1px solid #ff3b3b;
            color: #ff3b3b;
            padding: 6px;
            border-radius: 4px;
            margin: 8px 0;
            font-size: 11px;
        }
        
        .filter-section {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .search-box {
            padding: 6px 12px;
            background: #1a1e24;
            border: 1px solid #2a2f38;
            border-radius: 6px;
            font-size: 12px;
            color: #e0e0e0;
        }
        
        .order-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding: 12px 15px;
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            border-radius: 10px;
            border: 1px solid #2a2f38;
        }
        
        .stat-item {
            flex: 1;
            text-align: center;
            padding: 8px;
            background: #15191f;
            border-radius: 6px;
            border: 1px solid #2a2f38;
        }
        
        .stat-value {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }
        
        .stat-label {
            font-size: 11px;
            color: #a0a0a0;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            color: #a0a0a0;
        }
        
        .spinner {
            width: 30px;
            height: 30px;
            margin: 0 auto 10px;
            border: 2px solid #2a2f38;
            border-top: 2px solid #ff3b3b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .btn-sm {
            padding: 3px 6px;
            font-size: 10px;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
            border: none;
            padding: 3px 6px;
            font-size: 10px;
        }
        
        .btn-danger:hover {
            background: #c82333;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
            border: none;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .btn-warning {
            background: #ffc107;
            color: #000;
            border: none;
        }
        
        .btn-warning:hover {
            background: #e0a800;
        }
        
        .btn-info {
            background: #17a2b8;
            color: white;
            border: none;
        }
        
        .btn-info:hover {
            background: #138496;
        }
        
        /* ========== КНОПКА ЗАКРЫТИЯ СМЕНЫ ========== */
        .btn-end-shift {
            background: #ff9800;
            color: white;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
            width: 95px;
            font-weight: 600;
            margin-left: 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }
        
        .btn-end-shift:hover:not(:disabled) {
            background: #f57c00;
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .btn-end-shift:disabled {
            background: #4caf50;
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .btn-end-shift.completed {
            background: #4caf50;
        }
        
        .executor-item .btn-work:disabled,
        .executor-item .btn-end-shift:disabled,
        .executor-item input:disabled {
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="../images/logo.png" alt="MasterX Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="logo-text">
                    Master<span class="x-red">X</span>
                </div>
            </div>
            <h1 style="margin:0; color: white; font-size:18px;">🔧 Слесарный участок</h1>
        </header>

        <div class="date-navigation">
            <h2 id="currentDateDisplay" style="font-size: 15px; color: #fff; margin: 0;"></h2>
            <div class="nav-buttons">
                <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="changeDate('prev')">← Вчера</button>
                <button class="btn btn-success" style="padding: 6px 12px; font-size: 12px;" onclick="changeDate('today')">Сегодня</button>
                <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="changeDate('next')">Завтра →</button>
                <button class="btn btn-info" style="padding: 6px 12px; font-size: 12px;" onclick="exportToExcel()">📊 Excel</button>
            </div>
        </div>

        <div class="filter-section">
            <select id="statusFilter" class="search-box" style="width: auto; padding: 6px 10px;" onchange="applyFilters()">
                <option value="all">Все задачи</option>
                <option value="pending">Ожидают</option>
                <option value="in_progress">В работе</option>
                <option value="completed">Завершённые</option>
            </select>
        </div>

        <div class="order-stats">
            <div class="stat-item">
                <div class="stat-value" id="totalTasks">0</div>
                <div class="stat-label">Всего задач</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="tasksInProgress">0</div>
                <div class="stat-label">В работе</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="tasksCompleted">0</div>
                <div class="stat-label">Выполнено</div>
            </div>
        </div>

        <div id="tasksList" class="tasks-list">
            <div class="loading">
                <div class="spinner"></div>
                <p>Загрузка задач...</p>
            </div>
        </div>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/data-loader.js"></script>
    <script src="../js/task-operations.js"></script>
    <script src="../js/task-manager.js"></script>

    <script>
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ============== СОХРАНЕНИЕ СОСТОЯНИЯ ОТКРЫТЫХ КАРТОЧЕК ==============
        const STORAGE_KEY = 'slesarniy_open_cards';
        
        function saveOpenCardsState() {
            const openCards = [];
            document.querySelectorAll('.order-card').forEach(card => {
                const content = card.querySelector('.order-content');
                if (content && !content.classList.contains('collapsed')) {
                    openCards.push(card.dataset.orderId);
                }
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(openCards));
            console.log('💾 Сохранены открытые карточки:', openCards);
        }

        function restoreOpenCardsState() {
            const savedOpenCards = localStorage.getItem(STORAGE_KEY);
            if (!savedOpenCards) return;
            
            const openCardsIds = JSON.parse(savedOpenCards);
            console.log('📂 Восстанавливаем открытые карточки:', openCardsIds);
            
            openCardsIds.forEach(orderId => {
                const card = document.querySelector(`.order-card[data-order-id="${orderId}"]`);
                if (card) {
                    const header = card.querySelector('.order-header');
                    const content = card.querySelector('.order-content');
                    if (header && content) {
                        header.classList.remove('collapsed');
                        content.classList.remove('collapsed');
                        console.log('✅ Восстановлена карточка:', orderId);
                    }
                }
            });
        }

        // ============== ИНИЦИАЛИЗАЦИЯ ==============
        if (typeof TaskManager === 'undefined') {
            console.error('❌ TaskManager не загружен!');
            document.getElementById('tasksList').innerHTML = '<div class="no-tasks"><p>❌ Ошибка загрузки</p></div>';
        } else {
            const taskManager = new TaskManager('slesarniy', window.TASK_OPERATIONS.slesarniy || {});
            let currentFilter = 'all';
            let currentlyOpenOrderId = null;
            let isLoadingTasks = false;
            
            function saveOpenOrderState() {
                const allContents = document.querySelectorAll('.order-content');
                let foundOpenId = null;
                allContents.forEach((content) => {
                    const card = content.closest('.order-card');
                    if (card && !content.classList.contains('collapsed')) {
                        foundOpenId = card.dataset.orderId;
                    }
                });
                currentlyOpenOrderId = foundOpenId;
            }
            
            function restoreOpenOrderState() {
                if (!currentlyOpenOrderId) return;
                const openCard = document.querySelector(`.order-card[data-order-id="${currentlyOpenOrderId}"]`);
                if (openCard) {
                    const header = openCard.querySelector('.order-header');
                    const content = openCard.querySelector('.order-content');
                    if (header && content) {
                        header.classList.remove('collapsed');
                        content.classList.remove('collapsed');
                    }
                }
            }
            
            window.taskManager = taskManager;
            
            document.addEventListener('DOMContentLoaded', function() {
                updateDateDisplay();
                loadTasks();
                window.addEventListener('beforeunload', function() { saveOpenCardsState(); });
            });
            
            window.changeDate = function(action) {
                switch(action) {
                    case 'prev': taskManager.prevDay(); break;
                    case 'next': taskManager.nextDay(); break;
                    case 'today': taskManager.today(); break;
                }
                currentlyOpenOrderId = null;
                updateDateDisplay();
                loadTasks();
            };
            
            function updateDateDisplay() {
                var options = { year: 'numeric', month: 'long', day: 'numeric' };
                var dateStr = taskManager.currentDate.toLocaleDateString('ru-RU', options);
                var isToday = taskManager.formatDate(taskManager.currentDate) === taskManager.formatDate(new Date());
                document.getElementById('currentDateDisplay').innerHTML = dateStr + (isToday ? '' : '<span class="history-indicator">(история)</span>');
            }
            
            window.applyFilters = function() {
                currentFilter = document.getElementById('statusFilter').value;
                loadTasks();
            };
            
            function loadTasks() {
                if (isLoadingTasks) return;
                isLoadingTasks = true;
                
                saveOpenCardsState();
                saveOpenOrderState();
                
                var tasksList = document.getElementById('tasksList');
                taskManager.loadData();
                var tasks = taskManager.getTasksByStatus(currentFilter);
                
                var stats = taskManager.getStats();
                document.getElementById('totalTasks').textContent = stats.total;
                document.getElementById('tasksInProgress').textContent = stats.inProgress;
                document.getElementById('tasksCompleted').textContent = stats.completed;
                
                tasksList.innerHTML = '';
                
                if (tasks.length === 0) {
                    tasksList.innerHTML = '<div class="no-tasks"><p>📭 Нет задач на этот день</p></div>';
                    isLoadingTasks = false;
                    return;
                }
                
                var byOrder = {};
                tasks.forEach(function(task) {
                    if (!byOrder[task.orderId]) {
                        byOrder[task.orderId] = {
                            number: task.orderNumber,
                            orderId: task.orderId,
                            tasks: []
                        };
                    }
                    byOrder[task.orderId].tasks.push(task);
                });
                
                Object.values(byOrder).forEach(function(order) {
                    var orderDiv = document.createElement('div');
                    orderDiv.className = 'order-card';
                    orderDiv.dataset.orderId = order.orderId;
                    
                    var header = document.createElement('div');
                    header.className = 'order-header collapsed';
                    header.innerHTML = '<h3>📦 Заказ №' + escapeHtml(order.number) + '</h3><span class="collapse-icon">▼</span>';
                    
                    var content = document.createElement('div');
                    content.className = 'order-content collapsed';
                    
                    var fullOrder = null;
                    try {
                        var allOrders = JSON.parse(localStorage.getItem('masterx_orders')) || [];
                        fullOrder = allOrders.find(function(o) { return o.id == order.orderId; });
                    } catch (e) {}

                    var productQty = (fullOrder && fullOrder.items && fullOrder.items[0]) ? (fullOrder.items[0].size?.quantity || 1) : 1;
                    var productName = (fullOrder && fullOrder.items && fullOrder.items[0]) ? (fullOrder.items[0].product || '') : '';
                    var productSize = (fullOrder && fullOrder.items && fullOrder.items[0]) ? (fullOrder.items[0].size?.name || '-') : '-';
                    var bracket = (fullOrder && fullOrder.items && fullOrder.items[0]) ? (fullOrder.items[0].brackets || []) : [];
                    var lyre = (fullOrder && fullOrder.items && fullOrder.items[0]) ? (fullOrder.items[0].lyres || []) : [];
                    var ral = (fullOrder && fullOrder.items && fullOrder.items[0]) ? (fullOrder.items[0].ral || '') : '';
                    var texture = (fullOrder && fullOrder.items && fullOrder.items[0]) ? (fullOrder.items[0].texture || '') : '';
                    var components = (fullOrder && fullOrder.components) ? fullOrder.components : [];
                    var details = (fullOrder && fullOrder.items && fullOrder.items[0]) ? (fullOrder.items[0].details || []) : [];
                    
                    var allDetails = [];
                    if (bracket && bracket.length > 0) {
                        bracket.forEach(function(b) {
                            if (b.type && b.type !== 'отсутствует' && b.quantity > 0) {
                                allDetails.push({ name: 'Кронштейн ' + b.type, quantity: b.quantity });
                            }
                        });
                    }
                    if (lyre && lyre.length > 0) {
                        lyre.forEach(function(l) {
                            if (l.type && l.type !== 'отсутствует' && l.quantity > 0) {
                                allDetails.push({ name: 'Лира ' + l.type, quantity: l.quantity });
                            }
                        });
                    }
                    if (details && details.length > 0) {
                        details.forEach(function(d) {
                            if (d.type !== 'profile' && d.quantity > 0) {
                                allDetails.push({ name: d.name, quantity: d.quantity });
                            }
                        });
                    }
                    
                    var profiles = [];
                    if (details && details.length > 0) {
                        details.forEach(function(d) {
                            if (d.type === 'profile' && d.quantity > 0) {
                                profiles.push({ name: d.name, lengthMm: d.lengthMm, quantity: d.quantity });
                            }
                        });
                    }
                    
                    var productInfoDiv = document.createElement('div');
                    productInfoDiv.className = 'product-info';
                    productInfoDiv.style.padding = '8px 12px';
                    productInfoDiv.style.borderBottom = '1px solid #2a2f38';
                    
                    var infoHtml = `
                        <div style="font-size: 20px; font-weight: 600; color: #ff3b3b; margin: 0 0 8px 0;">📦 ${escapeHtml(productName)}</div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;">
                            <div>
                                <div style="color: #a0a0a0; font-size: 11px;">РАЗМЕР</div>
                                <div style="font-size: 20px;"><strong>${escapeHtml(productSize)}</strong> <span style="color: #4cd964;">× ${productQty} шт</span></div>
                                <div style="margin-top: 8px;">
                                    <div style="color: #a0a0a0; font-size: 11px;">ПОКРЫТИЕ</div>
                                    <div style="font-size: 18px;"><strong>${escapeHtml(ral || '-')}</strong> / ${escapeHtml(texture || '-')}</div>
                                </div>
                            </div>
                            <div>
                                <div style="color: #a0a0a0; font-size: 11px; margin-bottom: 8px;">ПРОФИЛИ</div>
                                ${profiles.map(p => `
                                    <div style="margin-bottom: 8px;">
                                        <div style="font-size: 16px;">• ${escapeHtml(p.name)}</div>
                                        <div style="margin-left: 18px; color: #a0a0a0; font-size: 13px;">
                                            <span style="color: #ff9800;">${p.lengthMm} мм</span> <span style="color: #4cd964;">× ${p.quantity} шт</span>
                                        </div>
                                    </div>
                                `).join('') || '<div style="color: #6c757d;">— нет —</div>'}
                            </div>
                            <div>
                                <div style="color: #a0a0a0; font-size: 11px; margin-bottom: 8px;">ДЕТАЛИ</div>
                                ${allDetails.map(d => `
                                    <div style="margin-bottom: 6px; font-size: 16px;">• ${escapeHtml(d.name)} <span style="color: #4cd964;">${d.quantity} шт</span></div>
                                `).join('') || '<div style="color: #6c757d;">— нет —</div>'}
                            </div>
                        </div>
                    `;
                    
                    if (components && components.length > 0) {
                        var compsHtml = '';
                        for (var i = 0; i < components.length; i++) {
                            compsHtml += '<span style="background: #1e232b; padding: 4px 10px; border-radius: 14px; font-size: 12px; border: 1px solid #2a2f38; margin-right: 6px; display: inline-block;">' + escapeHtml(components[i].name) + ': <strong style="color: #4cd964;">' + components[i].quantityPerProduct + '</strong> шт/изд</span>';
                        }
                        infoHtml += '<div style="margin-top: 12px; padding-top: 10px; border-top: 1px solid #2a2f38;"><strong style="color: #ff3b3b;">🔧 КОМПЛЕКТУЮЩИЕ:</strong><div style="margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px;">' + compsHtml + '</div></div>';
                    }
                    
                    productInfoDiv.innerHTML = infoHtml;
                    content.appendChild(productInfoDiv);
                    
                    order.tasks.forEach(function(task) {
                        content.appendChild(createTaskCard(task));
                    });
                    
                    header.addEventListener('click', function(e) {
                        if (e.target.tagName === 'BUTTON') return;
                        content.classList.toggle('collapsed');
                        header.classList.toggle('collapsed');
                        setTimeout(function() { saveOpenCardsState(); }, 50);
                    });
                    
                    orderDiv.appendChild(header);
                    orderDiv.appendChild(content);
                    tasksList.appendChild(orderDiv);
                });
                
                setTimeout(function() {
                    restoreOpenCardsState();
                    restoreOpenOrderState();
                    isLoadingTasks = false;
                }, 100);
            }
            
            function createTaskCard(task) {
                var card = document.createElement('div');
                card.className = 'task-card ' + (task.status === 'completed' ? 'completed' : '');
                card.dataset.taskId = task.id;
                
                var header = document.createElement('div');
                header.className = 'task-header';
                header.innerHTML = '<span class="task-title">' + escapeHtml(task.operation) + (task.isExtra ? '<span class="extra-task-badge">Доп.</span>' : '') + '</span>';
                card.appendChild(header);
                
                if (task.isExtra && task.description) {
                    var desc = document.createElement('div');
                    desc.className = 'task-description';
                    desc.textContent = escapeHtml(task.description);
                    card.appendChild(desc);
                }
                
                var headers = document.createElement('div');
                headers.className = 'executor-header';
                headers.innerHTML = '<span>ФИО</span><span>Кол-во</span><span>Статус</span><span></span>';
                card.appendChild(headers);
                
                var executorList = document.createElement('div');
                executorList.className = 'executor-list';
                executorList.id = 'executors-' + task.id;
                
                if (task.executors && task.executors.length > 0) {
                    task.executors.forEach(function(executor) {
                        executorList.appendChild(createExecutorItem(task, executor));
                    });
                } else {
                    var noExecutors = document.createElement('p');
                    noExecutors.style.cssText = 'color: #a0a0a0; padding: 8px; text-align: center; font-style: italic; font-size: 12px;';
                    noExecutors.textContent = 'Нет исполнителей';
                    executorList.appendChild(noExecutors);
                }
                card.appendChild(executorList);
                
                var actionContainer = document.createElement('div');
                actionContainer.className = 'action-container';
                if (task.status !== 'completed') {
                    var addBtn = document.createElement('button');
                    addBtn.className = 'btn-add-executor';
                    addBtn.textContent = '+ Добавить исполнителя';
                    addBtn.onclick = function() { showAddExecutorForm(task, actionContainer); };
                    actionContainer.appendChild(addBtn);
                }
                card.appendChild(actionContainer);
                
                var readyBtn = document.createElement('button');
                readyBtn.className = 'btn-ready';
                readyBtn.textContent = '✅ ГОТОВО';
                readyBtn.disabled = task.status === 'completed';
                readyBtn.onclick = function() { completeTask(task.id); };
                card.appendChild(readyBtn);
                
                return card;
            }
            
            function createExecutorItem(task, executor) {
                var div = document.createElement('div');
                div.className = 'executor-item';
                div.dataset.executorId = executor.id;
                var isShiftEnded = executor.status === 'shift_ended';
                
                var nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.className = 'executor-name';
                nameInput.value = escapeHtml(executor.name);
                nameInput.placeholder = 'ФИО';
                nameInput.disabled = task.status === 'completed' || isShiftEnded;
                div.appendChild(nameInput);
                
                var quantityInput = document.createElement('input');
                quantityInput.type = 'number';
                quantityInput.className = 'executor-quantity';
                quantityInput.value = executor.quantity || 0;
                quantityInput.min = 0;
                quantityInput.disabled = task.status === 'completed' || isShiftEnded;
                quantityInput.onchange = function(e) {
                    taskManager.updateExecutorQuantity(task.id, executor.id, parseInt(e.target.value) || 0);
                };
                div.appendChild(quantityInput);
                
                var workBtn = document.createElement('button');
                workBtn.className = 'btn-work ' + (executor.status === 'in_progress' ? 'active' : '');
                workBtn.textContent = executor.status === 'in_progress' ? 'В РАБОТЕ' : (isShiftEnded ? 'СМЕНА ЗАКРЫТА' : 'НАЧАТЬ');
                workBtn.disabled = task.status === 'completed' || isShiftEnded;
                workBtn.onclick = function() {
                    if (isShiftEnded) return;
                    var newStatus = workBtn.classList.contains('active') ? 'pending' : 'in_progress';
                    taskManager.updateExecutorStatus(task.id, executor.id, newStatus);
                    workBtn.classList.toggle('active');
                    workBtn.textContent = newStatus === 'in_progress' ? 'В РАБОТЕ' : 'НАЧАТЬ';
                };
                div.appendChild(workBtn);
                
                var endShiftBtn = document.createElement('button');
                endShiftBtn.className = 'btn-end-shift';
                endShiftBtn.innerHTML = isShiftEnded ? '✅ СМЕНА ЗАКРЫТА' : '🕒 ЗАКРЫТЬ';
                endShiftBtn.disabled = task.status === 'completed' || isShiftEnded;
                endShiftBtn.onclick = function() {
                    if (confirm('Закрыть смену для ' + executor.name + '?')) {
                        taskManager.updateExecutorStatus(task.id, executor.id, 'shift_ended');
                        var executorList = document.getElementById('executors-' + task.id);
                        if (executorList) {
                            executorList.innerHTML = '';
                            var updatedTask = taskManager.tasks.find(t => t.id === task.id);
                            if (updatedTask && updatedTask.executors) {
                                updatedTask.executors.forEach(exec => {
                                    executorList.appendChild(createExecutorItem(updatedTask, exec));
                                });
                            }
                        }
                    }
                };
                div.appendChild(endShiftBtn);
                
                var removeBtn = document.createElement('button');
                removeBtn.className = 'btn btn-danger btn-sm';
                removeBtn.innerHTML = '✕';
                removeBtn.disabled = task.status === 'completed' || isShiftEnded;
                removeBtn.onclick = function() {
                    if (confirm('Удалить этого исполнителя?')) taskManager.removeExecutor(task.id, executor.id);
                };
                div.appendChild(removeBtn);
                
                return div;
            }
            
            function showAddExecutorForm(task, actionContainer) {
                var oldForm = actionContainer.querySelector('.new-executor-form');
                if (oldForm) oldForm.remove();
                
                var formDiv = document.createElement('div');
                formDiv.className = 'new-executor-form';
                var input = document.createElement('input');
                input.type = 'text';
                input.placeholder = 'ФИО исполнителя';
                var addBtn = document.createElement('button');
                addBtn.className = 'btn btn-success';
                addBtn.textContent = 'Добавить';
                addBtn.onclick = function() {
                    var name = input.value.trim();
                    if (!name) { alert('Введите ФИО'); return; }
                    if (taskManager.addExecutor(task.id, name)) {
                        formDiv.remove();
                        var executorList = document.getElementById('executors-' + task.id);
                        if (executorList) {
                            executorList.innerHTML = '';
                            var updatedTask = taskManager.tasks.find(t => t.id === task.id);
                            if (updatedTask && updatedTask.executors) {
                                updatedTask.executors.forEach(exec => {
                                    executorList.appendChild(createExecutorItem(updatedTask, exec));
                                });
                            }
                        }
                    } else { alert('Исполнитель уже существует'); }
                };
                var cancelBtn = document.createElement('button');
                cancelBtn.className = 'btn btn-danger';
                cancelBtn.textContent = 'Отмена';
                cancelBtn.onclick = function() { formDiv.remove(); };
                formDiv.appendChild(input);
                formDiv.appendChild(addBtn);
                formDiv.appendChild(cancelBtn);
                actionContainer.appendChild(formDiv);
            }
            
            window.completeTask = function(taskId) {
                var task = taskManager.tasks.find(t => t.id === taskId);
                if (!task) return;
                var totalAssigned = task.executors.reduce((sum, e) => sum + (e.quantity || 0), 0);
                if (confirm('Завершить задачу?\nОперация: ' + task.operation + '\nВыполнено: ' + totalAssigned + ' шт')) {
                    taskManager.completeTask(taskId);
                    var taskCard = document.querySelector('.task-card[data-task-id="' + taskId + '"]');
                    if (taskCard) {
                        var updatedTask = taskManager.tasks.find(t => t.id === taskId);
                        if (updatedTask) taskCard.parentNode.replaceChild(createTaskCard(updatedTask), taskCard);
                    }
                }
            };
            
            window.exportToExcel = function() {
                const tasks = taskManager.tasks;
                const dateStr = taskManager.formatDate(taskManager.currentDate);
                let csv = "Заказ,Изделие,Операция,Исполнитель,Количество,Статус\n";
                tasks.forEach(task => {
                    if (task.executors && task.executors.length > 0) {
                        task.executors.forEach(exec => {
                            csv += `"${task.orderNumber}","${task.product}","${task.operation}","${exec.name}",${exec.quantity || 0},"${exec.status}"\n`;
                        });
                    } else {
                        csv += `"${task.orderNumber}","${task.product}","${task.operation}","Нет",0,"${task.status}"\n`;
                    }
                });
                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `slesarniy_${dateStr}.csv`;
                link.click();
            };
        }
    </script>
</body>
</html>
