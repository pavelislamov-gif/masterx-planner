<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterX - Планировщик производства</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ========== ОСНОВНЫЕ СТИЛИ ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0c10;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ШАПКА */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px 25px;
            background: linear-gradient(135deg, #1a1e24 0%, #0f1217 100%);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid #2a2f38;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            height: 45px;
            width: auto;
            border-radius: 8px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
        }

        .logo-text .x-red {
            color: #ff3b3b;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(255,59,59,0.5);
        }

        /* КАРТОЧКА ЗАКАЗА */
        .order-card {
            background: #1a1e24;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #2a2f38;
            overflow: hidden;
            transition: all 0.3s;
        }

        .order-header {
            padding: 12px 20px;
            background: #232830;
            border-bottom: 1px solid #2a2f38;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .order-header h3 {
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            margin: 0;
        }

        .order-content {
            padding: 15px 20px;
            transition: all 0.2s;
        }

        .order-content.collapsed {
            display: none;
        }

        /* СТАТУСЫ ЗАКАЗА */
        .order-header.status-green {
            background: linear-gradient(135deg, #1a3a1a, #0f2a0f);
            border-left: 4px solid #2ecc71;
        }
        .order-header.status-orange {
            background: linear-gradient(135deg, #3a2a1a, #2a1f0f);
            border-left: 4px solid #ff9800;
        }
        .order-header.status-gray {
            background: linear-gradient(135deg, #2a2a2a, #1f1f1f);
            border-left: 4px solid #6c757d;
        }

        /* КАРТОЧКА ИЗДЕЛИЯ */
        .item-card {
            background: #15191f;
            border: 1px solid #2a2f38;
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .item-header {
            padding: 10px 15px;
            background: #1e232b;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #ff3b3b;
        }

        .item-content {
            padding: 15px;
            display: none;
        }

        .item-content:not(.collapsed) {
            display: block;
        }

        .product-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
            padding: 12px;
            background: #0f1217;
            border-radius: 8px;
        }

        .product-info-grid div {
            font-size: 13px;
        }

        .product-info-grid strong {
            color: #ff3b3b;
        }

        .components-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .component-tag {
            background: #1e232b;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #2a2f38;
        }

        /* СТРОКА УЧАСТКА */
        .site-row {
            background: #1a1e24;
            border: 1px solid #2a2f38;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .site-header {
            padding: 12px 15px;
            background: #232830;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .site-name {
            font-weight: 600;
            color: #fff;
            font-size: 14px;
        }

        /* КОНТЕЙНЕР С ОПЕРАЦИЯМИ */
        .operations-container {
            padding: 12px 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            border-top: 1px solid #2a2f38;
        }

        /* КАЖДАЯ ОПЕРАЦИЯ */
        .operation-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 70px;
        }

        /* КНОПКА + / - */
        .op-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .op-btn.add {
            background: #2ecc71;
            color: white;
            box-shadow: 0 2px 8px rgba(46, 204, 113, 0.3);
        }

        .op-btn.add:hover {
            background: #27ae60;
            transform: scale(1.05);
        }

        .op-btn.remove {
            background: #e74c3c;
            color: white;
            box-shadow: 0 2px 8px rgba(231, 76, 60, 0.3);
        }

        .op-btn.remove:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        /* КВАДРАТИК */
        .square {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #1e232b;
            border: 2px solid #3a404b;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .square.orange {
            background-color: #ff9800;
            border-color: #e65100;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.3);
        }

        .square.green {
            background-color: #4caf50;
            border-color: #2e7d32;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }

        /* ПОДСКАЗКА ПРИ НАВЕДЕНИИ НА КВАДРАТИК */
        .square:hover::after {
            content: attr(title);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #232830;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            white-space: nowrap;
            z-index: 1000;
            margin-bottom: 8px;
            border: 1px solid #2a2f38;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        .operation-name {
            font-size: 10px;
            text-align: center;
            color: #a0a0a0;
            max-width: 70px;
            word-break: break-word;
            line-height: 1.3;
        }

        .no-operations {
            color: #a0a0a0;
            font-size: 12px;
            padding: 8px 15px;
            text-align: center;
        }

        /* ФИЛЬТРЫ И СТАТИСТИКА */
        .filter-section {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            padding: 8px 15px;
            background: #1a1e24;
            border: 1px solid #2a2f38;
            border-radius: 8px;
            width: 250px;
            color: #e0e0e0;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 16px;
            border: 1px solid #2a2f38;
            border-radius: 20px;
            background: #1a1e24;
            color: #a0a0a0;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: #ff3b3b;
            color: white;
            border-color: #ff3b3b;
        }

        .filter-btn:hover:not(.active) {
            background: #2a2f38;
            color: white;
        }

        .order-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            border-radius: 12px;
        }

        .stat-item {
            flex: 1;
            text-align: center;
            padding: 12px;
            background: #15191f;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sites-navigation {
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .sites-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .site-link {
            padding: 6px 18px;
            background: #1a1e24;
            border: 1px solid #2a2f38;
            border-radius: 20px;
            text-decoration: none;
            color: #e0e0e0;
            font-size: 13px;
        }

        .site-link:hover {
            background: #ff3b3b;
            color: white;
        }

        .theme-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-switch {
            display: inline-block;
            height: 24px;
            position: relative;
            width: 44px;
        }

        .theme-switch input {
            display: none;
        }

        .theme-switch .slider {
            background-color: #2a2f38;
            bottom: 0;
            cursor: pointer;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            transition: .3s;
            border-radius: 34px;
        }

        .theme-switch .slider:before {
            background-color: #ff3b3b;
            bottom: 3px;
            content: "";
            height: 18px;
            left: 3px;
            position: absolute;
            transition: .3s;
            width: 18px;
            border-radius: 50%;
        }

        .theme-switch input:checked + .slider {
            background-color: #ff9800;
        }

        .theme-switch input:checked + .slider:before {
            transform: translateX(20px);
            background-color: #fff;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            background: #1a1e24;
            border-radius: 12px;
            color: #a0a0a0;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            margin: 2% auto;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            border-radius: 12px;
            border: 1px solid #2a2f38;
        }

        .close {
            float: right;
            font-size: 28px;
            cursor: pointer;
            color: #a0a0a0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #a0a0a0;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 6px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="images/logo.png" alt="MasterX Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="logo-text">Master<span class="x-red">X</span></div>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="btn btn-primary" onclick="openOrderModal()">+ Создать заказ</button>
                <div class="theme-switch-wrapper">
                    <span>🌙</span>
                    <label class="theme-switch">
                        <input type="checkbox" id="themeToggle">
                        <span class="slider"></span>
                    </label>
                    <span>☀️</span>
                </div>
            </div>
        </header>

        <div class="sites-navigation">
            <h3>🏭 Производственные участки:</h3>
            <div class="sites-links">
                <a href="sites/tokarniy.html" class="site-link">Токарный</a>
                <a href="sites/slesarniy.html" class="site-link">Слесарный</a>
                <a href="sites/frezerniy.html" class="site-link">Фрезерный</a>
                <a href="sites/lazerno-gibochniy.html" class="site-link">Лазерно-гибочный</a>
                <a href="sites/polimerniy.html" class="site-link">Полимерный</a>
            </div>
        </div>

        <div class="order-stats">
            <div class="stat-item"><div class="stat-value" id="totalOrders">0</div><div>Всего заказов</div></div>
            <div class="stat-item"><div class="stat-value" id="totalItems">0</div><div>Изделий</div></div>
            <div class="stat-item"><div class="stat-value" id="activeTasks">0</div><div>В работе</div></div>
            <div class="stat-item"><div class="stat-value" id="completedTasks">0</div><div>Выполнено</div></div>
        </div>

        <div class="filter-section">
            <input type="text" class="search-box" placeholder="🔍 Поиск по названию заказа..." id="searchInput">
            <div class="filter-buttons" id="filterButtons">
                <button class="filter-btn active" data-filter="all">📋 Все</button>
                <button class="filter-btn" data-filter="active">⚡ В работе</button>
                <button class="filter-btn" data-filter="completed">✅ Завершённые</button>
                <button class="filter-btn" data-filter="inactive">⏳ Неактивные</button>
            </div>
            <button class="btn btn-primary" onclick="exportOrders()">📥 Экспорт</button>
            <button class="btn btn-success" onclick="importOrders()">📤 Импорт</button>
        </div>

        <div id="ordersList"></div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО СОЗДАНИЯ ЗАКАЗА -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeOrderModal()">&times;</span>
            <h2>📁 Создание заказа</h2>
            <div class="form-group">
                <label>Название заказа:</label>
                <input type="text" id="orderNameInput" placeholder="Например: Санкт-Петербург КИ000004020">
            </div>
            <div id="tempItemsPreview" style="margin: 15px 0; padding: 10px; background: #15191f; border-radius: 8px; min-height: 100px;">
                <p style="color: #a0a0a0;">Добавленные изделия появятся здесь</p>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn btn-danger" onclick="closeOrderModal()">Отмена</button>
                <button class="btn btn-success" onclick="createSimpleOrder()">Создать заказ</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/task-operations.js"></script>
    <script src="js/materials-report.js"></script>
    <script src="js/task-manager.js"></script>

    <script>
        // ============== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==============
        let productsList = [];
        let componentsData = {};
        let currentFilter = 'all';
        let tempItemsList = [];

        // ============== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==============
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ============== ПОЛУЧЕНИЕ ОПЕРАЦИЙ ДЛЯ УЧАСТКА ==============
        function getOperationsForProduct(productName, siteKey) {
            const ops = window.TASK_OPERATIONS || {};
            const siteOps = ops[siteKey] || {};
            if (siteOps[productName]) return siteOps[productName];
            for (let key in siteOps) {
                if (productName.includes(key)) return siteOps[key];
            }
            return [];
        }

        // ============== ПРОВЕРКА, ДОБАВЛЕНА ЛИ ОПЕРАЦИЯ ==============
        function isOperationAdded(orderId, siteKey, itemIndex, opIndex) {
            const orders = loadOrdersFromStorage();
            const order = orders.find(o => o.id == orderId);
            if (!order) return false;
            
            const dateStr = order.date;
            const storageKey = `tasks_${siteKey}_${dateStr}`;
            const taskId = `${order.id}_${siteKey}_${itemIndex}_${opIndex}`;
            
            try {
                const tasks = JSON.parse(localStorage.getItem(storageKey) || '[]');
                return tasks.some(t => t.id === taskId);
            } catch(e) { return false; }
        }

        // ============== ПОЛУЧЕНИЕ СТАТУСА ЗАКАЗА ==============
        function getOrderStatus(order) {
            const sites = ['tokarniy', 'slesarniy', 'frezerniy', 'lazerno', 'polimerniy'];
            const dateStr = order.date;
            let totalTasks = 0;
            let completedTasks = 0;
            
            sites.forEach(site => {
                const storageKey = `tasks_${site}_${dateStr}`;
                try {
                    const tasks = JSON.parse(localStorage.getItem(storageKey) || '[]');
                    const orderTasks = tasks.filter(t => t.orderId == order.id);
                    totalTasks += orderTasks.length;
                    completedTasks += orderTasks.filter(t => t.status === 'completed').length;
                } catch(e) {}
            });
            
            if (totalTasks === 0) return 'gray';
            if (completedTasks === totalTasks && totalTasks > 0) return 'green';
            return 'orange';
        }

        // ============== ДОБАВЛЕНИЕ / УДАЛЕНИЕ ОТДЕЛЬНОЙ ОПЕРАЦИИ ==============
        function toggleOperation(orderId, siteKey, itemIndex, opIndex, operationName, button, square) {
            const orders = loadOrdersFromStorage();
            const order = orders.find(o => o.id == orderId);
            if (!order) { alert('Заказ не найден'); return; }

            const dateStr = order.date;
            const storageKey = `tasks_${siteKey}_${dateStr}`;
            const taskId = `${order.id}_${siteKey}_${itemIndex}_${opIndex}`;
            
            let existingTasks = [];
            try {
                existingTasks = JSON.parse(localStorage.getItem(storageKey) || '[]');
            } catch(e) { console.error(e); }
            
            const taskExists = existingTasks.some(t => t.id === taskId);
            
            if (taskExists) {
                // УДАЛЕНИЕ
                if (confirm(`Удалить операцию "${operationName}" с участка ${getSiteName(siteKey)}?`)) {
                    const filteredTasks = existingTasks.filter(t => t.id !== taskId);
                    localStorage.setItem(storageKey, JSON.stringify(filteredTasks));
                    
                    button.classList.remove('remove');
                    button.classList.add('add');
                    button.textContent = '+';
                    square.classList.remove('orange');
                    
                    alert(`✅ Операция "${operationName}" удалена`);
                }
            } else {
                // ДОБАВЛЕНИЕ
                const item = order.items[itemIndex];
                const newTask = {
                    id: taskId,
                    orderId: order.id,
                    orderNumber: order.number,
                    product: item.product,
                    size: item.size?.name || 'Стандартный',
                    totalQuantity: item.size?.quantity || 1,
                    completedQuantity: 0,
                    operation: operationName,
                    index: opIndex,
                    status: 'pending',
                    executors: [],
                    date: dateStr,
                    isExtra: false
                };
                
                existingTasks.push(newTask);
                localStorage.setItem(storageKey, JSON.stringify(existingTasks));
                
                button.classList.remove('add');
                button.classList.add('remove');
                button.textContent = '−';
                square.classList.add('orange');
                
                alert(`✅ Операция "${operationName}" добавлена`);
            }
            
            renderOrdersList();
            updateStatistics();
        }

        function getSiteName(siteKey) {
            const names = { 'tokarniy': 'Токарный', 'slesarniy': 'Слесарный', 'frezerniy': 'Фрезерный', 'lazerno': 'Лазерно-гибочный', 'polimerniy': 'Полимерный' };
            return names[siteKey] || siteKey;
        }

        // ============== ОТОБРАЖЕНИЕ СПИСКА ЗАКАЗОВ ==============
        function renderOrdersList() {
            const ordersList = document.getElementById('ordersList');
            if (!ordersList) return;

            const orders = loadOrdersFromStorage() || [];
            const searchText = document.getElementById('searchInput')?.value.toLowerCase() || '';

            let filteredOrders = orders.filter(order => {
                if (!order.orderName.toLowerCase().includes(searchText)) return false;
                const orderStatus = getOrderStatus(order);
                if (currentFilter === 'active') return orderStatus === 'orange';
                if (currentFilter === 'completed') return orderStatus === 'green';
                if (currentFilter === 'inactive') return orderStatus === 'gray';
                return true;
            });

            ordersList.innerHTML = '';

            if (filteredOrders.length === 0) {
                ordersList.innerHTML = `<div class="empty-state">📭 Нет заказов</div>`;
                return;
            }

            filteredOrders.forEach(order => {
                const orderStatus = getOrderStatus(order);
                const statusClass = orderStatus === 'green' ? 'status-green' : (orderStatus === 'orange' ? 'status-orange' : 'status-gray');
                const statusText = orderStatus === 'green' ? '✅ Завершён' : (orderStatus === 'orange' ? '⚡ В работе' : '⏳ Не активен');
                
                const card = document.createElement('div');
                card.className = 'order-card';
                card.dataset.orderId = order.id;

                const header = document.createElement('div');
                header.className = `order-header ${statusClass}`;
                header.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                        <div>
                            <h3>📁 ${escapeHtml(order.orderName)}</h3>
                            <div style="font-size: 12px; color: #a0a0a0; margin-top: 5px;">
                                Изделий: ${order.items.length} | №${order.number} | ${statusText}
                            </div>
                        </div>
                        <div>
                            <button class="btn btn-info" onclick="event.stopPropagation(); alert('Отчет в разработке')">📊 Материалы</button>
                            <button class="btn btn-danger" onclick="event.stopPropagation(); deleteOrder(${order.id})">🗑️ Удалить</button>
                        </div>
                    </div>
                `;

                const content = document.createElement('div');
                content.className = 'order-content collapsed';

                // Отображаем все изделия в заказе
                order.items.forEach((item, itemIndex) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'item-card';
                    
                    const itemHeader = document.createElement('div');
                    itemHeader.className = 'item-header';
                    itemHeader.innerHTML = `<span>📦 ${escapeHtml(item.product)}</span><span>▼</span>`;
                    
                    const itemContent = document.createElement('div');
                    itemContent.className = 'item-content collapsed';
                    
                    let bracketsHtml = item.brackets?.map(b => `${b.type}: ${b.quantity}шт`).join(', ') || 'нет';
                    let lyresHtml = item.lyres?.map(l => `${l.type}: ${l.quantity}шт`).join(', ') || 'нет';
                    let profilesHtml = item.profiles?.map(p => `${p.name}: ${p.lengthMeters}м`).join(', ') || '';
                    
                    // Получаем комплектующие для изделия из componentsData
                    const comps = componentsData[item.product] || [];
                    let compsHtml = comps.map(c => `<span class="component-tag">${escapeHtml(c.name)}: по норме</span>`).join('');
                    
                    itemContent.innerHTML = `
                        <div class="product-info-grid">
                            <div><strong>📏 Размер:</strong> ${escapeHtml(item.size?.name)} x ${item.size?.quantity} шт</div>
                            <div><strong>🔧 Кронштейны:</strong> ${bracketsHtml}</div>
                            <div><strong>🎸 Лиры:</strong> ${lyresHtml}</div>
                            ${profilesHtml ? `<div><strong>📐 Профили:</strong> ${profilesHtml}</div>` : ''}
                            <div><strong>🎨 RAL:</strong> ${item.ral || '-'} / ${item.texture || '-'}</div>
                        </div>
                        ${compsHtml ? `<div class="components-list">🔩 Комплектующие: ${compsHtml}</div>` : ''}
                    `;
                    
                    itemHeader.onclick = () => {
                        const isCollapsed = itemContent.classList.contains('collapsed');
                        itemContent.classList.toggle('collapsed');
                        itemHeader.querySelector('span:last-child').textContent = isCollapsed ? '▲' : '▼';
                    };
                    
                    itemDiv.appendChild(itemHeader);
                    itemDiv.appendChild(itemContent);
                    content.appendChild(itemDiv);
                });
                
                // Добавляем блоки участков с операциями
                const sites = [
                    { key: 'tokarniy', name: '🔧 Токарный' },
                    { key: 'slesarniy', name: '🔨 Слесарный' },
                    { key: 'frezerniy', name: '⚙️ Фрезерный' },
                    { key: 'lazerno', name: '✨ Лазерно-гибочный' },
                    { key: 'polimerniy', name: '🧪 Полимерный' }
                ];
                
                sites.forEach(site => {
                    const siteRow = document.createElement('div');
                    siteRow.className = 'site-row';
                    
                    siteRow.innerHTML = `
                        <div class="site-header">
                            <span class="site-name">${site.name}</span>
                        </div>
                        <div class="operations-container" id="ops-${order.id}-${site.key}">
                        </div>
                    `;
                    
                    const opsContainer = siteRow.querySelector(`.operations-container`);
                    let hasAnyOperations = false;
                    
                    order.items.forEach((item, itemIndex) => {
                        const operations = getOperationsForProduct(item.product, site.key);
                        
                        operations.forEach((op, opIndex) => {
                            hasAnyOperations = true;
                            const operationName = typeof op === 'string' ? op : op.name;
                            const isAdded = isOperationAdded(order.id, site.key, itemIndex, opIndex);
                            
                            const opItem = document.createElement('div');
                            opItem.className = 'operation-item';
                            opItem.innerHTML = `
                                <button class="op-btn ${isAdded ? 'remove' : 'add'}" 
                                        data-order-id="${order.id}"
                                        data-site="${site.key}"
                                        data-item-index="${itemIndex}"
                                        data-op-index="${opIndex}"
                                        data-op-name="${escapeHtml(operationName)}">
                                    ${isAdded ? '−' : '+'}
                                </button>
                                <div class="square ${isAdded ? 'orange' : ''}" title="${escapeHtml(operationName)}"></div>
                                <div class="operation-name">${escapeHtml(operationName)}</div>
                            `;
                            
                            const addBtn = opItem.querySelector('.op-btn');
                            const square = opItem.querySelector('.square');
                            addBtn.onclick = (e) => {
                                e.stopPropagation();
                                toggleOperation(
                                    order.id, 
                                    site.key, 
                                    itemIndex, 
                                    opIndex, 
                                    operationName, 
                                    addBtn,
                                    square
                                );
                            };
                            
                            opsContainer.appendChild(opItem);
                        });
                    });
                    
                    if (!hasAnyOperations) {
                        opsContainer.innerHTML = '<div class="no-operations">Нет операций для этого участка</div>';
                    }
                    
                    content.appendChild(siteRow);
                });
                
                header.onclick = (e) => {
                    if (e.target.tagName === 'BUTTON') return;
                    const isCollapsed = content.classList.contains('collapsed');
                    content.classList.toggle('collapsed');
                };
                
                card.appendChild(header);
                card.appendChild(content);
                ordersList.appendChild(card);
            });
        }

        // ============== СТАТИСТИКА ==============
        function updateStatistics() {
            const orders = loadOrdersFromStorage() || [];
            document.getElementById('totalOrders').textContent = orders.length;
            const totalItems = orders.reduce((sum, o) => sum + o.items.length, 0);
            document.getElementById('totalItems').textContent = totalItems;
            
            let activeTasks = 0, completedTasks = 0;
            const sites = ['tokarniy', 'slesarniy', 'frezerniy', 'lazerno', 'polimerniy'];
            const dates = [new Date().toISOString().split('T')[0]];
            
            sites.forEach(site => {
                dates.forEach(date => {
                    const key = `tasks_${site}_${date}`;
                    try {
                        const tasks = JSON.parse(localStorage.getItem(key) || '[]');
                        activeTasks += tasks.filter(t => t.status === 'pending' || t.status === 'in_progress').length;
                        completedTasks += tasks.filter(t => t.status === 'completed').length;
                    } catch(e) {}
                });
            });
            
            document.getElementById('activeTasks').textContent = activeTasks;
            document.getElementById('completedTasks').textContent = completedTasks;
        }

        // ============== УДАЛЕНИЕ ЗАКАЗА ==============
        function deleteOrder(orderId) {
            if (!confirm('Удалить заказ? Все задачи на участках также будут удалены.')) return;
            let orders = loadOrdersFromStorage();
            orders = orders.filter(o => o.id !== orderId);
            saveOrdersToStorage(orders);
            
            const sites = ['tokarniy', 'slesarniy', 'frezerniy', 'lazerno', 'polimerniy'];
            const dates = [];
            for (let i = -30; i <= 30; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                dates.push(d.toISOString().split('T')[0]);
            }
            sites.forEach(site => {
                dates.forEach(date => {
                    const key = `tasks_${site}_${date}`;
                    const tasks = localStorage.getItem(key);
                    if (tasks) {
                        let tasksArr = JSON.parse(tasks);
                        tasksArr = tasksArr.filter(t => t.orderId !== orderId);
                        localStorage.setItem(key, JSON.stringify(tasksArr));
                    }
                });
            });
            
            renderOrdersList();
            updateStatistics();
            alert('✅ Заказ удалён');
        }

        // ============== ЭКСПОРТ/ИМПОРТ ==============
        function exportOrders() {
            const orders = loadOrdersFromStorage();
            if (orders.length === 0) { alert('Нет заказов'); return; }
            const data = JSON.stringify({ exportDate: new Date().toISOString(), orders }, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `masterx_export_${new Date().toISOString().slice(0,10)}.json`;
            link.click();
        }

        function importOrders() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const text = await file.text();
                const data = JSON.parse(text);
                if (!data.orders) { alert('Неверный формат'); return; }
                let orders = loadOrdersFromStorage();
                data.orders.forEach(imported => {
                    const existingIndex = orders.findIndex(o => o.id === imported.id);
                    if (existingIndex !== -1) orders[existingIndex] = imported;
                    else orders.push(imported);
                });
                saveOrdersToStorage(orders);
                renderOrdersList();
                updateStatistics();
                alert('Импорт завершён');
            };
            input.click();
        }

        // ============== СОЗДАНИЕ ПРОСТОГО ЗАКАЗА ==============
        function createSimpleOrder() {
            const orderName = document.getElementById('orderNameInput').value.trim();
            if (!orderName) { alert('Введите название заказа'); return; }
            
            const orders = loadOrdersFromStorage();
            const newOrder = {
                id: Date.now(),
                orderName: orderName,
                date: new Date().toISOString().split('T')[0],
                number: `З-${Date.now().toString().slice(-8)}`,
                items: [
                    {
                        product: 'XGRAY v.1',
                        size: { name: '216', quantity: 5 },
                        brackets: [{ type: 'PU-10', quantity: 2 }],
                        lyres: [{ type: '(P-серия) лира', quantity: 1 }],
                        ral: 'RAL 9003',
                        texture: 'матовая'
                    },
                    {
                        product: 'XLUMO',
                        size: { name: 'XLUMO-3', quantity: 2 },
                        brackets: [{ type: 'PU-10', quantity: 2 }],
                        lyres: [{ type: '(P-серия) лира', quantity: 1 }],
                        profiles: [{ name: 'Профиль НПС 2967 (XLUMO)', lengthMeters: 0.075 }],
                        ral: 'RAL 9005',
                        texture: 'глянцевая'
                    }
                ],
                status: 'active',
                tasks: {},
                extraTasks: {}
            };
            
            orders.push(newOrder);
            saveOrdersToStorage(orders);
            closeOrderModal();
            renderOrdersList();
            updateStatistics();
            alert(`✅ Заказ "${orderName}" создан!`);
        }

        function openOrderModal() {
            document.getElementById('orderNameInput').value = '';
            document.getElementById('orderModal').style.display = 'block';
        }
        
        function closeOrderModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        // ============== НАСТРОЙКА ФИЛЬТРОВ ==============
        function setupFilters() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderOrdersList();
                });
            });
        }

        // ============== ТЕМА ==============
        function initThemeToggle() {
            const toggle = document.getElementById('themeToggle');
            if (!toggle) return;
            const saved = localStorage.getItem('masterx_theme');
            if (saved === 'light') {
                document.body.classList.add('light-theme');
                toggle.checked = true;
            }
            toggle.addEventListener('change', () => {
                document.body.classList.toggle('light-theme');
                localStorage.setItem('masterx_theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
            });
        }

        // ============== ИНИЦИАЛИЗАЦИЯ ==============
        async function init() {
            productsList = await loadProducts() || [];
            await loadComponents();
            componentsData = window.componentsData || {};
            initThemeToggle();
            setupFilters();
            renderOrdersList();
            updateStatistics();
            
            document.getElementById('searchInput')?.addEventListener('input', () => renderOrdersList());
            window.addEventListener('storage', () => { renderOrdersList(); updateStatistics(); });
        }
        
        // Глобальные функции
        window.toggleOperation = toggleOperation;
        window.deleteOrder = deleteOrder;
        window.exportOrders = exportOrders;
        window.importOrders = importOrders;
        window.openOrderModal = openOrderModal;
        window.closeOrderModal = closeOrderModal;
        window.createSimpleOrder = createSimpleOrder;
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
