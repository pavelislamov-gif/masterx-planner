<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterX - Планировщик производства</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ========== СТИЛИ ========== */
        .order-content {
            transition: opacity 0.2s ease;
        }

        .date-filter-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            border-radius: 12px;
            border: 1px solid #2a2f38;
            flex-wrap: wrap;
            gap: 15px;
        }

        .date-filter-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .current-date-display {
            color: #ff3b3b;
            font-weight: 500;
            background: #1a1e24;
            padding: 8px 18px;
            border-radius: 25px;
            border: 1px solid #2a2f38;
            font-size: 14px;
        }

        .group-modal-content {
            max-width: 1200px;
            width: 95%;
        }

        .group-modal-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .add-item-panel {
            background: #15191f;
            border: 1px solid #2a2f38;
            border-radius: 12px;
            padding: 20px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .add-item-panel h3 {
            color: #ff3b3b;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2f38;
        }

        .items-list-panel {
            background: #15191f;
            border: 1px solid #2a2f38;
            border-radius: 12px;
            padding: 20px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .items-list-panel h3 {
            color: #ff3b3b;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2f38;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .items-list-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item-card {
            background: #1a1e24;
            border: 1px solid #2a2f38;
            border-radius: 8px;
            padding: 12px;
        }

        .item-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #2a2f38;
        }

        .item-card-title {
            font-weight: 600;
            color: #ff3b3b;
            font-size: 16px;
        }

        .item-card-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            font-size: 12px;
        }

        .item-card-content div {
            background: #15191f;
            padding: 6px 8px;
            border-radius: 4px;
        }

        .remove-item-btn {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 12px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #a0a0a0;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 10px;
            background: #1e232b;
            border: 1px solid #2a2f38;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
        }

        .size-quantity-row {
            display: flex;
            gap: 8px;
        }

        .size-quantity-row select {
            flex: 2;
        }

        .size-quantity-row input {
            flex: 1;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #2a2f38;
            color: #a0a0a0;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 5px;
        }

        .position-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            background: #1e232b;
            padding: 6px 10px;
            border-radius: 4px;
        }

        .position-item select {
            flex: 2;
            padding: 4px;
            font-size: 12px;
        }

        .position-item input {
            width: 70px;
            padding: 4px;
            text-align: center;
        }

        .position-item .remove-position {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 10px;
        }

        .components-section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #2a2f38;
        }

        .components-title {
            color: #ff3b3b;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .component-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            margin-bottom: 5px;
            background: #1e232b;
            border-radius: 4px;
        }

        .component-name {
            font-size: 12px;
            flex: 1;
        }

        .component-qty-input {
            width: 70px;
            padding: 4px;
            background: #15191f;
            border: 1px solid #2a2f38;
            border-radius: 4px;
            color: #fff;
            text-align: center;
        }

        .empty-items {
            text-align: center;
            padding: 40px;
            color: #a0a0a0;
        }

        .form-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .order-header.status-green {
            background: linear-gradient(135deg, #1a3a1a, #0f2a0f);
            border-left: 4px solid #2ecc71;
        }

        .order-header.status-orange {
            background: linear-gradient(135deg, #3a2a1a, #2a1f0f);
            border-left: 4px solid #ff9800;
        }

        .order-header.status-gray {
            background: linear-gradient(135deg, #2a2a2a, #1f1f1f);
            border-left: 4px solid #6c757d;
        }

        .order-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            border-radius: 12px;
            border: 1px solid #2a2f38;
        }

        .stat-item {
            flex: 1;
            text-align: center;
            padding: 15px;
            background: #15191f;
            border-radius: 8px;
            border: 1px solid #2a2f38;
            position: relative;
        }

        .stat-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #ff3b3b, #ff9f1c);
            border-radius: 4px 0 0 4px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-section {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-box {
            padding: 10px 15px;
            background: #1a1e24;
            border: 1px solid #2a2f38;
            border-radius: 8px;
            width: 300px;
            font-size: 14px;
            color: #e0e0e0;
        }

        .sites-navigation {
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #2a2f38;
        }

        .sites-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .site-link {
            padding: 8px 20px;
            background: #1a1e24;
            border: 1px solid #2a2f38;
            border-radius: 8px;
            text-decoration: none;
            color: #e0e0e0;
            transition: all 0.3s;
            font-size: 14px;
        }

        .site-link:hover {
            background: linear-gradient(135deg, #ff3b3b, #cc2e2e);
            color: white;
        }

        .theme-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-switch {
            display: inline-block;
            height: 24px;
            position: relative;
            width: 44px;
        }

        .theme-switch input {
            display: none;
        }

        .theme-switch .slider {
            background-color: #2a2f38;
            bottom: 0;
            cursor: pointer;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            transition: .3s;
            border-radius: 34px;
        }

        .theme-switch .slider:before {
            background-color: #ff3b3b;
            bottom: 3px;
            content: "";
            height: 18px;
            left: 3px;
            position: absolute;
            transition: .3s;
            width: 18px;
            border-radius: 50%;
        }

        .theme-switch input:checked + .slider {
            background-color: #ff9800;
        }

        .theme-switch input:checked + .slider:before {
            transform: translateX(20px);
            background-color: #fff;
        }

        body.light-theme {
            background-color: #f0f2f5 !important;
            color: #1e293b !important;
        }

        body.light-theme .order-card {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
        }

        body.light-theme .order-header {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9) !important;
        }

        .site-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #1a1e24;
            border-radius: 8px;
            border: 1px solid #2a2f38;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .squares {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
        }

        .operation-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 5px;
        }

        .op-toggle-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .square {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #1e232b;
            border: 2px solid #3a404b;
            transition: all 0.2s;
            cursor: pointer;
        }

        .square.orange {
            background-color: #ff9800;
            border-color: #e65100;
        }

        .operation-name-small {
            font-size: 10px;
            margin-top: 4px;
            color: #a0a0a0;
            text-align: center;
            max-width: 60px;
            word-break: break-word;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1e24, #0f1217);
            margin: 2% auto;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            border-radius: 12px;
            border: 1px solid #2a2f38;
        }

        .close {
            float: right;
            font-size: 28px;
            cursor: pointer;
            color: #a0a0a0;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            background: #1a1e24;
            border-radius: 12px;
            color: #a0a0a0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="images/logo.png" alt="MasterX Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="logo-text">Master<span class="x-red">X</span></div>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="btn btn-primary" id="createGroupBtn">+ Создать группу</button>
                <div class="theme-switch-wrapper">
                    <span>🌙</span>
                    <label class="theme-switch">
                        <input type="checkbox" id="themeToggle">
                        <span class="slider"></span>
                    </label>
                    <span>☀️</span>
                </div>
            </div>
        </header>

        <div class="sites-navigation">
            <h3>🏭 Производственные участки:</h3>
            <div class="sites-links">
                <a href="sites/tokarniy.html" class="site-link">Токарный</a>
                <a href="sites/slesarniy.html" class="site-link">Слесарный</a>
                <a href="sites/frezerniy.html" class="site-link">Фрезерный</a>
                <a href="sites/lazerno-gibochniy.html" class="site-link">Лазерно-гибочный</a>
                <a href="sites/polimerniy.html" class="site-link">Полимерный</a>
            </div>
        </div>

        <div class="date-filter-section">
            <div class="date-filter-buttons">
                <button class="btn btn-primary" id="prevDateBtn">← Вчера</button>
                <button class="btn btn-success" id="todayDateBtn">Сегодня</button>
                <button class="btn btn-primary" id="nextDateBtn">Завтра →</button>
            </div>
            <span id="currentFilterDate" class="current-date-display">Загрузка...</span>
        </div>

        <div class="order-stats">
            <div class="stat-item"><div class="stat-value" id="totalOrders">0</div><div class="stat-label">Всего групп</div></div>
            <div class="stat-item"><div class="stat-value" id="totalItems">0</div><div class="stat-label">Изделий</div></div>
            <div class="stat-item"><div class="stat-value" id="activeTasks">0</div><div class="stat-label">В работе</div></div>
            <div class="stat-item"><div class="stat-value" id="completedTasks">0</div><div class="stat-label">Выполнено</div></div>
        </div>

        <div class="filter-section">
            <input type="text" class="search-box" placeholder="🔍 Поиск..." id="searchInput">
            <select id="statusFilter" class="search-box" style="width: auto;">
                <option value="all">Все статусы</option>
                <option value="active">Активные</option>
                <option value="completed">Завершённые</option>
            </select>
            <button class="btn btn-primary" id="exportBtn">📥 Экспорт</button>
            <button class="btn btn-success" id="importBtn">📤 Импорт</button>
        </div>

        <div id="ordersList"></div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО СОЗДАНИЯ ГРУППЫ -->
    <div id="groupModal" class="modal">
        <div class="modal-content group-modal-content">
            <span class="close" onclick="closeGroupModal()">&times;</span>
            <h2>📁 Создание группы заказов</h2>
            <div class="form-group">
                <label>Название группы:</label>
                <input type="text" id="groupNameInput" placeholder="Например: Санкт-Петербург КИ000004020">
            </div>
            <div class="group-modal-layout">
                <div class="add-item-panel">
                    <h3>➕ Добавить изделие</h3>
                    <div class="form-group">
                        <label>Изделие:</label>
                        <select id="newItemProduct">
                            <option value="">Выберите изделие</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Размер:</label>
                        <div class="size-quantity-row">
                            <select id="newItemSize"><option value="">Сначала выберите изделие</option></select>
                            <input type="number" id="newItemSizeQuantity" placeholder="Кол-во" min="1" value="1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Кронштейны:</label>
                        <div id="bracketsListContainer"></div>
                        <button type="button" class="btn-outline" id="addBracketBtn">+ Добавить кронштейн</button>
                    </div>
                    <div class="form-group">
                        <label>Лиры:</label>
                        <div id="lyresListContainer"></div>
                        <button type="button" class="btn-outline" id="addLyreBtn">+ Добавить лиру</button>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="form-group"><label>RAL:</label><input type="text" id="newItemRal"></div>
                        <div class="form-group"><label>Текстура:</label><select id="newItemTexture"><option value="">Выберите</option><option value="матовая">Матовая</option><option value="глянцевая">Глянцевая</option></select></div>
                    </div>
                    <div id="newItemComponentsContainer" class="components-section" style="display: none;">
                        <div class="components-title">🔧 Комплектующие:</div>
                        <div id="newItemComponentsList"></div>
                    </div>
                    <button type="button" class="btn btn-success" id="addItemBtn" style="width: 100%; margin-top: 15px;">✅ Добавить изделие</button>
                </div>
                <div class="items-list-panel">
                    <h3>📦 Добавленные изделия <span id="itemsCount" style="font-size: 12px; color: #ff3b3b;">0</span></h3>
                    <div id="itemsListContainer" class="items-list-container"></div>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-danger" onclick="closeGroupModal()">Отмена</button>
                <button class="btn btn-success" id="createGroupOrderBtn">📋 Сформировать группу</button>
            </div>
        </div>
    </div>

    <div id="materialsModal" class="modal">
        <div class="modal-content" style="max-width: 900px;">
            <span class="close" onclick="closeMaterialsModal()">&times;</span>
            <div id="materialsReport"></div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/task-operations.js"></script>
    <script src="js/materials-report.js"></script>
    <script src="js/task-manager.js"></script>

    <script>
        // ============== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==============
        let tempItemsList = [];
        let productsList = [];
        let bracketsList = [];
        let lyresList = [];
        let componentsData = {};
        let tempBrackets = [];
        let tempLyres = [];
        let currentFilterDate = new Date().toISOString().split('T')[0];

        // ============== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==============
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function getSiteDisplayName(siteKey) {
            const names = { 'tokarniy': 'Токарный', 'slesarniy': 'Слесарный', 'frezerniy': 'Фрезерный', 'lazerno': 'Лазерно-гибочный', 'polimerniy': 'Полимерный' };
            return names[siteKey] || siteKey;
        }

        function getOperationNames(productName, siteKey) {
            const ops = window.TASK_OPERATIONS || {};
            const siteOps = ops[siteKey] || {};
            if (siteOps[productName]) return siteOps[productName];
            for (let key in siteOps) {
                if (productName.includes(key)) return siteOps[key];
            }
            return [];
        }

        // ============== ОСНОВНАЯ ФУНКЦИЯ - ДОБАВЛЕНИЕ/УДАЛЕНИЕ ОПЕРАЦИИ ==============
        window.toggleSiteOperation = function(button, orderId, siteKey, itemIndex, opIndex, operationName) {
            const orders = loadOrdersFromStorage();
            const order = orders.find(o => o.id == orderId);
            if (!order) { alert('Заказ не найден'); return; }

            const dateStr = order.date;
            const storageKey = `tasks_${siteKey}_${dateStr}`;
            const taskId = `${order.id}_${siteKey}_${itemIndex}_${opIndex}`;
            
            let existingTasks = [];
            try {
                existingTasks = JSON.parse(localStorage.getItem(storageKey) || '[]');
            } catch(e) { console.error(e); }
            
            const taskExists = existingTasks.some(t => t.id === taskId);
            const squareDiv = button.parentElement?.querySelector('.square');
            
            if (taskExists) {
                if (confirm(`Удалить операцию "${operationName}" с участка ${getSiteDisplayName(siteKey)}?`)) {
                    const filteredTasks = existingTasks.filter(t => t.id !== taskId);
                    localStorage.setItem(storageKey, JSON.stringify(filteredTasks));
                    
                    button.style.background = '#2ecc71';
                    button.textContent = '+';
                    button.classList.remove('remove');
                    
                    if (squareDiv) squareDiv.classList.remove('orange', 'green');
                    
                    if (order.tasks && order.tasks[taskId]) {
                        delete order.tasks[taskId];
                        const orderIndex = orders.findIndex(o => o.id == orderId);
                        orders[orderIndex] = order;
                        saveOrdersToStorage(orders);
                    }
                    alert(`✅ Операция "${operationName}" удалена`);
                }
            } else {
                const item = order.items[itemIndex];
                const newTask = {
                    id: taskId,
                    orderId: order.id,
                    orderNumber: order.number,
                    product: item.product,
                    size: item.size?.name || 'Стандартный',
                    totalQuantity: item.size?.quantity || 1,
                    completedQuantity: 0,
                    operation: operationName,
                    index: opIndex,
                    status: 'pending',
                    executors: [],
                    date: dateStr,
                    isExtra: false
                };
                
                existingTasks.push(newTask);
                localStorage.setItem(storageKey, JSON.stringify(existingTasks));
                
                button.style.background = '#e74c3c';
                button.textContent = '✕';
                button.classList.add('remove');
                
                if (squareDiv) squareDiv.classList.add('orange');
                
                if (!order.tasks) order.tasks = {};
                order.tasks[taskId] = 'orange';
                const orderIndex = orders.findIndex(o => o.id == orderId);
                orders[orderIndex] = order;
                saveOrdersToStorage(orders);
                
                alert(`✅ Операция "${operationName}" добавлена`);
            }
            
            renderOrdersList();
            updateStatistics();
        };

        // ============== СОЗДАНИЕ СТРОКИ УЧАСТКА С КНОПКАМИ ==============
        function createSiteRow(name, order, itemIndex, siteKey) {
            const item = order.items[itemIndex];
            if (!item) return '<div>Нет данных</div>';

            const operations = getOperationNames(item.product, siteKey);

            if (operations.length === 0) {
                return `
                    <div class="site-item">
                        <span class="site-name">${name}</span>
                        <div class="squares">
                            <div class="square red" title="Нет операций"></div>
                        </div>
                        <span>0/0</span>
                        <button class="btn btn-sm btn-primary" onclick="addExtraTask(${order.id}, '${siteKey}')">➕ Доп.</button>
                    </div>
                `;
            }

            let squaresHtml = '';
            let completedCount = 0;

            for (let i = 0; i < operations.length; i++) {
                const taskId = `${order.id}_${siteKey}_${itemIndex}_${i}`;
                const operationName = operations[i];
                let taskStatus = '';
                let isAdded = false;
                
                if (order.tasks && order.tasks[taskId]) {
                    taskStatus = order.tasks[taskId];
                    if (taskStatus === 'green') completedCount++;
                    if (taskStatus === 'orange' || taskStatus === 'green') isAdded = true;
                }
                
                if (!isAdded) {
                    try {
                        const dateStr = order.date;
                        const storageKey = `tasks_${siteKey}_${dateStr}`;
                        const tasks = JSON.parse(localStorage.getItem(storageKey) || '[]');
                        isAdded = tasks.some(t => t.id === taskId);
                        if (isAdded && order.tasks) order.tasks[taskId] = 'orange';
                    } catch(e) {}
                }

                squaresHtml += `
                    <div class="operation-wrapper">
                        <button class="op-toggle-btn ${isAdded ? 'remove' : ''}" 
                                onclick="toggleSiteOperation(this, ${order.id}, '${siteKey}', ${itemIndex}, ${i}, '${escapeHtml(operationName)}')"
                                style="background: ${isAdded ? '#e74c3c' : '#2ecc71'};">
                            ${isAdded ? '✕' : '+'}
                        </button>
                        <div class="square ${taskStatus}" title="${escapeHtml(operationName)}"></div>
                        <div class="operation-name-small">${escapeHtml(operationName)}</div>
                    </div>
                `;
            }

            return `
                <div class="site-item">
                    <span class="site-name">${name}</span>
                    <div class="squares">${squaresHtml}</div>
                    <div>
                        <span>${completedCount}/${operations.length}</span>
                        <button class="btn btn-sm btn-primary" onclick="addExtraTask(${order.id}, '${siteKey}')" style="margin-left: 10px;">➕ Доп.</button>
                    </div>
                </div>
            `;
        }

        // ============== ОТОБРАЖЕНИЕ СПИСКА ГРУПП ==============
        function renderOrdersList() {
            const ordersList = document.getElementById('ordersList');
            if (!ordersList) return;

            const orders = loadOrdersFromStorage() || [];
            const searchText = document.getElementById('searchInput')?.value.toLowerCase() || '';
            const statusFilter = document.getElementById('statusFilter')?.value || 'all';

            let filteredOrders = orders.filter(order => {
                const matchSearch = order.groupName.toLowerCase().includes(searchText) ||
                    order.items.some(item => item.product.toLowerCase().includes(searchText));
                if (!matchSearch) return false;
                
                const groupStatus = getGroupStatus(order);
                if (statusFilter === 'active') return groupStatus === 'orange' || groupStatus === 'gray';
                if (statusFilter === 'completed') return groupStatus === 'green';
                return true;
            });

            ordersList.innerHTML = '';

            if (filteredOrders.length === 0) {
                ordersList.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">Нет групп</div></div>`;
                return;
            }

            filteredOrders.forEach(order => {
                const groupStatus = getGroupStatus(order);
                const statusClass = groupStatus === 'green' ? 'status-green' : (groupStatus === 'orange' ? 'status-orange' : 'status-gray');
                
                const card = document.createElement('div');
                card.className = 'order-card';
                card.dataset.orderId = order.id;

                const header = document.createElement('div');
                header.className = `order-header ${statusClass}`;
                header.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                        <div>
                            <h3>📁 ${escapeHtml(order.groupName)}</h3>
                            <div style="font-size: 12px; color: #a0a0a0; margin-top: 5px;">
                                Изделий: ${order.items.length} | №${order.number}
                                ${groupStatus === 'green' ? ' | ✅ ВЫПОЛНЕНО' : (groupStatus === 'orange' ? ' | ⚡ В РАБОТЕ' : ' | ⏳ ОЖИДАЕТ')}
                            </div>
                        </div>
                        <div>
                            <button class="btn btn-info" onclick="event.stopPropagation(); showMaterialsReport(${order.id})">📊 Материалы</button>
                            <button class="btn btn-danger" onclick="event.stopPropagation(); deleteOrder(${order.id})">🗑️ Удалить</button>
                        </div>
                    </div>
                `;

                const content = document.createElement('div');
                content.className = 'order-content';
                content.style.display = 'none';

                order.items.forEach((item, itemIndex) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.style.marginBottom = '20px';
                    itemDiv.style.border = '1px solid #2a2f38';
                    itemDiv.style.borderRadius = '8px';
                    itemDiv.style.overflow = 'hidden';

                    const itemHeader = document.createElement('div');
                    itemHeader.style.padding = '10px 15px';
                    itemHeader.style.background = '#232830';
                    itemHeader.style.cursor = 'pointer';
                    itemHeader.style.display = 'flex';
                    itemHeader.style.justifyContent = 'space-between';
                    itemHeader.innerHTML = `
                        <span style="font-weight: 600; color: #ff3b3b;">📦 ${escapeHtml(item.product)}</span>
                        <span>▼</span>
                    `;

                    const itemContent = document.createElement('div');
                    itemContent.style.padding = '15px';
                    itemContent.style.display = 'none';

                    let bracketsHtml = item.brackets && item.brackets.length > 0 ? 
                        item.brackets.map(b => `<span>${b.type}: ${b.quantity} шт</span>`).join(', ') : 'нет';
                    let lyresHtml = item.lyres && item.lyres.length > 0 ? 
                        item.lyres.map(l => `<span>${l.type}: ${l.quantity} шт</span>`).join(', ') : 'нет';

                    itemContent.innerHTML = `
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #2a2f38;">
                            <div>📏 Размер: ${escapeHtml(item.size?.name)} x ${item.size?.quantity} шт</div>
                            <div>📐 Профиль: ${item.profileLength?.meters} м x ${item.profileLength?.quantity} шт</div>
                            <div>🔧 Кронштейны: ${bracketsHtml}</div>
                            <div>🎸 Лиры: ${lyresHtml}</div>
                            <div>🎨 RAL: ${item.ral || '-'} / ${item.texture || '-'}</div>
                        </div>
                        <div id="sites-${order.id}-${itemIndex}" class="sites-section">
                            <div class="sites-grid">
                                ${createSiteRow('🔧 Токарный', order, itemIndex, 'tokarniy')}
                                ${createSiteRow('🔨 Слесарный', order, itemIndex, 'slesarniy')}
                                ${createSiteRow('⚙️ Фрезерный', order, itemIndex, 'frezerniy')}
                                ${createSiteRow('✨ Лазерно-гибочный', order, itemIndex, 'lazerno')}
                                ${createSiteRow('🧪 Полимерный', order, itemIndex, 'polimerniy')}
                            </div>
                        </div>
                    `;

                    itemHeader.onclick = () => {
                        const isVisible = itemContent.style.display !== 'none';
                        itemContent.style.display = isVisible ? 'none' : 'block';
                        itemHeader.querySelector('span:last-child').textContent = isVisible ? '▼' : '▲';
                    };

                    itemDiv.appendChild(itemHeader);
                    itemDiv.appendChild(itemContent);
                    content.appendChild(itemDiv);
                });

                header.onclick = (e) => {
                    if (e.target.tagName === 'BUTTON') return;
                    content.style.display = content.style.display === 'none' ? 'block' : 'none';
                };

                card.appendChild(header);
                card.appendChild(content);
                ordersList.appendChild(card);
            });
        }

        // ============== ОСТАЛЬНЫЕ ФУНКЦИИ ==============
        function getGroupStatus(order) {
            if (!order.tasks || Object.keys(order.tasks).length === 0) return 'gray';
            let hasInProgress = false, allCompleted = true;
            Object.values(order.tasks).forEach(status => {
                if (status === 'orange') { hasInProgress = true; allCompleted = false; }
                if (status !== 'green') allCompleted = false;
            });
            if (allCompleted && Object.keys(order.tasks).length > 0) return 'green';
            if (hasInProgress) return 'orange';
            return 'gray';
        }

        function updateStatistics() {
            const orders = loadOrdersFromStorage() || [];
            document.getElementById('totalOrders').textContent = orders.length;
            const totalItems = orders.reduce((sum, o) => sum + o.items.length, 0);
            document.getElementById('totalItems').textContent = totalItems;
            
            let activeTasks = 0, completedTasks = 0;
            orders.forEach(order => {
                if (order.tasks) {
                    Object.values(order.tasks).forEach(status => {
                        if (status === 'orange') activeTasks++;
                        if (status === 'green') completedTasks++;
                    });
                }
            });
            document.getElementById('activeTasks').textContent = activeTasks;
            document.getElementById('completedTasks').textContent = completedTasks;
        }

        function generateOrderNumber(index) {
            const date = new Date();
            return `Г-${date.getFullYear().toString().slice(-2)}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate().toString().padStart(2,'0')}-${index.toString().padStart(3,'0')}`;
        }

        window.createGroupOrder = function() {
            const groupName = document.getElementById('groupNameInput').value.trim();
            if (!groupName) { alert('Введите название группы'); return; }
            if (tempItemsList.length === 0) { alert('Добавьте хотя бы одно изделие'); return; }
            
            const orders = loadOrdersFromStorage();
            const newOrder = {
                id: Date.now(),
                groupName: groupName,
                date: currentFilterDate,
                number: generateOrderNumber(orders.length + 1),
                items: JSON.parse(JSON.stringify(tempItemsList)),
                status: 'active',
                tasks: {},
                extraTasks: []
            };
            orders.push(newOrder);
            saveOrdersToStorage(orders);
            closeGroupModal();
            renderOrdersList();
            updateStatistics();
            alert(`✅ Группа "${groupName}" создана!`);
        };

        window.deleteOrder = function(orderId) {
            if (!confirm('Удалить группу?')) return;
            let orders = loadOrdersFromStorage();
            orders = orders.filter(o => o.id !== orderId);
            saveOrdersToStorage(orders);
            
            const sites = ['tokarniy', 'slesarniy', 'frezerniy', 'lazerno', 'polimerniy'];
            for (let i = -30; i <= 30; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                const date = d.toISOString().split('T')[0];
                sites.forEach(site => {
                    const key = `tasks_${site}_${date}`;
                    const tasks = localStorage.getItem(key);
                    if (tasks) {
                        let tasksArr = JSON.parse(tasks);
                        tasksArr = tasksArr.filter(t => t.orderId !== orderId);
                        localStorage.setItem(key, JSON.stringify(tasksArr));
                    }
                });
            }
            renderOrdersList();
            updateStatistics();
            alert('✅ Группа удалена');
        };

        window.exportOrders = function() {
            const orders = loadOrdersFromStorage();
            if (orders.length === 0) { alert('Нет групп'); return; }
            const data = JSON.stringify({ exportDate: new Date().toISOString(), orders }, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `masterx_export_${new Date().toISOString().slice(0,10)}.json`;
            link.click();
        };

        window.importOrders = function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const text = await file.text();
                const data = JSON.parse(text);
                if (!data.orders) { alert('Неверный формат'); return; }
                let orders = loadOrdersFromStorage();
                data.orders.forEach(imported => {
                    const existingIndex = orders.findIndex(o => o.id === imported.id);
                    if (existingIndex !== -1) orders[existingIndex] = imported;
                    else orders.push(imported);
                });
                saveOrdersToStorage(orders);
                renderOrdersList();
                updateStatistics();
                alert('Импорт завершён');
            };
            input.click();
        };

        window.showMaterialsReport = function(orderId) { alert('Отчет в разработке'); };
        window.closeMaterialsModal = function() { document.getElementById('materialsModal').style.display = 'none'; };
        window.addExtraTask = function(orderId, siteKey) { alert('Дополнительная задача будет доступна позже'); };

        window.filterOrdersByDate = function(action) {
            const today = new Date();
            let newDate = new Date(currentFilterDate);
            if (action === 'prev') newDate.setDate(newDate.getDate() - 1);
            if (action === 'next') newDate.setDate(newDate.getDate() + 1);
            if (action === 'today') newDate = new Date();
            currentFilterDate = newDate.toISOString().split('T')[0];
            document.getElementById('currentFilterDate').textContent = currentFilterDate;
            renderOrdersList();
        };

        // ============== ФУНКЦИИ ДЛЯ МОДАЛЬНОГО ОКНА ==============
        window.openGroupModal = function() { document.getElementById('groupModal').style.display = 'block'; };
        window.closeGroupModal = function() { document.getElementById('groupModal').style.display = 'none'; };
        
        function addBracketField() { tempBrackets.push({ type: '', quantity: 0 }); renderBracketsFields(); }
        function addLyreField() { tempLyres.push({ type: '', quantity: 0 }); renderLyresFields(); }
        
        function renderBracketsFields() {
            const container = document.getElementById('bracketsListContainer');
            if (!container) return;
            if (tempBrackets.length === 0) { container.innerHTML = '<div style="color:#a0a0a0;">Нет кронштейнов</div>'; return; }
            let html = '';
            tempBrackets.forEach((b, idx) => {
                html += `<div class="position-item"><select class="bracket-select" data-bracket-index="${idx}"><option value="">Выберите</option>${bracketsList.map(b => `<option value="${b.name}">${b.name}</option>`).join('')}</select><input type="number" class="bracket-quantity" data-bracket-index="${idx}" value="${b.quantity || 0}" min="0"><button class="remove-position" onclick="removeBracketField(${idx})">✕</button></div>`;
            });
            container.innerHTML = html;
            document.querySelectorAll('.bracket-select').forEach(s => s.addEventListener('change', (e) => { const idx = e.target.dataset.bracketIndex; if (tempBrackets[idx]) tempBrackets[idx].type = e.target.value; }));
            document.querySelectorAll('.bracket-quantity').forEach(i => i.addEventListener('change', (e) => { const idx = i.dataset.bracketIndex; if (tempBrackets[idx]) tempBrackets[idx].quantity = parseInt(e.target.value) || 0; }));
        }
        
        function renderLyresFields() {
            const container = document.getElementById('lyresListContainer');
            if (!container) return;
            if (tempLyres.length === 0) { container.innerHTML = '<div style="color:#a0a0a0;">Нет лир</div>'; return; }
            let html = '';
            tempLyres.forEach((l, idx) => {
                html += `<div class="position-item"><select class="lyre-select" data-lyre-index="${idx}"><option value="">Выберите</option>${lyresList.map(l => `<option value="${l.name}">${l.name}</option>`).join('')}</select><input type="number" class="lyre-quantity" data-lyre-index="${idx}" value="${l.quantity || 0}" min="0"><button class="remove-position" onclick="removeLyreField(${idx})">✕</button></div>`;
            });
            container.innerHTML = html;
            document.querySelectorAll('.lyre-select').forEach(s => s.addEventListener('change', (e) => { const idx = e.target.dataset.lyreIndex; if (tempLyres[idx]) tempLyres[idx].type = e.target.value; }));
            document.querySelectorAll('.lyre-quantity').forEach(i => i.addEventListener('change', (e) => { const idx = i.dataset.lyreIndex; if (tempLyres[idx]) tempLyres[idx].quantity = parseInt(e.target.value) || 0; }));
        }
        
        function removeBracketField(index) { tempBrackets.splice(index, 1); renderBracketsFields(); }
        function removeLyreField(index) { tempLyres.splice(index, 1); renderLyresFields(); }
        
        function updateItemsListDisplay() {
            const container = document.getElementById('itemsListContainer');
            if (!container) return;
            if (tempItemsList.length === 0) { container.innerHTML = '<div class="empty-items">📭 Нет добавленных изделий</div>'; document.getElementById('itemsCount').textContent = '0'; return; }
            document.getElementById('itemsCount').textContent = tempItemsList.length;
            let html = '';
            tempItemsList.forEach((item, idx) => {
                html += `<div class="item-card"><div class="item-card-header"><span class="item-card-title">📦 ${escapeHtml(item.product)}</span><button class="remove-item-btn" onclick="removeItemFromGroup(${idx})">✕</button></div><div class="item-card-content"><div>Размер: ${escapeHtml(item.size?.name)} x ${item.size?.quantity} шт</div><div>Профиль: ${item.profileLength?.meters} м x ${item.profileLength?.quantity} шт</div><div>Кронштейны: ${item.brackets?.map(b => `${b.type}: ${b.quantity}шт`).join(', ') || 'нет'}</div><div>Лиры: ${item.lyres?.map(l => `${l.type}: ${l.quantity}шт`).join(', ') || 'нет'}</div><div>RAL: ${item.ral || '-'} / ${item.texture || '-'}</div></div></div>`;
            });
            container.innerHTML = html;
        }
        
        function removeItemFromGroup(index) { tempItemsList.splice(index, 1); updateItemsListDisplay(); }
        
        function addItemToGroup() {
            const product = document.getElementById('newItemProduct').value;
            if (!product) { alert('Выберите изделие'); return; }
            const sizeName = document.getElementById('newItemSize').value;
            if (!sizeName) { alert('Выберите размер'); return; }
            tempItemsList.push({
                product: product,
                size: { name: sizeName, quantity: parseInt(document.getElementById('newItemSizeQuantity').value) || 1 },
                profileLength: { meters: parseFloat(document.getElementById('newItemProfileMeters').value) || 0, quantity: parseInt(document.getElementById('newItemProfileQuantity').value) || 1 },
                brackets: tempBrackets.filter(b => b.type && b.quantity > 0),
                lyres: tempLyres.filter(l => l.type && l.quantity > 0),
                ral: document.getElementById('newItemRal').value || '',
                texture: document.getElementById('newItemTexture').value || '',
                components: []
            });
            updateItemsListDisplay();
            tempBrackets = [];
            tempLyres = [];
            renderBracketsFields();
            renderLyresFields();
            document.getElementById('newItemProduct').value = '';
            document.getElementById('newItemSize').innerHTML = '<option value="">Сначала выберите изделие</option>';
            document.getElementById('newItemSizeQuantity').value = '1';
            document.getElementById('newItemProfileMeters').value = '0';
            document.getElementById('newItemProfileQuantity').value = '1';
            document.getElementById('newItemRal').value = '';
            document.getElementById('newItemTexture').value = '';
        }
        
        function onNewItemProductChange() {
            const productName = document.getElementById('newItemProduct').value;
            const product = productsList.find(p => p.name === productName);
            const sizeSelect = document.getElementById('newItemSize');
            if (product && product.sizes) {
                sizeSelect.innerHTML = '<option value="">Выберите размер</option>' + product.sizes.map(s => `<option value="${s}">${s}</option>`).join('');
            } else {
                sizeSelect.innerHTML = '<option value="">Нет размеров</option>';
            }
        }
        
        function populateNewItemSelects() {
            const productSelect = document.getElementById('newItemProduct');
            if (productSelect && productsList.length) {
                productSelect.innerHTML = '<option value="">Выберите изделие</option>' + productsList.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
            }
        }
        
        function initThemeToggle() {
            const toggle = document.getElementById('themeToggle');
            if (!toggle) return;
            const saved = localStorage.getItem('masterx_theme');
            if (saved === 'light') { document.body.classList.add('light-theme'); toggle.checked = true; }
            toggle.addEventListener('change', () => {
                document.body.classList.toggle('light-theme');
                localStorage.setItem('masterx_theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
            });
        }
        
        async function initMainPage() {
            productsList = await loadProducts() || [];
            bracketsList = await loadBrackets() || [];
            lyresList = await loadLyres() || [];
            await loadComponents();
            componentsData = window.componentsData || {};
            populateNewItemSelects();
            initThemeToggle();
            document.getElementById('currentFilterDate').textContent = currentFilterDate;
            
            document.getElementById('createGroupBtn').onclick = () => openGroupModal();
            document.getElementById('prevDateBtn').onclick = () => filterOrdersByDate('prev');
            document.getElementById('todayDateBtn').onclick = () => filterOrdersByDate('today');
            document.getElementById('nextDateBtn').onclick = () => filterOrdersByDate('next');
            document.getElementById('exportBtn').onclick = () => exportOrders();
            document.getElementById('importBtn').onclick = () => importOrders();
            document.getElementById('addBracketBtn').onclick = () => addBracketField();
            document.getElementById('addLyreBtn').onclick = () => addLyreField();
            document.getElementById('addItemBtn').onclick = () => addItemToGroup();
            document.getElementById('createGroupOrderBtn').onclick = () => createGroupOrder();
            document.getElementById('newItemProduct').onchange = () => onNewItemProductChange();
            
            renderOrdersList();
            updateStatistics();
            document.getElementById('searchInput')?.addEventListener('input', () => renderOrdersList());
            document.getElementById('statusFilter')?.addEventListener('change', () => renderOrdersList());
        }
        
        document.addEventListener('DOMContentLoaded', initMainPage);
    </script>
</body>
</html>
