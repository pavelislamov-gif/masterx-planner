<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterX - Планировщик производства</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- ШАПКА С ЛОГОТИПОМ -->
        <header>
            <div class="logo-container">
                <img src="images/logo.png" alt="MasterX Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="logo-text">
                    Master<span class="x-red">X</span>
                </div>
            </div>
            <button class="btn btn-primary" onclick="window.openOrderModal()">
                <span style="font-size: 20px; margin-right: 5px;">+</span> Новый заказ
            </button>
        </header>

        <!-- НАВИГАЦИЯ ПО УЧАСТКАМ -->
        <div class="sites-navigation">
            <h3 style="margin-bottom: 15px; color: #fff;">🏭 Производственные участки:</h3>
            <div class="sites-links">
                <a href="sites/tokarniy.html" class="site-link">Токарный</a>
                <a href="sites/slesarniy.html" class="site-link">Слесарный</a>
                <a href="sites/frezerniy.html" class="site-link">Фрезерный</a>
                <a href="sites/lazerno-gibochniy.html" class="site-link">Лазерно-гибочный</a>
                <a href="sites/polimerniy.html" class="site-link">Полимерный</a>
            </div>
        </div>

        <!-- СТАТИСТИКА -->
        <div class="order-stats" id="orderStats">
            <div class="stat-item">
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">Всего заказов</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalItems">0</div>
                <div class="stat-label">Изделий</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="activeTasks">0</div>
                <div class="stat-label">В работе</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="completedTasks">0</div>
                <div class="stat-label">Выполнено</div>
            </div>
        </div>

        <!-- ФИЛЬТРЫ И ПОИСК -->
        <div class="filter-section">
            <input type="text" class="search-box" placeholder="🔍 Поиск по номеру заказа или изделию..." id="searchInput">
            <select id="statusFilter" class="search-box" style="width: auto;">
                <option value="all">Все статусы</option>
                <option value="active">Активные</option>
                <option value="completed">Завершенные</option>
            </select>
            <button class="btn btn-primary" onclick="exportOrders()">📥 Экспорт заказов</button>
        </div>

<!-- МОДАЛЬНОЕ ОКНО ЗАКАЗА -->
<div id="orderModal" class="modal">
    <div class="modal-content" style="max-width: 600px; background: linear-gradient(135deg, #1a1e24, #0f1217); color: #fff; border: 1px solid #2a2f38;">
        <span class="close" onclick="closeOrderModal()" style="color: #ff3b3b;">&times;</span>
        <h2 id="modalTitle" style="color: #fff; border-bottom: 1px solid #2a2f38; padding-bottom: 10px;">Новый заказ</h2>
        
        <form id="orderForm" onsubmit="event.preventDefault(); saveOrder();">
            <!-- ОСНОВНЫЕ ПОЛЯ -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #a0a0a0;">Дата заказа:</label>
                <input type="date" id="orderDate" style="width: 100%; padding: 8px; background: #0f1217; border: 1px solid #2a2f38; border-radius: 4px; color: #fff;">
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #a0a0a0;">Заказчик:</label>
                <input type="text" id="orderCustomer" placeholder="Введите заказчика" style="width: 100%; padding: 8px; background: #0f1217; border: 1px solid #2a2f38; border-radius: 4px; color: #fff;">
            </div>
            
            <!-- ИЗДЕЛИЕ С РАЗМЕРАМИ -->
            <div style="margin-bottom: 15px; background: #0f1217; padding: 15px; border-radius: 4px; border: 1px solid #2a2f38;">
                <h3 style="color: #ff3b3b; margin-top: 0; margin-bottom: 10px; font-size: 16px;">🔧 Изделие</h3>
                
                <div style="margin-bottom: 10px;">
                    <label style="display: block; margin-bottom: 5px; color: #a0a0a0;">Выберите изделие:</label>
                    <select id="productSelect" style="width: 100%; padding: 8px; background: #1a1e24; border: 1px solid #2a2f38; border-radius: 4px; color: #fff;">
                        <option value="">Выберите изделие</option>
                    </select>
                </div>
                
                <div style="margin-bottom: 10px;">
                    <label style="display: block; margin-bottom: 5px; color: #a0a0a0;">Размер:</label>
                    <select id="productSizeSelect" style="width: 100%; padding: 8px; background: #1a1e24; border: 1px solid #2a2f38; border-radius: 4px; color: #fff;">
                        <option value="">Сначала выберите изделие</option>
                    </select>
                </div>
                
                <div>
                    <label style="display: block; margin-bottom: 5px; color: #a0a0a0;">Количество:</label>
                    <input type="number" id="productQuantity" value="1" min="1" style="width: 100%; padding: 8px; background: #1a1e24; border: 1px solid #2a2f38; border-radius: 4px; color: #fff;">
                </div>
            </div>
            
            <!-- КРОНШТЕЙНЫ -->
            <div style="margin-bottom: 15px; background: #0f1217; padding: 15px; border-radius: 4px; border: 1px solid #2a2f38;">
                <h3 style="color: #ff3b3b; margin-top: 0; margin-bottom: 10px; font-size: 16px;">🔩 Кронштейн</h3>
                
                <div style="margin-bottom: 10px;">
                    <label style="display: block; margin-bottom: 5px; color: #a0a0a0;">Выберите кронштейн:</label>
                    <select id="bracketSelect" style="width: 100%; padding: 8px; background: #1a1e24; border: 1px solid #2a2f38; border-radius: 4px; color: #fff;">
                        <option value="">Выберите кронштейн</option>
                    </select>
                </div>
                
                <div>
                    <label style="display: block; margin-bottom: 5px; color: #a0a0a0;">Количество:</label>
                    <input type="number" id="bracketQuantity" value="0" min="0" style="width: 100%; padding: 8px; background: #1a1e24; border: 1px solid #2a2f38; border-radius: 4px; color: #fff;">
                </div>
            </div>
            
            <!-- ЛИРЫ -->
            <div style="margin-bottom: 15px; background: #0f1217; padding: 15px; border-radius: 4px; border: 1px solid #2a2f38;">
                <h3 style="color: #ff3b3b; margin-top: 0; margin-bottom: 10px; font-size: 16px;">🎸 Лира</h3>
                
                <div style="margin-bottom: 10px;">
                    <label style="display: block; margin-bottom: 5px; color: #a0a0a0;">Выберите лиру:</label>
                    <select id="lyreSelect" style="width: 100%; padding: 8px; background: #1a1e24; border: 1px solid #2a2f38; border-radius: 4px; color: #fff;">
                        <option value="">Выберите лиру</option>
                    </select>
                </div>
                
                <div>
                    <label style="display: block; margin-bottom: 5px; color: #a0a0a0;">Количество:</label>
                    <input type="number" id="lyreQuantity" value="0" min="0" style="width: 100%; padding: 8px; background: #1a1e24; border: 1px solid #2a2f38; border-radius: 4px; color: #fff;">
                </div>
            </div>
            
            <!-- ДОПОЛНИТЕЛЬНЫЕ ПАРАМЕТРЫ -->
            <div style="margin-bottom: 15px; background: #0f1217; padding: 15px; border-radius: 4px; border: 1px solid #2a2f38;">
                <h3 style="color: #ff3b3b; margin-top: 0; margin-bottom: 10px; font-size: 16px;">🎨 Параметры</h3>
                
                <div style="margin-bottom: 10px;">
                    <label style="display: block; margin-bottom: 5px; color: #a0a0a0;">RAL:</label>
                    <input type="text" id="ralValue" placeholder="Например: RAL 9003" style="width: 100%; padding: 8px; background: #1a1e24; border: 1px solid #2a2f38; border-radius: 4px; color: #fff;">
                </div>
                
                <div style="margin-bottom: 10px;">
                    <label style="display: block; margin-bottom: 5px; color: #a0a0a0;">Текстура:</label>
                    <input type="text" id="textureValue" placeholder="Например: матовая, глянцевая" style="width: 100%; padding: 8px; background: #1a1e24; border: 1px solid #2a2f38; border-radius: 4px; color: #fff;">
                </div>
                
                <div>
                    <label style="display: block; margin-bottom: 5px; color: #a0a0a0;">Примечание:</label>
                    <textarea id="orderNotes" rows="2" placeholder="Дополнительная информация" style="width: 100%; padding: 8px; background: #1a1e24; border: 1px solid #2a2f38; border-radius: 4px; color: #fff; resize: vertical;"></textarea>
                </div>
            </div>
            
            <!-- КНОПКИ -->
            <div style="display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid #2a2f38; padding-top: 20px;">
                <button type="button" onclick="closeOrderModal()" style="background: #2a2f38; color: #fff; padding: 10px 25px; border: none; border-radius: 4px; cursor: pointer;">
                    Отмена
                </button>
                <button type="submit" style="background: #ff3b3b; color: white; padding: 10px 25px; border: none; border-radius: 4px; cursor: pointer;">
                    Сохранить заказ
                </button>
            </div>
        </form>
    </div>
</div>

        <!-- МОДАЛЬНОЕ ОКНО МАТЕРИАЛОВ -->
        <div id="materialsModal" class="modal">
            <div class="modal-content" style="max-width: 900px;">
                <span class="close" onclick="window.closeMaterialsModal()">&times;</span>
                <div id="materialsReport"></div>
            </div>
        </div>

        <!-- СПИСОК ЗАКАЗОВ -->
<div class="orders-list">
    <table style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr style="background: #2a2f38; color: #fff;">
                <th style="padding: 12px;">ID</th>
                <th style="padding: 12px;">Заказчик</th>
                <th style="padding: 12px;">Дата</th>
                <th style="padding: 12px;">Изделие</th>
                <th style="padding: 12px;">Размер</th>
                <th style="padding: 12px;">Кол-во</th>
                <th style="padding: 12px;">Кронштейн</th>
                <th style="padding: 12px;">Кол-во</th>
                <th style="padding: 12px;">Лира</th>
                <th style="padding: 12px;">Кол-во</th>
                <th style="padding: 12px;">RAL</th>
                <th style="padding: 12px;">Текстура</th>
                <th style="padding: 12px;">Действия</th>
            </tr>
        </thead>
        <tbody id="ordersTableBody">
            <!-- Заказы будут загружаться сюда -->
        </tbody>
    </table>
</div>

    <!-- ПОДКЛЮЧЕНИЕ СКРИПТОВ В ПРАВИЛЬНОМ ПОРЯДКЕ -->
    <script src="js/storage.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/task-operations.js"></script>
    <script src="js/materials-report.js"></script>
    <script src="js/task-manager.js"></script>
    <script src="js/app.js"></script>
    
    <!-- ДИАГНОСТИКА -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('='.repeat(50));
            console.log('🔍 ДИАГНОСТИКА ЗАГРУЗКИ СКРИПТОВ');
            console.log('='.repeat(50));
            
            console.log('📦 storage.js:', typeof loadOrdersFromStorage === 'function' ? '✅' : '❌');
            console.log('📦 data-loader.js:', typeof loadProducts === 'function' ? '✅' : '❌');
            console.log('📦 materials-report.js:', typeof MaterialsReport === 'function' ? '✅' : '❌');
            console.log('📦 task-manager.js:', typeof TaskManager === 'function' ? '✅' : '❌');
            console.log('📦 app.js:', typeof openOrderModal === 'function' ? '✅' : '❌');
            
            console.log('='.repeat(50));
            
            if (typeof openOrderModal === 'function') {
                console.log('🎉 ВСЁ РАБОТАЕТ! openOrderModal доступна');
            } else {
                console.error('❌ ПРОБЛЕМА: openOrderModal не определена!');
                console.log('Проверьте, что в app.js есть строка: window.openOrderModal = openOrderModal;');
            }
        });
    </script>
</body>
</html>
