<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterX - Планировщик производства</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- ШАПКА С ЛОГОТИПОМ -->
        <header>
            <div class="logo-container">
                <img src="images/logo.png" alt="MasterX Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="logo-text">
                    Master<span class="x-red">X</span>
                </div>
            </div>
            <button class="btn btn-primary" onclick="window.openOrderModal()">
                <span style="font-size: 20px; margin-right: 5px;">+</span> Новый заказ
            </button>
        </header>

        <!-- НАВИГАЦИЯ ПО УЧАСТКАМ -->
        <div class="sites-navigation">
            <h3 style="margin-bottom: 15px; color: #fff;">🏭 Производственные участки:</h3>
            <div class="sites-links">
                <a href="sites/tokarniy.html" class="site-link">Токарный</a>
                <a href="sites/slesarniy.html" class="site-link">Слесарный</a>
                <a href="sites/frezerniy.html" class="site-link">Фрезерный</a>
                <a href="sites/lazerno-gibochniy.html" class="site-link">Лазерно-гибочный</a>
                <a href="sites/polimerniy.html" class="site-link">Полимерный</a>
            </div>
        </div>

        <!-- СТАТИСТИКА -->
        <div class="order-stats" id="orderStats">
            <div class="stat-item">
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">Всего заказов</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalItems">0</div>
                <div class="stat-label">Изделий</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="activeTasks">0</div>
                <div class="stat-label">В работе</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="completedTasks">0</div>
                <div class="stat-label">Выполнено</div>
            </div>
        </div>

        <!-- ФИЛЬТРЫ И ПОИСК -->
        <div class="filter-section">
            <input type="text" class="search-box" placeholder="🔍 Поиск по номеру заказа или изделию..." id="searchInput">
            <select id="statusFilter" class="search-box" style="width: auto;">
                <option value="all">Все статусы</option>
                <option value="active">Активные</option>
                <option value="completed">Завершенные</option>
            </select>
            <button class="btn btn-primary" onclick="exportOrders()">📥 Экспорт заказов</button>
        </div>

        <!-- МОДАЛЬНОЕ ОКНО СОЗДАНИЯ ЗАКАЗА -->
        <div id="orderModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="window.closeOrderModal()">&times;</span>
                <h2 style="color: #fff; margin-bottom: 20px;">📋 Создание нового заказа</h2>
                <form id="orderForm">
                    <div class="form-group">
                        <label>📅 Дата заказа:</label>
                        <input type="date" id="orderDate" required>
                    </div>
                    <div class="form-group">
                        <label>🔢 Номер заказа:</label>
                        <input type="text" id="orderNumber" placeholder="Например: З-2024-001" required>
                    </div>
                    <div class="form-group">
                        <label>🏷️ Изделие:</label>
                        <select id="productSelect" onchange="window.loadProductSizes()" required>
                            <option value="">Выберите изделие</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>📏 Размер/Имя:</label>
                        <select id="sizeSelect" required>
                            <option value="">Сначала выберите изделие</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🔢 Кол-во изделий:</label>
                        <input type="number" id="quantity" min="1" value="1" required>
                    </div>

                    <!-- Кронштейн с количеством -->
                    <div class="form-group">
                        <label>🔧 Тип кронштейна:</label>
                        <div class="quantity-row">
                            <select id="bracketSelect">
                                <option value="">Выберите кронштейн</option>
                            </select>
                            <input type="number" id="bracketQuantity" min="0" value="1" placeholder="Кол-во">
                        </div>
                    </div>

                    <!-- Лира с количеством -->
                    <div class="form-group">
                        <label>🎸 Тип лиры:</label>
                        <div class="quantity-row">
                            <select id="lyreSelect">
                                <option value="">Выберите лиру</option>
                            </select>
                            <input type="number" id="lyreQuantity" min="0" value="1" placeholder="Кол-во">
                        </div>
                    </div>

                    <!-- Цвет RAL и текстура -->
                    <div class="form-group">
                        <label>🎨 Цвет RAL (вручную):</label>
                        <input type="text" id="ralInput" placeholder="Например: RAL 9003">
                    </div>
                    <div class="form-group">
                        <label>🧵 Текстура:</label>
                        <select id="textureSelect">
                            <option value="">Выберите текстуру</option>
                            <option value="матовая">Матовая</option>
                            <option value="глянцевая">Глянцевая</option>
                            <option value="сатиновая">Муар</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>📝 Дополнительные детали:</label>
                        <textarea id="additionalDetails" rows="3" placeholder="Особые требования или примечания..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-success" style="width: 100%; padding: 12px;">✅ Создать заказ</button>
                </form>
            </div>
        </div>

        <!-- МОДАЛЬНОЕ ОКНО МАТЕРИАЛОВ -->
        <div id="materialsModal" class="modal">
            <div class="modal-content" style="max-width: 900px;">
                <span class="close" onclick="window.closeMaterialsModal()">&times;</span>
                <div id="materialsReport"></div>
            </div>
        </div>

        <!-- СПИСОК ЗАКАЗОВ -->
        <div id="ordersList" class="orders-list">
            <!-- Заказы будут загружаться сюда -->
        </div>
    </div>

    <!-- ПОДКЛЮЧЕНИЕ СКРИПТОВ В ПРАВИЛЬНОМ ПОРЯДКЕ -->
    <script src="js/storage.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/task-operations.js"></script>
    <script src="js/materials-report.js"></script>
    <script src="js/task-manager.js"></script>
    <script src="js/app.js"></script>

    <!-- ДИАГНОСТИКА -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('='.repeat(50));
            console.log('🔍 ДИАГНОСТИКА ЗАГРУЗКИ СКРИПТОВ');
            console.log('='.repeat(50));

            console.log('📦 storage.js:', typeof loadOrdersFromStorage === 'function' ? '✅' : '❌');
            console.log('📦 data-loader.js:', typeof loadProducts === 'function' ? '✅' : '❌');
            console.log('📦 materials-report.js:', typeof MaterialsReport === 'function' ? '✅' : '❌');
            console.log('📦 task-manager.js:', typeof TaskManager === 'function' ? '✅' : '❌');
            console.log('📦 app.js:', typeof openOrderModal === 'function' ? '✅' : '❌');

            console.log('='.repeat(50));

            if (typeof openOrderModal === 'function') {
                console.log('🎉 ВСЁ РАБОТАЕТ! openOrderModal доступна');
            } else {
                console.error('❌ ПРОБЛЕМА: openOrderModal не определена!');
                console.log('Проверьте, что в app.js есть строка: window.openOrderModal = openOrderModal;');
            }
        });
    </script>
</body>
</html>
