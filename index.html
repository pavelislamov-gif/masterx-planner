<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterX - Планировщик производства</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ... все стили остаются без изменений ... */
    </style>
</head>
<body>
    <div class="container">
        <!-- ШАПКА -->
        <header>
            <div class="logo-container">
                <img src="images/logo.png" alt="MasterX Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="logo-text">Master<span class="x-red">X</span></div>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="btn btn-primary" onclick="openGroupModal()">+ Создать группу</button>
                <div class="theme-switch-wrapper">
                    <span>🌙</span>
                    <label class="theme-switch">
                        <input type="checkbox" id="themeToggle">
                        <span class="slider"></span>
                    </label>
                    <span>☀️</span>
                </div>
            </div>
        </header>

        <!-- НАВИГАЦИЯ ПО УЧАСТКАМ -->
        <div class="sites-navigation">
            <h3>🏭 Производственные участки:</h3>
            <div class="sites-links">
                <a href="sites/tokarniy.html" class="site-link">Токарный</a>
                <a href="sites/slesarniy.html" class="site-link">Слесарный</a>
                <a href="sites/frezerniy.html" class="site-link">Фрезерный</a>
                <a href="sites/lazerno.html" class="site-link">Лазерно-гибочный</a>
                <a href="sites/polimerniy.html" class="site-link">Полимерный</a>
            </div>
        </div>

        <!-- СТАТИСТИКА -->
        <div class="order-stats">
            <div class="stat-item"><div class="stat-value" id="totalOrders">0</div><div class="stat-label">Всего групп</div></div>
            <div class="stat-item"><div class="stat-value" id="totalItems">0</div><div class="stat-label">Изделий</div></div>
            <div class="stat-item"><div class="stat-value" id="activeTasks">0</div><div class="stat-label">В работе</div></div>
            <div class="stat-item"><div class="stat-value" id="completedTasks">0</div><div class="stat-label">Выполнено</div></div>
        </div>

        <!-- ФИЛЬТРЫ И ПОИСК -->
        <div class="filter-section">
            <input type="text" class="search-box" placeholder="🔍 Поиск по названию группы или изделию..." id="searchInput">
            <select id="statusFilter" class="search-box" style="width: auto;">
                <option value="all">Все статусы</option>
                <option value="active">Активные</option>
                <option value="completed">Завершённые</option>
            </select>
            <button class="btn btn-primary" onclick="exportOrders()">📥 Экспорт заказов</button>
            <button class="btn btn-success" onclick="importOrders()">📤 Импорт заказов</button>
        </div>

        <!-- МОДАЛЬНОЕ ОКНО СОЗДАНИЯ ГРУППЫ -->
        <div id="groupModal" class="modal">
            <div class="modal-content group-modal-content">
                <span class="close" onclick="closeGroupModal()">&times;</span>
                <h2>📁 Создание группы заказов</h2>
                <div class="form-group">
                    <label>🏷️ Название группы:</label>
                    <input type="text" id="groupNameInput" placeholder="Например: Санкт Петербург КИ000004020" required>
                </div>
                <div class="group-modal-layout">
                    <div class="add-item-panel">
                        <h3>➕ Добавить изделие</h3>
                        <div class="form-group">
                            <label>Изделие:</label>
                            <select id="newItemProduct" onchange="onNewItemProductChange()">
                                <option value="">Выберите изделие</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Размер и количество:</label>
                            <div class="size-quantity-row">
                                <select id="newItemSize"><option value="">Сначала выберите изделие</option></select>
                                <input type="number" id="newItemSizeQuantity" placeholder="Кол-во" min="1" value="1">
                            </div>
                        </div>
                        <div id="profilesContainer" style="display: none;">
                            <div class="components-title">📐 ПРОФИЛИ:</div>
                            <div id="profilesList"></div>
                            <button type="button" class="btn-outline" onclick="addCustomProfile()">+ Добавить профиль</button>
                        </div>
                        <div id="detailsContainer" style="display: none;">
                            <div class="components-title">🔧 ДЕТАЛИ:</div>
                            <div id="detailsList"></div>
                        </div>
                        <div class="form-group">
                            <label>Кронштейны и лиры:</label>
                            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                                <div style="flex:1;"><div id="bracketsListContainer"></div><button type="button" class="btn-outline" onclick="addBracketField()">+ Кронштейн</button></div>
                                <div style="flex:1;"><div id="lyresListContainer"></div><button type="button" class="btn-outline" onclick="addLyreField()">+ Лира</button></div>
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div class="form-group"><label>RAL:</label><input type="text" id="newItemRal" placeholder="RAL 9003"></div>
                            <div class="form-group"><label>Текстура:</label><select id="newItemTexture"><option value="">Выберите</option><option value="матовая">Матовая</option><option value="глянцевая">Глянцевая</option><option value="сатиновая">Муар</option></select></div>
                        </div>
                        <button type="button" class="btn btn-success" onclick="addItemToGroup()">✅ Добавить изделие</button>
                    </div>
                    <div class="items-list-panel">
                        <h3>📦 Добавленные изделия <span id="itemsCount" style="font-size:12px;color:#ff3b3b;">0</span></h3>
                        <div id="itemsListContainer" class="items-list-container"><div class="empty-items"><div style="font-size:40px;">📭</div><p>Нет добавленных изделий</p></div></div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-danger" onclick="closeGroupModal()">Отмена</button>
                    <button type="button" class="btn btn-success" onclick="createGroupOrder()">📋 Сформировать группу</button>
                </div>
            </div>
        </div>

        <!-- МОДАЛЬНОЕ ОКНО МАТЕРИАЛОВ -->
        <div id="materialsModal" class="modal">
            <div class="modal-content" style="max-width:900px;"><span class="close" onclick="closeMaterialsModal()">&times;</span><div id="materialsReport"></div></div>
        </div>

        <div id="ordersList" class="orders-list"></div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/task-operations.js"></script>
    <script src="js/materials-report.js"></script>
    <script src="js/task-manager.js"></script>

    <script>
        // ============== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==============
        let tempItemsList = [];
        let productsList = [];
        let bracketsList = [];
        let lyresList = [];
        let productDetailsData = {};
        let tempBrackets = [];
        let tempLyres = [];
        let tempProfiles = [];
        let taskOperationsData = {};

        // ============== ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ ==============
        function initThemeToggle() {
            const toggle = document.getElementById('themeToggle');
            if (!toggle) return;
            const savedTheme = localStorage.getItem('masterx_theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                toggle.checked = true;
            } else {
                document.body.classList.remove('light-theme');
                toggle.checked = false;
            }
            toggle.addEventListener('change', function() {
                if (this.checked) {
                    document.body.classList.add('light-theme');
                    localStorage.setItem('masterx_theme', 'light');
                } else {
                    document.body.classList.remove('light-theme');
                    localStorage.setItem('masterx_theme', 'dark');
                }
            });
        }

        // ============== ОПРЕДЕЛЕНИЕ СТАТУСА ГРУППЫ ==============
        function getGroupStatus(order) {
            if (!order.tasks || Object.keys(order.tasks).length === 0) return 'gray';
            let hasInProgress = false, allCompleted = true;
            Object.values(order.tasks).forEach(status => {
                if (status === 'orange') { hasInProgress = true; allCompleted = false; }
                if (status !== 'green') allCompleted = false;
            });
            if (allCompleted && Object.keys(order.tasks).length > 0) return 'green';
            if (hasInProgress) return 'orange';
            return 'gray';
        }

        // ============== ЗАГРУЗКА ДАННЫХ ==============
        async function loadTaskOperations() {
            try {
                const response = await fetch('data/taskOperations.json');
                if (response.ok) {
                    const data = await response.json();
                    taskOperationsData = data.operations || {};
                    console.log('✅ Загружены операции из taskOperations.json');
                } else { taskOperationsData = {}; }
            } catch(e) { taskOperationsData = {}; }
        }

        async function loadProductDetails() {
            try {
                const response = await fetch('data/productDetails.json');
                if (response.ok) {
                    const data = await response.json();
                    productDetailsData = data.products || {};
                    console.log('✅ Загружены данные о деталях');
                } else { productDetailsData = {}; }
            } catch(e) { productDetailsData = {}; }
        }

        // ============== ПОЛУЧЕНИЕ ОПЕРАЦИЙ ==============
        function getOperationNamesWithDetails(productName, siteKey) {
            const productOps = taskOperationsData[productName];
            if (!productOps) return [];
            const siteMap = { 'tokarniy': 'токарно-фрезерный', 'frezerniy': 'фрезерный', 'slesarniy': 'слесарный', 'lazerno': 'лазерно-гибочный', 'polimerniy': 'полимерный' };
            const siteColumn = siteMap[siteKey];
            if (!siteColumn) return [];
            return productOps[siteColumn] || [];
        }

        function getOperationNames(productName, siteKey) {
            const ops = getOperationNamesWithDetails(productName, siteKey);
            if (ops.length === 0) return [];
            if (typeof ops[0] === 'object' && ops[0].operation) return ops.map(op => op.operation);
            return ops;
        }

        // ============== ФУНКЦИИ ДЛЯ ПРОФИЛЕЙ ==============
        function addCustomProfile() {
            tempProfiles.push({ name: '', material: 'алюминий', lengthMm: 0, quantity: 1, isCustom: true });
            renderProfilesList();
        }
        function removeCustomProfile(index) {
            if (index >= 0 && index < tempProfiles.length && tempProfiles[index].isCustom) {
                tempProfiles.splice(index, 1);
                renderProfilesList();
            }
        }
        function renderProfilesList() {
            const profilesList = document.getElementById('profilesList');
            if (!profilesList) return;
            if (tempProfiles.length === 0) { document.getElementById('profilesContainer').style.display = 'none'; return; }
            document.getElementById('profilesContainer').style.display = 'block';
            let profilesHtml = '';
            tempProfiles.forEach((profile, idx) => {
                if (profile.isCustom) {
                    profilesHtml += `<div class="profile-item" data-profile-index="${idx}">
                        <input type="text" class="profile-name-custom" data-profile-index="${idx}" value="${escapeHtml(profile.name)}" placeholder="Название профиля">
                        <div><input type="number" class="profile-length-custom" data-profile-index="${idx}" value="${profile.lengthMm}" min="0" step="1" style="width:90px;"><span>мм</span>
                        <input type="number" class="profile-qty-custom" data-profile-index="${idx}" value="${profile.quantity}" min="0" style="width:70px;"><span>шт</span>
                        <button class="remove-profile-btn" onclick="removeCustomProfile(${idx})">✕</button></div>
                    </div>`;
                } else {
                    profilesHtml += `<div class="profile-item" data-profile-index="${idx}">
                        <span>${escapeHtml(profile.name)}</span>
                        <div><input type="number" class="profile-length" data-profile-index="${idx}" value="${profile.lengthMm}" min="0" step="1" style="width:90px;"><span>мм</span>
                        <input type="number" class="profile-qty" data-profile-index="${idx}" value="${profile.quantity}" min="0" style="width:70px;"><span>шт</span></div>
                    </div>`;
                }
            });
            profilesList.innerHTML = profilesHtml;
            document.querySelectorAll('.profile-length, .profile-length-custom').forEach(input => {
                const idx = parseInt(input.dataset.profileIndex);
                input.addEventListener('change', function() { if (tempProfiles[idx]) tempProfiles[idx].lengthMm = parseInt(this.value) || 0; });
            });
            document.querySelectorAll('.profile-qty, .profile-qty-custom').forEach(input => {
                const idx = parseInt(input.dataset.profileIndex);
                input.addEventListener('change', function() { if (tempProfiles[idx]) tempProfiles[idx].quantity = parseInt(this.value) || 0; });
            });
            document.querySelectorAll('.profile-name-custom').forEach(input => {
                const idx = parseInt(input.dataset.profileIndex);
                input.addEventListener('change', function() { if (tempProfiles[idx]) tempProfiles[idx].name = this.value; });
            });
        }

        // ============== ОБНОВЛЕНИЕ ПРИ ВЫБОРЕ ИЗДЕЛИЯ ==============
        function onNewItemProductChange() {
            const productName = document.getElementById('newItemProduct').value;
            const sizeSelect = document.getElementById('newItemSize');
            const product = productsList.find(p => p.name === productName);
            if (product && product.sizes) {
                sizeSelect.innerHTML = '<option value="">Выберите размер</option>';
                product.sizes.forEach(size => { const option = document.createElement('option'); option.value = size; option.textContent = size; sizeSelect.appendChild(option); });
            } else { sizeSelect.innerHTML = '<option value="">Нет доступных размеров</option>'; }
            const productDetails = productDetailsData[productName]?.details || [];
            const regularDetails = productDetails.filter(d => !d.name.includes('Профиль') && !d.name.includes('профиль') && !d.name.includes('НПС') && !d.name.includes('МП') && !d.name.includes('КП'));
            const profilesFromDetails = productDetails.filter(d => d.name.includes('Профиль') || d.name.includes('профиль') || d.name.includes('НПС') || d.name.includes('МП') || d.name.includes('КП'));
            const detailsContainer = document.getElementById('detailsContainer'), detailsList = document.getElementById('detailsList');
            if (regularDetails.length > 0) {
                detailsContainer.style.display = 'block';
                let detailsHtml = '';
                regularDetails.forEach(detail => {
                    detailsHtml += `<div class="detail-item"><span>${escapeHtml(detail.name)}</span><div><input type="number" class="detail-qty" data-detail-name="${detail.name}" data-detail-material="${detail.material}" value="${detail.quantity}" min="0" style="width:70px;"><span>шт</span></div></div>`;
                });
                detailsList.innerHTML = detailsHtml;
            } else { detailsContainer.style.display = 'none'; }
            tempProfiles = [];
            if (profilesFromDetails.length > 0) {
                profilesFromDetails.forEach(profile => { tempProfiles.push({ name: profile.name, material: profile.material, lengthMm: 0, quantity: profile.quantity, isCustom: false }); });
                renderProfilesList();
            } else { document.getElementById('profilesContainer').style.display = 'none'; }
        }

        function collectDetailsFromForm() {
            const details = [];
            document.querySelectorAll('#detailsList .detail-qty').forEach(input => {
                const qty = parseInt(input.value) || 0;
                if (qty > 0) details.push({ name: input.dataset.detailName, material: input.dataset.detailMaterial, quantity: qty, type: 'detail' });
            });
            tempProfiles.forEach(profile => {
                if (profile.name && profile.quantity > 0) details.push({ name: profile.name, material: profile.material, lengthMm: profile.lengthMm, quantity: profile.quantity, type: 'profile' });
            });
            return details;
        }

        // ============== МОДАЛЬНОЕ ОКНО ==============
        function openGroupModal() {
            tempItemsList = []; tempBrackets = []; tempLyres = []; tempProfiles = [];
            updateItemsListDisplay(); resetAddItemForm();
            document.getElementById('groupNameInput').value = '';
            document.getElementById('groupModal').style.display = 'block';
        }
        function closeGroupModal() { document.getElementById('groupModal').style.display = 'none'; }
        function resetAddItemForm() {
            document.getElementById('newItemProduct').value = '';
            document.getElementById('newItemSize').innerHTML = '<option value="">Сначала выберите изделие</option>';
            document.getElementById('newItemSizeQuantity').value = '1';
            document.getElementById('newItemRal').value = '';
            document.getElementById('newItemTexture').value = '';
            document.getElementById('detailsContainer').style.display = 'none';
            document.getElementById('detailsList').innerHTML = '';
            document.getElementById('profilesContainer').style.display = 'none';
            document.getElementById('profilesList').innerHTML = '';
            tempBrackets = []; tempLyres = []; tempProfiles = [];
            renderBracketsFields(); renderLyresFields();
        }
        function renderBracketsFields() {
            const container = document.getElementById('bracketsListContainer');
            if (!container) return;
            if (tempBrackets.length === 0) { container.innerHTML = '<div style="color:#a0a0a0;font-size:12px;padding:5px;text-align:center;">—</div>'; return; }
            let html = '';
            tempBrackets.forEach((bracket, idx) => {
                html += `<div class="position-item"><select data-bracket-index="${idx}" class="bracket-select">${bracketsList.map(b => `<option value="${b.name}" ${bracket.type === b.name ? 'selected' : ''}>${b.name}</option>`).join('')}</select>
                        <input type="number" class="bracket-quantity" data-bracket-index="${idx}" value="${bracket.quantity || 0}" min="0" placeholder="шт" style="width:60px;">
                        <button class="remove-position" onclick="removeBracketField(${idx})">✕</button></div>`;
            });
            container.innerHTML = html;
            document.querySelectorAll('.bracket-select').forEach(select => {
                select.addEventListener('change', (e) => { const idx = parseInt(e.target.dataset.bracketIndex); if (!isNaN(idx) && tempBrackets[idx]) tempBrackets[idx].type = e.target.value; });
            });
            document.querySelectorAll('.bracket-quantity').forEach(input => {
                input.addEventListener('change', (e) => { const idx = parseInt(e.target.dataset.bracketIndex); if (!isNaN(idx) && tempBrackets[idx]) tempBrackets[idx].quantity = parseInt(e.target.value) || 0; });
            });
        }
        function addBracketField() { tempBrackets.push({ type: '', quantity: 0 }); renderBracketsFields(); }
        function removeBracketField(index) { tempBrackets.splice(index, 1); renderBracketsFields(); }
        function renderLyresFields() {
            const container = document.getElementById('lyresListContainer');
            if (!container) return;
            if (tempLyres.length === 0) { container.innerHTML = '<div style="color:#a0a0a0;font-size:12px;padding:5px;text-align:center;">—</div>'; return; }
            let html = '';
            tempLyres.forEach((lyre, idx) => {
                html += `<div class="position-item"><select data-lyre-index="${idx}" class="lyre-select">${lyresList.map(l => `<option value="${l.name}" ${lyre.type === l.name ? 'selected' : ''}>${l.name}</option>`).join('')}</select>
                        <input type="number" class="lyre-quantity" data-lyre-index="${idx}" value="${lyre.quantity || 0}" min="0" placeholder="шт" style="width:60px;">
                        <button class="remove-position" onclick="removeLyreField(${idx})">✕</button></div>`;
            });
            container.innerHTML = html;
            document.querySelectorAll('.lyre-select').forEach(select => {
                select.addEventListener('change', (e) => { const idx = parseInt(e.target.dataset.lyreIndex); if (!isNaN(idx) && tempLyres[idx]) tempLyres[idx].type = e.target.value; });
            });
            document.querySelectorAll('.lyre-quantity').forEach(input => {
                input.addEventListener('change', (e) => { const idx = parseInt(e.target.dataset.lyreIndex); if (!isNaN(idx) && tempLyres[idx]) tempLyres[idx].quantity = parseInt(e.target.value) || 0; });
            });
        }
        function addLyreField() { tempLyres.push({ type: '', quantity: 0 }); renderLyresFields(); }
        function removeLyreField(index) { tempLyres.splice(index, 1); renderLyresFields(); }
        function updateItemsListDisplay() {
            const container = document.getElementById('itemsListContainer');
            const countSpan = document.getElementById('itemsCount');
            if (!container) return;
            if (tempItemsList.length === 0) {
                container.innerHTML = `<div class="empty-items"><div style="font-size:40px;">📭</div><p>Нет добавленных изделий</p></div>`;
                if (countSpan) countSpan.textContent = '0';
                return;
            }
            if (countSpan) countSpan.textContent = tempItemsList.length;
            let html = '';
            tempItemsList.forEach((item, index) => {
                let bracketsHtml = item.brackets && item.brackets.length ? item.brackets.map(b => `${b.type}: ${b.quantity} шт`).join(', ') : 'нет';
                let lyresHtml = item.lyres && item.lyres.length ? item.lyres.map(l => `${l.type}: ${l.quantity} шт`).join(', ') : 'нет';
                const regularDetails = (item.details || []).filter(d => d.type !== 'profile');
                const profiles = (item.details || []).filter(d => d.type === 'profile');
                let regularDetailsHtml = regularDetails.length ? regularDetails.map(d => `${d.name}: ${d.quantity} шт`).join(', ') : '';
                let profilesHtml = profiles.length ? profiles.map(p => `${p.name}: ${p.lengthMm}мм x ${p.quantity} шт`).join(', ') : '';
                html += `<div class="item-card"><div class="item-card-header"><span class="item-card-title">📦 ${escapeHtml(item.product)}</span><button class="remove-item-btn" onclick="removeItemFromGroup(${index})">✕ Удалить</button></div>
                        <div class="item-card-content"><div>Размер: ${escapeHtml(item.size?.name || '-')} x ${item.size?.quantity || 0} шт</div>
                        <div>Кронштейны: ${bracketsHtml}</div><div>Лиры: ${lyresHtml}</div>
                        <div>RAL: ${item.ral || '-'} / ${item.texture || '-'}</div>
                        ${regularDetailsHtml ? `<div>Детали: ${regularDetailsHtml}</div>` : ''}
                        ${profilesHtml ? `<div>Профили: ${profilesHtml}</div>` : ''}</div></div>`;
            });
            container.innerHTML = html;
        }
        function removeItemFromGroup(index) { tempItemsList.splice(index, 1); updateItemsListDisplay(); }
        function populateNewItemSelects() {
            const productSelect = document.getElementById('newItemProduct');
            if (productSelect && productsList.length) {
                productSelect.innerHTML = '<option value="">Выберите изделие</option>';
                productsList.forEach(p => { const option = document.createElement('option'); option.value = p.name; option.textContent = p.name; productSelect.appendChild(option); });
            }
        }
        function addItemToGroup() {
            const product = document.getElementById('newItemProduct').value;
            if (!product) { alert('Выберите изделие'); return; }
            const sizeName = document.getElementById('newItemSize').value;
            if (!sizeName) { alert('Выберите размер'); return; }
            const brackets = tempBrackets.filter(b => b.type && b.quantity > 0);
            const lyres = tempLyres.filter(l => l.type && l.quantity > 0);
            const details = collectDetailsFromForm();
            const newItem = {
                product: product,
                size: { name: sizeName, quantity: parseInt(document.getElementById('newItemSizeQuantity').value) || 1 },
                brackets: brackets, lyres: lyres, details: details,
                ral: document.getElementById('newItemRal').value || '',
                texture: document.getElementById('newItemTexture').value || ''
            };
            tempItemsList.push(newItem);
            updateItemsListDisplay();
            resetAddItemForm();
            populateNewItemSelects();
        }
        function createGroupOrder() {
            const groupName = document.getElementById('groupNameInput').value.trim();
            if (!groupName) { alert('Введите название группы'); return; }
            if (tempItemsList.length === 0) { alert('Добавьте хотя бы одно изделие'); return; }
            const orders = loadOrdersFromStorage();
            const newOrder = {
                id: Date.now(),
                groupName: groupName,
                date: new Date().toISOString().split('T')[0],
                number: generateOrderNumber(orders.length + 1),
                items: JSON.parse(JSON.stringify(tempItemsList)),
                status: 'active',
                tasks: {},
                extraTasks: []
            };
            orders.push(newOrder);
            saveOrdersToStorage(orders);
            closeGroupModal();
            renderOrdersList();
            updateStatistics();
            alert(`✅ Группа "${groupName}" успешно создана!`);
        }
        function generateOrderNumber(index) {
            const date = new Date();
            return `Г-${date.getFullYear().toString().slice(-2)}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate().toString().padStart(2,'0')}-${index.toString().padStart(3,'0')}`;
        }
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }).replace(/[\"\']/g, function(m) { if (m === '"') return '&quot;'; if (m === "'") return '&#39;'; return m; }); }

        // ============== СОХРАНЕНИЕ СОСТОЯНИЯ ОТКРЫТЫХ КАРТОЧЕК ==============
        const MAIN_STORAGE_KEY = 'main_open_cards';
        const MAIN_ITEMS_STORAGE_KEY = 'main_open_items';
        function saveMainOpenCardsState() {
            const openCards = [];
            document.querySelectorAll('.order-card').forEach(card => {
                const content = card.querySelector('.order-content');
                if (content && content.style.display !== 'none') openCards.push(card.dataset.orderId);
            });
            localStorage.setItem(MAIN_STORAGE_KEY, JSON.stringify(openCards));
        }
        function restoreMainOpenCardsState() {
            const saved = localStorage.getItem(MAIN_STORAGE_KEY);
            if (!saved) return;
            JSON.parse(saved).forEach(orderId => {
                const card = document.querySelector(`.order-card[data-order-id="${orderId}"]`);
                if (card) {
                    const content = card.querySelector('.order-content');
                    if (content) content.style.display = 'block';
                }
            });
        }
        function saveMainOpenItemsState() {
            const openItems = [];
            document.querySelectorAll('.order-card').forEach(card => {
                const orderId = card.dataset.orderId;
                card.querySelectorAll('.item-content').forEach((itemContent, idx) => {
                    if (itemContent.style.display !== 'none') openItems.push({ orderId, itemIndex: idx });
                });
            });
            localStorage.setItem(MAIN_ITEMS_STORAGE_KEY, JSON.stringify(openItems));
        }
        function restoreMainOpenItemsState() {
            const saved = localStorage.getItem(MAIN_ITEMS_STORAGE_KEY);
            if (!saved) return;
            JSON.parse(saved).forEach(({ orderId, itemIndex }) => {
                const card = document.querySelector(`.order-card[data-order-id="${orderId}"]`);
                if (card) {
                    const itemHeader = card.querySelectorAll('.item-header')[itemIndex];
                    const itemContent = card.querySelectorAll('.item-content')[itemIndex];
                    if (itemHeader && itemContent) {
                        itemContent.style.display = 'block';
                        const arrowSpan = itemHeader.querySelector('span:last-child');
                        if (arrowSpan) arrowSpan.textContent = '▲';
                    }
                }
            });
        }

        // ============== СОЗДАНИЕ СТРОКИ УЧАСТКА ==============
        function createSiteRow(name, order, itemIndex, siteKey) {
            const item = order.items[itemIndex];
            if (!item) return '<div>Нет данных</div>';
            const operations = getOperationNames(item.product, siteKey);
            if (!operations || operations.length === 0) {
                return `<div class="site-item"><span class="site-name">${name}</span><div class="squares"><div class="square red" title="Нет операций"></div></div><span>0/0</span><button class="btn btn-sm btn-primary" onclick="addExtraTask(${order.id}, '${siteKey}')">➕ Доп.</button></div>`;
            }
            let squaresHtml = '', completedCount = 0;
            for (let i = 0; i < operations.length; i++) {
                const taskId = `${order.id}_${siteKey}_${itemIndex}_${i}`;
                const operationName = operations[i];
                let taskStatus = '', isAdded = false;
                if (order.tasks && order.tasks[taskId]) {
                    taskStatus = order.tasks[taskId];
                    if (taskStatus === 'green') completedCount++;
                }
                try {
                    const tasks = JSON.parse(localStorage.getItem(`tasks_${siteKey}_${order.date}`) || '[]');
                    isAdded = tasks.some(t => t.id === taskId);
                } catch(e) {}
                squaresHtml += `<div class="operation-wrapper"><button class="op-toggle-btn ${isAdded ? 'added' : ''}" onclick="toggleSiteOperation(this, ${order.id}, '${siteKey}', ${itemIndex}, ${i}, '${escapeHtml(operationName)}')">${isAdded ? '✓' : '+'}</button><div class="square ${taskStatus}" title="${escapeHtml(operationName)}"></div><div class="operation-name-small">${escapeHtml(operationName)}</div></div>`;
            }
            return `<div class="site-item"><span class="site-name">${name}</span><div class="squares">${squaresHtml}</div><div><span>${completedCount}/${operations.length}</span><button class="btn btn-sm btn-primary" onclick="addExtraTask(${order.id}, '${siteKey}')" style="margin-left:10px;">➕ Доп.</button></div></div>`;
        }

        function toggleSiteOperation(button, orderId, siteKey, itemIndex, opIndex, operationName) {
            const orders = loadOrdersFromStorage();
            const order = orders.find(o => o.id == orderId);
            if (!order) { alert('Заказ не найден'); return; }
            const dateStr = order.date;
            const storageKey = `tasks_${siteKey}_${dateStr}`;
            const taskId = `${order.id}_${siteKey}_${itemIndex}_${opIndex}`;
            let existingTasks = [];
            try { const saved = localStorage.getItem(storageKey); if (saved) existingTasks = JSON.parse(saved); } catch(e) {}
            const taskExists = existingTasks.some(t => t.id === taskId);
            if (taskExists) {
                if (confirm(`Удалить операцию "${operationName}"?`)) {
                    localStorage.setItem(storageKey, JSON.stringify(existingTasks.filter(t => t.id !== taskId)));
                    button.classList.remove('added'); button.textContent = '+';
                    const squareDiv = button.parentElement?.querySelector('.square');
                    if (squareDiv) squareDiv.classList.remove('orange', 'green');
                    if (order.tasks && order.tasks[taskId]) delete order.tasks[taskId];
                    saveOrdersToStorage(orders);
                    alert(`✅ Операция удалена`);
                    renderOrdersList(); updateStatistics();
                }
            } else {
                const item = order.items[itemIndex];
                let plannedQuantity = 1;
                const siteColumnMap = { 'tokarniy': 'токарно-фрезерный', 'frezerniy': 'фрезерный', 'slesarniy': 'слесарный', 'lazerno': 'лазерно-гибочный', 'polimerniy': 'полимерный' };
                const productOps = taskOperationsData[item.product];
                if (productOps && productOps[siteColumnMap[siteKey]]) {
                    const opData = productOps[siteColumnMap[siteKey]].find(op => op.operation === operationName);
                    if (opData && opData.detail) {
                        const details = item.details || [];
                        for (const detail of details) { if (detail.name === opData.detail) { plannedQuantity = detail.quantity; break; } }
                        if (plannedQuantity === 1 && item.brackets) {
                            for (const b of item.brackets) { if (`Кронштейн ${b.type}` === opData.detail) { plannedQuantity = b.quantity; break; } }
                        }
                        if (plannedQuantity === 1 && item.lyres) {
                            for (const l of item.lyres) { if (`Лира ${l.type}` === opData.detail) { plannedQuantity = l.quantity; break; } }
                        }
                    }
                }
                const newTask = { id: taskId, orderId: order.id, orderNumber: order.number, product: item.product, size: item.size?.name || 'Стандартный', totalQuantity: plannedQuantity, completedQuantity: 0, operation: operationName, index: opIndex, status: 'pending', executors: [], date: dateStr, isExtra: false };
                existingTasks.push(newTask);
                localStorage.setItem(storageKey, JSON.stringify(existingTasks));
                button.classList.add('added'); button.textContent = '✓';
                if (!order.tasks) order.tasks = {};
                order.tasks[taskId] = 'pending';
                saveOrdersToStorage(orders);
                alert(`✅ Операция добавлена с планом ${plannedQuantity} шт`);
                renderOrdersList(); updateStatistics();
            }
        }

        // ============== ОТОБРАЖЕНИЕ СПИСКА ГРУПП ==============
        function renderOrdersList() {
            const ordersList = document.getElementById('ordersList');
            if (!ordersList) return;
            const orders = loadOrdersFromStorage() || [];
            const searchText = document.getElementById('searchInput')?.value?.toLowerCase() || '';
            const statusFilter = document.getElementById('statusFilter')?.value || 'all';
            let filteredOrders = orders.filter(order => {
                if (!order.groupName) return false;
                const matchSearch = order.groupName.toLowerCase().includes(searchText) || (order.items && order.items.some(item => item.product && item.product.toLowerCase().includes(searchText)));
                if (!matchSearch) return false;
                const groupStatus = getGroupStatus(order);
                if (statusFilter === 'active') return groupStatus === 'orange' || groupStatus === 'gray';
                if (statusFilter === 'completed') return groupStatus === 'green';
                return true;
            });
            ordersList.innerHTML = '';
            if (filteredOrders.length === 0) { ordersList.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">Нет групп</div></div>`; return; }
            filteredOrders.forEach(order => {
                const groupStatus = getGroupStatus(order);
                const statusClass = groupStatus === 'green' ? 'status-green' : (groupStatus === 'orange' ? 'status-orange' : 'status-gray');
                const card = document.createElement('div'); card.className = 'order-card'; card.dataset.orderId = order.id;
                const header = document.createElement('div'); header.className = `order-header ${statusClass}`;
                header.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;width:100%;"><div><h3>📁 ${escapeHtml(order.groupName)}</h3><div style="font-size:12px;color:#a0a0a0;margin-top:5px;">Изделий: ${order.items ? order.items.length : 0} | №${order.number || '---'} ${groupStatus === 'green' ? '| ✅ ВЫПОЛНЕНО' : (groupStatus === 'orange' ? '| ⚡ В РАБОТЕ' : '| ⏳ ОЖИДАЕТ')}</div></div><div><button class="btn btn-info" onclick="event.stopPropagation(); showMaterialsReport(${order.id})">📊 Материалы</button><button class="btn btn-danger" onclick="event.stopPropagation(); deleteOrder(${order.id})">🗑️ Удалить</button></div></div>`;
                const content = document.createElement('div'); content.className = 'order-content'; content.style.display = 'none';
                if (order.items && order.items.length > 0) {
                    order.items.forEach((item, itemIndex) => {
                        const itemDiv = document.createElement('div'); itemDiv.style.marginBottom = '20px'; itemDiv.style.border = '1px solid #2a2f38'; itemDiv.style.borderRadius = '8px'; itemDiv.style.overflow = 'hidden';
                        const itemHeader = document.createElement('div'); itemHeader.className = 'item-header'; itemHeader.style.padding = '10px 15px'; itemHeader.style.background = '#232830'; itemHeader.style.cursor = 'pointer'; itemHeader.style.display = 'flex'; itemHeader.style.justifyContent = 'space-between';
                        itemHeader.innerHTML = `<span style="font-weight:600;color:#ff3b3b;">📦 ${escapeHtml(item.product || 'Изделие')}</span><span>▼</span>`;
                        const itemContent = document.createElement('div'); itemContent.className = 'item-content'; itemContent.style.padding = '15px'; itemContent.style.display = 'none';
                        const regularDetails = (item.details || []).filter(d => d.type !== 'profile');
                        const profiles = (item.details || []).filter(d => d.type === 'profile');
                        itemContent.innerHTML = `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:25px;margin-bottom:20px;"><div><div style="margin-bottom:12px;"><div style="color:#a0a0a0;font-size:12px;">РАЗМЕР</div><div><strong>${escapeHtml(item.size?.name || '-')}</strong> <span style="color:#4cd964;">× ${item.size?.quantity || 0} шт</span></div></div><div><div style="color:#a0a0a0;font-size:12px;">ПОКРЫТИЕ</div><div><strong>${escapeHtml(item.ral || '-')}</strong> / ${escapeHtml(item.texture || '-')}</div></div></div><div><div style="color:#a0a0a0;font-size:12px;margin-bottom:8px;">ПРОФИЛИ</div>${profiles.length ? profiles.map(p => `<div style="margin-bottom:8px;"><div>• ${escapeHtml(p.name)}</div><div style="margin-left:12px;color:#a0a0a0;font-size:12px;"><span style="color:#ff9800;">${p.lengthMm} мм</span> <span style="color:#4cd964;">× ${p.quantity} шт</span></div></div>`).join('') : '<div style="color:#6c757d;">— нет —</div>'}</div><div><div style="color:#a0a0a0;font-size:12px;margin-bottom:8px;">ДЕТАЛИ</div>${(() => { const allDetails = []; if (item.brackets) item.brackets.forEach(b => allDetails.push({ name: `Кронштейн ${b.type}`, quantity: b.quantity })); if (item.lyres) item.lyres.forEach(l => allDetails.push({ name: `Лира ${l.type}`, quantity: l.quantity })); if (regularDetails.length) regularDetails.forEach(d => allDetails.push({ name: d.name, quantity: d.quantity })); return allDetails.length ? allDetails.map(d => `<div style="margin-bottom:6px;">• ${escapeHtml(d.name)} <span style="color:#4cd964;">${d.quantity} шт</span></div>`).join('') : '<div style="color:#6c757d;">— нет —</div>'; })()}</div></div><div id="sites-${order.id}-${itemIndex}" class="sites-section"><h4 style="margin-bottom:12px;">ПРОИЗВОДСТВЕННЫЕ УЧАСТКИ</h4><div class="sites-grid">${createSiteRow('Токарный', order, itemIndex, 'tokarniy')}${createSiteRow('Слесарный', order, itemIndex, 'slesarniy')}${createSiteRow('Фрезерный', order, itemIndex, 'frezerniy')}${createSiteRow('Лазерно-гибочный', order, itemIndex, 'lazerno')}${createSiteRow('Полимерный', order, itemIndex, 'polimerniy')}</div></div>`;
                        itemHeader.onclick = () => { const isVisible = itemContent.style.display !== 'none'; itemContent.style.display = isVisible ? 'none' : 'block'; itemHeader.querySelector('span:last-child').textContent = isVisible ? '▼' : '▲'; saveMainOpenItemsState(); };
                        itemDiv.appendChild(itemHeader); itemDiv.appendChild(itemContent); content.appendChild(itemDiv);
                    });
                }
                header.onclick = (e) => { if (e.target.tagName === 'BUTTON') return; const isVisible = content.style.display !== 'none'; content.style.display = isVisible ? 'none' : 'block'; saveMainOpenCardsState(); };
                card.appendChild(header); card.appendChild(content); ordersList.appendChild(card);
            });
            restoreMainOpenCardsState(); restoreMainOpenItemsState();
        }

        function updateStatistics() {
            const orders = loadOrdersFromStorage() || [];
            document.getElementById('totalOrders').textContent = orders.length;
            document.getElementById('totalItems').textContent = orders.reduce((sum, order) => sum + (order.items ? order.items.length : 0), 0);
            let active = 0, completed = 0;
            orders.forEach(order => { if (order.tasks) { Object.values(order.tasks).forEach(s => { if (s === 'orange') active++; if (s === 'green') completed++; }); } });
            document.getElementById('activeTasks').textContent = active;
            document.getElementById('completedTasks').textContent = completed;
        }

        function exportOrders() {
            const orders = loadOrdersFromStorage() || [];
            if (orders.length === 0) { alert('Нет групп для экспорта'); return; }
            const dataStr = JSON.stringify({ exportDate: new Date().toISOString(), version: '1.0', orders: orders }, null, 2);
            const link = document.createElement('a');
            link.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
            link.download = `masterx_groups_${new Date().toISOString().slice(0,10)}.json`;
            link.click();
            alert(`✅ Экспортировано ${orders.length} групп`);
        }
        function importOrders() {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const text = await file.text();
                    const data = JSON.parse(text);
                    if (!data.orders || !Array.isArray(data.orders)) { alert('❌ Неверный формат файла'); return; }
                    let existingOrders = loadOrdersFromStorage();
                    let importedCount = 0;
                    for (const importedOrder of data.orders) {
                        const existingIndex = existingOrders.findIndex(o => o.id === importedOrder.id);
                        if (existingIndex !== -1) {
                            if (confirm(`Группа "${importedOrder.groupName}" уже существует. Перезаписать?`)) {
                                existingOrders[existingIndex] = importedOrder;
                                importedCount++;
                            }
                        } else { existingOrders.push(importedOrder); importedCount++; }
                    }
                    saveOrdersToStorage(existingOrders);
                    renderOrdersList(); updateStatistics();
                    alert(`✅ Импортировано ${importedCount} групп`);
                } catch (error) { alert('❌ Ошибка при импорте'); }
            };
            input.click();
        }
        function showMaterialsReport(orderId) {
            const orders = loadOrdersFromStorage() || [];
            const order = orders.find(o => o.id === orderId);
            if (!order) { alert('Группа не найдена'); return; }
            if (!window.materialsReport) { alert('Отчет по материалам не доступен'); return; }
            const modal = document.getElementById('materialsModal');
            const reportDiv = document.getElementById('materialsReport');
            if (!modal || !reportDiv) return;
            reportDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Загрузка отчета...</p></div>';
            modal.style.display = 'block';
            window.materialsReport.generateReport(order).then(html => reportDiv.innerHTML = html).catch(err => reportDiv.innerHTML = '<div class="error">Ошибка загрузки отчета</div>');
        }
        function closeMaterialsModal() { document.getElementById('materialsModal').style.display = 'none'; }
        function addExtraTask(orderId, siteKey) {
            const desc = prompt('Введите описание дополнительной задачи:');
            if (!desc) return;
            let orders = loadOrdersFromStorage();
            const order = orders.find(o => o.id == orderId);
            if (!order) { alert('Группа не найдена'); return; }
            if (!order.extraTasks) order.extraTasks = [];
            order.extraTasks.push({ title: desc, description: desc, site: siteKey, createdAt: new Date().toISOString() });
            saveOrdersToStorage(orders);
            renderOrdersList(); updateStatistics();
            alert('✅ Дополнительная задача добавлена');
        }
        function deleteOrder(orderId) {
            if (!confirm('Удалить группу?')) return;
            let orders = loadOrdersFromStorage();
            orders = orders.filter(o => o.id !== orderId);
            saveOrdersToStorage(orders);
            const sites = ['tokarniy', 'slesarniy', 'frezerniy', 'lazerno', 'polimerniy'];
            const dates = [];
            const today = new Date();
            for (let i = -30; i <= 30; i++) { const d = new Date(today); d.setDate(today.getDate() + i); dates.push(d.toISOString().split('T')[0]); }
            sites.forEach(site => { dates.forEach(date => { const key = `tasks_${site}_${date}`; const tasks = localStorage.getItem(key); if (tasks) { let arr = JSON.parse(tasks); arr = arr.filter(t => t.orderId !== orderId); localStorage.setItem(key, JSON.stringify(arr)); } }); });
            renderOrdersList(); updateStatistics();
            alert('✅ Группа удалена');
        }

        async function initMainPage() {
            productsList = await loadProducts() || [];
            bracketsList = await loadBrackets() || [];
            lyresList = await loadLyres() || [];
            await loadProductDetails();
            await loadTaskOperations();
            populateNewItemSelects();
            initThemeToggle();
            renderOrdersList();
            updateStatistics();
            document.getElementById('searchInput')?.addEventListener('input', () => { renderOrdersList(); updateStatistics(); });
            document.getElementById('statusFilter')?.addEventListener('change', () => { renderOrdersList(); updateStatistics(); });
            window.addEventListener('storage', (e) => { if (e.key === 'masterx_orders') { renderOrdersList(); updateStatistics(); } });
            window.addEventListener('beforeunload', () => { saveMainOpenCardsState(); saveMainOpenItemsState(); });
        }

        window.openGroupModal = openGroupModal;
        window.closeGroupModal = closeGroupModal;
        window.addBracketField = addBracketField;
        window.addLyreField = addLyreField;
        window.addItemToGroup = addItemToGroup;
        window.createGroupOrder = createGroupOrder;
        window.exportOrders = exportOrders;
        window.importOrders = importOrders;
        window.showMaterialsReport = showMaterialsReport;
        window.closeMaterialsModal = closeMaterialsModal;
        window.addExtraTask = addExtraTask;
        window.deleteOrder = deleteOrder;
        window.toggleSiteOperation = toggleSiteOperation;
        window.addCustomProfile = addCustomProfile;
        window.removeCustomProfile = removeCustomProfile;
        window.onNewItemProductChange = onNewItemProductChange;

        document.addEventListener('DOMContentLoaded', initMainPage);
    </script>
</body>
</html>
