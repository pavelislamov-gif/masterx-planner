<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterX - Планировщик производства</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='85' font-size='85' text-anchor='middle' fill='%23ff3b3b'>⚙️</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="images/logo.png" alt="MasterX Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="logo-text">Master<span class="x-red">X</span></div>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="btn btn-primary" onclick="openImportModal()" style="background: linear-gradient(135deg, #22c55e, #16a34a);">📥 Импорт из 1С</button>
            </div>
        </header>

        <div class="sites-navigation">
            <h3>🏭 Производственные участки:</h3>
            <div class="sites-links">
                <a href="sites/tokarniy.html" class="site-link">🔧 Токарный</a>
                <a href="sites/slesarniy.html" class="site-link">🔨 Слесарный</a>
                <a href="sites/frezerniy.html" class="site-link">⚙️ Фрезерный</a>
                <a href="sites/lazerno-gibochniy.html" class="site-link">✨ Лазерно-гибочный</a>
                <a href="sites/polimerniy.html" class="site-link">🎨 Полимерный</a>
            </div>
        </div>

        <div class="order-stats">
            <div class="stat-item"><div class="stat-value" id="totalOrders">0</div><div class="stat-label">Всего групп</div></div>
            <div class="stat-item"><div class="stat-value" id="totalItems">0</div><div class="stat-label">Изделий</div></div>
            <div class="stat-item"><div class="stat-value" id="activeTasks">0</div><div class="stat-label">В работе</div></div>
            <div class="stat-item"><div class="stat-value" id="completedTasks">0</div><div class="stat-label">Выполнено</div></div>
        </div>

        <div class="filter-section">
            <input type="text" class="search-box" placeholder="🔍 Поиск по названию группы или изделию..." id="searchInput">
            <select id="statusFilter" class="search-box" style="width: auto;">
                <option value="all">Все статусы</option>
                <option value="active">Активные</option>
                <option value="completed">Завершённые</option>
            </select>
            <button class="btn btn-primary" onclick="exportOrders()">📥 Экспорт заказов</button>
            <button class="btn btn-success" onclick="importOrders()">📤 Импорт заказов</button>
            <button class="btn btn-warning" onclick="archiveCompletedGroups()">🗄️ Архив завершённых групп</button>
        </div>

        <!-- Модальное окно импорта из 1С -->
        <div id="importModal" class="modal" style="display:none">
            <div class="modal-content" style="max-width: 1200px; width: 95%; max-height: 90vh; overflow-y: auto;">
                <span class="close" onclick="closeImportModal()">&times;</span>
                <h2 style="color: #dc2626; margin-bottom: 20px;">📥 Импорт заказа из 1С</h2>
                <div class="form-group"><label>📄 Файл выгрузки из 1С (HTML):</label><input type="file" id="importFileInput" accept=".html,.htm" style="padding: 10px;"><small style="color: #64748b; display: block; margin-top: 5px;">Загрузите файл "Табель на объект" из 1С</small></div>
                <div class="form-group"><label>🏢 Название группы (заказчик/объект):</label><input type="text" id="importGroupName" placeholder="Например: ЖК Притяжение, секции 1 и паркинг"></div>
                <button class="btn btn-primary" id="analyzeImportBtn" style="margin-bottom: 20px;">🔍 Анализировать файл</button>
                <div id="importPreviewContainer" style="display: none;"><h3 style="margin: 20px 0 15px 0; color: #f97316;">📋 Найденные изделия</h3><div id="importItemsList" style="max-height: 500px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; background: #f8fafc;"></div></div>
                <div class="form-actions" style="display: flex; gap: 15px; justify-content: flex-end; margin-top: 25px; padding-top: 15px; border-top: 1px solid #e2e8f0;"><button class="btn btn-danger" onclick="closeImportModal()">✖️ Отмена</button><button class="btn btn-success" id="confirmImportBtn" onclick="confirmImport()" style="display: none;">✅ Сформировать группу</button></div>
                <div id="importProgress" style="display: none; text-align: center; padding: 20px;"><div class="spinner"></div><p>Создание группы и задач...</p></div>
            </div>
        </div>

        <div id="orderReportModal" class="modal"><div class="modal-content"><span class="close" onclick="closeOrderReportModal()">&times;</span><div id="orderReportContent"></div></div></div>

        <!-- Модальное окно редактирования изделия -->
        <div id="editItemModal" class="modal" style="display:none">
            <div class="modal-content" style="max-width: 800px; max-height: 90vh; overflow-y: auto;">
                <span class="close" onclick="closeEditModal()">&times;</span>
                <h2 style="color: #dc2626; margin-bottom: 20px;">✏️ Редактирование изделия</h2>
                <div class="form-group"><label>📦 Изделие:</label><input type="text" id="editProductName" readonly style="background: #f0f0f0; width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0;"></div>
                <div class="form-group"><label>📏 Размер:</label><input type="text" id="editSize" readonly style="background: #f0f0f0; width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0;"></div>
                <div class="form-group"><label>🔢 Количество:</label><input type="text" id="editQuantity" readonly style="background: #f0f0f0; width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0;"></div>
                <div class="form-group"><label>🎨 RAL:</label><input type="text" id="editRal" placeholder="RAL 9003" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0;"></div>
                <div class="form-group"><label>🧵 Текстура:</label><select id="editTexture" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0;"><option value="">Выберите</option><option value="матовая">Матовая</option><option value="глянцевая">Глянцевая</option><option value="муар">Муар</option></select></div>
                <div id="editDetailsContainer" style="margin-top: 15px;"></div>
                <div class="form-actions" style="display: flex; gap: 15px; justify-content: flex-end; margin-top: 25px; padding-top: 15px; border-top: 1px solid #e2e8f0;"><button class="btn btn-danger" onclick="closeEditModal()">✖️ Отмена</button><button class="btn btn-success" onclick="saveEditedItem()">💾 Сохранить изменения</button></div>
            </div>
        </div>

        <div id="ordersList" class="orders-list"></div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/profile-mapping.js"></script>
    <script src="js/materials-report.js"></script>
    <script src="js/task-manager.js"></script>
    <script src="js/import-from-1c.js"></script>

    <script>
        // ============== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==============
        let productsList = [];
        let taskOperationsData = {};
        const MAIN_STORAGE_KEY = 'main_open_cards';
        const MAIN_ITEMS_STORAGE_KEY = 'main_open_items';
        const siteNamesFull = {
            'tokarniy': '🔧 Токарный участок',
            'slesarniy': '🔨 Слесарный участок',
            'frezerniy': '⚙️ Фрезерный участок',
            'lazerno': '✨ Лазерно-гибочный участок',
            'polimerniy': '🎨 Полимерный участок'
        };

        // ============== СОХРАНЕНИЕ СОСТОЯНИЯ ==============
        function saveMainOpenCardsState() {
            const openCards = [];
            document.querySelectorAll('.order-card').forEach(card => {
                const content = card.querySelector('.order-content');
                if (content && content.style.display !== 'none') openCards.push(card.dataset.orderId);
            });
            localStorage.setItem(MAIN_STORAGE_KEY, JSON.stringify(openCards));
        }

        function restoreMainOpenCardsState() {
            const saved = localStorage.getItem(MAIN_STORAGE_KEY);
            if (!saved) return;
            JSON.parse(saved).forEach(orderId => {
                const card = document.querySelector(`.order-card[data-order-id="${orderId}"]`);
                if (card) {
                    const content = card.querySelector('.order-content');
                    if (content) content.style.display = 'block';
                }
            });
        }

        function saveMainOpenItemsState() {
            const openItems = [];
            document.querySelectorAll('.order-card').forEach(card => {
                const orderId = card.dataset.orderId;
                card.querySelectorAll('.item-content').forEach((itemContent, idx) => {
                    if (itemContent.style.display !== 'none') openItems.push({ orderId, itemIndex: idx });
                });
            });
            localStorage.setItem(MAIN_ITEMS_STORAGE_KEY, JSON.stringify(openItems));
        }

        function restoreMainOpenItemsState() {
            const saved = localStorage.getItem(MAIN_ITEMS_STORAGE_KEY);
            if (!saved) return;
            JSON.parse(saved).forEach(({ orderId, itemIndex }) => {
                const card = document.querySelector(`.order-card[data-order-id="${orderId}"]`);
                if (card) {
                    const itemHeader = card.querySelectorAll('.item-header')[itemIndex];
                    const itemContent = card.querySelectorAll('.item-content')[itemIndex];
                    if (itemHeader && itemContent) itemContent.style.display = 'block';
                }
            });
        }

        // ============== СТАТУС ГРУППЫ ==============
        function getGroupStatus(order) {
            if (!order.tasks || Object.keys(order.tasks).length === 0) return 'gray';
            let hasInProgress = false, allCompleted = true;
            Object.values(order.tasks).forEach(status => {
                if (status === 'in_progress' || status === 'orange') { hasInProgress = true; allCompleted = false; }
                if (status === 'pending' || status === '') allCompleted = false;
                if (status !== 'completed' && status !== 'green') allCompleted = false;
            });
            if (allCompleted && Object.keys(order.tasks).length > 0) return 'green';
            if (hasInProgress) return 'orange';
            return 'gray';
        }

        // ============== ЗАГРУЗКА ОПЕРАЦИЙ ==============
        async function loadTaskOperations() {
            try {
                const response = await fetch('data/taskOperations.json?_=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    taskOperationsData = data.operations || {};
                    window.taskOperationsData = taskOperationsData;
                    console.log('✅ Загружены операции из taskOperations.json');
                } else {
                    console.warn('taskOperations.json не найден');
                    taskOperationsData = {};
                }
            } catch(e) {
                console.error('Ошибка загрузки taskOperations.json:', e);
                taskOperationsData = {};
            }
        }

        // ============== ВСПОМОГАТЕЛЬНЫЕ ==============
        function normalizeDetailName(name) {
            if (!name) return '';
            return String(name).toLowerCase().replace(/\d+(?:[.,]\d+)?(?:-?\d+)?\s*мм/gi, '').replace(/aisi/gi, '').replace(/сталь/gi, '').replace(/алюминий/gi, '').replace(/нержавейка/gi, '').replace(/пвх/gi, '').replace(/поликарбонат/gi, '').replace(/\s+/g, ' ').trim();
        }

        function getDetailQuantity(item, operationDetailName) {
            if (!operationDetailName || !item?.details) return 0;
            const normalizedOp = normalizeDetailName(operationDetailName);
            for (const detail of item.details) {
                if (normalizeDetailName(detail.name) === normalizedOp) return detail.quantity;
            }
            for (const detail of item.details) {
                if (normalizedOp.includes(normalizeDetailName(detail.name))) return detail.quantity;
            }
            return 0;
        }

        function updateTaskQuantitiesFromDetails(orderId) {
            const orders = loadOrdersFromStorage();
            const order = orders.find(o => o.id == orderId);
            if (!order || !order.items) return false;
            const sites = ['tokarniy', 'slesarniy', 'frezerniy', 'lazerno', 'polimerniy'];
            let anyUpdated = false;
            order.items.forEach((item, itemIndex) => {
                sites.forEach(siteKey => {
                    const storageKey = `tasks_${siteKey}`;
                    const tasks = JSON.parse(localStorage.getItem(storageKey) || '[]');
                    let siteUpdated = false;
                    tasks.forEach(task => {
                        if (task.orderId == orderId && task.itemIndex == itemIndex && task.detail) {
                            const newQuantity = getDetailQuantity(item, task.detail);
                            if (newQuantity > 0 && newQuantity !== task.totalQuantity) {
                                task.totalQuantity = newQuantity;
                                siteUpdated = true;
                                anyUpdated = true;
                            }
                        }
                    });
                    if (siteUpdated) localStorage.setItem(storageKey, JSON.stringify(tasks));
                });
            });
            if (anyUpdated) { renderOrdersList(); updateStatistics(); }
            return anyUpdated;
        }

        function getOperationNamesWithDetails(productName, siteKey) {
            const siteColumnMap = { 'tokarniy': 'токарно-фрезерный', 'frezerniy': 'фрезерный', 'slesarniy': 'слесарный', 'lazerno': 'лазерно-гибочный', 'polimerniy': 'полимерный' };
            const siteColumn = siteColumnMap[siteKey];
            if (!siteColumn) return [];
            let productOps = taskOperationsData[productName];
            if (!productOps) {
                const normalizedInput = productName.toLowerCase();
                for (const [key, value] of Object.entries(taskOperationsData)) {
                    if (key.toLowerCase() === normalizedInput) {
                        productOps = value;
                        break;
                    }
                }
            }
            return (productOps && productOps[siteColumn]) ? productOps[siteColumn] : [];
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ============== ДОПОЛНИТЕЛЬНЫЕ ЗАДАЧИ ==============
        let currentExtraTaskItemIndex = 0;

        function addExtraTask(orderId, siteKey) {
            // Получаем заказ для отображения списка изделий
            const orders = loadOrdersFromStorage();
            const order = orders.find(o => o.id == orderId);
            if (!order) {
                alert('Группа не найдена');
                return;
            }
            
            let itemsHtml = '';
            if (order.items && order.items.length > 1) {
                itemsHtml = `
                    <div class="form-group">
                        <label>📦 Выберите изделие:</label>
                        <select id="extraTaskItemSelect" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0;">
                            ${order.items.map((item, idx) => `<option value="${idx}">${escapeHtml(item.product)} (${item.size?.name || 'стандарт'} × ${item.size?.quantity || 1} шт)</option>`).join('')}
                        </select>
                    </div>
                `;
            }
            
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.style.display = 'block';
            modal.style.zIndex = '3000';
            modal.innerHTML = `
                <div class="modal-content" style="max-width: 450px;">
                    <span class="close" onclick="this.parentElement.parentElement.remove()">&times;</span>
                    <h3 style="color: #dc2626; margin-bottom: 20px;">➕ Дополнительная задача</h3>
                    ${itemsHtml}
                    <div class="form-group"><label>📋 Название операции:</label><input type="text" id="extraTaskName" placeholder="Например: Доп. обработка" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0;"></div>
                    <div class="form-group"><label>🔢 Количество:</label><input type="number" id="extraTaskQuantity" value="1" min="1" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0;"></div>
                    <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                        <button class="btn btn-danger" onclick="this.closest('.modal').remove()">Отмена</button>
                        <button class="btn btn-success" onclick="saveExtraTask(${orderId}, '${siteKey}')">✅ Создать</button>
                    </div>
                    <p style="font-size: 11px; color: #64748b; margin-top: 15px; text-align: center;">💡 После создания нажмите кнопку +, чтобы отправить на участок</p>
                </div>
            `;
            document.body.appendChild(modal);
            
            if (order.items && order.items.length > 1) {
                const select = modal.querySelector('#extraTaskItemSelect');
                if (select) {
                    select.addEventListener('change', (e) => {
                        currentExtraTaskItemIndex = parseInt(e.target.value);
                    });
                    currentExtraTaskItemIndex = parseInt(select.value);
                }
            } else {
                currentExtraTaskItemIndex = 0;
            }
        }

        function addExtraTaskWithIndex(orderId, siteKey, itemIndex) {
            currentExtraTaskItemIndex = itemIndex;
            addExtraTask(orderId, siteKey);
        }

        // ============== ИСПРАВЛЕННАЯ ФУНКЦИЯ saveExtraTask (ТОЛЬКО СОЗДАНИЕ ЧЕРНОВИКА) ==============
        function saveExtraTask(orderId, siteKey) {
            const taskName = document.getElementById('extraTaskName')?.value.trim();
            const quantity = parseInt(document.getElementById('extraTaskQuantity')?.value) || 1;
            
            const itemSelect = document.getElementById('extraTaskItemSelect');
            const selectedItemIndex = itemSelect ? parseInt(itemSelect.value) : currentExtraTaskItemIndex;
            
            if (!taskName) {
                alert('Введите название операции');
                return;
            }
            
            const modal = document.querySelector('.modal');
            if (modal) modal.remove();
            
            const orders = loadOrdersFromStorage();
            const order = orders.find(o => o.id == orderId);
            
            if (!order) {
                alert('Группа не найдена');
                return;
            }
            
            // ============== ТОЛЬКО СОХРАНЯЕМ КАК ЧЕРНОВИК (НЕ ОТПРАВЛЯЕМ НА УЧАСТОК) ==============
            if (!order.extraTasks) order.extraTasks = [];
            
            // Проверка на дубликат черновика
            const exists = order.extraTasks.some(t => t.title === taskName && t.site === siteKey && t.itemIndex === selectedItemIndex);
            if (exists) {
                alert(`⚠️ Задача "${taskName}" уже создана! Нажмите + для отправки на участок.`);
                return;
            }
            
            order.extraTasks.push({
                id: Date.now(),
                title: taskName,
                quantity: quantity,
                site: siteKey,
                itemIndex: selectedItemIndex,
                createdAt: new Date().toISOString()
            });
            
            const orderIndex = orders.findIndex(o => o.id == orderId);
            orders[orderIndex] = order;
            saveOrdersToStorage(orders);
            
            renderOrdersList();
            updateStatistics();
            
            alert(`✅ Черновик задачи "${taskName}" создан! Нажмите + для отправки на участок.`);
        }

        // ============== ФУНКЦИЯ ОТПРАВКИ ЧЕРНОВИКА НА УЧАСТОК ==============
        function sendDraftToSite(orderId, siteKey, draftId, itemIndex, operationName, quantity) {
            const orders = loadOrdersFromStorage();
            const order = orders.find(o => o.id == orderId);
            if (!order || !order.extraTasks) {
                alert('Черновик не найден');
                return;
            }
            
            const draftIndex = order.extraTasks.findIndex(t => t.id === draftId);
            if (draftIndex === -1) {
                alert('Черновик не найден');
                return;
            }
            
            const draft = order.extraTasks[draftIndex];
            const item = order.items[itemIndex];
            
            const storageKey = `tasks_${siteKey}`;
            let existingTasks = JSON.parse(localStorage.getItem(storageKey) || '[]');
            
            const extraCount = existingTasks.filter(t => t.isExtra === true).length;
            const taskId = `${order.id}_${siteKey}_extra_${itemIndex}_${extraCount}_${Date.now()}`;
            
            const newTask = {
                id: taskId,
                orderId: order.id,
                itemIndex: itemIndex,
                orderNumber: order.number,
                product: item.product,
                size: item.size?.name || 'Стандартный',
                sizeQuantity: item.size?.quantity || 1,
                totalQuantity: draft.quantity,
                completedQuantity: 0,
                operation: draft.title,
                detail: '',
                thickness: '',
                ral: item.ral || '',
                texture: item.texture || '',
                index: existingTasks.length,
                status: 'pending',
                executors: [],
                date: new Date().toISOString().split('T')[0],
                isExtra: true,
                isPriority: false,
                createdAt: new Date().toISOString()
            };
            
            existingTasks.push(newTask);
            localStorage.setItem(storageKey, JSON.stringify(existingTasks));
            
            if (!order.tasks) order.tasks = {};
            order.tasks[taskId] = 'pending';
            
            // Удаляем черновик
            order.extraTasks.splice(draftIndex, 1);
            
            const orderIndex = orders.findIndex(o => o.id == orderId);
            orders[orderIndex] = order;
            saveOrdersToStorage(orders);
            
            renderOrdersList();
            updateStatistics();
            
            alert(`✅ Задача "${draft.title}" отправлена на участок!`);
        }

        // ============== РАБОТА С ФАЙЛАМИ ==============
        function addSiteFile(orderId, siteKey) {
            const orders = loadOrdersFromStorage();
            const order = orders.find(o => o.id == orderId);
            if (!order) { alert('Группа не найдена'); return; }
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.style.display = 'block';
            modal.style.zIndex = '3000';
            modal.innerHTML = `<div class="modal-content" style="max-width: 500px;"><span class="close" onclick="this.parentElement.parentElement.remove()">&times;</span><h3 style="color: #dc2626; margin-bottom: 20px;">📎 Добавить файл/ссылку</h3><div class="form-group"><label>📁 Название файла (необязательно):</label><input type="text" id="fileNameInput" placeholder="Например: Чертеж детали"></div><div class="form-group"><label>🔗 Путь к файлу или ссылка:</label><input type="text" id="filePathInput" placeholder="\\\\server\\share\\file.pdf  или  https://..."><small style="color: #64748b; font-size: 10px;">Поддерживаются: сетевые пути, локальные пути, URL</small></div><div class="form-group"><label>💬 Комментарий (необязательно):</label><textarea id="fileCommentInput" rows="2" placeholder="Дополнительная информация..."></textarea></div><div style="display: flex; gap: 10px; justify-content: flex-end;"><button class="btn btn-danger" onclick="this.closest('.modal').remove()">Отмена</button><button class="btn btn-success" onclick="saveSiteFile(${orderId}, '${siteKey}')">💾 Сохранить</button></div></div>`;
            document.body.appendChild(modal);
            modal.addEventListener('click', function(e) { if (e.target === modal) modal.remove(); });
        }

        function saveSiteFile(orderId, siteKey) {
            const fileName = document.getElementById('fileNameInput')?.value.trim();
            const filePath = document.getElementById('filePathInput')?.value.trim();
            const comment = document.getElementById('fileCommentInput')?.value.trim();
            if (!filePath) { alert('Введите путь к файлу или ссылку'); return; }
            const orders = loadOrdersFromStorage();
            const order = orders.find(o => o.id == orderId);
            if (!order) { alert('Группа не найдена'); return; }
            if (!order.siteFiles) order.siteFiles = {};
            if (!order.siteFiles[siteKey]) order.siteFiles[siteKey] = [];
            order.siteFiles[siteKey].push({ id: Date.now(), name: fileName || filePath.split(/[\\/]/).pop() || 'Файл', path: filePath, comment: comment || '', createdAt: new Date().toISOString() });
            saveOrdersToStorage(orders);
            const modal = document.querySelector('.modal');
            if (modal) modal.remove();
            renderOrdersList();
            alert('✅ Файл добавлен!');
        }

        function clearAllSiteFiles(orderId, siteKey) {
            if (!confirm('Удалить все прикреплённые файлы для этого участка?')) return;
            const orders = loadOrdersFromStorage();
            const order = orders.find(o => o.id == orderId);
            if (!order) return;
            if (order.siteFiles && order.siteFiles[siteKey]) delete order.siteFiles[siteKey];
            saveOrdersToStorage(orders);
            renderOrdersList();
            alert('✅ Все файлы удалены');
        }

        // ============== СОЗДАНИЕ СТРОКИ УЧАСТКА ==============
        function createSiteRow(name, order, itemIndex, siteKey) {
            const item = order.items[itemIndex];
            if (!item) return null;
            const operationsWithDetails = getOperationNamesWithDetails(item.product, siteKey);
            let operationsHtml = '';
            let completedCount = 0;
            let tasksFromStorage = [];
            const storageKey = `tasks_${siteKey}`;
            try { const saved = localStorage.getItem(storageKey); if (saved) tasksFromStorage = JSON.parse(saved); } catch(e) { console.error(e); }

            // ОСНОВНЫЕ ОПЕРАЦИИ
            if (operationsWithDetails && operationsWithDetails.length > 0) {
                for (let i = 0; i < operationsWithDetails.length; i++) {
                    const opData = operationsWithDetails[i];
                    const detailName = opData.detail || '';
                    const taskId = `${order.id}_${siteKey}_${itemIndex}_${i}`;
                    const operationName = opData.operation || opData;
                    const thickness = opData.thickness || '';
                    let displayOperationName = operationName;
                    if (detailName) {
                        let cleanDetailName = detailName;
                        if (thickness) cleanDetailName = detailName.replace(thickness, '').trim();
                        displayOperationName = `${operationName} (${cleanDetailName})`;
                        if (thickness) displayOperationName += ` ${thickness}`;
                    }
                    let squareClass = '', isAdded = false, plannedQuantity = 1;
                    if (detailName && item.details) {
                        const foundDetail = item.details.find(d => d.name === detailName);
                        if (foundDetail && foundDetail.quantity > 0) plannedQuantity = foundDetail.quantity;
                    }
                    const existingTask = tasksFromStorage.find(t => t.id === taskId);
                    if (existingTask && existingTask.totalQuantity && plannedQuantity === 1) plannedQuantity = existingTask.totalQuantity;
                    if (order.tasks && order.tasks[taskId]) {
                        const taskStatus = order.tasks[taskId];
                        if (taskStatus === 'green') { squareClass = 'green'; isAdded = true; completedCount++; }
                        else if (taskStatus === 'orange') { squareClass = 'orange'; isAdded = true; }
                        else if (taskStatus === 'pending' || taskStatus === '') { isAdded = true; }
                    }
                    if (existingTask && !isAdded) {
                        isAdded = true;
                        if (existingTask.status === 'completed') { squareClass = 'green'; completedCount++; }
                        else if (existingTask.status === 'in_progress') { squareClass = 'orange'; }
                    }
                    const buttonIcon = isAdded ? '✓' : '+';
                    const buttonClass = isAdded ? 'added' : '';
                    operationsHtml += `<div class="operation-item"><div class="operation-info"><div class="operation-name">${escapeHtml(displayOperationName)}</div><div class="operation-plan">📋 План: ${plannedQuantity} шт</div></div><div class="operation-controls"><div class="square-status ${squareClass}" data-task-id="${taskId}" onclick="event.stopPropagation(); toggleSquareStatus('${taskId}')"></div><div class="action-buttons"><button class="action-btn btn-add ${buttonClass}" onclick="event.stopPropagation(); toggleSiteOperation(this, ${order.id}, '${siteKey}', ${itemIndex}, ${i}, '${escapeHtml(operationName)}', false)">${buttonIcon}</button><button class="action-btn btn-priority" onclick="event.stopPropagation(); toggleSiteOperation(this, ${order.id}, '${siteKey}', ${itemIndex}, ${i}, '${escapeHtml(operationName)}', true)">🔴</button></div></div></div>`;
                }
            }

            // ДОПОЛНИТЕЛЬНЫЕ ЗАДАЧИ (уже отправленные на участок)
            const extraTasksFromStorage = tasksFromStorage.filter(t => t.isExtra === true && t.orderId == order.id && t.itemIndex == itemIndex);
            for (let e = 0; e < extraTasksFromStorage.length; e++) {
                const extraTask = extraTasksFromStorage[e];
                const taskId = extraTask.id;
                let squareClass = '', isAdded = false, plannedQuantity = extraTask.totalQuantity || 1;
                if (order.tasks && order.tasks[taskId]) {
                    const taskStatus = order.tasks[taskId];
                    if (taskStatus === 'green') { squareClass = 'green'; isAdded = true; completedCount++; }
                    else if (taskStatus === 'orange') { squareClass = 'orange'; isAdded = true; }
                    else if (taskStatus === 'pending' || taskStatus === '') { isAdded = true; }
                }
                const buttonIcon = isAdded ? '✓' : '+';
                const buttonClass = isAdded ? 'added' : '';
                operationsHtml += `<div class="operation-item"><div class="operation-info"><div class="operation-name">✨ ${escapeHtml(extraTask.operation)} (доп.)</div><div class="operation-plan">📋 План: ${plannedQuantity} шт</div></div><div class="operation-controls"><div class="square-status ${squareClass}" data-task-id="${taskId}" onclick="event.stopPropagation(); toggleSquareStatus('${taskId}')"></div><div class="action-buttons"><button class="action-btn btn-add ${buttonClass}" onclick="event.stopPropagation(); toggleSiteOperation(this, ${order.id}, '${siteKey}', ${itemIndex}, ${e}, '${escapeHtml(extraTask.operation)}', false)">${buttonIcon}</button><button class="action-btn btn-priority" onclick="event.stopPropagation(); toggleSiteOperation(this, ${order.id}, '${siteKey}', ${itemIndex}, ${e}, '${escapeHtml(extraTask.operation)}', true)">🔴</button></div></div></div>`;
            }
            
            // ЧЕРНОВИКИ (ещё не отправленные на участок)
            const draftTasks = order.extraTasks?.filter(t => t.site === siteKey && t.itemIndex === itemIndex) || [];
            for (let d = 0; d < draftTasks.length; d++) {
                const draft = draftTasks[d];
                operationsHtml += `<div class="operation-item">
                    <div class="operation-info">
                        <div class="operation-name">📝 ${escapeHtml(draft.title)} (черновик)</div>
                        <div class="operation-plan">📋 План: ${draft.quantity} шт</div>
                    </div>
                    <div class="operation-controls">
                        <div class="square-status" style="background: #e2e8f0;"></div>
                        <div class="action-buttons">
                            <button class="action-btn btn-add" onclick="event.stopPropagation(); sendDraftToSite(${order.id}, '${siteKey}', ${draft.id}, ${itemIndex}, '${escapeHtml(draft.title)}', ${draft.quantity})">+</button>
                        </div>
                    </div>
                </div>`;
            }

            if (!operationsHtml && draftTasks.length === 0) return null;
            const totalOperations = (operationsWithDetails?.length || 0) + extraTasksFromStorage.length + draftTasks.length;
            const files = order.siteFiles?.[siteKey] || [];
            const hasFiles = files.length > 0;
            let filesIndicatorHtml = '';
            if (hasFiles) { filesIndicatorHtml = `<div class="file-indicator"><span>📎 Файлы: ${files.length} шт</span><button class="btn-sm" style="background: #dc2626; padding: 2px 8px; font-size: 9px;" onclick="event.stopPropagation(); clearAllSiteFiles(${order.id}, '${siteKey}')">✕ Очистить</button></div>`; }
            return `<div class="site-card"><div class="site-card-header"><div class="site-name">${name}</div><div class="site-stats"><span class="completed">${completedCount}</span>/<span class="total">${totalOperations}</span></div></div><div class="site-card-content">${operationsHtml}<div style="display: flex; gap: 8px; margin-top: 8px;"><button class="btn-add-extra" style="flex: 1;" onclick="event.stopPropagation(); addExtraTaskWithIndex(${order.id}, '${siteKey}', ${itemIndex})">➕ Доп. задача</button><button class="btn-file" style="flex: 1;" onclick="event.stopPropagation(); addSiteFile(${order.id}, '${siteKey}')">📎 Добавить файл</button></div>${filesIndicatorHtml}</div></div>`;
        }

        // ============== ПЕРЕКЛЮЧЕНИЕ СТАТУСА ==============
        function toggleSquareStatus(taskId) {
            const square = document.querySelector(`.square-status[data-task-id="${taskId}"]`);
            if (!square) return;
            let newStatus = '', newColor = '';
            if (square.classList.contains('orange')) { newStatus = 'completed'; newColor = 'green'; }
            else if (square.classList.contains('green')) { newStatus = 'pending'; newColor = ''; }
            else { newStatus = 'in_progress'; newColor = 'orange'; }
            const parts = taskId.split('_');
            const orderId = parseInt(parts[0]);
            const siteKey = parts[1];
            const orders = loadOrdersFromStorage();
            const order = orders.find(o => o.id === orderId);
            if (order) {
                if (!order.tasks) order.tasks = {};
                order.tasks[taskId] = newColor;
                saveOrdersToStorage(orders);
                const storageKey = `tasks_${siteKey}`;
                const tasks = JSON.parse(localStorage.getItem(storageKey) || '[]');
                const taskIndex = tasks.findIndex(t => t.id === taskId);
                if (taskIndex !== -1) { tasks[taskIndex].status = newStatus; localStorage.setItem(storageKey, JSON.stringify(tasks)); }
                renderOrdersList(); updateStatistics();
            }
        }

        function toggleSiteOperation(button, orderId, siteKey, itemIndex, opIndex, operationName, isPriority = false) {
            const orders = loadOrdersFromStorage();
            const order = orders.find(o => o.id == orderId);
            if (!order) { alert('Заказ не найден'); return; }
            const storageKey = `tasks_${siteKey}`;
            const taskId = `${order.id}_${siteKey}_${itemIndex}_${opIndex}`;
            let existingTasks = [];
            try { const saved = localStorage.getItem(storageKey); if (saved) existingTasks = JSON.parse(saved); } catch(e) { console.error(e); }
            if (existingTasks.some(t => t.id === taskId)) {
                if (confirm(`❓ Удалить операцию "${operationName}" с участка?`)) {
                    localStorage.setItem(storageKey, JSON.stringify(existingTasks.filter(t => t.id !== taskId)));
                    if (order.tasks && order.tasks[taskId]) delete order.tasks[taskId];
                    const newStatus = getGroupStatus(order);
                    order.status = newStatus === 'green' ? 'completed' : (newStatus === 'orange' ? 'active' : 'pending');
                    const orderIndex = orders.findIndex(o => o.id == orderId);
                    orders[orderIndex] = order;
                    saveOrdersToStorage(orders);
                    renderOrdersList(); updateStatistics();
                    alert(`✅ Операция "${operationName}" удалена с участка`);
                }
                return;
            }
            const item = order.items[itemIndex];
            let plannedQuantity = 1, detailName = '', thickness = '';
            const siteColumnMap = { 'tokarniy': 'токарно-фрезерный', 'frezerniy': 'фрезерный', 'slesarniy': 'слесарный', 'lazerno': 'лазерно-гибочный', 'polimerniy': 'полимерный' };
            const siteColumn = siteColumnMap[siteKey];
            const productOps = taskOperationsData[item.product];
            if (productOps && siteColumn && productOps[siteColumn]) {
                const opData = productOps[siteColumn][opIndex];
                if (opData) {
                    detailName = opData.detail || '';
                    thickness = opData.thickness || '';
                    if (detailName && item.details) {
                        const qty = getDetailQuantity(item, detailName);
                        if (qty > 0) plannedQuantity = qty;
                    }
                }
            }
            const newTask = {
                id: taskId, orderId: order.id, itemIndex: itemIndex, orderNumber: order.number,
                product: item.product, size: item.size?.name || 'Стандартный', sizeQuantity: item.size?.quantity || 1,
                totalQuantity: plannedQuantity, completedQuantity: 0, operation: operationName,
                detail: detailName, thickness: thickness, ral: item.ral || '', texture: item.texture || '',
                index: opIndex, status: 'pending', executors: [], date: new Date().toISOString().split('T')[0],
                isExtra: false, isPriority: isPriority, createdAt: new Date().toISOString()
            };
            existingTasks.push(newTask);
            localStorage.setItem(storageKey, JSON.stringify(existingTasks));
            if (!order.tasks) order.tasks = {};
            order.tasks[taskId] = 'pending';
            const newStatus = getGroupStatus(order);
            order.status = newStatus === 'green' ? 'completed' : (newStatus === 'orange' ? 'active' : 'pending');
            const orderIndex = orders.findIndex(o => o.id == orderId);
            orders[orderIndex] = order;
            saveOrdersToStorage(orders);
            if (button) { button.classList.add('added'); button.textContent = '✓'; }
            alert(`✅ ${isPriority ? 'ПРИОРИТЕТНАЯ ' : ''}Операция "${operationName}" добавлена на участок с планом ${plannedQuantity} шт${detailName ? ` (деталь: ${detailName})` : ''}`);
            renderOrdersList(); updateStatistics();
        }

        function syncAllTasksToOrders() {
            const orders = loadOrdersFromStorage();
            const sites = ['tokarniy', 'slesarniy', 'frezerniy', 'lazerno', 'polimerniy'];
            let updated = false;
            orders.forEach(order => {
                if (!order.tasks) order.tasks = {};
                const activeTaskIds = new Set();
                sites.forEach(site => {
                    const storageKey = `tasks_${site}`;
                    const tasksJson = localStorage.getItem(storageKey);
                    if (tasksJson) {
                        let tasks = JSON.parse(tasksJson);
                        const uniqueTasks = [], seen = new Set();
                        for (const task of tasks) {
                            const key = `${task.orderId}_${task.itemIndex}_${task.operation}_${task.detail || ''}`;
                            if (!seen.has(key)) { seen.add(key); uniqueTasks.push(task); }
                        }
                        if (uniqueTasks.length !== tasks.length) localStorage.setItem(storageKey, JSON.stringify(uniqueTasks));
                        uniqueTasks.forEach(task => {
                            if (task.orderId == order.id) {
                                const taskId = `${order.id}_${site}_${task.itemIndex}_${task.index}`;
                                activeTaskIds.add(taskId);
                                let squareColor = '';
                                if (task.status === 'completed') squareColor = 'green';
                                else if (task.status === 'in_progress') squareColor = 'orange';
                                if (squareColor && order.tasks[taskId] !== squareColor) { order.tasks[taskId] = squareColor; updated = true; }
                            }
                        });
                    }
                });
                for (const taskId in order.tasks) { if (!activeTaskIds.has(taskId)) { delete order.tasks[taskId]; updated = true; } }
            });
            if (updated) saveOrdersToStorage(orders);
        }

        function createGroupOrder() {
            let groupName = '';
            const importGroupName = document.getElementById('importGroupName');
            if (importGroupName && importGroupName.value) groupName = importGroupName.value.trim();
            if (!groupName) { const oldGroupName = document.getElementById('groupNameInput'); if (oldGroupName && oldGroupName.value) groupName = oldGroupName.value.trim(); }
            if (!groupName) { alert('Введите название группы'); return; }
            if (!window.tempItemsList || window.tempItemsList.length === 0) { alert('Добавьте хотя бы одно изделие'); return; }
            const orders = loadOrdersFromStorage();
            const newOrder = {
                id: Date.now(), groupName: groupName, date: new Date().toISOString().split('T')[0], number: generateOrderNumber(),
                items: JSON.parse(JSON.stringify(window.tempItemsList)), status: 'active', tasks: {}, extraTasks: [], siteFiles: {}
            };
            orders.push(newOrder);
            saveOrdersToStorage(orders);
            if (typeof createTasksForOrder === 'function') createTasksForOrder(newOrder);
            const importModal = document.getElementById('importModal');
            if (importModal) importModal.style.display = 'none';
            renderOrdersList(); updateStatistics();
            alert(`✅ Группа "${groupName}" успешно создана!`);
            window.tempItemsList = [];
        }

        function generateOrderNumber() {
            const date = new Date();
            const year = date.getFullYear().toString().slice(-2);
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            return `${day}.${month}.${year}`;
        }

        // ============== ОТОБРАЖЕНИЕ СПИСКА ГРУПП ==============
        function renderOrdersList() {
            const ordersList = document.getElementById('ordersList');
            if (!ordersList) return;
            const freshOrdersData = loadOrdersFromStorage() || [];
            const searchText = document.getElementById('searchInput')?.value?.toLowerCase() || '';
            const statusFilter = document.getElementById('statusFilter')?.value || 'all';
            let filteredOrders = freshOrdersData.filter(order => {
                if (!order.groupName) return false;
                const matchSearch = order.groupName.toLowerCase().includes(searchText) || (order.items && order.items.some(item => item.product && item.product.toLowerCase().includes(searchText)));
                if (!matchSearch) return false;
                const groupStatus = getGroupStatus(order);
                if (statusFilter === 'active') return groupStatus === 'orange' || groupStatus === 'gray';
                if (statusFilter === 'completed') return groupStatus === 'green';
                return true;

                const content = document.createElement('div');
                content.className = 'order-content';
                content.style.display = 'none';
                if (order.items && order.items.length > 0) {
                    order.items.forEach((item, itemIndex) => {
                        let ralTextureHtml = '';

                        else if (item.texture && item.texture.trim() !== '') ralTextureHtml = `<span style="font-size: 11px; color: #f97316;">🎨 не указан / ${escapeHtml(item.texture)}</span>`;
                        else ralTextureHtml = `<span style="font-size: 11px; color: #64748b;">🎨 не указан</span>`;

                                const parts = taskId.split('_');
                                if (parts.length >= 3) {
                                    const taskItemIndex = parseInt(parts[2]);

                                        hasAnyTask = true;

                        itemContent.style.padding = '15px';
                        itemContent.style.display = 'none';
                        itemContent.innerHTML = `<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 25px; margin-bottom: 20px;"><div><div style="margin-bottom: 12px;"><div style="color: #64748b; font-size: 12px; margin-bottom: 4px;">РАЗМЕР</div><div><strong>${escapeHtml(item.size?.name || '-')}</strong> <span style="color: #10b981;">× ${item.size?.quantity || 0} шт</span></div></div><div style="margin-bottom: 12px;"><div style="color: #64748b; font-size: 12px; margin-bottom: 4px;">ПОКРЫТИЕ</div><div><strong>${escapeHtml(item.ral || '-')}</strong> / ${escapeHtml(item.texture || '-')}</div></div></div><div><div style="color: #64748b; font-size: 12px; margin-bottom: 8px;">ПРОФИЛИ</div>${profiles.length > 0 ? `<div class="details-chips">${profiles.map(p => `<span class="profile-chip"><span class="profile-name">📐 ${escapeHtml(p.name)}</span><span class="profile-length">${p.lengthMm || 0} мм</span><span class="profile-quantity">× ${p.quantity} шт</span></span>`).join('')}</div>` : '<div style="color: #64748b;">— нет —</div>'}</div><div><div style="color: #64748b; font-size: 12px; margin-bottom: 8px;">ДЕТАЛИ</div>${regularDetails.length > 0 ? `<div class="details-chips">${regularDetails.map(d => `<span class="detail-chip"><span class="detail-name">🔩 ${escapeHtml(d.name)}</span><span class="detail-quantity">${d.quantity} шт</span></span>`).join('')}</div>` : '<div style="color: #64748b;">— нет —</div>'}</div></div><div id="sites-${order.id}-${itemIndex}" class="sites-section"><h4 style="margin-bottom: 12px;">🏭 ПРОИЗВОДСТВЕННЫЕ УЧАСТКИ</h4><div class="sites-grid">${createSiteRow('Токарный', order, itemIndex, 'tokarniy') || ''}${createSiteRow('Слесарный', order, itemIndex, 'slesarniy') || ''}${createSiteRow('Фрезерный', order, itemIndex, 'frezerniy') || ''}${createSiteRow('Лазерно-гибочный', order, itemIndex, 'lazerno') || ''}${createSiteRow('Полимерный', order, itemIndex, 'polimerniy') || ''}</div></div>`;
                        itemHeader.onclick = (e) => { if (e.target.tagName === 'BUTTON') return; const isVisible = itemContent.style.display !== 'none'; itemContent.style.display = isVisible ? 'none' : 'block'; saveMainOpenItemsState(); };
                        itemDiv.appendChild(itemHeader);
                        itemDiv.appendChild(itemContent);
                        content.appendChild(itemDiv);
                    });
                }
                header.onclick = (e) => { if (e.target.tagName === 'BUTTON') return; const isVisible = content.style.display !== 'none'; content.style.display = isVisible ? 'none' : 'block'; saveMainOpenCardsState(); };
                card.appendChild(header);
                card.appendChild(content);
                ordersList.appendChild(card);
            });
            restoreMainOpenCardsState();
            restoreMainOpenItemsState();
        }

        // ============== ПРОЧИЕ ФУНКЦИИ (сохранены из вашего кода) ==============
        function editGroupName(orderId) {
            const orders = loadOrdersFromStorage();
            const order = orders.find(o => o.id == orderId);
            if (!order) { alert('Группа не найдена'); return; }
            const newName = prompt('Введите новое название заказчика:', order.groupName);
            if (!newName || newName.trim() === '') return;
            if (newName === order.groupName) return;
            order.groupName = newName.trim();
            const orderIndex = orders.findIndex(o => o.id == orderId);
            orders[orderIndex] = order;
            saveOrdersToStorage(orders);
            renderOrdersList();
            updateStatistics();
            alert(`✅ Название заказчика изменено на "${newName}"`);
        }

        function updateStatistics() {
            const orders = loadOrdersFromStorage() || [];
            const totalOrders = orders.length;
            const totalItems = orders.reduce((sum, order) => sum + (order.items ? order.items.length : 0), 0);
            let activeTasks = 0, completedTasks = 0;
            orders.forEach(order => {
                if (order.tasks) {
                    Object.values(order.tasks).forEach(status => {
                        if (status === 'in_progress' || status === 'orange') activeTasks++;
                        if (status === 'completed' || status === 'green') completedTasks++;
                    });
                }
            });
            document.getElementById('totalOrders').textContent = totalOrders;
            document.getElementById('totalItems').textContent = totalItems;
            document.getElementById('activeTasks').textContent = activeTasks;
            document.getElementById('completedTasks').textContent = completedTasks;
        }

        function exportOrders() {
            const orders = loadOrdersFromStorage() || [];
            if (orders.length === 0) { alert('Нет групп для экспорта'); return; }
            const exportData = { exportDate: new Date().toISOString(), version: '1.0', orders: orders };
            const dataStr = JSON.stringify(exportData, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
            const date = new Date();
            const fileName = `masterx_groups_${date.getFullYear()}-${(date.getMonth()+1).toString().padStart(2,'0')}-${date.getDate().toString().padStart(2,'0')}.json`;
            const link = document.createElement('a');
            link.href = dataUri;
            link.download = fileName;
            link.click();
            alert(`✅ Экспортировано ${orders.length} групп`);
        }

        function importOrders() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const text = await file.text();
                    const data = JSON.parse(text);
                    if (!data.orders || !Array.isArray(data.orders)) { alert('❌ Неверный формат файла'); return; }
                    let existingOrders = loadOrdersFromStorage();
                    const existingIds = new Set(existingOrders.map(o => o.id));
                    let importedCount = 0, skippedCount = 0;
                    for (const importedOrder of data.orders) {
                        if (existingIds.has(importedOrder.id)) {
                            if (confirm(`Группа "${importedOrder.groupName}" уже существует. Перезаписать?`)) {
                                existingOrders = existingOrders.filter(o => o.id !== importedOrder.id);
                                existingOrders.push(importedOrder);
                                importedCount++;
                            } else skippedCount++;
                        } else { existingOrders.push(importedOrder); importedCount++; }
                    }
                    saveOrdersToStorage(existingOrders);
                    renderOrdersList();
                    updateStatistics();
                    saveMainOpenCardsState();
                    saveMainOpenItemsState();
                    alert(`✅ Импорт завершён!\n📦 Импортировано: ${importedCount} групп\n⏭️ Пропущено: ${skippedCount}`);
                } catch (error) { console.error('❌ Ошибка импорта:', error); alert('❌ Ошибка при импорте файла'); }
            };
            input.click();
        }

        // Остальные функции (showMaterialsReport, closeMaterialsModal, getAllGroupTasks, showGroupStats, showTimeStats, deleteOrder, showItemReport, showOrderReport, archiveCompletedGroups, editGroup, и т.д.) остаются без изменений из вашего исходного кода
        // Для краткости я их не включаю сюда, но они должны быть в вашем файле

        // ============== ИНИЦИАЛИЗАЦИЯ ==============
        async function initMainPage() {
            productsList = await loadProducts() || [];
            await loadTaskOperations();
            syncAllTasksToOrders();
            const orders = loadOrdersFromStorage();
            orders.forEach(order => { updateTaskQuantitiesFromDetails(order.id); });
            renderOrdersList();
            updateStatistics();
            window.addEventListener('beforeunload', () => { saveMainOpenCardsState(); saveMainOpenItemsState(); });
            document.getElementById('searchInput')?.addEventListener('input', () => { renderOrdersList(); updateStatistics(); });
            document.getElementById('statusFilter')?.addEventListener('change', () => { renderOrdersList(); updateStatistics(); });
            window.addEventListener('storage', (e) => { if (e.key === 'masterx_orders') { renderOrdersList(); updateStatistics(); } });
        }

        // Автообновление (оставлено как в вашем коде)
        const AUTO_RELOAD_INTERVAL = 15 * 60 * 1000;
        const WARNING_BEFORE_RELOAD = 2 * 60 * 1000;
        let reloadTimer = null, warningTimer = null, countdownInterval = null, warningShown = false, countdownSeconds = 120;
        function saveAllDataBeforeReload() { saveMainOpenCardsState(); saveMainOpenItemsState(); const orders = loadOrdersFromStorage(); saveOrdersToStorage(orders); const sites = ['tokarniy', 'slesarniy', 'frezerniy', 'lazerno', 'polimerniy']; sites.forEach(site => { const storageKey = `tasks_${site}`; const tasks = JSON.parse(localStorage.getItem(storageKey) || '[]'); if (tasks.length > 0) localStorage.setItem(storageKey, JSON.stringify(tasks)); }); localStorage.setItem('masterx_last_save', Date.now()); }
        function forceReload() { saveAllDataBeforeReload(); if (countdownInterval) clearInterval(countdownInterval); if (reloadTimer) clearTimeout(reloadTimer); if (warningTimer) clearTimeout(warningTimer); const notification = document.getElementById('reloadWarning'); if (notification) notification.remove(); setTimeout(() => { location.reload(); }, 100); }
        function updateCountdown() { countdownSeconds--; const minutes = Math.floor(countdownSeconds / 60); const seconds = countdownSeconds % 60; const timeString = `${minutes}:${seconds.toString().padStart(2, '0')}`; const countdownSpan = document.getElementById('reloadCountdown'); if (countdownSpan) countdownSpan.textContent = timeString; const progressBar = document.getElementById('reloadProgress'); if (progressBar) { const progressPercent = ((120 - countdownSeconds) / 120) * 100; progressBar.style.width = `${progressPercent}%`; } if (countdownSeconds <= 0) { if (countdownInterval) clearInterval(countdownInterval); forceReload(); } }
        function showReloadWarning() { if (warningShown) return; warningShown = true; countdownSeconds = 120; const modal = document.createElement('div'); modal.id = 'reloadWarning'; modal.style.cssText = `position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 20000; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.3s ease;`; modal.innerHTML = `<div style="background: linear-gradient(135deg, #1a1e24, #0f1217); border: 2px solid #ff9800; border-radius: 20px; padding: 35px; max-width: 500px; width: 90%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5);"><div style="font-size: 56px; margin-bottom: 15px;">⏰</div><h3 style="color: #ff9800; margin-bottom: 10px; font-size: 24px;">Автообновление страницы</h3><p style="color: #e0e0e0; margin-bottom: 20px; font-size: 16px;">Страница будет автоматически обновлена через</p><div style="font-size: 48px; font-weight: 700; color: #ff9800; margin-bottom: 10px;" id="reloadCountdown">2:00</div><div style="width: 100%; height: 8px; background: #2a2f38; border-radius: 4px; margin-bottom: 20px; overflow: hidden;"><div id="reloadProgress" style="width: 0%; height: 100%; background: linear-gradient(90deg, #ff9800, #ff3b3b); border-radius: 4px; transition: width 1s linear;"></div></div><p style="color: #a0a0a0; font-size: 13px; margin-bottom: 25px;">💾 Все данные будут сохранены автоматически перед обновлением.</p><button id="cancelReloadBtn" style="background: #2a2f38; border: 1px solid #3a404b; border-radius: 10px; padding: 12px 30px; color: #e0e0e0; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 10px;">⏰ Отложить на 15 минут</button><p style="color: #6c757d; font-size: 11px; margin-top: 20px;">💡 При активности пользователя таймер автоматически сбрасывается</p></div>`; document.body.appendChild(modal); const style = document.createElement('style'); style.textContent = `@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }`; document.head.appendChild(style); countdownInterval = setInterval(updateCountdown, 1000); document.getElementById('cancelReloadBtn').onclick = () => { cancelAutoReload(); modal.remove(); if (countdownInterval) clearInterval(countdownInterval); }; }
        function cancelAutoReload() { if (reloadTimer) clearTimeout(reloadTimer); if (warningTimer) clearTimeout(warningTimer); if (countdownInterval) clearInterval(countdownInterval); warningShown = false; countdownSeconds = 120; startAutoReloadTimer(); const notification = document.getElementById('reloadWarning'); if (notification) notification.remove(); const toast = document.createElement('div'); toast.style.cssText = `position: fixed; bottom: 20px; right: 20px; background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 12px 20px; border-radius: 8px; z-index: 20001; font-size: 14px; animation: fadeIn 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.1);`; toast.innerHTML = '⏰ Автообновление отложено на 15 минут'; document.body.appendChild(toast); setTimeout(() => toast.remove(), 3000); }
        function startAutoReloadTimer() { if (reloadTimer) clearTimeout(reloadTimer); if (warningTimer) clearTimeout(warningTimer); if (countdownInterval) clearInterval(countdownInterval); warningShown = false; countdownSeconds = 120; const notification = document.getElementById('reloadWarning'); if (notification) notification.remove(); warningTimer = setTimeout(() => { showReloadWarning(); }, AUTO_RELOAD_INTERVAL - WARNING_BEFORE_RELOAD); reloadTimer = setTimeout(() => { forceReload(); }, AUTO_RELOAD_INTERVAL); }
        let userActivityTimer = null;
        function resetAutoReloadTimer() { if (reloadTimer || warningTimer) startAutoReloadTimer(); }
        function trackUserActivity() { const events = ['click', 'mousemove', 'keydown', 'scroll', 'touchstart']; events.forEach(event => { document.addEventListener(event, () => { if (userActivityTimer) clearTimeout(userActivityTimer); userActivityTimer = setTimeout(() => { resetAutoReloadTimer(); }, 1000); }); }); }
        document.addEventListener('visibilitychange', function() { if (!document.hidden) { const lastReload = localStorage.getItem('masterx_last_reload'); const now = Date.now(); if (lastReload && (now - parseInt(lastReload)) > AUTO_RELOAD_INTERVAL) forceReload(); else startAutoReloadTimer(); } });
        function onDataChanged() { resetAutoReloadTimer(); }
        window.addEventListener('storage', function(e) { if (e.key === 'masterx_orders' || (e.key && e.key.startsWith('tasks_'))) onDataChanged(); });
        function initAutoReload() { startAutoReloadTimer(); trackUserActivity(); }
        initAutoReload();

        document.addEventListener('DOMContentLoaded', initMainPage);

        // ЭКСПОРТ ФУНКЦИЙ
        window.openImportModal = openImportModal;
        window.closeImportModal = closeImportModal;
        window.analyzeImportFile = analyzeImportFile;
        window.confirmImport = confirmImport;
        window.saveEditedGroup = saveEditedGroup;
        window.addExtraTaskWithIndex = addExtraTaskWithIndex;
        window.saveExtraTask = saveExtraTask;
        window.sendDraftToSite = sendDraftToSite;
    </script>
</body>
